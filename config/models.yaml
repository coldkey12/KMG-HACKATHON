# Манифест моделей. Заменить модель = поменять строку здесь; код конвейера не меняется.
# external: уходят ли данные во внешний сервис (для манифеста сдачи).
version: 0.2.0
# Способ вызова модели (модель та же):
#   claude_code — Claude Code без интерфейса (`claude -p`), за счёт подписки пользователя; ключ API не используется;
#   api         — Anthropic API по ключу из .env (для жюри и как запасной путь).
# Переопределение на один запуск: KMG_TRANSPORT=api|claude_code. Ключ кэша от способа не зависит.
transport: claude_code
roles:
  plan:   {provider: anthropic, model: claude-opus-5-5, effort: high,    max_tokens: 64000, external: true, purpose: "план узлов главы: разбиение единиц, порядок, части"}
  node:   {provider: anthropic, model: claude-haiku-5-5, effort: high,  max_tokens: 64000, external: true, purpose: "заполнение полей узла с цитатами"}
  repair: {provider: anthropic, model: claude-haiku-5-5, effort: low,   max_tokens: 64000, external: true, purpose: "починка синтаксиса JSON ответа модели"}
  pack:   {provider: anthropic, model: claude-haiku-5-5, effort: high, max_tokens: 64000, external: true, purpose: "черновик доменного пакета по главе нового домена"}
  refine: {provider: anthropic, model: claude-haiku-5-5, effort: high,   max_tokens: 64000, external: true, purpose: "доработка узла: дыры покрытия и условия применимости в утверждениях"}
  review: {provider: anthropic, model: claude-opus-5-5, effort: high,   max_tokens: 64000, external: true, purpose: "модуль проверки чужого пакета"}
# $ за 1M токенов (cache_write = запись в кэш 5 мин, cache_read = чтение из кэша)
prices:
  claude-opus-5-5:   {input: 4.0, output: 20.0, cache_write: 5.0,  cache_read: 0.20}
  claude-sonnet-5-5: {input: 2.0, output: 10.0, cache_write: 2.5,  cache_read: 0.10}
  claude-haiku-5-5:  {input: 0.1, output: 0.5,  cache_write: 0.125, cache_read: 0.01}
