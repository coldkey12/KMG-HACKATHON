# Маршрутизация форматов: детерминированное правило (одинаковый узел → одинаковый формат).
# Вход правила: флаги видеоёмкости (ставит модель), тип трудности, data_decision, наличие формул/таблиц/примеров/рисунков.
# Критерии видеоёмкости — из ТЗ: изменение во времени, невидимое становится видимым, скачок масштаба,
# контринтуитивность, причина и следствие. Модель ставит флаги щедро, поэтому видео — только при сильном сигнале
# (калибровка на Латышовой 2026-11-25: без порогов 47 из 69 узлов уходили в видео).
version: 0.3.0
rules:
- if: data_decision and score >= 3 and (has_figures or has_examples)
  format: long_video
  why: решение на данных по рисунку/примеру и ≥3 критерия видеоёмкости → разбор 16:9 с синхронными видами
- if: primary in ('М','В') and score >= 4 and time_change
  format: long_video
  why: 'механизм/время: цепочка событий длиннее одного шортса → длинное видео (правило типов М и В)'
- if: score >= 3 and (time_change or invisible_visible) and not (has_formulas or has_tables) and primary in ('М','В','И','Р','Ф')
  format: short
  why: ≥3 критерия, есть движение или невидимое, один механизм → шортс 9:16 (для Ф — смысл членов, не вывод)
- if: score >= 2 and (time_change or invisible_visible or has_figures or has_formulas)
  format: interactive
  why: 2+ критерия видеоёмкости и есть что двигать/вычислять → интерактив
- if: primary == 'Пр' or data_decision or has_examples
  format: data_practicum
  why: процедура / правило на данных / примеры с числами → практикум на данных (ведущий формат типа Пр)
- if: primary in ('Ф','П','Н') or has_formulas
  format: interactive
  why: формализм, пространство или неопределённость → интерактив (ведущий формат типа)
- if: primary == 'Р' or (n_terms >= 3 and n_claims <= 6)
  format: cards
  why: распознавание или узел из определений → карточки (ведущий формат типа Р)
- if: 'True'
  format: text
  why: нет сильного критерия видеоёмкости → текст шага
scene_templates:
- id: tool_in_well
  when: primary in ('И',) and invisible_visible
  state_model: глубина прибора → положение в кадре и текущая точка кривой
- id: radial_profile
  when: primary in ('И','Н') and cause_effect
  state_model: радиальный профиль свойства от стенки скважины вглубь пласта; зонды разной глубинности читают его
- id: log_panel_decision
  when: data_decision
  state_model: планшет кривых по глубине → признаки → правило → вывод по интервалам
- id: crossplot_regions
  when: has_figures and primary in ('Пр','Н','И')
  state_model: точка (x, y) на кроссплоте/палетке → область → вывод
- id: pressure_diffusion
  when: primary in ('М','Ф') and time_change
  state_model: поле давления p(r,t) из решения уравнения → кривая давления на скважине
- id: growth_timeline
  when: primary in ('В',) or (time_change and primary in ('Р','П'))
  state_model: этапы роста/развития тела во времени, разрез на каждом этапе
- id: geometry_3d
  when: primary in ('П',) or scale_jump
  state_model: '3D-тело/разрез, синхронные виды: разрез, план, поверхность'
- id: feature_matching
  when: primary in ('Р',)
  state_model: набор признаков → совпадение с эталонами типов
