<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Проверка ловит ложь</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#000;overflow:hidden}
#st{position:relative;width:1920px;height:1080px;background:#000;color:#fff;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;padding:70px 100px}
.mono{font:500 20px/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:#8c8c8c}
h1{font-size:76px;font-weight:400;letter-spacing:-.035em;margin:26px 0 40px;line-height:1}
.box{position:absolute;border:1px solid #333;background:#0b0b0b;padding:28px 32px}
.lab{font:500 17px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8c8c8c;margin-bottom:20px}
.t{font-size:34px;line-height:1.3}
pre{margin:0;font:500 27px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap}
.r{color:#ff5a4f}.g{color:#19d3c5}.m{color:#8c8c8c}
#cap{position:absolute;left:100px;bottom:56px;font-size:44px;letter-spacing:-.02em}
</style></head><body><div id="st">
<div class="mono">Osiris Deeptech · что будет, если нейросеть соврёт</div>
<h1 id="h"></h1>
<div class="box" style="left:100px;top:270px;width:830px;height:250px"><div class="lab">Книга · Латышова, стр. 98</div><div class="t">«…для которого ρn = 20 Ом·м, <b>kn = 25 %</b>»</div></div>
<div class="box" id="lb" style="left:990px;top:270px;width:830px;height:250px"><div class="lab">Курс · утверждение в уроке</div><div class="t">Точка с ρn = 20 Ом·м и kn = <b id="n">25</b> % даёт <span id="w">безводную нефть</span>.</div></div>
<div class="box" style="left:100px;top:560px;width:1720px;height:360px"><div class="lab">Терминал</div><pre id="term"></pre></div>
<div id="cap"></div></div>
<script>
var CMD='python -m kmg check out/lat-v/layer.json';
var OUT=['<span class="m">quote: ошибок 0 · coverage: ошибок 0 · </span><span class="r">numbers: ошибок 1</span>','<span class="r">[error] lat-v.n-098-edce90: число 40 нет в исходных единицах</span>','<span class="r">passed: False</span><span class="m"> — курс из такого файла не выпускается</span>'];
function cl(x){return Math.min(1,Math.max(0,x))}
window.TOTAL=22;
window.render=function(t){
  var lie=t>3.2;
  document.getElementById('h').textContent=t<3.2?'Шаг 1. В курсе написано то же, что в книге':t<8?'Шаг 2. Подменяем факт: как будто нейросеть ошиблась':t<16?'Шаг 3. Запускаем проверку — обычная программа, без нейросети':'Ложь поймана за 3 секунды';
  document.getElementById('n').textContent=lie?'40':'25';document.getElementById('n').style.color=lie?'#ff5a4f':'#fff';
  document.getElementById('w').textContent=lie?'чистую воду':'безводную нефть';document.getElementById('w').style.color=lie?'#ff5a4f':'#fff';
  document.getElementById('lb').style.borderColor=lie?'#ff5a4f':'#333';
  var h='';if(t>8){h='<span class="g">$</span> '+CMD.slice(0,Math.round(cl((t-8.3)/1.8)*CMD.length))+(t<10.3?'▌':'');
    if(t>12)h+='\n'+OUT[0];if(t>13)h+='\n'+OUT[1];if(t>14.2)h+='\n'+OUT[2]}
  document.getElementById('term').innerHTML=h;
  document.getElementById('cap').textContent=t>16.5?'Числа 40 в книге нет. Программа это видит сама.':'';
};
if(!window.NOAUTO){var t0=performance.now();(function f(){var t=(performance.now()-t0)/1000;render(Math.min(t,22));if(t<22)requestAnimationFrame(f)})()}
</script></body></html>
