<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Osiris Deeptech — защита по разбалловке</title>
<style>
:root{--acc:#19d3c5;--line:#2b2b2b;--mut:#8c8c8c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;font:400 20px/1.35 "Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#top{position:fixed;left:0;right:0;top:0;height:58px;display:flex;align-items:center;gap:22px;padding:0 32px;border-bottom:1px solid var(--line)}

#pb{flex:1;height:6px;background:#1c1c1c;position:relative}#pb i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);width:0;transition:width .5s cubic-bezier(.2,.7,.2,1)}
#pts{font-size:30px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-width:230px;text-align:right}#pts span{color:var(--mut);font-size:18px}
#side{position:fixed;left:0;top:58px;bottom:0;width:372px;border-right:1px solid var(--line);overflow:auto}
#side button{display:flex;width:100%;align-items:baseline;gap:12px;background:none;border:0;border-bottom:1px solid var(--line);color:#bdbdbd;font:inherit;font-size:19px;text-align:left;padding:15px 20px 15px 32px;cursor:pointer}
#side button span{font:500 13px/1 ui-monospace,Menlo,monospace;color:var(--mut);min-width:52px}
#side button em{margin-left:auto;font-style:normal;font:500 13px/1 ui-monospace,Menlo,monospace;color:var(--mut)}
#side button.on{background:#fff;color:#000}#side button.on span,#side button.on em{color:#555}
#side button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
#main{position:fixed;left:372px;right:0;top:58px;bottom:0;overflow:auto;padding:30px 44px 40px}
.k{font:500 13px/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
h1{font-weight:400;font-size:clamp(34px,3.6vw,58px);letter-spacing:-.03em;line-height:1.02;margin:12px 0 22px;max-width:24ch}
.g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px}
.box{border:1px solid var(--line);background:#0b0b0b;padding:18px 22px;animation:in .4s both}
.box:nth-child(2){animation-delay:.07s}.box:nth-child(3){animation-delay:.14s}.box:nth-child(4){animation-delay:.21s}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.box{animation:none}#pb i{transition:none}}
.lab{font:500 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
.box p{margin:0;color:#d8d8d8}.box ul{margin:0;padding:0;list-style:none}
.box li{padding:7px 0 7px 24px;border-top:1px solid var(--line);position:relative}.box li:first-child{border-top:0}.box li::before{content:"—";position:absolute;left:0;color:var(--mut)}
.box li b{color:#fff;font-weight:500}
pre{margin:0;font:500 16px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:#e6e6e6}
pre .c{color:var(--acc)}pre .m{color:var(--mut)}pre .r{color:#ff5a4f}
.say{border-color:var(--acc)}.say p{font-size:23px;line-height:1.35;color:#fff}
.weak{border-color:#6a3a36}.weak .lab{color:#ff8a7e}
.tm{color:var(--acc)}
.hint{position:fixed;right:28px;bottom:12px;font:500 12px ui-monospace,Menlo,monospace;letter-spacing:.14em;color:#555}
@media (max-width:1100px){.g{grid-template-columns:minmax(0,1fr)}#side{width:260px}#main{left:260px}}
</style></head><body>
