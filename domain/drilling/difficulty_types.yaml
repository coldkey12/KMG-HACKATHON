# Восемь типов трудности — из документа организаторов «Подача доменов геологии» (официально).
version: 0.2.0
provisional: false
source: docs/organizers/pack/06_подача_и_референсы/подача_доменов_геологии.md
types:
  М:
    name: Механизм процесса
    description: 'Как работает технический или физический процесс: что куда движется и почему'
    leading_format: Шортсы и длинные видео с анимацией разреза
    mix_video_action_read: 60 / 25 / 15
  В:
    name: Геологическое время
    description: 'Историю формирования за миллионы лет: какое событие за каким'
    leading_format: Анимация эволюции со шкалой этапов, интерактив «отмотать назад»
    mix_video_action_read: 60 / 25 / 15
  И:
    name: Косвенное измерение
    description: Цепочку «сигнал → отклик → свойство» и понимание, что ответов может быть несколько
    leading_format: Синхрон «прибор — кривая — интерпретация», затем «интерпретируй сам» на реальных данных
    mix_video_action_read: 45 / 40 / 15
  Ф:
    name: Формализм и модель
    description: 'Смысл уравнения или модели: что в ней меняется и к чему приводит'
    leading_format: Шортс про физический смысл + интерактив с ползунками параметров
    mix_video_action_read: 40 / 45 / 15
  П:
    name: Пространство
    description: Объём по картам и разрезам, сечение в любом направлении
    leading_format: 3D-интерактив с движущимся разрезом, синхронные виды; видео — для переходов
    mix_video_action_read: 35 / 50 / 15
  Пр:
    name: Процедура
    description: Порядок действий, входные данные, точки выбора, ручной труд
    leading_format: Практикум на данных, длинное видео «день специалиста», интерактивная блок-схема
    mix_video_action_read: 25 / 55 / 20
  Н:
    name: Неопределённость и решение
    description: Диапазон вместо числа, сценарии, вероятности, цена ошибки
    leading_format: Интерактив на сценарии и Монте-Карло, кейсы «решение → исход»
    mix_video_action_read: 25 / 55 / 20
  Р:
    name: Распознавание
    description: Умение узнать признак на фото керна, шлифе, кривой или сейсмике
    leading_format: Шортс «фото → признаки → схема», фото-квизы, карточки повторения
    mix_video_action_read: 30 / 50 / 20
rules:
- '**М и В** — единственные типы, где длинное видео оправдано само по себе: цепочка событий длиннее одного шортса. Главный риск — одна гладкая реконструкция без пометки, что это гипотеза.'
- '**И** — кривая или сейсмотрасса всегда в кадре рядом с причиной и считается из той же модели. Обязателен узел про неоднозначность: два разных разреза с похожим откликом.'
- '**Ф** — вывод формулы никогда не идёт в видео; видео показывает смысл каждого члена, а вывод живёт в карточке.'
- '**П** — пассивный шортс про геометрию слаб (статичная схема часто лучше анимации); видео нужно для переходов «карта → объём → разрез», а закрепление — в интерактиве.'
- '**Пр** — каждый практический узел несёт линзу неэффективности: входные данные, ручные шаги, точки суждения, время, типичные ошибки.'
- '**Н** — число всегда показывается диапазоном; интерактив даёт принять решение и увидеть его цену.'
- '**Р** — реальное фото сначала без разметки, затем с ней; для цифровиков это прямой мост к задачам компьютерного зрения.'
