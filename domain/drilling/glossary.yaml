version: 0.3.0
terms:
- id: d-01
  ru: скважина
  en: well
  prerequisite: true
  def: Узкий глубокий ствол, пробуренный в земле.
- id: d-02
  ru: буровой раствор
  en: drilling mud / drilling fluid
  prerequisite: true
  def: 'Жидкость, которую прокачивают через бурильную колонну: выносит шлам, держит стенки, создаёт противодавление.'
- id: d-03
  ru: долото
  en: drill bit
  prerequisite: true
  def: Инструмент на конце бурильной колонны, разрушающий породу.
- id: d-04
  ru: шлам
  en: cuttings
  prerequisite: true
  def: Обломки породы, выносимые раствором на поверхность.
- id: d-05
  ru: обсадная колонна
  en: casing
  prerequisite: true
  def: Стальные трубы, закрепляющие стенки скважины.
- id: d-06
  ru: затрубное пространство
  en: annulus
  prerequisite: true
  def: Кольцевой зазор между колонной труб и стенкой скважины.
- id: d-07
  ru: бурильная колонна
  en: drill string
  prerequisite: true
  def: Колонна труб от ротора до долота, через которую подаётся раствор.
- id: d-08
  ru: компоновка низа бурильной колонны
  en: bottom-hole assembly
  abbr: КНБК
  prerequisite: false
  def: 'Нижняя часть колонны: долото, утяжелённые трубы, двигатель, датчики.'
- id: d-09
  ru: забойное давление
  en: bottomhole pressure
  abbr: BHP
  prerequisite: false
  def: Давление на забое скважины.
- id: d-10
  ru: гидростатическое давление
  en: hydrostatic pressure
  prerequisite: false
  def: 'Давление столба раствора: растёт с глубиной и плотностью.'
- id: d-11
  ru: пластовое (поровое) давление
  en: pore pressure
  prerequisite: false
  def: Давление флюида в порах пласта.
- id: d-12
  ru: давление гидроразрыва
  en: fracture pressure
  prerequisite: false
  def: Давление, при котором порода трескается и принимает раствор.
- id: d-13
  ru: эквивалентная циркуляционная плотность
  en: equivalent circulating density
  abbr: ЭЦП
  prerequisite: false
  def: Плотность, эквивалентная забойному давлению при циркуляции.
- id: d-14
  ru: проявление (приток)
  en: kick
  prerequisite: false
  def: Поступление пластового флюида в скважину.
- id: d-15
  ru: открытый фонтан
  en: blowout
  prerequisite: false
  def: Неуправляемый выброс флюида из скважины.
- id: d-16
  ru: противовыбросовое оборудование (превентор)
  en: blowout preventer
  abbr: ПВО
  prerequisite: false
  def: Устьевое оборудование для герметизации скважины.
- id: d-17
  ru: поглощение
  en: lost circulation
  prerequisite: false
  def: Уход бурового раствора в пласт.
- id: d-18
  ru: прихват
  en: stuck pipe
  prerequisite: false
  def: Колонна не может двигаться в скважине.
- id: d-19
  ru: приёмная ёмкость
  en: mud pit
  prerequisite: false
  def: Ёмкость с раствором на поверхности; её объём следят для контроля скважины.
- id: d-20
  ru: цементирование
  en: cementing
  prerequisite: false
  def: Закачка цемента в затруб для крепления колонны и разобщения пластов.
- id: d-21
  ru: наклонно-направленное бурение
  en: directional drilling
  prerequisite: false
  def: Бурение по заданной траектории, отличной от вертикали.
- id: d-22
  ru: телеметрия во время бурения
  en: measurement while drilling
  abbr: MWD
  prerequisite: false
  def: Датчики в КНБК, передающие данные на поверхность при бурении.
- id: d-23
  ru: каротаж во время бурения
  en: logging while drilling
  abbr: LWD
  prerequisite: false
  def: Геофизические измерения прибором в КНБК во время бурения.
- id: d-24
  ru: механическая скорость проходки
  en: rate of penetration
  abbr: ROP
  prerequisite: false
  def: Сколько метров бурится в час.
- id: d-25
  ru: нагрузка на долото
  en: weight on bit
  abbr: WOB
  prerequisite: false
  def: Сила, с которой колонна давит на долото.
- id: d-26
  ru: глушение скважины
  en: well kill
  prerequisite: false
  def: Замена флюида в стволе раствором нужной плотности для восстановления контроля.
- id: d-27
  ru: ствол скважины
  en: wellbore
  prerequisite: true
  def: Пробуренная часть скважины, заполненная буровым раствором и флюидами.
- id: d-28
  ru: аномально высокое пластовое давление
  en: abnormally high formation pressure
  prerequisite: false
  def: Пластовое давление заметно выше нормального для данной глубины.
  abbr: АВПД
- id: d-29
  ru: переходная зона
  en: transition zone
  prerequisite: false
  def: Интервал разреза, где давление постепенно растёт от нормального к аномальному.
- id: d-30
  ru: коллектор
  en: reservoir rock
  prerequisite: true
  def: Порода, способная вмещать пластовый флюид и отдавать его в скважину.
- id: d-31
  ru: пластовый флюид
  en: formation fluid
  prerequisite: false
  def: Нефть, газ или вода, находящиеся в пласте под давлением.
- id: d-32
  ru: перелив
  en: flow (overflow)
  prerequisite: false
  def: Выход бурового раствора из скважины при остановленных насосах.
- id: d-33
  ru: газирование раствора
  en: gas cut mud
  prerequisite: false
  def: Насыщение бурового раствора газом, которое может быть признаком притока.
- id: d-34
  ru: газосодержание
  en: gas content
  prerequisite: false
  def: Количество газа, растворённого или захваченного в буровом растворе.
- id: d-35
  ru: дегазация
  en: degassing
  prerequisite: false
  def: Удаление газа из бурового раствора перед его повторным использованием.
- id: d-36
  ru: противодавление
  en: back pressure
  prerequisite: false
  def: Давление, которое столб раствора создаёт на пласт и которое удерживает флюид.
- id: d-37
  ru: скачок проходки
  en: drilling break
  prerequisite: false
  def: Резкое увеличение механической скорости бурения, которое может указывать на аномалию давления.
- id: d-38
  ru: уровнемер
  en: level sensor
  prerequisite: false
  def: Прибор для измерения уровня бурового раствора в приёмной емкости.
- id: d-39
  ru: расходомер
  en: flowmeter
  prerequisite: true
  def: Прибор для измерения расхода бурового раствора.
- id: d-40
  ru: долив
  en: trip fill-up
  prerequisite: false
  def: Добавление бурового раствора в скважину при подъёме бурильной колонны.
- id: d-41
  ru: спускоподъемные операции
  en: tripping
  prerequisite: false
  def: Спуск и подъём бурильной или обсадной колонны.
  abbr: СПО
- id: d-42
  ru: мерник
  en: trip tank
  prerequisite: false
  def: Мерная емкость с уровнемером, из которой измеряют объём долива.
- id: d-43
  ru: свабирование
  en: swabbing
  prerequisite: false
  def: Снижение давления на забое при подъёме колонны, которое может вызвать приток.
- id: d-44
  ru: штуцер
  en: choke
  prerequisite: false
  def: Регулируемое сужение на линии, которым управляют давлением в скважине.
- id: d-45
  ru: плашки
  en: rams
  prerequisite: false
  def: Уплотняющие элементы превентора; бывают трубными и глухими.
- id: d-46
  ru: безопасный клапан
  en: safety valve
  prerequisite: false
  def: Клапан, устанавливаемый на колонну труб для перекрытия её проходного канала.
- id: d-47
  ru: метод бурильщика
  en: driller's method
  prerequisite: false
  def: 'Двухэтапный способ глушения: сначала вытесняется флюид, затем закачивается утяжелённый раствор.'
- id: d-48
  ru: метод ожидания и веса
  en: wait-and-weight method
  prerequisite: false
  def: Одноэтапный способ глушения, при котором сразу циркулирует утяжелённый раствор.
- id: d-49
  ru: абсолютная погрешность
  en: absolute error
  prerequisite: false
  def: Погрешность датчика в единицах измеряемой величины; в главе обозначена как ε.
- id: d-50
  ru: коэффициент безопасности
  en: safety margin
  prerequisite: false
  def: Запас давления сверх расчётного, добавляемый при глушении скважины.
