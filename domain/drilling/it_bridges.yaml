version: 0.3.0
items:
- id: IT-D1
  topic: контроль скважины
  analogy: 'Объём раствора в ёмкостях — как баланс очереди сообщений: приток больше оттока — где-то лишний источник.'
  breaks: Источник — пласт под давлением; реагировать нужно за минуты, а «сообщения» — газ, который при всплытии расширяется.
- id: IT-D2
  topic: окно давлений
  analogy: 'Окно между поровым давлением и давлением гидроразрыва — как допустимый диапазон нагрузки сервиса: ниже — отказ (приток), выше — падение (поглощение).'
  breaks: Границы окна меняются с глубиной и известны лишь с неопределённостью; выход за границу необратим.
- id: IT-D3
  topic: телеметрия MWD
  analogy: 'MWD — как телеметрия по узкому каналу с низкой пропускной способностью: передаются сжатые сводки, не сырые данные.'
  breaks: Канал — импульсы давления в растворе; при остановке насосов связи нет вовсе.
- id: IT-D4
  topic: шлам как данные
  analogy: 'Шлам — как лог с задержкой доставки: событие (глубина) и запись (поверхность) разнесены во времени.'
  breaks: Задержку пересчитывают по расходу и объёму затруба; шлам перемешивается, точная глубина размыта.
- id: IT-D5
  topic: Уровнемер и порог обнаружения (ΔV_min = ε·S)
  analogy: Датчик заполнения буфера или очереди, который срабатывает только при изменении выше порога, зависящего от размера ёмкости.
  breaks: В скважине порог задаётся физикой жидкости и площадью поверхности; в ИТ порог обычно задаётся настройкой и не связан с геометрией объекта.
- id: IT-D6
  topic: Скачок проходки как ранний сигнал
  analogy: Аномалия метрики задержки (latency spike) как самый ранний сигнал деградации сервиса, который надо проверить, но не принять за диагноз.
  breaks: Скачок может быть вызван провалом инструмента в каверну, то есть механикой, а не аномалией давления; в мониторинге аномалия обычно отражает только саму метрику.
- id: IT-D7
  topic: Мягкое перекрытие скважины через штуцер
  analogy: Постепенное ограничение потока (throttling) вместо резкого отключения, чтобы избежать скачков нагрузки.
  breaks: 'Приток флюида физический и сжимаемый: он не «останавливается по команде», а снижается с инерцией; в системах запросов отмена обычно мгновенна.'
- id: IT-D8
  topic: Сверка долива с объёмом поднятых труб
  analogy: Сверка двойной записи (reconciliation) между журналом и выгрузкой банка, где любое расхождение выше допуска считается аномалией.
  breaks: Объём раствора и металла труб — непрерывные величины с погрешностью датчиков и пленкой на трубах; в бухгалтерии записи дискретны и точны.
- id: IT-D9
  topic: Сравнение входного и выходного расхода
  analogy: Сверка входящего и исходящего трафика на сетевом шлюзе, где рост выхода выше входа означает утечку или приток.
  breaks: В скважине есть инерция и запаздывание поступления сигналов с забоя; в сетях сигналы обычно приходят почти мгновенно.
- id: IT-D10
  topic: Превентор как запорное оборудование
  analogy: Аварийный выключатель или circuit breaker, который обрывает поток при аномалии и требует ручного сброса.
  breaks: 'Перекрытие скважины нельзя просто откатить: после него требуется глушение и удаление поступившего флюида, а в ИТ откат обычно возможен.'
