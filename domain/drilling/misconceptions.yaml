version: 0.1.0
source: 'ТЗ: типичные заблуждения + чек-лист «Бурение и скважина»'
items:
- id: M11
  text: Обсаженная скважина сама пропускает нефть без перфорации.
  official_id: misc.casing_flows
- id: M12
  text: Буровая вышка остаётся над добывающей скважиной.
  official_id: misc.rig_stays
- id: M19
  text: Газовая пачка в закрытой скважине расширяется, и давление не меняется.
  official_id: misc.gas_kick_constant
- id: M10
  text: Керн и шлам дают одинаковую информацию.
  official_id: misc.core_eq_cuttings
- id: M03
  text: Пласт — пустота, а не порода с порами.
  official_id: misc.reservoir_void
- id: D01
  text: Гидростатическое давление в скважине не зависит от плотности раствора.
- id: D02
  text: При циркуляции давление на забой такое же, как в покое.
- id: D03
  text: Рост объёма раствора в приёмной ёмкости — это нормально и ни о чём не говорит.
