# Заблуждения для бурения: из общего списка ТЗ (применимые к бурению) + раздел чек-листа «Бурение и скважина».
version: 0.1.0
source: "ТЗ: типичные заблуждения + чек-лист «Бурение и скважина»"
items:
  - {id: M11, text: "Обсаженная скважина сама пропускает нефть без перфорации."}
  - {id: M12, text: "Буровая вышка остаётся над добывающей скважиной."}
  - {id: M19, text: "Газовая пачка в закрытой скважине расширяется, и давление не меняется."}
  - {id: M10, text: "Керн и шлам дают одинаковую информацию."}
  - {id: M03, text: "Пласт — пустота, а не порода с порами."}
  - {id: D01, text: "Гидростатическое давление в скважине не зависит от плотности раствора."}
  - {id: D02, text: "При циркуляции давление на забой такое же, как в покое."}
  - {id: D03, text: "Рост объёма раствора в приёмной ёмкости — это нормально и ни о чём не говорит."}
