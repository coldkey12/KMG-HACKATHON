version: 0.3.0
source: ТЗ (общие и «Бурение и скважина») + команда
items:
- id: M11
  official_id: misc.casing_flows
  text: Обсаженная скважина сама пропускает нефть без перфорации.
- id: M12
  official_id: misc.rig_stays
  text: Буровая вышка остаётся над добывающей скважиной.
- id: M19
  official_id: misc.gas_kick_constant
  text: Газовая пачка в закрытой скважине расширяется, и давление не меняется.
- id: M10
  official_id: misc.core_eq_cuttings
  text: Керн и шлам дают одинаковую информацию.
- id: M03
  official_id: misc.reservoir_void
  text: Пласт — пустота, а не порода с порами.
- id: D01
  text: Гидростатическое давление в скважине не зависит от плотности раствора.
- id: D02
  text: При циркуляции давление на забой такое же, как в покое.
- id: D03
  text: Рост объёма раствора в приёмной ёмкости — это нормально и ни о чём не говорит.
- id: D04
  text: 'Чем тяжелее раствор, тем безопаснее: перебор плотности ничем не грозит.'
- id: D05
  text: Долото бурит вертикально вниз само по себе; траектория не требует управления.
- id: D06
  text: Шлам поднимается на поверхность мгновенно, его глубина известна точно.
- id: D07
  text: Прихват колонны — это поломка долота.
- id: D08
  text: Поглощение раствора — утечка на поверхности, а не уход раствора в пласт.
- id: D09
  text: Скорость проходки зависит только от нагрузки на долото.
- id: D10
  text: Газ при всплытии в открытой скважине расширяется равномерно по всему стволу.
- id: D16
  text: Газирование раствора само по себе является причиной выброса.
  right: Газирование обычно не приводит к существенному падению забойного давления; оно скорее признак условий поступления газа в скважину.
  source: bas-4 u-237-b00695
- id: D17
  text: Любой скачок проходки означает проявление.
  right: Скачок проходки — признак возможного проявления, но может быть вызван провалом инструмента в каверну или трещину, и тогда приводит к поглощению, а не к проявлению.
  source: bas-4 u-232-0bbf56
- id: D18
  text: Если давление на насосах снизилось, проявление слабое.
  right: Снижение давления на насосах может быть вызвано движением газовой пачки, поступившей при свабировании; сама по себе оно не говорит о слабой интенсивности.
  source: bas-4 u-238-866472
- id: D19
  text: Рост механической скорости бурения всегда означает приближение к зоне АВПД.
  right: Устойчивое самопроизвольное увеличение может указывать на АВПД, но единичный рост без тренда и без других признаков недостаточен для вывода.
  source: bas-4 u-232 footnote *Увеличение механической скорости*
- id: D20
  text: Изменение одного свойства бурового раствора однозначно доказывает проявление.
  right: Отклонения свойств могут иметь и другие причины; достовернее судить по изменению нескольких показателей одновременно, с учётом запаздывания.
  source: bas-4 u-239-15f37c, u-239-b38911
- id: D21
  text: Уровнемер фиксирует любой, даже очень малый приток.
  right: Минимальный видимый объём равен ΔV_min = ε·S; он зависит от погрешности датчика и площади поверхности жидкости в емкостях.
  source: bas-4 u-233-c024f3
- id: D22
  text: После закрытия скважины приток мгновенно прекращается.
  right: Приток снижается постепенно из-за сжимаемости жидкости в скважине и полностью прекращается, когда давление на устье плюс гидростатическое станет равно пластовому.
  source: bas-4 u-312-6b546e и далее
- id: D23
  text: Глушение скважины всегда выполняется в один этап.
  right: Метод бурильщика предполагает два этапа глушения, а в методе ожидания и веса все работы выполняются в один этап; выбор зависит от условий.
  source: bas-4 u-316-dcb2ca, u-317-c6819a
