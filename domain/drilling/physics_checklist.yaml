version: 0.1.0
items:
  - {id: P-D1, group: "Бурение и скважина", text: "Гидростатическое давление растёт с глубиной и плотностью раствора; при циркуляции давление на забой выше статического."}
  - {id: P-D2, group: "Бурение и скважина", text: "Газ в закрытой скважине почти не может расшириться и, всплывая, поднимает давление по всему стволу; в открытой скважине газ расширяется, сильнее всего у устья."}
  - {id: P-D3, group: "Бурение и скважина", text: "Рост объёма раствора в приёмной ёмкости — признак притока из пласта, уменьшение — признак поглощения."}
  - {id: P-D4, group: "Бурение и скважина", text: "Колонны, пакеры и оборудование на своих местах во всех кадрах; конструкция скважины не меняется между видами."}
  - {id: P-F3, group: "Флюиды и пласт", text: "Флюид движется от высокого давления к низкому."}
  - {id: P-C1, group: "Процессы и причинность", text: "Причина раньше следствия; порядок операций верный."}
  - {id: P-C2, group: "Процессы и причинность", text: "Соблюдается баланс (закачали → трещина выросла; шлам уходит по затрубу)."}
  - {id: P-S1, group: "Масштабы и числа", text: "Глубины, температуры (типично 60–150 °C у долота), давления правдоподобны."}
  - {id: P-K2, group: "Кадры и актуальность", text: "Техника из старой книги не выдаётся за сегодняшнюю практику."}
