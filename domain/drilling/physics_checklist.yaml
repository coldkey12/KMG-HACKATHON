# Чек-лист бурения: официальные пункты организаторов (pc.*) + пункты команды.
version: 0.2.0
items:
- id: pc.fluids_in_pores
  group: Флюиды и пласт
  text: Нефть и газ находятся в порах породы, а не в полостях и озёрах.
- id: pc.gas_oil_water
  group: Флюиды и пласт
  text: Газ над нефтью, нефть над водой; контакт горизонтален или оговорено иное.
- id: pc.flow_high_to_low
  group: Флюиды и пласт
  text: Флюид движется от высокого давления к низкому; ловушка имеет покрышку.
- id: pc.causality
  group: Процессы и причинность
  text: 'Порядок операций и событий верный: причина раньше следствия.'
- id: pc.balance
  group: Процессы и причинность
  text: Соблюдается баланс (масса, объём).
- id: pc.views_consistent
  group: Процессы и причинность
  text: Разрез, план и поверхность показывают одно и то же состояние.
- id: pc.plausible_numbers
  group: Масштабы и числа
  text: Глубины, температуры, давления и размеры правдоподобны.
- id: pc.exaggeration_named
  group: Масштабы и числа
  text: Преувеличения названы числом, а не только общей плашкой.
- id: pc.objects_stable
  group: Объекты
  text: Оборудование и прибор не меняют конструкцию между кадрами.
- id: pc.objects_plausible
  group: Объекты
  text: Объекты не совмещены неправдоподобно.
- id: pc.depth_down
  group: Кадры и актуальность
  text: Глубина растёт вниз; шкалы, единицы и полярность подписаны.
- id: pc.label_matches
  group: Кадры и актуальность
  text: Вертикальное преувеличение подписано числом; метка происхождения соответствует тому, как сделан кадр.
- id: pc.modern_or_historic
  group: Кадры и актуальность
  text: Оборудование современное или помечено как историческое.
- id: pc.hydrostatic
  group: Бурение и скважина
  text: Гидростатическое давление растёт с глубиной и плотностью раствора; при циркуляции давление на забой выше статического.
- id: pc.gas_closed_well
  group: Бурение и скважина
  text: Газ в закрытой скважине почти не может расшириться и, всплывая, поднимает давление по всему стволу; в открытой скважине газ расширяется, сильнее всего у устья.
- id: pc.pit_gain
  group: Бурение и скважина
  text: Рост объёма раствора в приёмной ёмкости — признак притока из пласта, уменьшение — признак поглощения.
- id: pc.well_construction
  group: Бурение и скважина
  text: Колонны, пакеры и оборудование на своих местах во всех кадрах; конструкция скважины не меняется между видами.
- id: pc.drill.ecd
  group: Бурение и скважина
  text: Эквивалентная циркуляционная плотность (ЭЦП) больше статической плотности раствора на величину потерь давления в затрубе.
  note: команда
- id: pc.drill.window
  group: Бурение и скважина
  text: Забойное давление держат в окне между пластовым (поровым) давлением и давлением гидроразрыва (поглощения).
  note: команда
- id: pc.drill.cuttings_path
  group: Бурение и скважина
  text: Раствор идёт вниз по бурильным трубам и вверх по затрубному пространству, вынося шлам; направление потока не меняется между кадрами.
  note: команда
- id: pc.drill.casing_cement
  group: Бурение и скважина
  text: Обсадная колонна цементируется в затрубе; цемент снаружи колонны, а не внутри.
  note: команда
- id: pc.drill.bop
  group: Бурение и скважина
  text: Превентор стоит на устье над обсадной колонной; при закрытии превентора поток идёт через штуцерный манифольд.
  note: команда
