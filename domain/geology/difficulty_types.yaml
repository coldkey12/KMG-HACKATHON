# Восемь типов трудности. Коды — из таблицы «Три выборки» ТЗ.
# ВНИМАНИЕ: расшифровки — гипотеза команды; документа организаторов «Подача доменов геологии» у нас нет.
# Когда он появится, меняются только name/description здесь, коды и код конвейера — нет.
version: 0.1.0
provisional: true
types:
  И:  {name: "Измерение", description: "Прибор даёт косвенный отклик; свойство получают интерпретацией (сигнал ≠ свойство)."}
  Пр: {name: "Процедура / практикум", description: "Порядок действий специалиста: признаки → правило → вывод; пороги и критерии."}
  Н:  {name: "Неоднозначность", description: "Одни данные — разные случаи; условия применимости; когда правило ломается."}
  Ф:  {name: "Формализм", description: "Уравнения, выводы, размерности; смысл переменных и допущения модели."}
  М:  {name: "Механизм невидимого процесса", description: "Процесс, который нельзя увидеть (фильтрация, волна давления); нужна модель состояния."}
  Р:  {name: "Распознавание", description: "Узнать тип объекта по совокупности признаков (фация, порода, риф)."}
  В:  {name: "Время / развитие", description: "Восстановить последовательность событий и рост во времени."}
  П:  {name: "Пространство / геометрия", description: "Представить форму тела, разрез, карту, 3D-строение."}
