# Глоссарий RU/EN. prerequisite: true — термин считается известным до главы (из короткого чтения-предпосылки),
# поэтому проверка порядка терминов не требует его объяснения внутри главы; курс показывает его в «Новых понятиях» со ссылкой «из предпосылок».
version: 0.1.0
terms:
  - {id: g-gis, ru: "ГИС (геофизические исследования скважин)", en: "well logging", abbr: "ГИС", prerequisite: true, def: "Измерения физических свойств пород приборами, опускаемыми в скважину на кабеле."}
  - {id: g-sp, ru: "метод собственных потенциалов (ПС, СП)", en: "spontaneous potential (SP)", abbr: "ПС", aliases: ["СП", "ПС"], prerequisite: true, def: "Запись естественной разности электрических потенциалов в скважине; выделяет проницаемые и глинистые пласты."}
  - {id: g-gr, ru: "гамма-метод (ГМ, ГК)", en: "gamma ray log (GR)", abbr: "ГМ", aliases: ["ГК", "ГМ"], prerequisite: true, def: "Запись естественного гамма-излучения пород; связано с глинистостью, но не равно ей."}
  - {id: g-ngm, ru: "нейтронный гамма-метод (НГМ, НГК)", en: "neutron-gamma log", abbr: "НГМ", aliases: ["НГК", "НГМ"], prerequisite: true, def: "Нейтронный метод: отклик зависит от водородосодержания (пористости) породы."}
  - {id: g-nm, ru: "нейтронные методы (НМ)", en: "neutron logs", abbr: "НМ", prerequisite: true, def: "Методы, где породу облучают нейтронами; отклик связан с содержанием водорода."}
  - {id: g-ggm, ru: "гамма-гамма-метод плотностной (ГГМ)", en: "density log", abbr: "ГГМ", prerequisite: true, def: "Метод рассеянного гамма-излучения; отклик связан с плотностью породы."}
  - {id: g-ak, ru: "акустический метод (АК, АМ)", en: "sonic log", abbr: "АК", aliases: ["АМ"], prerequisite: true, def: "Измерение времени пробега упругой волны ΔT; связано с пористостью."}
  - {id: g-bez, ru: "боковое электрическое зондирование (БЭЗ)", en: "lateral electrical sounding", abbr: "БЭЗ", prerequisite: true, def: "Набор зондов разной длины для оценки сопротивления на разном удалении от скважины."}
  - {id: g-bk, ru: "боковой (экранированный) каротаж (БК)", en: "laterolog", abbr: "БК", prerequisite: true, def: "Фокусированный зонд сопротивления."}
  - {id: g-mbk, ru: "микробоковой каротаж (МБК)", en: "microlaterolog", abbr: "МБК", prerequisite: true, def: "Фокусированный микрозонд малой глубинности."}
  - {id: g-ik, ru: "индукционный метод (ИК)", en: "induction log", abbr: "ИК", prerequisite: true, def: "Измерение проводимости пород без электрического контакта со стенкой скважины."}
  - {id: g-mz, ru: "микрозонды (МЗ)", en: "microlog", abbr: "МЗ", prerequisite: true, def: "Короткие зонды, прижатые к стенке; различают глинистую корку и промытую зону."}
  - {id: g-cal, ru: "кавернограмма, каверномер", en: "caliper log", prerequisite: true, def: "Запись фактического диаметра скважины."}
  - {id: g-nmr, ru: "ядерно-магнитный метод (ЯМР, ЯММ)", en: "nuclear magnetic resonance log (NMR)", abbr: "ЯМР", prerequisite: true, def: "Отклик пропорционален количеству подвижного водорода в порах — индекс свободного флюида."}
  - {id: g-rho, ru: "удельное электрическое сопротивление (ρ)", en: "resistivity", prerequisite: true, def: "Насколько порода сопротивляется электрическому току, Ом·м."}
  - {id: g-kp, ru: "коэффициент пористости (kп)", en: "porosity", abbr: "kп", aliases: ["пористость"], prerequisite: true, def: "Доля объёма породы, занятая порами."}
  - {id: g-kpr, ru: "коэффициент проницаемости (kпр)", en: "permeability", abbr: "kпр", aliases: ["проницаемость"], prerequisite: true, def: "Способность породы пропускать флюид; не то же, что пористость."}
  - {id: g-kv, ru: "коэффициент водонасыщения (kв)", en: "water saturation (Sw)", abbr: "kв", aliases: ["водонасыщенность", "нефтенасыщенность", "насыщение"], prerequisite: true, def: "Доля объёма пор, занятая водой."}
  - {id: g-pp, ru: "параметр пористости (Pп)", en: "formation factor (F)", abbr: "Pп", prerequisite: true, def: "Отношение сопротивления водонасыщенной породы к сопротивлению воды."}
  - {id: g-pn, ru: "параметр насыщения (Pн)", en: "resistivity index (RI)", abbr: "Pн", prerequisite: true, def: "Во сколько раз сопротивление нефтегазонасыщенной породы больше, чем той же породы с водой."}
  - {id: g-alpha-sp, ru: "относительная амплитуда ПС (αпс)", en: "relative SP amplitude", abbr: "αпс", prerequisite: true, def: "Амплитуда ПС против пласта, делённая на амплитуду в чистом опорном пласте."}
  - {id: g-filtrate, ru: "фильтрат бурового раствора", en: "mud filtrate", prerequisite: true, def: "Жидкость, отфильтровавшаяся из раствора в проницаемый пласт."}
  - {id: g-mudcake, ru: "глинистая корка", en: "mudcake", prerequisite: true, def: "Слой глинистых частиц раствора на стенке скважины против проницаемого пласта."}
  - {id: g-invasion, ru: "зона проникновения", en: "invaded zone", prerequisite: true, def: "Часть пласта вокруг скважины, куда вошёл фильтрат раствора."}
  - {id: g-collector, ru: "коллектор", en: "reservoir rock", prerequisite: true, def: "Порода, способная вмещать и отдавать нефть, газ или воду."}
  - {id: g-vnk, ru: "водонефтяной контакт (ВНК)", en: "oil-water contact (OWC)", abbr: "ВНК", prerequisite: false, def: "Граница между нефтенасыщенной и водонасыщенной частью залежи; бывает с переходной зоной."}
  - {id: g-gnk, ru: "газонефтяной контакт (ГНК)", en: "gas-oil contact (GOC)", abbr: "ГНК", prerequisite: false, def: "Граница между газовой шапкой и нефтью."}
  - {id: g-gzhk, ru: "газожидкостный контакт (ГЖК)", en: "gas-liquid contact", abbr: "ГЖК", prerequisite: false, def: "Граница газа и жидкости (нефти или воды)."}
  - {id: g-heff, ru: "эффективная толщина (hэф)", en: "net pay / net thickness", abbr: "hэф", prerequisite: false, def: "Суммарная толщина прослоев-коллекторов в пласте."}
  - {id: g-field, ru: "месторождение", en: "field", prerequisite: true, def: "Скопление нефти или газа, которое выгодно разрабатывать."}
  - {id: g-well, ru: "скважина", en: "well", prerequisite: true, def: "Узкий глубокий ствол, пробуренный в земле."}
  - {id: g-mud, ru: "буровой (промывочный) раствор", en: "drilling mud", aliases: ["буровой раствор", "промывочная жидкость", "глинистый раствор"], prerequisite: true, def: "Жидкость, которую прокачивают через скважину при бурении: выносит шлам, держит стенки, создаёт давление."}
  - {id: g-core, ru: "керн", en: "core", prerequisite: true, def: "Цилиндрический образец породы, поднятый из скважины."}
  - {id: g-lith, ru: "литология", en: "lithology", aliases: ["литологический"], prerequisite: true, def: "Состав и строение горной породы."}
