# ИТ-мосты: аналогия + где ломается. Модель может предложить свою; пакетная — предпочтительна (id в it_analogy.pack_id).
version: 0.1.0
items:
  - {id: IT01, topic: "косвенное измерение", analogy: "Каротажная кривая — как метрика мониторинга: это отклик датчика, а не само состояние системы.", breaks: "Метрику можно откалибровать по логам системы; у породы «логов» нет — калибруют по керну и испытаниям."}
  - {id: IT02, topic: "комплекс методов", analogy: "Комплекс ГИС — как ансамбль признаков: один признак неоднозначен, вместе они различают классы.", breaks: "Признаки ГИС физически связаны и искажаются одной и той же средой (раствором, проникновением) — это не независимые фичи."}
  - {id: IT03, topic: "граничное значение", analogy: "Граничное значение — как порог классификатора «коллектор / неколлектор».", breaks: "Порог выводят не из ROC-кривой, а из экономики (рентабельный дебит) и петрофизики; он разный для разных пород."}
  - {id: IT04, topic: "нормализация диаграмм", analogy: "Нормализация — как приведение двух рядов к общей шкале перед сравнением: расхождение = аномалия.", breaks: "Совмещать можно только там, где известно, что флюид — вода; это априорное знание, а не статистика."}
  - {id: IT05, topic: "зона проникновения", analogy: "Зона проникновения — как кэш, перезаписанный рядом с точкой чтения: ближние датчики видят кэш, дальние — исходные данные.", breaks: "«Кэш» со временем расформировывается сам, и его глубина зависит от раствора и пористости."}
