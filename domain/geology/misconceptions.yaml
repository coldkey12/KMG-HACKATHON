version: 0.2.0
source: ТЗ + docs/organizers/pack/04_доменные_заготовки/misconceptions.json (official_id)
items:
- id: M01
  text: Нефть лежит подземным озером или в пещерах.
  official_id: misc.oil_lake
- id: M02
  text: Нефть образовалась из динозавров.
  official_id: misc.dinosaurs
- id: M03
  text: Пласт — пустота, а не порода с порами.
  official_id: misc.reservoir_void
- id: M04
  text: Пористость и проницаемость — одно и то же.
  official_id: misc.porosity_eq_perm
- id: M05
  text: Сейсмика «видит нефть» напрямую.
  official_id: misc.seismic_sees_oil
- id: M06
  text: Высокое сопротивление всегда означает нефть.
  official_id: misc.high_res_oil
- id: M07
  text: ГК «отражается» от породы.
  official_id: misc.gr_reflects
- id: M08
  text: Водонефтяной контакт всегда резкая плоская граница.
  official_id: misc.owc_sharp
- id: M09
  text: Запасы — одно точное число, а не диапазон с вероятностями.
  official_id: misc.reserves_exact
- id: M10
  text: Керн и шлам дают одинаковую информацию.
  official_id: misc.core_eq_cuttings
- id: M11
  text: Обсаженная скважина сама пропускает нефть без перфорации.
  official_id: misc.casing_flows
- id: M12
  text: Буровая вышка остаётся над добывающей скважиной.
  official_id: misc.rig_stays
- id: M13
  text: Каротажная кривая — это и есть порода, а не косвенное измерение.
  official_id: misc.log_is_rock
- id: M14
  text: Модель пласта точно знает, что под землёй.
  official_id: misc.model_knows
- id: M15
  text: Тонкий пласт, который не виден отдельным отражением, на сейсмике «не существует».
  official_id: misc.thin_bed_absent
- id: M16
  text: Давление в пласте расходится с постоянной скоростью, как звук.
  official_id: misc.pressure_sound_speed
- id: M17
  text: Высокая амплитуда на сейсмике всегда означает углеводороды.
  official_id: misc.amplitude_hc
- id: M18
  text: Гамма-каротаж измеряет глинистость напрямую.
  official_id: misc.gr_measures_clay
- id: M19
  text: Газовая пачка в закрытой скважине расширяется, и давление не меняется.
  official_id: misc.gas_kick_constant
- id: M20
  text: Пористость рифовых известняков сохраняется такой, какой была при образовании.
  official_id: misc.reef_porosity_preserved
