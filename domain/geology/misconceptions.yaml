# Список заблуждений из ТЗ (раздел «Типичные заблуждения»). id устойчивы; ссылки из слоя — misconception.pack_id.
version: 0.1.0
source: "ТЗ, чек-лист физической и предметной корректности"
items:
  - {id: M01, text: "Нефть лежит подземным озером или в пещерах."}
  - {id: M02, text: "Нефть образовалась из динозавров."}
  - {id: M03, text: "Пласт — пустота, а не порода с порами."}
  - {id: M04, text: "Пористость и проницаемость — одно и то же."}
  - {id: M05, text: "Сейсмика «видит нефть» напрямую."}
  - {id: M06, text: "Высокое сопротивление всегда означает нефть."}
  - {id: M07, text: "ГК «отражается» от породы."}
  - {id: M08, text: "Водонефтяной контакт всегда резкая плоская граница."}
  - {id: M09, text: "Запасы — одно точное число, а не диапазон с вероятностями."}
  - {id: M10, text: "Керн и шлам дают одинаковую информацию."}
  - {id: M11, text: "Обсаженная скважина сама пропускает нефть без перфорации."}
  - {id: M12, text: "Буровая вышка остаётся над добывающей скважиной."}
  - {id: M13, text: "Каротажная кривая — это и есть порода, а не косвенное измерение."}
  - {id: M14, text: "Модель пласта точно знает, что под землёй."}
  - {id: M15, text: "Тонкий пласт, который не виден отдельным отражением, на сейсмике «не существует»."}
  - {id: M16, text: "Давление в пласте расходится с постоянной скоростью, как звук."}
  - {id: M17, text: "Высокая амплитуда на сейсмике всегда означает углеводороды."}
  - {id: M18, text: "Гамма-каротаж измеряет глинистость напрямую."}
  - {id: M19, text: "Газовая пачка в закрытой скважине расширяется, и давление не меняется."}
  - {id: M20, text: "Пористость рифовых известняков сохраняется такой, какой была при образовании."}
