# Чек-лист физической и предметной корректности (ТЗ). Используется модулем проверки и инвариантами сцен.
version: 0.1.0
items:
  - {id: P-L1, group: "Слои и структура", text: "Порядок слоёв сохраняется; молодые лежат на старых, если не показан надвиг или опрокидывание."}
  - {id: P-L2, group: "Слои и структура", text: "Разлом смещает слои согласованно по обе стороны; смещение не исчезает и не меняет знак."}
  - {id: P-L3, group: "Слои и структура", text: "Несогласие показано как событие: размыв, перерыв, новое накопление."}
  - {id: P-F1, group: "Флюиды и пласт", text: "Нефть и газ находятся в порах породы, а не в полостях и озёрах."}
  - {id: P-F2, group: "Флюиды и пласт", text: "Газ над нефтью, нефть над водой; контакт горизонтален, если не оговорено иное; переходная зона бывает."}
  - {id: P-F3, group: "Флюиды и пласт", text: "Флюид движется от высокого давления к низкому; ловушка имеет покрышку."}
  - {id: P-C1, group: "Процессы и причинность", text: "Причина раньше следствия; порядок операций верный."}
  - {id: P-C2, group: "Процессы и причинность", text: "Соблюдается баланс (закачали → трещина выросла; шлам уходит по затрубу)."}
  - {id: P-C3, group: "Процессы и причинность", text: "Разрез, план и поверхность показывают одно состояние."}
  - {id: P-M1, group: "Измерения и данные", text: "Механизм прибора верный: ГК регистрирует собственное излучение породы, а не «отражение»."}
  - {id: P-M2, group: "Измерения и данные", text: "Сигнал отделён от свойства: прибор измеряет отклик, свойство получают интерпретацией."}
  - {id: P-M3, group: "Измерения и данные", text: "Названы условия применимости правила (например, знак ПС зависит от соотношения минерализации фильтрата и пластовой воды)."}
  - {id: P-M4, group: "Измерения и данные", text: "Кривая синхронна с прибором и вычислена из той же модели."}
  - {id: P-S1, group: "Масштабы и числа", text: "Глубины, температуры, давления, размеры правдоподобны."}
  - {id: P-S2, group: "Масштабы и числа", text: "Преувеличения названы числом."}
  - {id: P-O1, group: "Объекты", text: "Оборудование не меняет конструкцию между кадрами; объекты не совмещены неправдоподобно."}
  - {id: P-K1, group: "Кадры и актуальность", text: "Глубина растёт вниз; шкалы, единицы, полярность подписаны."}
  - {id: P-K2, group: "Кадры и актуальность", text: "Техника из старой книги не выдаётся за сегодняшнюю практику."}
