# Манифест моделей агента B. Заменить модель = поменять строку здесь; код сборщика не меняется.
# external: уходят ли данные во внешний сервис. Цены берутся из config/models.yaml (общий манифест агента A).
version: 0.1.0
roles:
  tasks: {provider: anthropic, model: claude-haiku-5-5, effort: medium, max_tokens: 64000, external: true,
          purpose: "задания по утверждениям узлов (ключи затем проверяются без модели)"}
  script: {provider: anthropic, model: claude-sonnet-5-5, effort: medium, max_tokens: 16000, external: true,
           purpose: "закадровый текст ролика по утверждениям узла (каждая фраза → id утверждений; проверяется без модели)"}
tts:
  primary:  {provider: microsoft-edge-online, voice: ru-RU-SvetlanaNeural, external: true, sends: "только текст сценария"}
  fallback: [{provider: elevenlabs, voice: multilingual_v2, external: true, when: "есть ELEVENLABS_API_KEY"},
             {provider: microsoft-edge-online, voice: ru-RU-DmitryNeural, external: true}]
render:
  browser: {tool: "Chromium-семейство без окна через Playwright 1.65 (Chromium Playwright / Google Chrome / Microsoft Edge — что найдётся; KMG_BROWSER)", external: false}
  encoder: {tool: "FFmpeg (libx264, AAC, loudnorm −16 LUFS)", external: false}
asr:
  check: {tool: "faster-whisper 1.2.1, модель small (CPU, int8)", external: false, note: "модель скачивается один раз с Hugging Face; аудио не уходит наружу"}
