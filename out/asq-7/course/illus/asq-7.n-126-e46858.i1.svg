<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1220" role="img" aria-label="Схема шага «Карта интерпретации: от данных к результатам»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Карта интерпретации: от данных к результатам»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Сырые данные каротажа и</text><text class="it" x="24" y="96">другая информация о</text><text class="it" x="24" y="122">скважине (левая колонка</text><text class="it" x="24" y="148">схемы).</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Набор кривых зависит от</text><text class="it" x="24" y="256">того, что записано в</text><text class="it" x="24" y="282">конкретной скважине.</text><line class="ia" x1="170" y1="310" x2="170" y2="330"/><path class="iah" d="M170 336 l-6 -9 h12 z"/><rect class="i-node" x="12" y="340" width="316" height="76" rx="6"/><text class="it" x="24" y="372">Карта интерпретации: от</text><text class="it" x="24" y="398">данных к результатам</text><line class="ia" x1="170" y1="420" x2="170" y2="440"/><path class="iah" d="M170 446 l-6 -9 h12 z"/><rect class="i-out" x="12" y="450" width="316" height="154" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Пористость (φ) и объём</text><text class="it" x="24" y="534">глинистости (Vsh), каждая</text><text class="it" x="24" y="560">считается несколькими</text><text class="it" x="24" y="586">путями.</text><rect class="i-out" x="12" y="610" width="316" height="128" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Величины интереса справа,</text><text class="it" x="24" y="694">которые получают из</text><text class="it" x="24" y="720">промежуточных величин.</text><rect class="i-out" x="12" y="744" width="316" height="154" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Состав величин интереса на</text><text class="it" x="24" y="828">схеме не подтверждён</text><text class="it" x="24" y="854">текстом. Его надо сверить</text><text class="it" x="24" y="880">со сканом.</text><rect class="i-warn" x="12" y="904" width="316" height="128" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Разные пути расчёта дают</text><text class="it" x="24" y="988">разные значения одной</text><text class="it" x="24" y="1014">величины.</text><rect class="i-warn" x="12" y="1038" width="316" height="128" rx="6"/><text class="ih" x="24" y="1070">Где ломается</text><text class="it" x="24" y="1096">Если данных по скважине</text><text class="it" x="24" y="1122">мало, часть путей</text><text class="it" x="24" y="1148">недоступна.</text><rect x="249" y="1184" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1205">схема</text></svg>