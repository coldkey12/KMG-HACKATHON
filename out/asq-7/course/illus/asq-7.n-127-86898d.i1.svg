<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1272" role="img" aria-label="Схема шага «Индекс подвижных углеводородов и его пороги»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Индекс подвижных углеводородов и его пороги»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Rxo с сверхмелкого</text><text class="it" x="24" y="96">прибора, например</text><text class="it" x="24" y="122">laterolog-8,</text><text class="it" x="24" y="148">микрофокусированного</text><text class="it" x="24" y="174">каротажа или микрозонда.</text><rect class="i-in" x="12" y="198" width="316" height="180" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Rt с глубокого прибора</text><text class="it" x="24" y="282">(индукционный или боковой</text><text class="it" x="24" y="308">глубинный),</text><text class="it" x="24" y="334">скорректированный на</text><text class="it" x="24" y="360">проникновение.</text><rect class="i-in" x="12" y="384" width="316" height="102" rx="6"/><text class="ih" x="24" y="416">Вход</text><text class="it" x="24" y="442">Rmf и Rw, оба при</text><text class="it" x="24" y="468">пластовой температуре.</text><line class="ia" x1="170" y1="496" x2="170" y2="516"/><path class="iah" d="M170 522 l-6 -9 h12 z"/><rect class="i-node" x="12" y="526" width="316" height="76" rx="6"/><text class="it" x="24" y="558">Индекс подвижных</text><text class="it" x="24" y="584">углеводородов и его пороги</text><line class="ia" x1="170" y1="606" x2="170" y2="626"/><path class="iah" d="M170 632 l-6 -9 h12 z"/><rect class="i-out" x="12" y="636" width="316" height="128" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Индекс Sw/Sxo, который</text><text class="it" x="24" y="720">сравнивают с 1.0 и с</text><text class="it" x="24" y="746">порогом 0.7 или 0.6.</text><rect class="i-out" x="12" y="770" width="316" height="154" rx="6"/><text class="ih" x="24" y="802">Вывод</text><text class="it" x="24" y="828">Вывод по зоне:</text><text class="it" x="24" y="854">углеводороды не вытеснены</text><text class="it" x="24" y="880">(индекс 1.0 и выше) или</text><text class="it" x="24" y="906">подвижны (ниже порога).</text><rect class="i-warn" x="12" y="930" width="316" height="154" rx="6"/><text class="ih" x="24" y="962">Где ломается</text><text class="it" x="24" y="988">Значения между порогом и</text><text class="it" x="24" y="1014">1.0 книга не разбирает,</text><text class="it" x="24" y="1040">поэтому вывод</text><text class="it" x="24" y="1066">неоднозначен.</text><rect class="i-warn" x="12" y="1090" width="316" height="128" rx="6"/><text class="ih" x="24" y="1122">Где ломается</text><text class="it" x="24" y="1148">Индекс 1.0 и выше не</text><text class="it" x="24" y="1174">означает отсутствие</text><text class="it" x="24" y="1200">углеводородов.</text><rect x="249" y="1236" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1257">схема</text></svg>