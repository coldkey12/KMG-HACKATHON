<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1008" role="img" aria-label="Схема шага «Водонасыщенность из отношения Rwa»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Водонасыщенность из отношения Rwa»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кажущееся сопротивление</text><text class="it" x="24" y="96">воды Rwa по каждой</text><text class="it" x="24" y="122">сравниваемой зоне.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Наименьшее Rwa среди</text><text class="it" x="24" y="230">сравниваемых зон как</text><text class="it" x="24" y="256">опорное значение.</text><line class="ia" x1="170" y1="284" x2="170" y2="304"/><path class="iah" d="M170 310 l-6 -9 h12 z"/><rect class="i-node" x="12" y="314" width="316" height="76" rx="6"/><text class="it" x="24" y="346">Водонасыщенность из</text><text class="it" x="24" y="372">отношения Rwa</text><line class="ia" x1="170" y1="394" x2="170" y2="414"/><path class="iah" d="M170 420 l-6 -9 h12 z"/><rect class="i-out" x="12" y="424" width="316" height="128" rx="6"/><text class="ih" x="24" y="456">Вывод</text><text class="it" x="24" y="482">Водонасыщенность Sw каждой</text><text class="it" x="24" y="508">зоны относительно опорного</text><text class="it" x="24" y="534">Rwa.</text><rect class="i-out" x="12" y="558" width="316" height="128" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Ориентир Sw по отношению</text><text class="it" x="24" y="642">3, 4 или 5 для быстрой</text><text class="it" x="24" y="668">оценки.</text><rect class="i-warn" x="12" y="692" width="316" height="128" rx="6"/><text class="ih" x="24" y="724">Где ломается</text><text class="it" x="24" y="750">Если опорная зона содержит</text><text class="it" x="24" y="776">нефть, оценка Sw соседних</text><text class="it" x="24" y="802">зон смещена.</text><rect class="i-warn" x="12" y="826" width="316" height="128" rx="6"/><text class="ih" x="24" y="858">Где ломается</text><text class="it" x="24" y="884">Таблица ориентиров верна</text><text class="it" x="24" y="910">только при a = 1.0 и m =</text><text class="it" x="24" y="936">2.0.</text><rect x="249" y="972" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="993">схема</text></svg>