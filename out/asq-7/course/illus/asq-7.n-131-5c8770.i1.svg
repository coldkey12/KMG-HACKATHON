<svg viewBox="0 0 340 1380" role="img" aria-label="Схема шага «Кривая «влажного» сопротивления Ro: эталон для сравнения»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Кривая «влажного» сопротивления Ro: эталон для сравнения»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Пористость из</text><text class="it" x="24" y="96">акустического или</text><text class="it" x="24" y="122">плотностного каротажа.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Оценка сопротивления</text><text class="it" x="24" y="230">пластовой воды Rw при</text><text class="it" x="24" y="256">пластовой температуре.</text><rect class="i-in" x="12" y="280" width="316" height="128" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Параметры a и m</text><text class="it" x="24" y="364">(коэффициент извилистости</text><text class="it" x="24" y="390">и показатель цементации).</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="102" rx="6"/><text class="it" x="24" y="480">Кривая «влажного»</text><text class="it" x="24" y="506">сопротивления Ro: эталон</text><text class="it" x="24" y="532">для сравнения</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="128" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Кривая Ro в масштабе</text><text class="it" x="24" y="668">кривых сопротивления для</text><text class="it" x="24" y="694">каждой зоны.</text><rect class="i-out" x="12" y="718" width="316" height="154" rx="6"/><text class="ih" x="24" y="750">Вывод</text><text class="it" x="24" y="776">Наложение двух кривых:</text><text class="it" x="24" y="802">совпадение в водоносных</text><text class="it" x="24" y="828">зонах, разрыв в</text><text class="it" x="24" y="854">нефтеносных.</text><rect class="i-out" x="12" y="878" width="316" height="154" rx="6"/><text class="ih" x="24" y="910">Вывод</text><text class="it" x="24" y="936">При желании —</text><text class="it" x="24" y="962">водонасыщенность по Арчи</text><text class="it" x="24" y="988">по Ro и глубокому</text><text class="it" x="24" y="1014">сопротивлению.</text><rect class="i-warn" x="12" y="1038" width="316" height="128" rx="6"/><text class="ih" x="24" y="1070">Где ломается</text><text class="it" x="24" y="1096">Ro опирается на оценку Rw:</text><text class="it" x="24" y="1122">неверная оценка смещает</text><text class="it" x="24" y="1148">кривую Ro.</text><rect class="i-warn" x="12" y="1172" width="316" height="154" rx="6"/><text class="ih" x="24" y="1204">Где ломается</text><text class="it" x="24" y="1230">Разрыв между кривыми</text><text class="it" x="24" y="1256">нельзя переводить в</text><text class="it" x="24" y="1282">количество без правильных</text><text class="it" x="24" y="1308">Rw и пористости.</text><rect x="249" y="1344" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1365">схема</text></svg>