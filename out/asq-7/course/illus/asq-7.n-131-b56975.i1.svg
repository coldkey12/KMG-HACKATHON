<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1190" role="img" aria-label="Схема шага «График Баклса: гиперболы равной BVW»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «График Баклса: гиперболы равной BVW»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Пары значений пористости и</text><text class="it" x="24" y="96">водонасыщенности для точек</text><text class="it" x="24" y="122">пласта, нанесённые на</text><text class="it" x="24" y="148">линейные шкалы.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Значения водонасыщенности</text><text class="it" x="24" y="256">и пористости, рассчитанные</text><text class="it" x="24" y="282">по каротажным данным в</text><text class="it" x="24" y="308">разных точках пласта.</text><line class="ia" x1="170" y1="336" x2="170" y2="356"/><path class="iah" d="M170 362 l-6 -9 h12 z"/><rect class="i-node" x="12" y="366" width="316" height="76" rx="6"/><text class="it" x="24" y="398">График Баклса: гиперболы</text><text class="it" x="24" y="424">равной BVW</text><line class="ia" x1="170" y1="446" x2="170" y2="466"/><path class="iah" d="M170 472 l-6 -9 h12 z"/><rect class="i-out" x="12" y="476" width="316" height="180" rx="6"/><text class="ih" x="24" y="508">Вывод</text><text class="it" x="24" y="534">Точки на одной гиперболе:</text><text class="it" x="24" y="560">BVW постоянна, пласт</text><text class="it" x="24" y="586">близок к неснижаемой</text><text class="it" x="24" y="612">водонасыщенности, воду не</text><text class="it" x="24" y="638">даёт.</text><rect class="i-out" x="12" y="662" width="316" height="180" rx="6"/><text class="ih" x="24" y="694">Вывод</text><text class="it" x="24" y="720">Точки разбросаны от</text><text class="it" x="24" y="746">гипербол: пласт держит</text><text class="it" x="24" y="772">больше воды, чем</text><text class="it" x="24" y="798">капиллярно удерживает;</text><text class="it" x="24" y="824">вода добывается.</text><rect class="i-warn" x="12" y="848" width="316" height="128" rx="6"/><text class="ih" x="24" y="880">Где ломается</text><text class="it" x="24" y="906">Гиперболы видны только при</text><text class="it" x="24" y="932">линейных шкалах пористости</text><text class="it" x="24" y="958">и водонасыщенности.</text><rect class="i-warn" x="12" y="982" width="316" height="154" rx="6"/><text class="ih" x="24" y="1014">Где ломается</text><text class="it" x="24" y="1040">Нужна серия точек на одной</text><text class="it" x="24" y="1066">кривой; одна точка не</text><text class="it" x="24" y="1092">доказывает постоянство</text><text class="it" x="24" y="1118">BVW.</text><rect x="249" y="1154" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1175">схема</text></svg>