<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 896" role="img" aria-label="Схема шага «Кроссплоты насыщенности: зачем рисовать»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Кроссплоты насыщенности: зачем рисовать»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Данные каротажа,</text><text class="it" x="24" y="96">отложенные по осям: в</text><text class="it" x="24" y="122">названии метода —</text><text class="it" x="24" y="148">сопротивление и</text><text class="it" x="24" y="174">пористость.</text><rect class="i-in" x="12" y="198" width="316" height="154" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Точки по каждой</text><text class="it" x="24" y="282">потенциально продуктивной</text><text class="it" x="24" y="308">зоне, а не одна точка на</text><text class="it" x="24" y="334">весь разрез.</text><line class="ia" x1="170" y1="362" x2="170" y2="382"/><path class="iah" d="M170 388 l-6 -9 h12 z"/><rect class="i-node" x="12" y="392" width="316" height="76" rx="6"/><text class="it" x="24" y="424">Кроссплоты насыщенности:</text><text class="it" x="24" y="450">зачем рисовать</text><line class="ia" x1="170" y1="472" x2="170" y2="492"/><path class="iah" d="M170 498 l-6 -9 h12 z"/><rect class="i-out" x="12" y="502" width="316" height="154" rx="6"/><text class="ih" x="24" y="534">Вывод</text><text class="it" x="24" y="560">Водонасыщенность (Sw),</text><text class="it" x="24" y="586">которую читают из</text><text class="it" x="24" y="612">положения точек на</text><text class="it" x="24" y="638">графике.</text><rect class="i-warn" x="12" y="662" width="316" height="180" rx="6"/><text class="ih" x="24" y="694">Где ломается</text><text class="it" x="24" y="720">Кроссплот опирается на</text><text class="it" x="24" y="746">уравнение Арчи. Если его</text><text class="it" x="24" y="772">допущения не выполняются,</text><text class="it" x="24" y="798">график даст искажённую</text><text class="it" x="24" y="824">картину.</text><rect x="249" y="860" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="881">схема</text></svg>