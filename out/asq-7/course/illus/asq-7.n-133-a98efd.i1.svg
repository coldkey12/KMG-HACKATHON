<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 952" role="img" aria-label="Схема шага «Сетки Хингла: песчаники и карбонаты»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Сетки Хингла: песчаники и карбонаты»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Пористость по линейной</text><text class="it" x="24" y="96">оси.</text><rect class="i-in" x="12" y="120" width="316" height="154" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Сопротивление пласта,</text><text class="it" x="24" y="204">которое читается по сетке</text><text class="it" x="24" y="230">для выбранного типа</text><text class="it" x="24" y="256">породы.</text><line class="ia" x1="170" y1="284" x2="170" y2="304"/><path class="iah" d="M170 310 l-6 -9 h12 z"/><rect class="i-node" x="12" y="314" width="316" height="76" rx="6"/><text class="it" x="24" y="346">Сетки Хингла: песчаники и</text><text class="it" x="24" y="372">карбонаты</text><line class="ia" x1="170" y1="394" x2="170" y2="414"/><path class="iah" d="M170 420 l-6 -9 h12 z"/><rect class="i-out" x="12" y="424" width="316" height="154" rx="6"/><text class="ih" x="24" y="456">Вывод</text><text class="it" x="24" y="482">Положение точки на сетке:</text><text class="it" x="24" y="508">пористость и</text><text class="it" x="24" y="534">сопротивление, нанесённые</text><text class="it" x="24" y="560">без расчётов.</text><rect class="i-warn" x="12" y="584" width="316" height="154" rx="6"/><text class="ih" x="24" y="616">Где ломается</text><text class="it" x="24" y="642">Если a и m не совпадают с</text><text class="it" x="24" y="668">теми, под которые</text><text class="it" x="24" y="694">построена сетка, точки</text><text class="it" x="24" y="720">смещаются.</text><rect class="i-warn" x="12" y="744" width="316" height="154" rx="6"/><text class="ih" x="24" y="776">Где ломается</text><text class="it" x="24" y="802">Сетка для песчаников не</text><text class="it" x="24" y="828">подходит для карбонатов:</text><text class="it" x="24" y="854">для них нужна сетка с</text><text class="it" x="24" y="880">другими a и m.</text><rect x="249" y="916" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="937">схема</text></svg>