<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1432" role="img" aria-label="Схема шага «Хингл: водная линия и веер насыщенностей»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Хингл: водная линия и веер насыщенностей»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Пористость, или объёмная</text><text class="it" x="24" y="96">плотность, или время</text><text class="it" x="24" y="122">пробега для каждого</text><text class="it" x="24" y="148">интервала (по оси x).</text><rect class="i-in" x="12" y="172" width="316" height="180" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Сопротивление каждого</text><text class="it" x="24" y="256">интервала; нефтеносные</text><text class="it" x="24" y="282">интервалы имеют</text><text class="it" x="24" y="308">сопротивление больше</text><text class="it" x="24" y="334">водоносных.</text><rect class="i-in" x="12" y="358" width="316" height="102" rx="6"/><text class="ih" x="24" y="390">Вход</text><text class="it" x="24" y="416">Показатель насыщения n,</text><text class="it" x="24" y="442">известный или оценённый.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Хингл: водная линия и веер</text><text class="it" x="24" y="558">насыщенностей</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="128" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Набор водоносных</text><text class="it" x="24" y="694">интервалов: точки, лежащие</text><text class="it" x="24" y="720">на водной линии.</text><rect class="i-out" x="12" y="744" width="316" height="180" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Значение матрицы из точки</text><text class="it" x="24" y="828">пересечения, если по оси x</text><text class="it" x="24" y="854">отложены объёмная</text><text class="it" x="24" y="880">плотность или время</text><text class="it" x="24" y="906">пробега.</text><rect class="i-out" x="12" y="930" width="316" height="154" rx="6"/><text class="ih" x="24" y="962">Вывод</text><text class="it" x="24" y="988">Водонасыщенность точки по</text><text class="it" x="24" y="1014">её вертикальному</text><text class="it" x="24" y="1040">расстоянию до водной</text><text class="it" x="24" y="1066">линии.</text><rect class="i-warn" x="12" y="1090" width="316" height="128" rx="6"/><text class="ih" x="24" y="1122">Где ломается</text><text class="it" x="24" y="1148">Если водоносные точки не</text><text class="it" x="24" y="1174">ложатся на прямую, водную</text><text class="it" x="24" y="1200">линию построить нельзя.</text><rect class="i-warn" x="12" y="1224" width="316" height="154" rx="6"/><text class="ih" x="24" y="1256">Где ломается</text><text class="it" x="24" y="1282">Без известного или</text><text class="it" x="24" y="1308">оценённого n расстояние не</text><text class="it" x="24" y="1334">переводится в</text><text class="it" x="24" y="1360">водонасыщенность.</text><rect x="249" y="1396" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1417">схема</text></svg>