<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1116" role="img" aria-label="Схема шага «Вода и матрица по графику Хингла»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Вода и матрица по графику Хингла»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Точка на водоносной линии:</text><text class="it" x="24" y="96">сопротивление Ro и</text><text class="it" x="24" y="122">пористость, снятые с</text><text class="it" x="24" y="148">графика.</text><rect class="i-in" x="12" y="172" width="316" height="102" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Значения a и m, принятые</text><text class="it" x="24" y="256">по выбранной сетке.</text><rect class="i-in" x="12" y="280" width="316" height="128" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Точки водоносной линии в</text><text class="it" x="24" y="364">широком диапазоне</text><text class="it" x="24" y="390">пористостей.</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Вода и матрица по графику</text><text class="it" x="24" y="506">Хингла</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="76" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Rw по формуле 7.29.</text><rect class="i-out" x="12" y="640" width="316" height="154" rx="6"/><text class="ih" x="24" y="672">Вывод</text><text class="it" x="24" y="698">Матрица (ρma или Δtma) как</text><text class="it" x="24" y="724">значение пересечения</text><text class="it" x="24" y="750">продлённой линии с нулевой</text><text class="it" x="24" y="776">проводимостью.</text><rect class="i-warn" x="12" y="800" width="316" height="128" rx="6"/><text class="ih" x="24" y="832">Где ломается</text><text class="it" x="24" y="858">Узкий диапазон</text><text class="it" x="24" y="884">пористостей: линию нельзя</text><text class="it" x="24" y="910">надёжно продлить.</text><rect class="i-warn" x="12" y="934" width="316" height="128" rx="6"/><text class="ih" x="24" y="966">Где ломается</text><text class="it" x="24" y="992">Неверная матрица сдвигает</text><text class="it" x="24" y="1018">нулевую точку от нижнего</text><text class="it" x="24" y="1044">левого угла графика.</text><rect x="249" y="1080" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1101">схема</text></svg>