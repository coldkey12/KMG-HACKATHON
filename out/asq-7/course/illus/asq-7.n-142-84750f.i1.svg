<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 930" role="img" aria-label="Схема шага «Пример: водонасыщенность нефтеносных точек»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Пример: водонасыщенность нефтеносных точек»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Сопротивление точки Rt (в</text><text class="it" x="24" y="96">примере 40 Ом·м).</text><rect class="i-in" x="12" y="120" width="316" height="128" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Ra — значение водной линии</text><text class="it" x="24" y="204">при пористости точки (в</text><text class="it" x="24" y="230">примере 0.80 Ом·м).</text><rect class="i-in" x="12" y="254" width="316" height="102" rx="6"/><text class="ih" x="24" y="286">Вход</text><text class="it" x="24" y="312">Показатель насыщения n (в</text><text class="it" x="24" y="338">примере 2.0).</text><line class="ia" x1="170" y1="366" x2="170" y2="386"/><path class="iah" d="M170 392 l-6 -9 h12 z"/><rect class="i-node" x="12" y="396" width="316" height="76" rx="6"/><text class="it" x="24" y="428">Пример: водонасыщенность</text><text class="it" x="24" y="454">нефтеносных точек</text><line class="ia" x1="170" y1="476" x2="170" y2="496"/><path class="iah" d="M170 502 l-6 -9 h12 z"/><rect class="i-out" x="12" y="506" width="316" height="102" rx="6"/><text class="ih" x="24" y="538">Вывод</text><text class="it" x="24" y="564">Водонасыщенность точки Sw</text><text class="it" x="24" y="590">(в примере 0.14).</text><rect class="i-warn" x="12" y="614" width="316" height="128" rx="6"/><text class="ih" x="24" y="646">Где ломается</text><text class="it" x="24" y="672">Чтение Ra и Rt с графика</text><text class="it" x="24" y="698">менее точно, чем расчёт по</text><text class="it" x="24" y="724">формуле.</text><rect class="i-warn" x="12" y="748" width="316" height="128" rx="6"/><text class="ih" x="24" y="780">Где ломается</text><text class="it" x="24" y="806">При другом n результат</text><text class="it" x="24" y="832">меняется: показатель</text><text class="it" x="24" y="858">входит в степень 1/n.</text><rect x="249" y="894" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="915">схема</text></svg>