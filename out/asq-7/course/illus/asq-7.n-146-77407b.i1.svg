<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1138" role="img" aria-label="Схема шага «Палетка K-3: проницаемость по одной точке»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Палетка K-3: проницаемость по одной точке»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Пористость φ для зоны — по</text><text class="it" x="24" y="96">ней выбирают положение на</text><text class="it" x="24" y="122">нижней шкале.</text><rect class="i-in" x="12" y="146" width="316" height="180" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Неснижаемая</text><text class="it" x="24" y="230">водонасыщенность Swi для</text><text class="it" x="24" y="256">той же зоны — по ней</text><text class="it" x="24" y="282">выбирают положение на</text><text class="it" x="24" y="308">левой шкале.</text><line class="ia" x1="170" y1="336" x2="170" y2="356"/><path class="iah" d="M170 362 l-6 -9 h12 z"/><rect class="i-node" x="12" y="366" width="316" height="76" rx="6"/><text class="it" x="24" y="398">Палетка K-3: проницаемость</text><text class="it" x="24" y="424">по одной точке</text><line class="ia" x1="170" y1="446" x2="170" y2="466"/><path class="iah" d="M170 472 l-6 -9 h12 z"/><rect class="i-out" x="12" y="476" width="316" height="128" rx="6"/><text class="ih" x="24" y="508">Вывод</text><text class="it" x="24" y="534">Проницаемость K в мД —</text><text class="it" x="24" y="560">значение тяжёлой кривой в</text><text class="it" x="24" y="586">точке пересечения.</text><rect class="i-out" x="12" y="610" width="316" height="154" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Объёмная влажность BVW —</text><text class="it" x="24" y="694">значение светлой гиперболы</text><text class="it" x="24" y="720">C = Swi × φ в той же</text><text class="it" x="24" y="746">точке.</text><rect class="i-warn" x="12" y="770" width="316" height="154" rx="6"/><text class="ih" x="24" y="802">Где ломается</text><text class="it" x="24" y="828">Палетка построена для</text><text class="it" x="24" y="854">нефти средней плотности.</text><text class="it" x="24" y="880">Для другого флюида кривые</text><text class="it" x="24" y="906">могут сместиться.</text><rect class="i-warn" x="12" y="930" width="316" height="154" rx="6"/><text class="ih" x="24" y="962">Где ломается</text><text class="it" x="24" y="988">Чтение на глаз даёт</text><text class="it" x="24" y="1014">приближённое значение.</text><text class="it" x="24" y="1040">Точность зависит от</text><text class="it" x="24" y="1066">масштаба шкал.</text><rect x="249" y="1102" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1123">схема</text></svg>