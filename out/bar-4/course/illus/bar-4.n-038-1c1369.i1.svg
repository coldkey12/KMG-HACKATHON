<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 632" role="img" aria-label="Схема шага «Что значит «нестационарное» течение»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Что значит «нестационарное» течение»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Давление в точке пласта,</text><text class="it" x="24" y="96">записанное как функция</text><text class="it" x="24" y="122">времени.</text><line class="ia" x1="170" y1="150" x2="170" y2="170"/><path class="iah" d="M170 176 l-6 -9 h12 z"/><rect class="i-node" x="12" y="180" width="316" height="76" rx="6"/><text class="it" x="24" y="212">Что значит</text><text class="it" x="24" y="238">«нестационарное» течение</text><line class="ia" x1="170" y1="260" x2="170" y2="280"/><path class="iah" d="M170 286 l-6 -9 h12 z"/><rect class="i-out" x="12" y="290" width="316" height="128" rx="6"/><text class="ih" x="24" y="322">Вывод</text><text class="it" x="24" y="348">Признак нестационарного</text><text class="it" x="24" y="374">течения: давление в точке</text><text class="it" x="24" y="400">меняется со временем.</text><rect class="i-warn" x="12" y="424" width="316" height="154" rx="6"/><text class="ih" x="24" y="456">Где ломается</text><text class="it" x="24" y="482">Если жидкость заметно</text><text class="it" x="24" y="508">сжимаема или пласт не</text><text class="it" x="24" y="534">деформируется, этот случай</text><text class="it" x="24" y="560">не подходит.</text><rect x="249" y="596" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="617">схема</text></svg>