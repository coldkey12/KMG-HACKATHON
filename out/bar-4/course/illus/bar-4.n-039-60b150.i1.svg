<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1138" role="img" aria-label="Схема шага «Границы пласта и что на них задают»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Границы пласта и что на них задают»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Тип каждой границы:</text><text class="it" x="24" y="96">непроницаемая, скважина,</text><text class="it" x="24" y="122">галерея или контур</text><text class="it" x="24" y="148">питания.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Давление, напор или расход</text><text class="it" x="24" y="256">на скважинах и галереях,</text><text class="it" x="24" y="282">заданные как функция</text><text class="it" x="24" y="308">времени.</text><rect class="i-in" x="12" y="332" width="316" height="154" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Мгновенный скачок от</text><text class="it" x="24" y="416">начального к конечному</text><text class="it" x="24" y="442">значению при пуске или</text><text class="it" x="24" y="468">закрытии скважины.</text><line class="ia" x1="170" y1="496" x2="170" y2="516"/><path class="iah" d="M170 522 l-6 -9 h12 z"/><rect class="i-node" x="12" y="526" width="316" height="76" rx="6"/><text class="it" x="24" y="558">Границы пласта и что на</text><text class="it" x="24" y="584">них задают</text><line class="ia" x1="170" y1="606" x2="170" y2="626"/><path class="iah" d="M170 632 l-6 -9 h12 z"/><rect class="i-out" x="12" y="636" width="316" height="128" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Распределение давления</text><text class="it" x="24" y="720">p(x, y, z, t) в пласте при</text><text class="it" x="24" y="746">заданных границах.</text><rect class="i-warn" x="12" y="770" width="316" height="128" rx="6"/><text class="ih" x="24" y="802">Где ломается</text><text class="it" x="24" y="828">Мгновенный скачок —</text><text class="it" x="24" y="854">идеализация: реальный пуск</text><text class="it" x="24" y="880">занимает конечное время.</text><rect class="i-warn" x="12" y="904" width="316" height="180" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Если значение на границе</text><text class="it" x="24" y="988">во времени известно</text><text class="it" x="24" y="1014">неточно, результат</text><text class="it" x="24" y="1040">опирается на это</text><text class="it" x="24" y="1066">допущение.</text><rect x="249" y="1102" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1123">схема</text></svg>