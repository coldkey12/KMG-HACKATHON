<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1164" role="img" aria-label="Схема шага «От долей секунды до десятилетий»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «От долей секунды до десятилетий»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Размер области L: блок</text><text class="it" x="24" y="96">породы, расстояние между</text><text class="it" x="24" y="122">скважинами, месторождение,</text><text class="it" x="24" y="148">водонапорная система.</text><rect class="i-in" x="12" y="172" width="316" height="206" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Коэффициент</text><text class="it" x="24" y="256">пьезопроводности ϰ: для</text><text class="it" x="24" y="282">маловязкой нефти или воды</text><text class="it" x="24" y="308">в высокопроницаемом</text><text class="it" x="24" y="334">коллекторе порядка 10⁴</text><text class="it" x="24" y="360">см²/с.</text><rect class="i-in" x="12" y="384" width="316" height="128" rx="6"/><text class="ih" x="24" y="416">Вход</text><text class="it" x="24" y="442">Связь ϰ с проницаемостью,</text><text class="it" x="24" y="468">вязкостью и сжимаемостью.</text><text class="it" x="24" y="494">В главе напрямую не дана.</text><line class="ia" x1="170" y1="522" x2="170" y2="542"/><path class="iah" d="M170 548 l-6 -9 h12 z"/><rect class="i-node" x="12" y="552" width="316" height="76" rx="6"/><text class="it" x="24" y="584">От долей секунды до</text><text class="it" x="24" y="610">десятилетий</text><line class="ia" x1="170" y1="632" x2="170" y2="652"/><path class="iah" d="M170 658 l-6 -9 h12 z"/><rect class="i-out" x="12" y="662" width="316" height="128" rx="6"/><text class="ih" x="24" y="694">Вывод</text><text class="it" x="24" y="720">Характерное время τ:</text><text class="it" x="24" y="746">порядок времени выхода на</text><text class="it" x="24" y="772">стационарный режим.</text><rect class="i-warn" x="12" y="796" width="316" height="154" rx="6"/><text class="ih" x="24" y="828">Где ломается</text><text class="it" x="24" y="854">Для высоковязкой нефти и</text><text class="it" x="24" y="880">низкой проницаемости ϰ на</text><text class="it" x="24" y="906">один-два порядка меньше,</text><text class="it" x="24" y="932">время больше.</text><rect class="i-warn" x="12" y="956" width="316" height="154" rx="6"/><text class="ih" x="24" y="988">Где ломается</text><text class="it" x="24" y="1014">Результат — порядок</text><text class="it" x="24" y="1040">величины. Точное значение</text><text class="it" x="24" y="1066">по этим данным не</text><text class="it" x="24" y="1092">получить.</text><rect x="249" y="1128" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1149">схема</text></svg>