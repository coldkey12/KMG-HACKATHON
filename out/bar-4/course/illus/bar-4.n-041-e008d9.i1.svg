<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 874" role="img" aria-label="Схема шага «Любой режим — сумма простых скачков»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Любой режим — сумма простых скачков»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">История давления на</text><text class="it" x="24" y="96">границе x = 0 как функция</text><text class="it" x="24" y="122">времени f(t)</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Отклик на скачок P₁:</text><text class="it" x="24" y="230">решение (II.92) или</text><text class="it" x="24" y="256">(II.93)</text><line class="ia" x1="170" y1="284" x2="170" y2="304"/><path class="iah" d="M170 310 l-6 -9 h12 z"/><rect class="i-node" x="12" y="314" width="316" height="76" rx="6"/><text class="it" x="24" y="346">Любой режим — сумма</text><text class="it" x="24" y="372">простых скачков</text><line class="ia" x1="170" y1="394" x2="170" y2="414"/><path class="iah" d="M170 420 l-6 -9 h12 z"/><rect class="i-out" x="12" y="424" width="316" height="128" rx="6"/><text class="ih" x="24" y="456">Вывод</text><text class="it" x="24" y="482">Давление P(x, t) в любой</text><text class="it" x="24" y="508">точке пласта и в любой</text><text class="it" x="24" y="534">момент после начала режима</text><rect class="i-warn" x="12" y="558" width="316" height="128" rx="6"/><text class="ih" x="24" y="590">Где ломается</text><text class="it" x="24" y="616">Если уравнение нелинейно,</text><text class="it" x="24" y="642">сумма откликов не равна</text><text class="it" x="24" y="668">отклику на сумму режимов</text><rect class="i-warn" x="12" y="692" width="316" height="128" rx="6"/><text class="ih" x="24" y="724">Где ломается</text><text class="it" x="24" y="750">Если f(0) не равно нулю, к</text><text class="it" x="24" y="776">формуле нужно добавить</text><text class="it" x="24" y="802">слагаемое с f(0)</text><rect x="249" y="838" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="859">схема</text></svg>