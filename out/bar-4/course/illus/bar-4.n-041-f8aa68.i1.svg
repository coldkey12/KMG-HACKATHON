<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1060" role="img" aria-label="Схема шага «Сначала пласт кажется бесконечным»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Сначала пласт кажется бесконечным»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Расстояние x от места</text><text class="it" x="24" y="96">скачка и момент времени t</text><text class="it" x="24" y="122">после него.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Коэффициент</text><text class="it" x="24" y="230">пьезопроводности ϰ и</text><text class="it" x="24" y="256">размер пласта L.</text><line class="ia" x1="170" y1="284" x2="170" y2="304"/><path class="iah" d="M170 310 l-6 -9 h12 z"/><rect class="i-node" x="12" y="314" width="316" height="76" rx="6"/><text class="it" x="24" y="346">Сначала пласт кажется</text><text class="it" x="24" y="372">бесконечным</text><line class="ia" x1="170" y1="394" x2="170" y2="414"/><path class="iah" d="M170 420 l-6 -9 h12 z"/><rect class="i-out" x="12" y="424" width="316" height="128" rx="6"/><text class="ih" x="24" y="456">Вывод</text><text class="it" x="24" y="482">Отклонение давления как</text><text class="it" x="24" y="508">функция одной величины</text><text class="it" x="24" y="534">x/√(ϰt).</text><rect class="i-out" x="12" y="558" width="316" height="154" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Оценка того, дошло ли</text><text class="it" x="24" y="642">изменение давления до</text><text class="it" x="24" y="668">точки наблюдения за время</text><text class="it" x="24" y="694">t.</text><rect class="i-warn" x="12" y="718" width="316" height="154" rx="6"/><text class="ih" x="24" y="750">Где ломается</text><text class="it" x="24" y="776">Если L²/ϰt не велико,</text><text class="it" x="24" y="802">решение с одной erfc</text><text class="it" x="24" y="828">неприменимо: граница уже</text><text class="it" x="24" y="854">влияет.</text><rect class="i-warn" x="12" y="878" width="316" height="128" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Шум измерений может скрыть</text><text class="it" x="24" y="962">слабое изменение давления</text><text class="it" x="24" y="988">на далёком расстоянии.</text><rect x="249" y="1024" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1045">схема</text></svg>