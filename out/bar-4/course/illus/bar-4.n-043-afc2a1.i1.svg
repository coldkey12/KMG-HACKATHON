<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1480" role="img" aria-label="Схема шага «Тонкая скважина, большой пласт: промежуточный интервал»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Тонкая скважина, большой пласт: промежуточный интервал»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Радиус скважины ρ (обычно</text><text class="it" x="24" y="96">10 см или менее) и</text><text class="it" x="24" y="122">расстояние до соседней</text><text class="it" x="24" y="148">скважины R (больше 300 м</text><text class="it" x="24" y="174">для типичных условий).</text><rect class="i-in" x="12" y="198" width="316" height="180" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Время t после начала</text><text class="it" x="24" y="282">возмущения и коэффициент</text><text class="it" x="24" y="308">пьезопроводности ϰ, от</text><text class="it" x="24" y="334">которых зависит масштаб</text><text class="it" x="24" y="360">√(ϰt).</text><rect class="i-in" x="12" y="384" width="316" height="154" rx="6"/><text class="ih" x="24" y="416">Вход</text><text class="it" x="24" y="442">Кривая давления в скважине</text><text class="it" x="24" y="468">во времени, из которой</text><text class="it" x="24" y="494">берут участок</text><text class="it" x="24" y="520">промежуточной асимптотики.</text><line class="ia" x1="170" y1="548" x2="170" y2="568"/><path class="iah" d="M170 574 l-6 -9 h12 z"/><rect class="i-node" x="12" y="578" width="316" height="102" rx="6"/><text class="it" x="24" y="610">Тонкая скважина, большой</text><text class="it" x="24" y="636">пласт: промежуточный</text><text class="it" x="24" y="662">интервал</text><line class="ia" x1="170" y1="684" x2="170" y2="704"/><path class="iah" d="M170 710 l-6 -9 h12 z"/><rect class="i-out" x="12" y="714" width="316" height="180" rx="6"/><text class="ih" x="24" y="746">Вывод</text><text class="it" x="24" y="772">Изображение давления на</text><text class="it" x="24" y="798">скважине вида</text><text class="it" x="24" y="824">p*σ⁻¹·ln(γρν):</text><text class="it" x="24" y="850">логарифмическая форма по</text><text class="it" x="24" y="876">σ.</text><rect class="i-out" x="12" y="900" width="316" height="180" rx="6"/><text class="ih" x="24" y="932">Вывод</text><text class="it" x="24" y="958">Участок данных, где</text><text class="it" x="24" y="984">зависимость от времени</text><text class="it" x="24" y="1010">ведёт себя как логарифм.</text><text class="it" x="24" y="1036">Это признак попадания в</text><text class="it" x="24" y="1062">промежуточный интервал.</text><rect class="i-warn" x="12" y="1086" width="316" height="154" rx="6"/><text class="ih" x="24" y="1118">Где ломается</text><text class="it" x="24" y="1144">Вне интервала (очень малые</text><text class="it" x="24" y="1170">t или t, когда масштаб</text><text class="it" x="24" y="1196">сравним с R) формула не</text><text class="it" x="24" y="1222">работает.</text><rect class="i-warn" x="12" y="1246" width="316" height="180" rx="6"/><text class="ih" x="24" y="1278">Где ломается</text><text class="it" x="24" y="1304">Если R меньше 300 м или</text><text class="it" x="24" y="1330">радиус скважины велик,</text><text class="it" x="24" y="1356">условие для типичных</text><text class="it" x="24" y="1382">условий может не</text><text class="it" x="24" y="1408">выполняться.</text><rect x="249" y="1444" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1465">схема</text></svg>