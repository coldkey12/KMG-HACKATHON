<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 952" role="img" aria-label="Схема шага «Давление не зависит от радиуса скважины»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Давление не зависит от радиуса скважины»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Время t и расстояние r от</text><text class="it" x="24" y="96">скважины. По ним считают</text><text class="it" x="24" y="122">аргумент r²/(4ϰt).</text><rect class="i-in" x="12" y="146" width="316" height="154" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Коэффициент</text><text class="it" x="24" y="230">пьезопроводности ϰ и</text><text class="it" x="24" y="256">постоянная p* из</text><text class="it" x="24" y="282">граничного условия.</text><line class="ia" x1="170" y1="310" x2="170" y2="330"/><path class="iah" d="M170 336 l-6 -9 h12 z"/><rect class="i-node" x="12" y="340" width="316" height="76" rx="6"/><text class="it" x="24" y="372">Давление не зависит от</text><text class="it" x="24" y="398">радиуса скважины</text><line class="ia" x1="170" y1="420" x2="170" y2="440"/><path class="iah" d="M170 446 l-6 -9 h12 z"/><rect class="i-out" x="12" y="450" width="316" height="128" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Давление p(r, t) в точке r</text><text class="it" x="24" y="534">на момент t по формуле</text><text class="it" x="24" y="560">(II.107).</text><rect class="i-warn" x="12" y="584" width="316" height="128" rx="6"/><text class="ih" x="24" y="616">Где ломается</text><text class="it" x="24" y="642">При нарушении ρ²/(ϰt) ≪ 1</text><text class="it" x="24" y="668">независимость от радиуса</text><text class="it" x="24" y="694">не гарантируется.</text><rect class="i-warn" x="12" y="718" width="316" height="180" rx="6"/><text class="ih" x="24" y="750">Где ломается</text><text class="it" x="24" y="776">Асимптотику Ei нельзя</text><text class="it" x="24" y="802">применять вне области её</text><text class="it" x="24" y="828">применимости. Предел в</text><text class="it" x="24" y="854">тексте уточняется по</text><text class="it" x="24" y="880">скану.</text><rect x="249" y="916" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="937">схема</text></svg>