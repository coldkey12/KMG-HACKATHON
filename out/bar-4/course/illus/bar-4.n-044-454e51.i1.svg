<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1064" role="img" aria-label="Схема шага «По наклону прямой находим гидропроводность»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «По наклону прямой находим гидропроводность»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривая давления p после</text><text class="it" x="24" y="96">остановки скважины,</text><text class="it" x="24" y="122">построенная в координатах</text><text class="it" x="24" y="148">p и ln t.</text><rect class="i-in" x="12" y="172" width="316" height="102" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Полный дебит Q, известный</text><text class="it" x="24" y="256">до остановки.</text><line class="ia" x1="170" y1="284" x2="170" y2="304"/><path class="iah" d="M170 310 l-6 -9 h12 z"/><rect class="i-node" x="12" y="314" width="316" height="76" rx="6"/><text class="it" x="24" y="346">По наклону прямой находим</text><text class="it" x="24" y="372">гидропроводность</text><line class="ia" x1="170" y1="394" x2="170" y2="414"/><path class="iah" d="M170 420 l-6 -9 h12 z"/><rect class="i-out" x="12" y="424" width="316" height="102" rx="6"/><text class="ih" x="24" y="456">Вывод</text><text class="it" x="24" y="482">Наклон A и отрезок B</text><text class="it" x="24" y="508">асимптоты.</text><rect class="i-out" x="12" y="532" width="316" height="102" rx="6"/><text class="ih" x="24" y="564">Вывод</text><text class="it" x="24" y="590">Гидропроводность kh/μ =</text><text class="it" x="24" y="616">Q/(4πA).</text><rect class="i-out" x="12" y="640" width="316" height="76" rx="6"/><text class="ih" x="24" y="672">Вывод</text><text class="it" x="24" y="698">Отношение ϰ/ρ² по A и B.</text><rect class="i-warn" x="12" y="722" width="316" height="154" rx="6"/><text class="ih" x="24" y="754">Где ломается</text><text class="it" x="24" y="780">Если асимптотического</text><text class="it" x="24" y="806">участка нет, A и B не</text><text class="it" x="24" y="832">определить, и формулы не</text><text class="it" x="24" y="858">работают.</text><rect class="i-warn" x="12" y="882" width="316" height="128" rx="6"/><text class="ih" x="24" y="914">Где ломается</text><text class="it" x="24" y="940">Ошибка в проведении прямой</text><text class="it" x="24" y="966">сдвигает A и B, а значит и</text><text class="it" x="24" y="992">оценки kh/μ и ϰ/ρ².</text><rect x="249" y="1028" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1049">схема</text></svg>