<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1168" role="img" aria-label="Схема шага «Гидропрослушивание между двумя скважинами»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Гидропрослушивание между двумя скважинами»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривая Δp(t): изменение</text><text class="it" x="24" y="96">давления в реагирующей</text><text class="it" x="24" y="122">скважине во времени после</text><text class="it" x="24" y="148">скачка дебита возмущающей.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Момент и величина скачка</text><text class="it" x="24" y="256">дебита возмущающей</text><text class="it" x="24" y="282">скважины (Q).</text><rect class="i-in" x="12" y="306" width="316" height="128" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Расстояние r между</text><text class="it" x="24" y="390">скважинами, известное</text><text class="it" x="24" y="416">достаточно точно.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Гидропрослушивание между</text><text class="it" x="24" y="532">двумя скважинами</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="128" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Момент t₁ касания кривой</text><text class="it" x="24" y="668">Δp(t) с прямой из начала</text><text class="it" x="24" y="694">координат.</text><rect class="i-out" x="12" y="718" width="316" height="102" rx="6"/><text class="ih" x="24" y="750">Вывод</text><text class="it" x="24" y="776">Пьезопроводность ϰ = 0,57</text><text class="it" x="24" y="802">r²/t₁.</text><rect class="i-warn" x="12" y="826" width="316" height="128" rx="6"/><text class="ih" x="24" y="858">Где ломается</text><text class="it" x="24" y="884">Если реагирующая скважина</text><text class="it" x="24" y="910">работала, её кривая не</text><text class="it" x="24" y="936">отвечает этой схеме.</text><rect class="i-warn" x="12" y="960" width="316" height="154" rx="6"/><text class="ih" x="24" y="992">Где ломается</text><text class="it" x="24" y="1018">Книга разрешает формулу</text><text class="it" x="24" y="1044">только при скачке дебита.</text><text class="it" x="24" y="1070">Для другого режима метод</text><text class="it" x="24" y="1096">по тексту не описан.</text><rect x="249" y="1132" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1153">схема</text></svg>