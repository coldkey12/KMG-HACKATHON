<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1112" role="img" aria-label="Схема шага «Кажущийся радиус: что КВД не различит»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Кажущийся радиус: что КВД не различит»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Величина ϰ/ρ², полученная</text><text class="it" x="24" y="96">из данных о давлении.</text><rect class="i-in" x="12" y="120" width="316" height="154" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Сведения о том, как</text><text class="it" x="24" y="204">скважина вскрыла пласт:</text><text class="it" x="24" y="230">какая толщина вскрыта и</text><text class="it" x="24" y="256">какая поверхность открыта.</text><rect class="i-in" x="12" y="280" width="316" height="128" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Сведения о призабойной</text><text class="it" x="24" y="364">зоне: есть ли загрязнение</text><text class="it" x="24" y="390">или трещины.</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Кажущийся радиус: что КВД</text><text class="it" x="24" y="506">не различит</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="154" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Один ответ: величина ϰ/ρ².</text><text class="it" x="24" y="642">Пьезопроводность и радиус</text><text class="it" x="24" y="668">по отдельности не</text><text class="it" x="24" y="694">получаются.</text><rect class="i-warn" x="12" y="718" width="316" height="154" rx="6"/><text class="ih" x="24" y="750">Где ломается</text><text class="it" x="24" y="776">Кажущийся радиус</text><text class="it" x="24" y="802">отличается от истинного</text><text class="it" x="24" y="828">из-за вскрытия и неполной</text><text class="it" x="24" y="854">открытости поверхности.</text><rect class="i-warn" x="12" y="878" width="316" height="180" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Загрязнение призабойной</text><text class="it" x="24" y="962">зоны и трещины тоже меняют</text><text class="it" x="24" y="988">кажущийся радиус, и по</text><text class="it" x="24" y="1014">одной кривой их не</text><text class="it" x="24" y="1040">отделить от ϰ.</text><rect x="249" y="1076" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1097">схема</text></svg>