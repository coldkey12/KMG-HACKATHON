<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1168" role="img" aria-label="Схема шага «Когда прямого участка на кривой нет»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Когда прямого участка на кривой нет»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Запись давления на забое</text><text class="it" x="24" y="96">после остановки скважины:</text><text class="it" x="24" y="122">кривая восстановления</text><text class="it" x="24" y="148">давления.</text><rect class="i-in" x="12" y="172" width="316" height="102" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Расстояние R до границы</text><text class="it" x="24" y="256">пласта, из геологии.</text><rect class="i-in" x="12" y="280" width="316" height="128" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Время, в течение которого</text><text class="it" x="24" y="364">идёт дополнительный приток</text><text class="it" x="24" y="390">после остановки.</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Когда прямого участка на</text><text class="it" x="24" y="506">кривой нет</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="128" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Решение, есть ли на кривой</text><text class="it" x="24" y="642">прямой участок, пригодный</text><text class="it" x="24" y="668">для расчёта параметров.</text><rect class="i-out" x="12" y="692" width="316" height="128" rx="6"/><text class="ih" x="24" y="724">Вывод</text><text class="it" x="24" y="750">Выбор способа обработки:</text><text class="it" x="24" y="776">по прямой или с учётом</text><text class="it" x="24" y="802">послепритока.</text><rect class="i-warn" x="12" y="826" width="316" height="128" rx="6"/><text class="ih" x="24" y="858">Где ломается</text><text class="it" x="24" y="884">Скважина близко к границе:</text><text class="it" x="24" y="910">прямого участка может не</text><text class="it" x="24" y="936">быть.</text><rect class="i-warn" x="12" y="960" width="316" height="154" rx="6"/><text class="ih" x="24" y="992">Где ломается</text><text class="it" x="24" y="1018">Послеприток длится дольше,</text><text class="it" x="24" y="1044">чем выход на асимптоту:</text><text class="it" x="24" y="1070">прямой участок не</text><text class="it" x="24" y="1096">появляется.</text><rect x="249" y="1132" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1153">схема</text></svg>