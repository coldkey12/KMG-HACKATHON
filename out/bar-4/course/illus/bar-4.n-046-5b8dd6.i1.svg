<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 900" role="img" aria-label="Схема шага «Однородный пласт: как снять параметры по ψ»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Однородный пласт: как снять параметры по ψ»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Замеры давления p1(t) на</text><text class="it" x="24" y="96">скважине и дебита q(t) во</text><text class="it" x="24" y="122">времени.</text><line class="ia" x1="170" y1="150" x2="170" y2="170"/><path class="iah" d="M170 176 l-6 -9 h12 z"/><rect class="i-node" x="12" y="180" width="316" height="76" rx="6"/><text class="it" x="24" y="212">Однородный пласт: как</text><text class="it" x="24" y="238">снять параметры по ψ</text><line class="ia" x1="170" y1="260" x2="170" y2="280"/><path class="iah" d="M170 286 l-6 -9 h12 z"/><rect class="i-out" x="12" y="290" width="316" height="154" rx="6"/><text class="ih" x="24" y="322">Вывод</text><text class="it" x="24" y="348">Значения ψ при</text><text class="it" x="24" y="374">трёх–четырёх значениях τ,</text><text class="it" x="24" y="400">построенные в координатах</text><text class="it" x="24" y="426">ln τ.</text><rect class="i-out" x="12" y="450" width="316" height="128" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Наклон прямой μ/(4πkh) и</text><text class="it" x="24" y="534">свободный член, зависящий</text><text class="it" x="24" y="560">от κ и ρ.</text><rect class="i-warn" x="12" y="584" width="316" height="128" rx="6"/><text class="ih" x="24" y="616">Где ломается</text><text class="it" x="24" y="642">Значения τ меньше 1–2 мин:</text><text class="it" x="24" y="668">формула (II.115) может</text><text class="it" x="24" y="694">перестать работать.</text><rect class="i-warn" x="12" y="718" width="316" height="128" rx="6"/><text class="ih" x="24" y="750">Где ломается</text><text class="it" x="24" y="776">Шум в замерах давления и</text><text class="it" x="24" y="802">дебита может размыть</text><text class="it" x="24" y="828">прямую.</text><rect x="249" y="864" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="885">схема</text></svg>