<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1138" role="img" aria-label="Схема шага «Ограниченный пласт: возмущение дошло до контура»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Ограниченный пласт: возмущение дошло до контура»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Радиус круглого пласта R и</text><text class="it" x="24" y="96">радиус скважины, который</text><text class="it" x="24" y="122">пренебрежимо мал.</text><rect class="i-in" x="12" y="146" width="316" height="154" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Коэффициент</text><text class="it" x="24" y="230">пьезопроводности ϰ и время</text><text class="it" x="24" y="256">t: по ним считают момент</text><text class="it" x="24" y="282">t₁ = R²/(12ϰ).</text><rect class="i-in" x="12" y="306" width="316" height="128" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Дебит q и давление на</text><text class="it" x="24" y="390">контуре, равное начальному</text><text class="it" x="24" y="416">(нулю).</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="102" rx="6"/><text class="it" x="24" y="506">Ограниченный пласт:</text><text class="it" x="24" y="532">возмущение дошло до</text><text class="it" x="24" y="558">контура</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="128" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Давление p(r,t): до t₁ по</text><text class="it" x="24" y="694">(II.135), после t₁ по</text><text class="it" x="24" y="720">(II.137) с функцией P₀(t).</text><rect class="i-warn" x="12" y="744" width="316" height="154" rx="6"/><text class="ih" x="24" y="776">Где ломается</text><text class="it" x="24" y="802">Формулы (II.135) и</text><text class="it" x="24" y="828">(II.137) — приближённые.</text><text class="it" x="24" y="854">Точный ряд плохо сходится</text><text class="it" x="24" y="880">и трудно обозрим.</text><rect class="i-warn" x="12" y="904" width="316" height="180" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Момент t₁ зависит от R и</text><text class="it" x="24" y="988">ϰ. При другом размере</text><text class="it" x="24" y="1014">пласта переход между</text><text class="it" x="24" y="1040">режимами наступает в</text><text class="it" x="24" y="1066">другое время.</text><rect x="249" y="1102" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1123">схема</text></svg>