<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1064" role="img" aria-label="Схема шага «Грубая оценка зоны возмущения при пуске скважины»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Грубая оценка зоны возмущения при пуске скважины»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Дебит скважины q, заданный</text><text class="it" x="24" y="96">при пуске.</text><rect class="i-in" x="12" y="120" width="316" height="102" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Коэффициент</text><text class="it" x="24" y="204">пьезопроводности κ.</text><rect class="i-in" x="12" y="228" width="316" height="76" rx="6"/><text class="ih" x="24" y="260">Вход</text><text class="it" x="24" y="286">Время t с момента пуска.</text><line class="ia" x1="170" y1="314" x2="170" y2="334"/><path class="iah" d="M170 340 l-6 -9 h12 z"/><rect class="i-node" x="12" y="344" width="316" height="102" rx="6"/><text class="it" x="24" y="376">Грубая оценка зоны</text><text class="it" x="24" y="402">возмущения при пуске</text><text class="it" x="24" y="428">скважины</text><line class="ia" x1="170" y1="450" x2="170" y2="470"/><path class="iah" d="M170 476 l-6 -9 h12 z"/><rect class="i-out" x="12" y="480" width="316" height="102" rx="6"/><text class="ih" x="24" y="512">Вывод</text><text class="it" x="24" y="538">Радиус зоны возмущения</text><text class="it" x="24" y="564">l(t) = 2√(κt).</text><rect class="i-out" x="12" y="588" width="316" height="102" rx="6"/><text class="ih" x="24" y="620">Вывод</text><text class="it" x="24" y="646">Профиль давления p0(r,t) =</text><text class="it" x="24" y="672">q·ln(r/l) внутри зоны.</text><rect class="i-warn" x="12" y="696" width="316" height="128" rx="6"/><text class="ih" x="24" y="728">Где ломается</text><text class="it" x="24" y="754">Поправки P_i отброшены.</text><text class="it" x="24" y="780">Реальные кривые с учётом</text><text class="it" x="24" y="806">поправок могут отличаться.</text><rect class="i-warn" x="12" y="830" width="316" height="180" rx="6"/><text class="ih" x="24" y="862">Где ломается</text><text class="it" x="24" y="888">На границе зоны</text><text class="it" x="24" y="914">производная давления не</text><text class="it" x="24" y="940">равна нулю. Точные</text><text class="it" x="24" y="966">граничные условия здесь не</text><text class="it" x="24" y="992">выполняются.</text><rect x="249" y="1028" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1049">схема</text></svg>