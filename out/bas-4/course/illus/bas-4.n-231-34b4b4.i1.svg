<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1190" role="img" aria-label="Схема шага «Свойства раствора: смотреть несколько показателей сразу»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Свойства раствора: смотреть несколько показателей сразу»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="232" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Показатели бурового</text><text class="it" x="24" y="96">раствора: плотность,</text><text class="it" x="24" y="122">водоотдача, вязкость,</text><text class="it" x="24" y="148">статическое и динамическое</text><text class="it" x="24" y="174">напряжение сдвига,</text><text class="it" x="24" y="200">удельное сопротивление,</text><text class="it" x="24" y="226">концентрация хлоридов.</text><rect class="i-in" x="12" y="250" width="316" height="128" rx="6"/><text class="ih" x="24" y="282">Вход</text><text class="it" x="24" y="308">Заданные значения</text><text class="it" x="24" y="334">показателей, от которых</text><text class="it" x="24" y="360">ведут отсчёт отклонений.</text><line class="ia" x1="170" y1="388" x2="170" y2="408"/><path class="iah" d="M170 414 l-6 -9 h12 z"/><rect class="i-node" x="12" y="418" width="316" height="102" rx="6"/><text class="it" x="24" y="450">Свойства раствора:</text><text class="it" x="24" y="476">смотреть несколько</text><text class="it" x="24" y="502">показателей сразу</text><line class="ia" x1="170" y1="524" x2="170" y2="544"/><path class="iah" d="M170 550 l-6 -9 h12 z"/><rect class="i-out" x="12" y="554" width="316" height="128" rx="6"/><text class="ih" x="24" y="586">Вывод</text><text class="it" x="24" y="612">Набор одновременных</text><text class="it" x="24" y="638">отклонений показателей; по</text><text class="it" x="24" y="664">нему судят о проявлении.</text><rect class="i-out" x="12" y="688" width="316" height="154" rx="6"/><text class="ih" x="24" y="720">Вывод</text><text class="it" x="24" y="746">Оценка вероятности</text><text class="it" x="24" y="772">проявления по сочетанию</text><text class="it" x="24" y="798">показателей. Формула или</text><text class="it" x="24" y="824">порог в главе не даны.</text><rect class="i-warn" x="12" y="848" width="316" height="154" rx="6"/><text class="ih" x="24" y="880">Где ломается</text><text class="it" x="24" y="906">Приток ниже разрешающей</text><text class="it" x="24" y="932">способности средств</text><text class="it" x="24" y="958">распознавания или средства</text><text class="it" x="24" y="984">отсутствуют.</text><rect class="i-warn" x="12" y="1008" width="316" height="128" rx="6"/><text class="ih" x="24" y="1040">Где ломается</text><text class="it" x="24" y="1066">Отклонения от заданных</text><text class="it" x="24" y="1092">значений могут иметь</text><text class="it" x="24" y="1118">другие причины.</text><rect x="249" y="1154" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1175">схема</text></svg>