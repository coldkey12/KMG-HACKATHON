<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1328" role="img" aria-label="Схема шага «Бурим быстрее: давление растёт?»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Бурим быстрее: давление растёт?»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривая механической</text><text class="it" x="24" y="96">скорости бурения по</text><text class="it" x="24" y="122">глубине забоя.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Сведения о переходной зоне</text><text class="it" x="24" y="230">и о близости коллектора с</text><text class="it" x="24" y="256">высоким давлением.</text><rect class="i-in" x="12" y="280" width="316" height="128" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Запас противодавления на</text><text class="it" x="24" y="364">забое, который зависит от</text><text class="it" x="24" y="390">плотности раствора.</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Бурим быстрее: давление</text><text class="it" x="24" y="506">растёт?</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="154" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Вывод о быстром росте</text><text class="it" x="24" y="642">аномальности давления на</text><text class="it" x="24" y="668">забое при скачке в</text><text class="it" x="24" y="694">переходной зоне.</text><rect class="i-out" x="12" y="718" width="316" height="154" rx="6"/><text class="ih" x="24" y="750">Вывод</text><text class="it" x="24" y="776">Вывод о риске притока,</text><text class="it" x="24" y="802">если аномальность</text><text class="it" x="24" y="828">превышает запас</text><text class="it" x="24" y="854">противодавления.</text><rect class="i-out" x="12" y="878" width="316" height="128" rx="6"/><text class="ih" x="24" y="910">Вывод</text><text class="it" x="24" y="936">Вывод о признаке</text><text class="it" x="24" y="962">углубления в зону АВПД при</text><text class="it" x="24" y="988">устойчивом росте скорости.</text><rect class="i-warn" x="12" y="1012" width="316" height="128" rx="6"/><text class="ih" x="24" y="1044">Где ломается</text><text class="it" x="24" y="1070">Скачок «как правило», а не</text><text class="it" x="24" y="1096">всегда: одна кривая не</text><text class="it" x="24" y="1122">даёт однозначного ответа.</text><rect class="i-warn" x="12" y="1146" width="316" height="128" rx="6"/><text class="ih" x="24" y="1178">Где ломается</text><text class="it" x="24" y="1204">Провал инструмента в</text><text class="it" x="24" y="1230">трещину или каверну тоже</text><text class="it" x="24" y="1256">даёт резкий рост скорости.</text><rect x="249" y="1292" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1313">схема</text></svg>