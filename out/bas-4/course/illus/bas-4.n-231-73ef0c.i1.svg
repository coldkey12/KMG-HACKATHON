<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1138" role="img" aria-label="Схема шага «Газ в растворе: фон и тревога»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Газ в растворе: фон и тревога»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Содержание газа в буровом</text><text class="it" x="24" y="96">растворе, сравниваемое с</text><text class="it" x="24" y="122">фоновым уровнем.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Момент появления газа в</text><text class="it" x="24" y="230">растворе относительно</text><text class="it" x="24" y="256">бурения и циркуляции.</text><line class="ia" x1="170" y1="284" x2="170" y2="304"/><path class="iah" d="M170 310 l-6 -9 h12 z"/><rect class="i-node" x="12" y="314" width="316" height="76" rx="6"/><text class="it" x="24" y="346">Газ в растворе: фон и</text><text class="it" x="24" y="372">тревога</text><line class="ia" x1="170" y1="394" x2="170" y2="414"/><path class="iah" d="M170 420 l-6 -9 h12 z"/><rect class="i-out" x="12" y="424" width="316" height="128" rx="6"/><text class="ih" x="24" y="456">Вывод</text><text class="it" x="24" y="482">Решение: дегазация</text><text class="it" x="24" y="508">раствора и поиск причины</text><text class="it" x="24" y="534">поступления газа.</text><rect class="i-out" x="12" y="558" width="316" height="154" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Признак, требующий</text><text class="it" x="24" y="642">проверки, а не</text><text class="it" x="24" y="668">доказательство притока из</text><text class="it" x="24" y="694">пласта.</text><rect class="i-warn" x="12" y="718" width="316" height="180" rx="6"/><text class="ih" x="24" y="750">Где ломается</text><text class="it" x="24" y="776">Одинаковое содержание газа</text><text class="it" x="24" y="802">может быть вызвано разными</text><text class="it" x="24" y="828">причинами, связанными и не</text><text class="it" x="24" y="854">связанными с</text><text class="it" x="24" y="880">недоуравновешенностью.</text><rect class="i-warn" x="12" y="904" width="316" height="180" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Число фонового уровня в</text><text class="it" x="24" y="988">тексте не задано; на</text><text class="it" x="24" y="1014">практике его берут из</text><text class="it" x="24" y="1040">условий конкретного</text><text class="it" x="24" y="1066">бурения.</text><rect x="249" y="1102" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1123">схема</text></svg>