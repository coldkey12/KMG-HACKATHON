<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 952" role="img" aria-label="Схема шага «Признаки проявления: прямые и косвенные»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Признаки проявления: прямые и косвенные»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Объём раствора в ёмкостях</text><text class="it" x="24" y="96">и уровень в приёмной</text><text class="it" x="24" y="122">ёмкости.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Расход выходящего потока</text><text class="it" x="24" y="230">при неизменной подаче</text><text class="it" x="24" y="256">буровых насосов.</text><rect class="i-in" x="12" y="280" width="316" height="128" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Объём долива при подъёме</text><text class="it" x="24" y="364">колонны относительно</text><text class="it" x="24" y="390">расчётного.</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Признаки проявления:</text><text class="it" x="24" y="506">прямые и косвенные</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="180" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Набор признаков, по</text><text class="it" x="24" y="642">которым можно заподозрить</text><text class="it" x="24" y="668">приток; каждый признак</text><text class="it" x="24" y="694">требует разной степени</text><text class="it" x="24" y="720">доверия.</text><rect class="i-warn" x="12" y="744" width="316" height="154" rx="6"/><text class="ih" x="24" y="776">Где ломается</text><text class="it" x="24" y="802">Последние три признака</text><text class="it" x="24" y="828">могут возникать по другим</text><text class="it" x="24" y="854">причинам, не из-за</text><text class="it" x="24" y="880">проявления.</text><rect x="249" y="916" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="937">схема</text></svg>