<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 922" role="img" aria-label="Схема шага «Контроль газа в растворе: станции и данные»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Контроль газа в растворе: станции и данные»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Концентрация газа в</text><text class="it" x="24" y="96">буровом растворе по</text><text class="it" x="24" y="122">показаниям станции</text><text class="it" x="24" y="148">контроля или</text><text class="it" x="24" y="174">газокаротажной станции.</text><line class="ia" x1="170" y1="202" x2="170" y2="222"/><path class="iah" d="M170 228 l-6 -9 h12 z"/><rect class="i-node" x="12" y="232" width="316" height="76" rx="6"/><text class="it" x="24" y="264">Контроль газа в растворе:</text><text class="it" x="24" y="290">станции и данные</text><line class="ia" x1="170" y1="312" x2="170" y2="332"/><path class="iah" d="M170 338 l-6 -9 h12 z"/><rect class="i-out" x="12" y="342" width="316" height="180" rx="6"/><text class="ih" x="24" y="374">Вывод</text><text class="it" x="24" y="400">Ряд значений концентрации</text><text class="it" x="24" y="426">газа и её изменения —</text><text class="it" x="24" y="452">основа для решения о</text><text class="it" x="24" y="478">дальнейшей технологии</text><text class="it" x="24" y="504">бурения.</text><rect class="i-warn" x="12" y="528" width="316" height="154" rx="6"/><text class="ih" x="24" y="560">Где ломается</text><text class="it" x="24" y="586">Контроль ведут при</text><text class="it" x="24" y="612">отмеченном поступлении</text><text class="it" x="24" y="638">газа. Без газа этот узел</text><text class="it" x="24" y="664">данных не требует.</text><rect class="i-warn" x="12" y="688" width="316" height="180" rx="6"/><text class="ih" x="24" y="720">Где ломается</text><text class="it" x="24" y="746">Возможна задержка сигнала</text><text class="it" x="24" y="772">между забоем и станцией,</text><text class="it" x="24" y="798">по аналогии с</text><text class="it" x="24" y="824">запаздыванием свойств</text><text class="it" x="24" y="850">раствора.</text><rect x="249" y="886" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="907">схема</text></svg>