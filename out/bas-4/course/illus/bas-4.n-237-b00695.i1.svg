<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1220" role="img" aria-label="Схема шага «Газ в растворе — признак, а не причина»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Газ в растворе — признак, а не причина»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Плотность бурового</text><text class="it" x="24" y="96">раствора у устья: газ её</text><text class="it" x="24" y="122">снижает.</text><rect class="i-in" x="12" y="146" width="316" height="102" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Факт выхода газированного</text><text class="it" x="24" y="230">раствора из скважины.</text><rect class="i-in" x="12" y="254" width="316" height="102" rx="6"/><text class="ih" x="24" y="286">Вход</text><text class="it" x="24" y="312">Уровень раствора в</text><text class="it" x="24" y="338">приёмных ёмкостях.</text><line class="ia" x1="170" y1="366" x2="170" y2="386"/><path class="iah" d="M170 392 l-6 -9 h12 z"/><rect class="i-node" x="12" y="396" width="316" height="76" rx="6"/><text class="it" x="24" y="428">Газ в растворе — признак,</text><text class="it" x="24" y="454">а не причина</text><line class="ia" x1="170" y1="476" x2="170" y2="496"/><path class="iah" d="M170 502 l-6 -9 h12 z"/><rect class="i-out" x="12" y="506" width="316" height="154" rx="6"/><text class="ih" x="24" y="538">Вывод</text><text class="it" x="24" y="564">Вывод: газирование —</text><text class="it" x="24" y="590">признак условий</text><text class="it" x="24" y="616">поступления газа, а не</text><text class="it" x="24" y="642">причина выброса.</text><rect class="i-out" x="12" y="666" width="316" height="180" rx="6"/><text class="ih" x="24" y="698">Вывод</text><text class="it" x="24" y="724">При росте уровня вместе с</text><text class="it" x="24" y="750">выходом газированного</text><text class="it" x="24" y="776">раствора — повышение</text><text class="it" x="24" y="802">плотности и меры по</text><text class="it" x="24" y="828">проявлению.</text><rect class="i-warn" x="12" y="852" width="316" height="154" rx="6"/><text class="ih" x="24" y="884">Где ломается</text><text class="it" x="24" y="910">Слово «обычно»: газ не</text><text class="it" x="24" y="936">всегда оставляет давление</text><text class="it" x="24" y="962">на забое без заметного</text><text class="it" x="24" y="988">падения.</text><rect class="i-warn" x="12" y="1012" width="316" height="154" rx="6"/><text class="ih" x="24" y="1044">Где ломается</text><text class="it" x="24" y="1070">Газ без роста уровня в</text><text class="it" x="24" y="1096">ёмкостях автор не</text><text class="it" x="24" y="1122">связывает с мерами в этом</text><text class="it" x="24" y="1148">узле.</text><rect x="249" y="1184" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1205">схема</text></svg>