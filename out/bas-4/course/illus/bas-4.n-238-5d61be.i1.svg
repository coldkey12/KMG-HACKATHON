<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1090" role="img" aria-label="Схема шага «Мерная ёмкость и схема долива»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Мерная ёмкость и схема долива»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Показание уровнемера</text><text class="it" x="24" y="96">мерной ёмкости.</text><rect class="i-in" x="12" y="120" width="316" height="102" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Число поднятых свечей до</text><text class="it" x="24" y="204">проверки — пять по тексту.</text><rect class="i-in" x="12" y="228" width="316" height="128" rx="6"/><text class="ih" x="24" y="260">Вход</text><text class="it" x="24" y="286">Объём бурильной колонны в</text><text class="it" x="24" y="312">скважине — для выбора</text><text class="it" x="24" y="338">размера мерника.</text><line class="ia" x1="170" y1="366" x2="170" y2="386"/><path class="iah" d="M170 392 l-6 -9 h12 z"/><rect class="i-node" x="12" y="396" width="316" height="76" rx="6"/><text class="it" x="24" y="428">Мерная ёмкость и схема</text><text class="it" x="24" y="454">долива</text><line class="ia" x1="170" y1="476" x2="170" y2="496"/><path class="iah" d="M170 502 l-6 -9 h12 z"/><rect class="i-out" x="12" y="506" width="316" height="102" rx="6"/><text class="ih" x="24" y="538">Вывод</text><text class="it" x="24" y="564">Фактический объём</text><text class="it" x="24" y="590">доливаемого раствора.</text><rect class="i-out" x="12" y="614" width="316" height="102" rx="6"/><text class="ih" x="24" y="646">Вывод</text><text class="it" x="24" y="672">Вывод, годится ли мерник</text><text class="it" x="24" y="698">по порогу два деления.</text><rect class="i-warn" x="12" y="722" width="316" height="154" rx="6"/><text class="ih" x="24" y="754">Где ломается</text><text class="it" x="24" y="780">Мерник мал: изменение</text><text class="it" x="24" y="806">уровня меньше двух</text><text class="it" x="24" y="832">делений, измерение не</text><text class="it" x="24" y="858">подтверждает долив.</text><rect class="i-warn" x="12" y="882" width="316" height="154" rx="6"/><text class="ih" x="24" y="914">Где ломается</text><text class="it" x="24" y="940">Без сливной трубы</text><text class="it" x="24" y="966">вытесненный при спуске</text><text class="it" x="24" y="992">раствор не попадает в</text><text class="it" x="24" y="1018">мерник.</text><rect x="249" y="1054" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1075">схема</text></svg>