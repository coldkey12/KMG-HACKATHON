<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 818" role="img" aria-label="Схема шага «Из чего состоит устьевое оборудование»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Из чего состоит устьевое оборудование»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Перечень позиций: номер,</text><text class="it" x="24" y="96">название и связь.</text><text class="it" x="24" y="122">Например, штуцерная линия</text><text class="it" x="24" y="148">9 идёт к штуцерному</text><text class="it" x="24" y="174">манифольду.</text><rect class="i-in" x="12" y="198" width="316" height="128" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Схема рис. 4.16 как</text><text class="it" x="24" y="282">опорный образ: элементы и</text><text class="it" x="24" y="308">их соединения.</text><line class="ia" x1="170" y1="336" x2="170" y2="356"/><path class="iah" d="M170 362 l-6 -9 h12 z"/><rect class="i-node" x="12" y="366" width="316" height="76" rx="6"/><text class="it" x="24" y="398">Из чего состоит устьевое</text><text class="it" x="24" y="424">оборудование</text><line class="ia" x1="170" y1="446" x2="170" y2="466"/><path class="iah" d="M170 472 l-6 -9 h12 z"/><rect class="i-out" x="12" y="476" width="316" height="154" rx="6"/><text class="ih" x="24" y="508">Вывод</text><text class="it" x="24" y="534">Таблица элементов: номер</text><text class="it" x="24" y="560">на схеме, тип, соединение</text><text class="it" x="24" y="586">с другими элементами (для</text><text class="it" x="24" y="612">каталога оборудования).</text><rect class="i-warn" x="12" y="636" width="316" height="128" rx="6"/><text class="ih" x="24" y="668">Где ломается</text><text class="it" x="24" y="694">Номера в перечне не идут</text><text class="it" x="24" y="720">подряд: не все номера от 1</text><text class="it" x="24" y="746">до 16 названы в тексте.</text><rect x="249" y="782" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="803">схема</text></svg>