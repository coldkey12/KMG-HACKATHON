<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1082" role="img" aria-label="Схема шага «Жёсткое закрытие: быстро, но с ударом»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Жёсткое закрытие: быстро, но с ударом»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="206" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Давление на устье</text><text class="it" x="24" y="96">скважины: по нему</text><text class="it" x="24" y="122">контролируют скважину;</text><text class="it" x="24" y="148">книга называет его</text><text class="it" x="24" y="174">основным параметром</text><text class="it" x="24" y="200">контроля.</text><rect class="i-in" x="12" y="224" width="316" height="154" rx="6"/><text class="ih" x="24" y="256">Вход</text><text class="it" x="24" y="282">Момент закрытия задвижки</text><text class="it" x="24" y="308">штуцерной линии и</text><text class="it" x="24" y="334">превентора с трубными</text><text class="it" x="24" y="360">плашками.</text><line class="ia" x1="170" y1="388" x2="170" y2="408"/><path class="iah" d="M170 414 l-6 -9 h12 z"/><rect class="i-node" x="12" y="418" width="316" height="76" rx="6"/><text class="it" x="24" y="450">Жёсткое закрытие: быстро,</text><text class="it" x="24" y="476">но с ударом</text><line class="ia" x1="170" y1="498" x2="170" y2="518"/><path class="iah" d="M170 524 l-6 -9 h12 z"/><rect class="i-out" x="12" y="528" width="316" height="180" rx="6"/><text class="ih" x="24" y="560">Вывод</text><text class="it" x="24" y="586">Приток из пласта быстро</text><text class="it" x="24" y="612">прекращается; объём</text><text class="it" x="24" y="638">притока и давление</text><text class="it" x="24" y="664">нагнетания на устье</text><text class="it" x="24" y="690">доведены до минимума.</text><rect class="i-warn" x="12" y="714" width="316" height="128" rx="6"/><text class="ih" x="24" y="746">Где ломается</text><text class="it" x="24" y="772">Колебания давления: одно</text><text class="it" x="24" y="798">показание на устье нельзя</text><text class="it" x="24" y="824">считать точным.</text><rect class="i-warn" x="12" y="848" width="316" height="180" rx="6"/><text class="ih" x="24" y="880">Где ломается</text><text class="it" x="24" y="906">При больших давлениях</text><text class="it" x="24" y="932">задвижка трудно</text><text class="it" x="24" y="958">открывается без сообщения</text><text class="it" x="24" y="984">с нагнетательной стороной</text><text class="it" x="24" y="1010">клапана.</text><rect x="249" y="1046" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1067">схема</text></svg>