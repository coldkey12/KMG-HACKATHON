<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1510" role="img" aria-label="Схема шага «Закачка тяжёлого раствора: как вести давление»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Закачка тяжёлого раствора: как вести давление»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Давление в бурильных</text><text class="it" x="24" y="96">трубах при закрытой</text><text class="it" x="24" y="122">скважине после выброса: от</text><text class="it" x="24" y="148">него считают стартовое</text><text class="it" x="24" y="174">значение.</text><rect class="i-in" x="12" y="198" width="316" height="154" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Потери давления в каналах</text><text class="it" x="24" y="282">труб, штуцера и долота,</text><text class="it" x="24" y="308">которые добавляют к</text><text class="it" x="24" y="334">стартовому значению.</text><rect class="i-in" x="12" y="358" width="316" height="128" rx="6"/><text class="ih" x="24" y="390">Вход</text><text class="it" x="24" y="416">Коэффициент безопасности,</text><text class="it" x="24" y="442">который добавляют к</text><text class="it" x="24" y="468">давлению в трубах.</text><line class="ia" x1="170" y1="496" x2="170" y2="516"/><path class="iah" d="M170 522 l-6 -9 h12 z"/><rect class="i-node" x="12" y="526" width="316" height="76" rx="6"/><text class="it" x="24" y="558">Закачка тяжёлого раствора:</text><text class="it" x="24" y="584">как вести давление</text><line class="ia" x1="170" y1="606" x2="170" y2="626"/><path class="iah" d="M170 632 l-6 -9 h12 z"/><rect class="i-out" x="12" y="636" width="316" height="128" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Кривая давления в трубах:</text><text class="it" x="24" y="720">сначала снижается, затем</text><text class="it" x="24" y="746">постоянна.</text><rect class="i-out" x="12" y="770" width="316" height="154" rx="6"/><text class="ih" x="24" y="802">Вывод</text><text class="it" x="24" y="828">Решение о закрытии штуцера</text><text class="it" x="24" y="854">и скважины, когда</text><text class="it" x="24" y="880">утяжелённый раствор начал</text><text class="it" x="24" y="906">выходить.</text><rect class="i-out" x="12" y="930" width="316" height="154" rx="6"/><text class="ih" x="24" y="962">Вывод</text><text class="it" x="24" y="988">Вывод: если избыточного</text><text class="it" x="24" y="1014">давления в трубах и кольце</text><text class="it" x="24" y="1040">нет, скважина под</text><text class="it" x="24" y="1066">контролем.</text><rect class="i-warn" x="12" y="1090" width="316" height="180" rx="6"/><text class="ih" x="24" y="1122">Где ломается</text><text class="it" x="24" y="1148">Стартовое правило</text><text class="it" x="24" y="1174">относится к скорости</text><text class="it" x="24" y="1200">глушения. До её достижения</text><text class="it" x="24" y="1226">давление в трубах по этой</text><text class="it" x="24" y="1252">формуле не задают.</text><rect class="i-warn" x="12" y="1276" width="316" height="180" rx="6"/><text class="ih" x="24" y="1308">Где ломается</text><text class="it" x="24" y="1334">Переход к постоянному</text><text class="it" x="24" y="1360">давлению привязан к</text><text class="it" x="24" y="1386">положению раствора у</text><text class="it" x="24" y="1412">долота, а не к моменту</text><text class="it" x="24" y="1438">времени.</text><rect x="249" y="1474" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1495">схема</text></svg>