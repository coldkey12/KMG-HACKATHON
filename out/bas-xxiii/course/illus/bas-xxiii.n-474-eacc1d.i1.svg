<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1350" role="img" aria-label="Схема шага «Откуда напор: открытый и замкнутый пласт»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Откуда напор: открытый и замкнутый пласт»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">История пластового</text><text class="it" x="24" y="96">давления залежи и давление</text><text class="it" x="24" y="122">насыщения: сравнивается,</text><text class="it" x="24" y="148">выше ли текущее давление</text><text class="it" x="24" y="174">давления насыщения.</text><rect class="i-in" x="12" y="198" width="316" height="154" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Карта или разрез границ</text><text class="it" x="24" y="282">пласта: видно ли</text><text class="it" x="24" y="308">выклинивание или сброс</text><text class="it" x="24" y="334">рядом с залежью.</text><rect class="i-in" x="12" y="358" width="316" height="128" rx="6"/><text class="ih" x="24" y="390">Вход</text><text class="it" x="24" y="416">Признаки притока воды из</text><text class="it" x="24" y="442">области питания в данных</text><text class="it" x="24" y="468">по скважинам.</text><line class="ia" x1="170" y1="496" x2="170" y2="516"/><path class="iah" d="M170 522 l-6 -9 h12 z"/><rect class="i-node" x="12" y="526" width="316" height="76" rx="6"/><text class="it" x="24" y="558">Откуда напор: открытый и</text><text class="it" x="24" y="584">замкнутый пласт</text><line class="ia" x1="170" y1="606" x2="170" y2="626"/><path class="iah" d="M170 632 l-6 -9 h12 z"/><rect class="i-out" x="12" y="636" width="316" height="180" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Вывод о режиме:</text><text class="it" x="24" y="720">упруговодонапорный, если</text><text class="it" x="24" y="746">приток поддерживается</text><text class="it" x="24" y="772">напором воды из области</text><text class="it" x="24" y="798">питания.</text><rect class="i-out" x="12" y="822" width="316" height="180" rx="6"/><text class="ih" x="24" y="854">Вывод</text><text class="it" x="24" y="880">Вывод о режиме:</text><text class="it" x="24" y="906">замкнуто-упругий, если</text><text class="it" x="24" y="932">ловушка закрыта и давление</text><text class="it" x="24" y="958">ещё не снизилось до</text><text class="it" x="24" y="984">давления насыщения.</text><rect class="i-warn" x="12" y="1008" width="316" height="154" rx="6"/><text class="ih" x="24" y="1040">Где ломается</text><text class="it" x="24" y="1066">Замкнуто-упругий режим</text><text class="it" x="24" y="1092">действует только до</text><text class="it" x="24" y="1118">снижения давления до</text><text class="it" x="24" y="1144">давления насыщения.</text><rect class="i-warn" x="12" y="1168" width="316" height="128" rx="6"/><text class="ih" x="24" y="1200">Где ломается</text><text class="it" x="24" y="1226">В главе не задано число</text><text class="it" x="24" y="1252">для «небольших расстояний»</text><text class="it" x="24" y="1278">до границы ловушки.</text><rect x="249" y="1314" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1335">схема</text></svg>