<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1216" role="img" aria-label="Схема шага «Вода снаружи или замкнутая залежь»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Вода снаружи или замкнутая залежь»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Признак области питания:</text><text class="it" x="24" y="96">есть ли приток воды извне</text><text class="it" x="24" y="122">к залежи. Определяется по</text><text class="it" x="24" y="148">геологии границ.</text><rect class="i-in" x="12" y="172" width="316" height="180" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Геометрия границ залежи:</text><text class="it" x="24" y="256">закрыта ли она ловушками</text><text class="it" x="24" y="282">со всех сторон и насколько</text><text class="it" x="24" y="308">близко стоят выклинивание</text><text class="it" x="24" y="334">или сброс.</text><rect class="i-in" x="12" y="358" width="316" height="128" rx="6"/><text class="ih" x="24" y="390">Вход</text><text class="it" x="24" y="416">История пластового</text><text class="it" x="24" y="442">давления относительно</text><text class="it" x="24" y="468">давления насыщения.</text><line class="ia" x1="170" y1="496" x2="170" y2="516"/><path class="iah" d="M170 522 l-6 -9 h12 z"/><rect class="i-node" x="12" y="526" width="316" height="76" rx="6"/><text class="it" x="24" y="558">Вода снаружи или замкнутая</text><text class="it" x="24" y="584">залежь</text><line class="ia" x1="170" y1="606" x2="170" y2="626"/><path class="iah" d="M170 632 l-6 -9 h12 z"/><rect class="i-out" x="12" y="636" width="316" height="154" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Метка режима:</text><text class="it" x="24" y="720">упруговодонапорный,</text><text class="it" x="24" y="746">замкнуто-упругий или режим</text><text class="it" x="24" y="772">не определён.</text><rect class="i-warn" x="12" y="796" width="316" height="180" rx="6"/><text class="ih" x="24" y="828">Где ломается</text><text class="it" x="24" y="854">Число для «небольших</text><text class="it" x="24" y="880">расстояний» в книге не</text><text class="it" x="24" y="906">задано. Граница между</text><text class="it" x="24" y="932">закрытой и открытой</text><text class="it" x="24" y="958">залежью размыта.</text><rect class="i-warn" x="12" y="982" width="316" height="180" rx="6"/><text class="ih" x="24" y="1014">Где ломается</text><text class="it" x="24" y="1040">Если давление упало ниже</text><text class="it" x="24" y="1066">давления насыщения,</text><text class="it" x="24" y="1092">замкнуто-упругое описание</text><text class="it" x="24" y="1118">в этом фрагменте не</text><text class="it" x="24" y="1144">применяется.</text><rect x="249" y="1180" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1201">схема</text></svg>