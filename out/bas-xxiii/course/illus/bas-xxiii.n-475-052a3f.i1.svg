<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 658" role="img" aria-label="Схема шага «Как появилась теория упругого режима»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Как появилась теория упругого режима»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Записи давления во времени</text><text class="it" x="24" y="96">при работе скважины (в</text><text class="it" x="24" y="122">тексте не описаны; по</text><text class="it" x="24" y="148">смыслу раздела).</text><line class="ia" x1="170" y1="176" x2="170" y2="196"/><path class="iah" d="M170 202 l-6 -9 h12 z"/><rect class="i-node" x="12" y="206" width="316" height="76" rx="6"/><text class="it" x="24" y="238">Как появилась теория</text><text class="it" x="24" y="264">упругого режима</text><line class="ia" x1="170" y1="286" x2="170" y2="306"/><path class="iah" d="M170 312 l-6 -9 h12 z"/><rect class="i-out" x="12" y="316" width="316" height="128" rx="6"/><text class="ih" x="24" y="348">Вывод</text><text class="it" x="24" y="374">Оценка того, какая модель</text><text class="it" x="24" y="400">упругого режима подходит</text><text class="it" x="24" y="426">для описания данных.</text><rect class="i-warn" x="12" y="450" width="316" height="154" rx="6"/><text class="ih" x="24" y="482">Где ломается</text><text class="it" x="24" y="508">Модель без объёмной</text><text class="it" x="24" y="534">упругости пласта может</text><text class="it" x="24" y="560">давать систематически</text><text class="it" x="24" y="586">неполную картину.</text><rect x="249" y="622" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="643">схема</text></svg>