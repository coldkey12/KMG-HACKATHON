<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1198" role="img" aria-label="Схема шага «Изменение объёма жидкости и пор»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Изменение объёма жидкости и пор»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Объём элемента пласта V0,</text><text class="it" x="24" y="96">заданный геометрией</text><text class="it" x="24" y="122">модели.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Начальное давление p0 и</text><text class="it" x="24" y="230">объём жидкости V0ж при</text><text class="it" x="24" y="256">нём.</text><rect class="i-in" x="12" y="280" width="316" height="102" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Одно изменение давления Δp</text><text class="it" x="24" y="364">для всех точек элемента.</text><line class="ia" x1="170" y1="392" x2="170" y2="412"/><path class="iah" d="M170 418 l-6 -9 h12 z"/><rect class="i-node" x="12" y="422" width="316" height="76" rx="6"/><text class="it" x="24" y="454">Изменение объёма жидкости</text><text class="it" x="24" y="480">и пор</text><line class="ia" x1="170" y1="502" x2="170" y2="522"/><path class="iah" d="M170 528 l-6 -9 h12 z"/><rect class="i-out" x="12" y="532" width="316" height="102" rx="6"/><text class="ih" x="24" y="564">Вывод</text><text class="it" x="24" y="590">ΔV_ж — изменение объёма</text><text class="it" x="24" y="616">жидкости в элементе.</text><rect class="i-out" x="12" y="640" width="316" height="102" rx="6"/><text class="ih" x="24" y="672">Вывод</text><text class="it" x="24" y="698">ΔV_п — изменение объёма</text><text class="it" x="24" y="724">пор в элементе.</text><rect class="i-out" x="12" y="748" width="316" height="102" rx="6"/><text class="ih" x="24" y="780">Вывод</text><text class="it" x="24" y="806">ΔV_з — изменение упругого</text><text class="it" x="24" y="832">запаса элемента.</text><rect class="i-warn" x="12" y="856" width="316" height="128" rx="6"/><text class="ih" x="24" y="888">Где ломается</text><text class="it" x="24" y="914">Если Δp различно в разных</text><text class="it" x="24" y="940">точках элемента, одной</text><text class="it" x="24" y="966">величиной Δp не обойтись.</text><rect class="i-warn" x="12" y="990" width="316" height="154" rx="6"/><text class="ih" x="24" y="1022">Где ломается</text><text class="it" x="24" y="1048">Без соглашения о знаке Δp</text><text class="it" x="24" y="1074">данные по жидкости и порам</text><text class="it" x="24" y="1100">могут выглядеть</text><text class="it" x="24" y="1126">противоречивыми.</text><rect x="249" y="1162" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1183">схема</text></svg>