<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1242" role="img" aria-label="Схема шага «Почему давление выравнивается долго»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Почему давление выравнивается долго»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривая изменения</text><text class="it" x="24" y="96">пластового давления во</text><text class="it" x="24" y="122">времени после пуска</text><text class="it" x="24" y="148">скважины или смены её</text><text class="it" x="24" y="174">дебита.</text><rect class="i-in" x="12" y="198" width="316" height="180" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Параметры пласта и флюида:</text><text class="it" x="24" y="282">проницаемость k, вязкость</text><text class="it" x="24" y="308">μ, коэффициенты объёмной</text><text class="it" x="24" y="334">упругости жидкости β_ж и</text><text class="it" x="24" y="360">скелета β_с.</text><line class="ia" x1="170" y1="388" x2="170" y2="408"/><path class="iah" d="M170 414 l-6 -9 h12 z"/><rect class="i-node" x="12" y="418" width="316" height="76" rx="6"/><text class="it" x="24" y="450">Почему давление</text><text class="it" x="24" y="476">выравнивается долго</text><line class="ia" x1="170" y1="498" x2="170" y2="518"/><path class="iah" d="M170 524 l-6 -9 h12 z"/><rect class="i-out" x="12" y="528" width="316" height="154" rx="6"/><text class="ih" x="24" y="560">Вывод</text><text class="it" x="24" y="586">Длительность процесса</text><text class="it" x="24" y="612">перераспределения давления</text><text class="it" x="24" y="638">после изменения режима</text><text class="it" x="24" y="664">работы скважины.</text><rect class="i-out" x="12" y="688" width="316" height="154" rx="6"/><text class="ih" x="24" y="720">Вывод</text><text class="it" x="24" y="746">Качественная оценка того,</text><text class="it" x="24" y="772">быстрее или медленнее идёт</text><text class="it" x="24" y="798">процесс при известных</text><text class="it" x="24" y="824">свойствах.</text><rect class="i-warn" x="12" y="848" width="316" height="154" rx="6"/><text class="ih" x="24" y="880">Где ломается</text><text class="it" x="24" y="906">В тексте нет числового</text><text class="it" x="24" y="932">порога времени. Оценка по</text><text class="it" x="24" y="958">данным требует знания</text><text class="it" x="24" y="984">свойств пласта и флюида.</text><rect class="i-warn" x="12" y="1008" width="316" height="180" rx="6"/><text class="ih" x="24" y="1040">Где ломается</text><text class="it" x="24" y="1066">Медленный отклик можно</text><text class="it" x="24" y="1092">объяснить и вязкостью, и</text><text class="it" x="24" y="1118">упругостью. Без</text><text class="it" x="24" y="1144">дополнительных данных их</text><text class="it" x="24" y="1170">вклад трудно разделить.</text><rect x="249" y="1206" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1227">схема</text></svg>