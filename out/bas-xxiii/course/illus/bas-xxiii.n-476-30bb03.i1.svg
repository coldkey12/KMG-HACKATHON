<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1086" role="img" aria-label="Схема шага «Коэффициент упругоёмкости пласта β*»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Коэффициент упругоёмкости пласта β*»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="76" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Объём элемента пласта V_0.</text><rect class="i-in" x="12" y="94" width="316" height="102" rx="6"/><text class="ih" x="24" y="126">Вход</text><text class="it" x="24" y="152">Изменение пластового</text><text class="it" x="24" y="178">давления Δp.</text><rect class="i-in" x="12" y="202" width="316" height="102" rx="6"/><text class="ih" x="24" y="234">Вход</text><text class="it" x="24" y="260">Изменение упругого запаса</text><text class="it" x="24" y="286">ΔV_з за тот же интервал.</text><line class="ia" x1="170" y1="314" x2="170" y2="334"/><path class="iah" d="M170 340 l-6 -9 h12 z"/><rect class="i-node" x="12" y="344" width="316" height="76" rx="6"/><text class="it" x="24" y="376">Коэффициент упругоёмкости</text><text class="it" x="24" y="402">пласта β*</text><line class="ia" x1="170" y1="424" x2="170" y2="444"/><path class="iah" d="M170 450 l-6 -9 h12 z"/><rect class="i-out" x="12" y="454" width="316" height="128" rx="6"/><text class="ih" x="24" y="486">Вывод</text><text class="it" x="24" y="512">Коэффициент β* как</text><text class="it" x="24" y="538">отношение ΔV_з к</text><text class="it" x="24" y="564">произведению V_0 и Δp.</text><rect class="i-warn" x="12" y="588" width="316" height="180" rx="6"/><text class="ih" x="24" y="620">Где ломается</text><text class="it" x="24" y="646">Оценка зависит от того,</text><text class="it" x="24" y="672">что считать изменением</text><text class="it" x="24" y="698">запаса. Если ΔV_з смешан с</text><text class="it" x="24" y="724">другими эффектами, β*</text><text class="it" x="24" y="750">будет неверным.</text><rect class="i-warn" x="12" y="774" width="316" height="258" rx="6"/><text class="ih" x="24" y="806">Где ломается</text><text class="it" x="24" y="832">По главе связь ΔV_з =</text><text class="it" x="24" y="858">β*·V_0·Δp линейна при</text><text class="it" x="24" y="884">малом Δp (см. шаг 26</text><text class="it" x="24" y="910">«Когда уравнение</text><text class="it" x="24" y="936">пьезопроводности</text><text class="it" x="24" y="962">неприменимо»); это</text><text class="it" x="24" y="988">ограничение здесь не из</text><text class="it" x="24" y="1014">выбранных единиц.</text><rect x="249" y="1050" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1071">схема</text></svg>