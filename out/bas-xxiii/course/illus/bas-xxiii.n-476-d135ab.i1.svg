<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1246" role="img" aria-label="Схема шага «Упругоёмкость пласта — одна цифра»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Упругоёмкость пласта — одна цифра»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Пористость пласта m — доля</text><text class="it" x="24" y="96">порового объёма элемента.</text><rect class="i-in" x="12" y="120" width="316" height="128" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Коэффициенты объёмной</text><text class="it" x="24" y="204">упругости жидкости β_ж и</text><text class="it" x="24" y="230">скелета β_с.</text><rect class="i-in" x="12" y="254" width="316" height="102" rx="6"/><text class="ih" x="24" y="286">Вход</text><text class="it" x="24" y="312">Объём элемента V0 и</text><text class="it" x="24" y="338">изменение давления Δp.</text><line class="ia" x1="170" y1="366" x2="170" y2="386"/><path class="iah" d="M170 392 l-6 -9 h12 z"/><rect class="i-node" x="12" y="396" width="316" height="76" rx="6"/><text class="it" x="24" y="428">Упругоёмкость пласта —</text><text class="it" x="24" y="454">одна цифра</text><line class="ia" x1="170" y1="476" x2="170" y2="496"/><path class="iah" d="M170 502 l-6 -9 h12 z"/><rect class="i-out" x="12" y="506" width="316" height="180" rx="6"/><text class="ih" x="24" y="538">Вывод</text><text class="it" x="24" y="564">Одна величина β*, которая</text><text class="it" x="24" y="590">показывает изменение</text><text class="it" x="24" y="616">упругого запаса на единицу</text><text class="it" x="24" y="642">объёма и на единицу</text><text class="it" x="24" y="668">давления.</text><rect class="i-out" x="12" y="692" width="316" height="128" rx="6"/><text class="ih" x="24" y="724">Вывод</text><text class="it" x="24" y="750">Изменение упругого запаса</text><text class="it" x="24" y="776">в элементе: ΔVз =</text><text class="it" x="24" y="802">β*·V0·Δp.</text><rect class="i-warn" x="12" y="826" width="316" height="180" rx="6"/><text class="ih" x="24" y="858">Где ломается</text><text class="it" x="24" y="884">Формулы записаны для</text><text class="it" x="24" y="910">одного элемента. Для</text><text class="it" x="24" y="936">неоднородного пласта β*</text><text class="it" x="24" y="962">нужно считать по элементам</text><text class="it" x="24" y="988">отдельно.</text><rect class="i-warn" x="12" y="1012" width="316" height="180" rx="6"/><text class="ih" x="24" y="1044">Где ломается</text><text class="it" x="24" y="1070">Если m, β_ж или β_с</text><text class="it" x="24" y="1096">заметно меняются при</text><text class="it" x="24" y="1122">изменении давления,</text><text class="it" x="24" y="1148">постоянная β* становится</text><text class="it" x="24" y="1174">приближением.</text><rect x="249" y="1210" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1231">схема</text></svg>