<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1086" role="img" aria-label="Схема шага «Баланс: добыча равна убыли запаса»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Баланс: добыча равна убыли запаса»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Суммарный дебит всех</text><text class="it" x="24" y="96">скважин залежи Q(t) по</text><text class="it" x="24" y="122">времени.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Объём возмущённой части</text><text class="it" x="24" y="230">пласта V_0(t) и падение</text><text class="it" x="24" y="256">давления Δp по времени.</text><rect class="i-in" x="12" y="280" width="316" height="154" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Коэффициент упругоёмкости</text><text class="it" x="24" y="364">пласта β* (см. шаг 10</text><text class="it" x="24" y="390">«Упругоёмкость пласта —</text><text class="it" x="24" y="416">одна цифра»).</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Баланс: добыча равна убыли</text><text class="it" x="24" y="532">запаса</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="154" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Скорость изменения</text><text class="it" x="24" y="668">произведения β*·V_0·Δp,</text><text class="it" x="24" y="694">равная Q(t), делённому на</text><text class="it" x="24" y="720">β*.</text><rect class="i-warn" x="12" y="744" width="316" height="128" rx="6"/><text class="ih" x="24" y="776">Где ломается</text><text class="it" x="24" y="802">Если в залежь поступает</text><text class="it" x="24" y="828">вода, отбор Q(t) не даёт</text><text class="it" x="24" y="854">полного баланса.</text><rect class="i-warn" x="12" y="878" width="316" height="154" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Уравнение записано для</text><text class="it" x="24" y="962">замкнуто-упругого режима и</text><text class="it" x="24" y="988">не переносится на другие</text><text class="it" x="24" y="1014">режимы без проверки.</text><rect x="249" y="1050" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1071">схема</text></svg>