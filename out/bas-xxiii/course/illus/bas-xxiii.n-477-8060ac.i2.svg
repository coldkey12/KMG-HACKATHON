<svg viewBox="0 0 340 204" role="img" aria-label="Условные цвета шага «Баланс: добыча равна убыли запаса»: нефть, давление." xmlns="http://www.w3.org/2000/svg"><title>Условные цвета шага «Баланс: добыча равна убыли запаса»: нефть, давление.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><text class="ih" x="12" y="32">Флюиды</text><rect class="isw" x="12" y="44" width="44" height="28" rx="4" fill="#2E8B57"/><text class="it" x="68" y="65">нефть</text><text class="ih" x="12" y="106">Кривые</text><rect class="isw" x="12" y="118" width="44" height="28" rx="4" fill="#00CEC9"/><text class="it" x="68" y="139">давление</text><rect x="249" y="168" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="189">схема</text></svg>