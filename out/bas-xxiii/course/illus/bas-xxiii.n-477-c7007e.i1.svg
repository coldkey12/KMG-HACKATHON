<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1086" role="img" aria-label="Схема шага «Сколько нефти даёт упругость»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Сколько нефти даёт упругость»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Наблюдения за изменением</text><text class="it" x="24" y="96">дебитов скважин во</text><text class="it" x="24" y="122">времени.</text><rect class="i-in" x="12" y="146" width="316" height="102" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Наблюдения за изменением</text><text class="it" x="24" y="230">давлений во времени.</text><line class="ia" x1="170" y1="258" x2="170" y2="278"/><path class="iah" d="M170 284 l-6 -9 h12 z"/><rect class="i-node" x="12" y="288" width="316" height="76" rx="6"/><text class="it" x="24" y="320">Сколько нефти даёт</text><text class="it" x="24" y="346">упругость</text><line class="ia" x1="170" y1="368" x2="170" y2="388"/><path class="iah" d="M170 394 l-6 -9 h12 z"/><rect class="i-out" x="12" y="398" width="316" height="128" rx="6"/><text class="ih" x="24" y="430">Вывод</text><text class="it" x="24" y="456">Коллекторские свойства</text><text class="it" x="24" y="482">пластов, восстановленные</text><text class="it" x="24" y="508">по этим наблюдениям.</text><rect class="i-out" x="12" y="532" width="316" height="154" rx="6"/><text class="ih" x="24" y="564">Вывод</text><text class="it" x="24" y="590">Оценка потенциальных</text><text class="it" x="24" y="616">возможностей упругой</text><text class="it" x="24" y="642">водонапорной системы для</text><text class="it" x="24" y="668">вытеснения флюидов.</text><rect class="i-warn" x="12" y="692" width="316" height="180" rx="6"/><text class="ih" x="24" y="724">Где ломается</text><text class="it" x="24" y="750">Доля добычи из упругого</text><text class="it" x="24" y="776">запаса зависит от режима:</text><text class="it" x="24" y="802">2–5% при естественном</text><text class="it" x="24" y="828">упругом режиме и до 20% на</text><text class="it" x="24" y="854">Тенгизе.</text><rect class="i-warn" x="12" y="878" width="316" height="154" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Обратный расчёт по</text><text class="it" x="24" y="962">наблюдениям может давать</text><text class="it" x="24" y="988">не один ответ. Это общая</text><text class="it" x="24" y="1014">оговорка, не из главы.</text><rect x="249" y="1050" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1071">схема</text></svg>