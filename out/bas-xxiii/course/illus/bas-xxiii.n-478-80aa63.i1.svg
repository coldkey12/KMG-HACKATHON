<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1030" role="img" aria-label="Схема шага «Допущение: проницаемость не меняется»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Допущение: проницаемость не меняется»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Значения проницаемости k и</text><text class="it" x="24" y="96">вязкости μ. В модели они</text><text class="it" x="24" y="122">задаются константами.</text><rect class="i-in" x="12" y="146" width="316" height="154" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Пористость m как функция</text><text class="it" x="24" y="230">давления. Она входит в</text><text class="it" x="24" y="256">модель через уравнение</text><text class="it" x="24" y="282">состояния.</text><line class="ia" x1="170" y1="310" x2="170" y2="330"/><path class="iah" d="M170 336 l-6 -9 h12 z"/><rect class="i-node" x="12" y="340" width="316" height="76" rx="6"/><text class="it" x="24" y="372">Допущение: проницаемость</text><text class="it" x="24" y="398">не меняется</text><line class="ia" x1="170" y1="420" x2="170" y2="440"/><path class="iah" d="M170 446 l-6 -9 h12 z"/><rect class="i-out" x="12" y="450" width="316" height="180" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Если проницаемость в</text><text class="it" x="24" y="534">пласте меняется, давление</text><text class="it" x="24" y="560">и дебит по модели могут</text><text class="it" x="24" y="586">заметно расходиться с</text><text class="it" x="24" y="612">измерениями.</text><rect class="i-warn" x="12" y="636" width="316" height="180" rx="6"/><text class="ih" x="24" y="668">Где ломается</text><text class="it" x="24" y="694">Модель неточна там, где</text><text class="it" x="24" y="720">проницаемость заметно</text><text class="it" x="24" y="746">меняется с давлением.</text><text class="it" x="24" y="772">Граница в книге не задана</text><text class="it" x="24" y="798">числом.</text><rect class="i-warn" x="12" y="822" width="316" height="154" rx="6"/><text class="ih" x="24" y="854">Где ломается</text><text class="it" x="24" y="880">Для пластов с меняющейся</text><text class="it" x="24" y="906">проницаемостью книга</text><text class="it" x="24" y="932">предлагает монографии, а</text><text class="it" x="24" y="958">не готовую формулу.</text><rect x="249" y="994" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1015">схема</text></svg>