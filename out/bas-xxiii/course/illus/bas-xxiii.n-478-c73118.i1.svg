<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1168" role="img" aria-label="Схема шага «Три закона, из которых строится модель»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Три закона, из которых строится модель»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Давление p в точках</text><text class="it" x="24" y="96">пласта: от него зависят</text><text class="it" x="24" y="122">остальные величины модели.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Пористость m, плотность ρ,</text><text class="it" x="24" y="230">проницаемость k и вязкость</text><text class="it" x="24" y="256">μ как функции давления.</text><rect class="i-in" x="12" y="280" width="316" height="128" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Массовые силы f̄, если они</text><text class="it" x="24" y="364">заданы. В узле их</text><text class="it" x="24" y="390">определение не дано.</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Три закона, из которых</text><text class="it" x="24" y="506">строится модель</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="128" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Скорость фильтрации w̄ по</text><text class="it" x="24" y="642">закону Дарси из градиента</text><text class="it" x="24" y="668">давления и свойств среды.</text><rect class="i-out" x="12" y="692" width="316" height="102" rx="6"/><text class="ih" x="24" y="724">Вывод</text><text class="it" x="24" y="750">Изменение массы в порах по</text><text class="it" x="24" y="776">уравнению неразрывности.</text><rect class="i-warn" x="12" y="800" width="316" height="154" rx="6"/><text class="ih" x="24" y="832">Где ломается</text><text class="it" x="24" y="858">Если f̄ не задан или его</text><text class="it" x="24" y="884">знак неясен, скорость по</text><text class="it" x="24" y="910">формуле однозначно не</text><text class="it" x="24" y="936">посчитать.</text><rect class="i-warn" x="12" y="960" width="316" height="154" rx="6"/><text class="ih" x="24" y="992">Где ломается</text><text class="it" x="24" y="1018">Если свойства не заданы</text><text class="it" x="24" y="1044">для разных давлений, их</text><text class="it" x="24" y="1070">зависимость от давления не</text><text class="it" x="24" y="1096">определена.</text><rect x="249" y="1132" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1153">схема</text></svg>