<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1086" role="img" aria-label="Схема шага «Почему квадратичное слагаемое отбрасывают»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Почему квадратичное слагаемое отбрасывают»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Коэффициенты сжимаемости</text><text class="it" x="24" y="96">нефти, пластовой воды и</text><text class="it" x="24" y="122">пласта; их справочные</text><text class="it" x="24" y="148">диапазоны порядка 10^-10</text><text class="it" x="24" y="174">Па^-1.</text><rect class="i-in" x="12" y="198" width="316" height="128" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Разность давлений p − p0</text><text class="it" x="24" y="282">относительно начального</text><text class="it" x="24" y="308">пластового давления.</text><rect class="i-in" x="12" y="332" width="316" height="76" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Пористость пласта m0.</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Почему квадратичное</text><text class="it" x="24" y="506">слагаемое отбрасывают</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="154" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Выражение для mρ, линейное</text><text class="it" x="24" y="642">по давлению; оно</text><text class="it" x="24" y="668">используется в дальнейшем</text><text class="it" x="24" y="694">выводе уравнения.</text><rect class="i-warn" x="12" y="718" width="316" height="128" rx="6"/><text class="ih" x="24" y="750">Где ломается</text><text class="it" x="24" y="776">Автор позже ограничивает</text><text class="it" x="24" y="802">применимость условием β*(p</text><text class="it" x="24" y="828">− p0) ≪ 1.</text><rect class="i-warn" x="12" y="852" width="316" height="180" rx="6"/><text class="ih" x="24" y="884">Где ломается</text><text class="it" x="24" y="910">При большом перепаде</text><text class="it" x="24" y="936">давлений квадратичный член</text><text class="it" x="24" y="962">может стать заметным, и</text><text class="it" x="24" y="988">отбрасывание станет</text><text class="it" x="24" y="1014">неверным.</text><rect x="249" y="1050" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1071">схема</text></svg>