<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1246" role="img" aria-label="Схема шага «Модель пласта как система уравнений»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Модель пласта как система уравнений»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Давление p и опорное</text><text class="it" x="24" y="96">давление p0: их разность p</text><text class="it" x="24" y="122">− p0 задаёт плотность и</text><text class="it" x="24" y="148">пористость.</text><rect class="i-in" x="12" y="172" width="316" height="102" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Опорные значения ρ0 и m0</text><text class="it" x="24" y="256">при давлении p0.</text><rect class="i-in" x="12" y="280" width="316" height="102" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Коэффициенты β∞ (жидкость)</text><text class="it" x="24" y="364">и βc (пласт).</text><line class="ia" x1="170" y1="392" x2="170" y2="412"/><path class="iah" d="M170 418 l-6 -9 h12 z"/><rect class="i-node" x="12" y="422" width="316" height="76" rx="6"/><text class="it" x="24" y="454">Модель пласта как система</text><text class="it" x="24" y="480">уравнений</text><line class="ia" x1="170" y1="502" x2="170" y2="522"/><path class="iah" d="M170 528 l-6 -9 h12 z"/><rect class="i-out" x="12" y="532" width="316" height="180" rx="6"/><text class="ih" x="24" y="564">Вывод</text><text class="it" x="24" y="590">Все величины выражаются</text><text class="it" x="24" y="616">через одну искомую</text><text class="it" x="24" y="642">функцию: плотность,</text><text class="it" x="24" y="668">пористость и функция P</text><text class="it" x="24" y="694">зависят от давления.</text><rect class="i-out" x="12" y="718" width="316" height="154" rx="6"/><text class="ih" x="24" y="750">Вывод</text><text class="it" x="24" y="776">Одно дифференциальное</text><text class="it" x="24" y="802">уравнение для одной</text><text class="it" x="24" y="828">искомой функции — цель</text><text class="it" x="24" y="854">сведения системы.</text><rect class="i-warn" x="12" y="878" width="316" height="128" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Если k или μ меняются с</text><text class="it" x="24" y="962">давлением, эта система их</text><text class="it" x="24" y="988">не описывает.</text><rect class="i-warn" x="12" y="1012" width="316" height="180" rx="6"/><text class="ih" x="24" y="1044">Где ломается</text><text class="it" x="24" y="1070">Линейные уравнения</text><text class="it" x="24" y="1096">состояния описывают малые</text><text class="it" x="24" y="1122">изменения давления; при</text><text class="it" x="24" y="1148">больших отклонениях они</text><text class="it" x="24" y="1174">могут не подходить.</text><rect x="249" y="1210" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1231">схема</text></svg>