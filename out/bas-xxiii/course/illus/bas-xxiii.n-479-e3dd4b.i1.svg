<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1000" role="img" aria-label="Схема шага «Полная система уравнений упругого режима»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Полная система уравнений упругого режима»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="232" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Постоянные величины пласта</text><text class="it" x="24" y="96">и флюида: опорное давление</text><text class="it" x="24" y="122">p0, плотность ρ0,</text><text class="it" x="24" y="148">пористость m0,</text><text class="it" x="24" y="174">коэффициенты β∞ и βc,</text><text class="it" x="24" y="200">проницаемость k, вязкость</text><text class="it" x="24" y="226">μ.</text><line class="ia" x1="170" y1="254" x2="170" y2="274"/><path class="iah" d="M170 280 l-6 -9 h12 z"/><rect class="i-node" x="12" y="284" width="316" height="76" rx="6"/><text class="it" x="24" y="316">Полная система уравнений</text><text class="it" x="24" y="342">упругого режима</text><line class="ia" x1="170" y1="364" x2="170" y2="384"/><path class="iah" d="M170 390 l-6 -9 h12 z"/><rect class="i-out" x="12" y="394" width="316" height="180" rx="6"/><text class="ih" x="24" y="426">Вывод</text><text class="it" x="24" y="452">Одно уравнение для</text><text class="it" x="24" y="478">давления p. Зная p, по</text><text class="it" x="24" y="504">уравнениям состояния</text><text class="it" x="24" y="530">находят плотность ρ и</text><text class="it" x="24" y="556">пористость m.</text><rect class="i-warn" x="12" y="580" width="316" height="180" rx="6"/><text class="ih" x="24" y="612">Где ломается</text><text class="it" x="24" y="638">Если проницаемость или</text><text class="it" x="24" y="664">вязкость меняются с</text><text class="it" x="24" y="690">деформацией, запись с</text><text class="it" x="24" y="716">постоянными k и μ не</text><text class="it" x="24" y="742">подходит.</text><rect class="i-warn" x="12" y="766" width="316" height="180" rx="6"/><text class="ih" x="24" y="798">Где ломается</text><text class="it" x="24" y="824">Линейные уравнения</text><text class="it" x="24" y="850">состояния нужно проверять</text><text class="it" x="24" y="876">на диапазон изменения</text><text class="it" x="24" y="902">давления; в главе это</text><text class="it" x="24" y="928">обсуждается дальше.</text><rect x="249" y="964" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="985">схема</text></svg>