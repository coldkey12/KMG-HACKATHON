<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1112" role="img" aria-label="Схема шага «Накопление массы в порах»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Накопление массы в порах»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Изменение давления p во</text><text class="it" x="24" y="96">времени в точке пласта</text><rect class="i-in" x="12" y="120" width="316" height="206" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Значения ρ0, m0 и</text><text class="it" x="24" y="204">коэффициентов β∞, βс для</text><text class="it" x="24" y="230">конкретного пласта и</text><text class="it" x="24" y="256">флюида, взятые из</text><text class="it" x="24" y="282">справочных или</text><text class="it" x="24" y="308">лабораторных данных</text><line class="ia" x1="170" y1="336" x2="170" y2="356"/><path class="iah" d="M170 362 l-6 -9 h12 z"/><rect class="i-node" x="12" y="366" width="316" height="50" rx="6"/><text class="it" x="24" y="398">Накопление массы в порах</text><line class="ia" x1="170" y1="420" x2="170" y2="440"/><path class="iah" d="M170 446 l-6 -9 h12 z"/><rect class="i-out" x="12" y="450" width="316" height="154" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Скорость изменения</text><text class="it" x="24" y="534">накопленной массы mρ при</text><text class="it" x="24" y="560">заданной скорости</text><text class="it" x="24" y="586">изменения давления</text><rect class="i-out" x="12" y="610" width="316" height="102" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Сводный коэффициент β* для</text><text class="it" x="24" y="694">точки пласта</text><rect class="i-warn" x="12" y="718" width="316" height="154" rx="6"/><text class="ih" x="24" y="750">Где ломается</text><text class="it" x="24" y="776">Диапазоны βж и βс даны для</text><text class="it" x="24" y="802">нефтей, пластовых вод и</text><text class="it" x="24" y="828">пласта. Для других флюидов</text><text class="it" x="24" y="854">в тексте данных нет.</text><rect class="i-warn" x="12" y="878" width="316" height="180" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">При сильном изменении</text><text class="it" x="24" y="962">давления квадратичный член</text><text class="it" x="24" y="988">может оказаться не малым.</text><text class="it" x="24" y="1014">В этом узле такая проверка</text><text class="it" x="24" y="1040">не выполняется.</text><rect x="249" y="1076" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1097">схема</text></svg>