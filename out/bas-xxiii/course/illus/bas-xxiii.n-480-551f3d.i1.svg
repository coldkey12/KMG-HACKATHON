<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1142" role="img" aria-label="Схема шага «Коэффициент пьезопроводности: скорость выравнивания давления»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Коэффициент пьезопроводности: скорость выравнивания давления»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Коэффициент проницаемости</text><text class="it" x="24" y="96">k, входящий в числитель κ.</text><rect class="i-in" x="12" y="120" width="316" height="76" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Вязкость μ жидкости.</text><rect class="i-in" x="12" y="202" width="316" height="102" rx="6"/><text class="ih" x="24" y="234">Вход</text><text class="it" x="24" y="260">Коэффициент упругоёмкости</text><text class="it" x="24" y="286">пласта β*.</text><line class="ia" x1="170" y1="314" x2="170" y2="334"/><path class="iah" d="M170 340 l-6 -9 h12 z"/><rect class="i-node" x="12" y="344" width="316" height="102" rx="6"/><text class="it" x="24" y="376">Коэффициент</text><text class="it" x="24" y="402">пьезопроводности: скорость</text><text class="it" x="24" y="428">выравнивания давления</text><line class="ia" x1="170" y1="450" x2="170" y2="470"/><path class="iah" d="M170 476 l-6 -9 h12 z"/><rect class="i-out" x="12" y="480" width="316" height="128" rx="6"/><text class="ih" x="24" y="512">Вывод</text><text class="it" x="24" y="538">Коэффициент</text><text class="it" x="24" y="564">пьезопроводности κ в</text><text class="it" x="24" y="590">единицах L²/T (м²/с).</text><rect class="i-out" x="12" y="614" width="316" height="128" rx="6"/><text class="ih" x="24" y="646">Вывод</text><text class="it" x="24" y="672">Оценка того, как быстро</text><text class="it" x="24" y="698">выравнивается давление в</text><text class="it" x="24" y="724">пласте.</text><rect class="i-warn" x="12" y="748" width="316" height="154" rx="6"/><text class="ih" x="24" y="780">Где ломается</text><text class="it" x="24" y="806">Размерность не</text><text class="it" x="24" y="832">подтверждает значение κ.</text><text class="it" x="24" y="858">Точность κ зависит от</text><text class="it" x="24" y="884">точности k, μ и β*.</text><rect class="i-warn" x="12" y="908" width="316" height="180" rx="6"/><text class="ih" x="24" y="940">Где ломается</text><text class="it" x="24" y="966">Диапазон 0,1–5 м²/с</text><text class="it" x="24" y="992">относится к наиболее</text><text class="it" x="24" y="1018">частым значениям. Другие</text><text class="it" x="24" y="1044">пласты могут дать иные</text><text class="it" x="24" y="1070">значения.</text><rect x="249" y="1106" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1127">схема</text></svg>