<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 922" role="img" aria-label="Схема шага «Накопление массы выражается через β*»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Накопление массы выражается через β*»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Изменение давления во</text><text class="it" x="24" y="96">времени в точке пласта, то</text><text class="it" x="24" y="122">есть ∂p/∂t.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Коэффициент упругоёмкости</text><text class="it" x="24" y="230">пласта β* и начальная</text><text class="it" x="24" y="256">плотность ρ0.</text><line class="ia" x1="170" y1="284" x2="170" y2="304"/><path class="iah" d="M170 310 l-6 -9 h12 z"/><rect class="i-node" x="12" y="314" width="316" height="76" rx="6"/><text class="it" x="24" y="346">Накопление массы</text><text class="it" x="24" y="372">выражается через β*</text><line class="ia" x1="170" y1="394" x2="170" y2="414"/><path class="iah" d="M170 420 l-6 -9 h12 z"/><rect class="i-out" x="12" y="424" width="316" height="128" rx="6"/><text class="ih" x="24" y="456">Вывод</text><text class="it" x="24" y="482">Скорость изменения</text><text class="it" x="24" y="508">накопленной массы жидкости</text><text class="it" x="24" y="534">в порах, ∂(m·ρ)/∂t.</text><rect class="i-warn" x="12" y="558" width="316" height="310" rx="6"/><text class="ih" x="24" y="590">Где ломается</text><text class="it" x="24" y="616">Результат получен после</text><text class="it" x="24" y="642">отбрасывания малого</text><text class="it" x="24" y="668">слагаемого; при большом</text><text class="it" x="24" y="694">сжатии вид не действует</text><text class="it" x="24" y="720">(шаг 21 «Почему</text><text class="it" x="24" y="746">квадратичное слагаемое</text><text class="it" x="24" y="772">отбрасывают», шаг 26</text><text class="it" x="24" y="798">«Когда уравнение</text><text class="it" x="24" y="824">пьезопроводности</text><text class="it" x="24" y="850">неприменимо»).</text><rect x="249" y="886" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="907">схема</text></svg>