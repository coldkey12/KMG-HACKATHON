<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 818" role="img" aria-label="Схема шага «Где уравнение перестаёт работать»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Где уравнение перестаёт работать»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Давление в точке пласта и</text><text class="it" x="24" y="96">начальное давление: по ним</text><text class="it" x="24" y="122">считают отклонение</text><text class="it" x="24" y="148">давления от начального.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Коэффициент объёмной</text><text class="it" x="24" y="256">упругости жидкости: по</text><text class="it" x="24" y="282">нему оценивают, мала ли</text><text class="it" x="24" y="308">сжимаемость.</text><line class="ia" x1="170" y1="336" x2="170" y2="356"/><path class="iah" d="M170 362 l-6 -9 h12 z"/><rect class="i-node" x="12" y="366" width="316" height="76" rx="6"/><text class="it" x="24" y="398">Где уравнение перестаёт</text><text class="it" x="24" y="424">работать</text><line class="ia" x1="170" y1="446" x2="170" y2="466"/><path class="iah" d="M170 472 l-6 -9 h12 z"/><rect class="i-out" x="12" y="476" width="316" height="154" rx="6"/><text class="ih" x="24" y="508">Вывод</text><text class="it" x="24" y="534">Линейное уравнение</text><text class="it" x="24" y="560">пьезопроводности (23.16)</text><text class="it" x="24" y="586">как рабочая модель, если</text><text class="it" x="24" y="612">условие выполнено.</text><rect class="i-warn" x="12" y="636" width="316" height="128" rx="6"/><text class="ih" x="24" y="668">Где ломается</text><text class="it" x="24" y="694">Если условие не выполнено,</text><text class="it" x="24" y="720">линейная модель нарушается</text><text class="it" x="24" y="746">и нужна нелинейная.</text><rect x="249" y="782" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="803">схема</text></svg>