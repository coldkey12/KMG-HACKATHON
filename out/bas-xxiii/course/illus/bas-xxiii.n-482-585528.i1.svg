<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 982" role="img" aria-label="Схема шага «Начальные и граничные условия»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Начальные и граничные условия»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Давление во всём пласте в</text><text class="it" x="24" y="96">начальный момент (p_к).</text><rect class="i-in" x="12" y="120" width="316" height="128" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Давление на галерее после</text><text class="it" x="24" y="204">пуска (p_г), записанное</text><text class="it" x="24" y="230">при t &gt; 0.</text><rect class="i-in" x="12" y="254" width="316" height="102" rx="6"/><text class="ih" x="24" y="286">Вход</text><text class="it" x="24" y="312">Давление вдали от галереи</text><text class="it" x="24" y="338">(p_к) при любом t ≥ 0.</text><line class="ia" x1="170" y1="366" x2="170" y2="386"/><path class="iah" d="M170 392 l-6 -9 h12 z"/><rect class="i-node" x="12" y="396" width="316" height="76" rx="6"/><text class="it" x="24" y="428">Начальные и граничные</text><text class="it" x="24" y="454">условия</text><line class="ia" x1="170" y1="476" x2="170" y2="496"/><path class="iah" d="M170 502 l-6 -9 h12 z"/><rect class="i-out" x="12" y="506" width="316" height="128" rx="6"/><text class="ih" x="24" y="538">Вывод</text><text class="it" x="24" y="564">Искомые функции: давление</text><text class="it" x="24" y="590">p(x, t) и дебит галереи</text><text class="it" x="24" y="616">Q(t).</text><rect class="i-warn" x="12" y="640" width="316" height="154" rx="6"/><text class="ih" x="24" y="672">Где ломается</text><text class="it" x="24" y="698">Условие на галерее</text><text class="it" x="24" y="724">записано только для t &gt; 0,</text><text class="it" x="24" y="750">поэтому при t = 0 его</text><text class="it" x="24" y="776">нельзя применить напрямую.</text><rect class="i-warn" x="12" y="800" width="316" height="128" rx="6"/><text class="ih" x="24" y="832">Где ломается</text><text class="it" x="24" y="858">Реальный пласт может не</text><text class="it" x="24" y="884">иметь удалённой границы с</text><text class="it" x="24" y="910">постоянным давлением.</text><rect x="249" y="946" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="967">схема</text></svg>