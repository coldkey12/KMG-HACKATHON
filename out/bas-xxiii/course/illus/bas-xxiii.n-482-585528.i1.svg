<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1168" role="img" aria-label="Схема шага «Начальные и граничные условия задачи»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Начальные и граничные условия задачи»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Давление пласта до пуска</text><text class="it" x="24" y="96">галереи: в начальный</text><text class="it" x="24" y="122">момент оно равно p_κ.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Давление на галерее при t</text><text class="it" x="24" y="230">&gt; 0: по условию оно равно</text><text class="it" x="24" y="256">p_τ.</text><rect class="i-in" x="12" y="280" width="316" height="128" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Давление вдали от галереи</text><text class="it" x="24" y="364">при t ≥ 0: по условию оно</text><text class="it" x="24" y="390">равно p_κ.</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Начальные и граничные</text><text class="it" x="24" y="506">условия задачи</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="128" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Функция p(x, t): давление</text><text class="it" x="24" y="642">в любой точке и в любой</text><text class="it" x="24" y="668">момент времени.</text><rect class="i-out" x="12" y="692" width="316" height="102" rx="6"/><text class="ih" x="24" y="724">Вывод</text><text class="it" x="24" y="750">Дебит галереи Q(t): ищется</text><text class="it" x="24" y="776">вместе с давлением.</text><rect class="i-warn" x="12" y="800" width="316" height="154" rx="6"/><text class="ih" x="24" y="832">Где ломается</text><text class="it" x="24" y="858">Если давление на галерее в</text><text class="it" x="24" y="884">реальности не постоянно,</text><text class="it" x="24" y="910">условие p = p_τ не</text><text class="it" x="24" y="936">отражает данные.</text><rect class="i-warn" x="12" y="960" width="316" height="154" rx="6"/><text class="ih" x="24" y="992">Где ломается</text><text class="it" x="24" y="1018">Граничное значение на</text><text class="it" x="24" y="1044">галерее задано только для</text><text class="it" x="24" y="1070">t &gt; 0. Замер в момент t =</text><text class="it" x="24" y="1096">0 это условие не задаёт.</text><rect x="249" y="1132" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1153">схема</text></svg>