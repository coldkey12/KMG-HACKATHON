<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1082" role="img" aria-label="Схема шага «Как уравнение давления сводится к одной переменной»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Как уравнение давления сводится к одной переменной»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Профили давления P(x, t),</text><text class="it" x="24" y="96">полученные измерением или</text><text class="it" x="24" y="122">расчётом в нескольких</text><text class="it" x="24" y="148">точках x и в разные</text><text class="it" x="24" y="174">моменты t.</text><rect class="i-in" x="12" y="198" width="316" height="128" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Значение коэффициента</text><text class="it" x="24" y="282">пьезопроводности κ для</text><text class="it" x="24" y="308">пласта.</text><line class="ia" x1="170" y1="336" x2="170" y2="356"/><path class="iah" d="M170 362 l-6 -9 h12 z"/><rect class="i-node" x="12" y="366" width="316" height="102" rx="6"/><text class="it" x="24" y="398">Как уравнение давления</text><text class="it" x="24" y="424">сводится к одной</text><text class="it" x="24" y="450">переменной</text><line class="ia" x1="170" y1="472" x2="170" y2="492"/><path class="iah" d="M170 498 l-6 -9 h12 z"/><rect class="i-out" x="12" y="502" width="316" height="180" rx="6"/><text class="ih" x="24" y="534">Вывод</text><text class="it" x="24" y="560">Если процесс</text><text class="it" x="24" y="586">автомодельный, профили в</text><text class="it" x="24" y="612">разные t совпадают при</text><text class="it" x="24" y="638">перестроении по u =</text><text class="it" x="24" y="664">x/(2√(κt)).</text><rect class="i-warn" x="12" y="688" width="316" height="180" rx="6"/><text class="ih" x="24" y="720">Где ломается</text><text class="it" x="24" y="746">Если профили не совпадают</text><text class="it" x="24" y="772">при перестроении по u,</text><text class="it" x="24" y="798">одна переменная не</text><text class="it" x="24" y="824">описывает процесс. Замена</text><text class="it" x="24" y="850">не работает.</text><rect class="i-warn" x="12" y="874" width="316" height="154" rx="6"/><text class="ih" x="24" y="906">Где ломается</text><text class="it" x="24" y="932">Шум в данных искажает</text><text class="it" x="24" y="958">наклон профиля, поэтому</text><text class="it" x="24" y="984">производные по u</text><text class="it" x="24" y="1010">оцениваются с ошибкой.</text><rect x="249" y="1046" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1067">схема</text></svg>