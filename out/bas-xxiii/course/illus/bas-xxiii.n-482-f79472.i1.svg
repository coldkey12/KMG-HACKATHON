<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1004" role="img" aria-label="Схема шага «Одна переменная вместо x и t»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Одна переменная вместо x и t»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Координата x, время t с</text><text class="it" x="24" y="96">начала пуска и коэффициент</text><text class="it" x="24" y="122">пьезопроводности κ.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Начальное давление p_κ и</text><text class="it" x="24" y="230">давление на галерее p_г,</text><text class="it" x="24" y="256">по которым строится P.</text><line class="ia" x1="170" y1="284" x2="170" y2="304"/><path class="iah" d="M170 310 l-6 -9 h12 z"/><rect class="i-node" x="12" y="314" width="316" height="76" rx="6"/><text class="it" x="24" y="346">Одна переменная вместо x и</text><text class="it" x="24" y="372">t</text><line class="ia" x1="170" y1="394" x2="170" y2="414"/><path class="iah" d="M170 420 l-6 -9 h12 z"/><rect class="i-out" x="12" y="424" width="316" height="206" rx="6"/><text class="ih" x="24" y="456">Вывод</text><text class="it" x="24" y="482">Безразмерное давление P</text><text class="it" x="24" y="508">как функция одной</text><text class="it" x="24" y="534">переменной u = x/(2√(κt)).</text><text class="it" x="24" y="560">Значения при разных t</text><text class="it" x="24" y="586">должны ложиться на одну</text><text class="it" x="24" y="612">кривую.</text><rect class="i-warn" x="12" y="636" width="316" height="128" rx="6"/><text class="ih" x="24" y="668">Где ломается</text><text class="it" x="24" y="694">Если граничное давление</text><text class="it" x="24" y="720">меняется во времени, одной</text><text class="it" x="24" y="746">кривой по u не получить.</text><rect class="i-warn" x="12" y="770" width="316" height="180" rx="6"/><text class="ih" x="24" y="802">Где ломается</text><text class="it" x="24" y="828">Если κ меняется из-за</text><text class="it" x="24" y="854">изменения давления или</text><text class="it" x="24" y="880">проницаемости, комплекс</text><text class="it" x="24" y="906">перестаёт быть постоянным</text><text class="it" x="24" y="932">коэффициентом.</text><rect x="249" y="968" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="989">схема</text></svg>