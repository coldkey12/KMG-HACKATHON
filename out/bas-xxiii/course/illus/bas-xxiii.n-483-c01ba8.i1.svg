<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1142" role="img" aria-label="Схема шага «Как выглядит падение давления в пласте»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Как выглядит падение давления в пласте»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Расстояние x от галереи и</text><text class="it" x="24" y="96">момент времени t после</text><text class="it" x="24" y="122">пуска.</text><rect class="i-in" x="12" y="146" width="316" height="102" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Забойное давление p_г и</text><text class="it" x="24" y="230">контурное давление p_к.</text><rect class="i-in" x="12" y="254" width="316" height="102" rx="6"/><text class="ih" x="24" y="286">Вход</text><text class="it" x="24" y="312">Коэффициент</text><text class="it" x="24" y="338">пьезопроводности κ.</text><line class="ia" x1="170" y1="366" x2="170" y2="386"/><path class="iah" d="M170 392 l-6 -9 h12 z"/><rect class="i-node" x="12" y="396" width="316" height="76" rx="6"/><text class="it" x="24" y="428">Как выглядит падение</text><text class="it" x="24" y="454">давления в пласте</text><line class="ia" x1="170" y1="476" x2="170" y2="496"/><path class="iah" d="M170 502 l-6 -9 h12 z"/><rect class="i-out" x="12" y="506" width="316" height="128" rx="6"/><text class="ih" x="24" y="538">Вывод</text><text class="it" x="24" y="564">Давление p в точке x в</text><text class="it" x="24" y="590">момент t по формуле</text><text class="it" x="24" y="616">(23.27).</text><rect class="i-out" x="12" y="640" width="316" height="154" rx="6"/><text class="ih" x="24" y="672">Вывод</text><text class="it" x="24" y="698">Семейство кривых p(x) при</text><text class="it" x="24" y="724">разных t, которые можно</text><text class="it" x="24" y="750">сравнить по положению</text><text class="it" x="24" y="776">фронта.</text><rect class="i-warn" x="12" y="800" width="316" height="154" rx="6"/><text class="ih" x="24" y="832">Где ломается</text><text class="it" x="24" y="858">Формула относится к</text><text class="it" x="24" y="884">постоянному забойному</text><text class="it" x="24" y="910">давлению; при другом</text><text class="it" x="24" y="936">условии она не подходит.</text><rect class="i-warn" x="12" y="960" width="316" height="128" rx="6"/><text class="ih" x="24" y="992">Где ломается</text><text class="it" x="24" y="1018">Упругая жидкость — условие</text><text class="it" x="24" y="1044">модели; реальные данные</text><text class="it" x="24" y="1070">могут не совпасть с ним.</text><rect x="249" y="1106" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1127">схема</text></svg>