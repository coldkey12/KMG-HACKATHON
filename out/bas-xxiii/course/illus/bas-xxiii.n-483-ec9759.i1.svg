<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 900" role="img" aria-label="Схема шага «Решаем уравнение через подстановку ξ»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Решаем уравнение через подстановку ξ»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Уравнение для давления по</text><text class="it" x="24" y="96">автомодельной переменной</text><text class="it" x="24" y="122">u, записанное как (23.23).</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Условия (23.21), которые</text><text class="it" x="24" y="230">нужны, чтобы найти</text><text class="it" x="24" y="256">постоянную C₁.</text><line class="ia" x1="170" y1="284" x2="170" y2="304"/><path class="iah" d="M170 310 l-6 -9 h12 z"/><rect class="i-node" x="12" y="314" width="316" height="76" rx="6"/><text class="it" x="24" y="346">Решаем уравнение через</text><text class="it" x="24" y="372">подстановку ξ</text><line class="ia" x1="170" y1="394" x2="170" y2="414"/><path class="iah" d="M170 420 l-6 -9 h12 z"/><rect class="i-out" x="12" y="424" width="316" height="128" rx="6"/><text class="ih" x="24" y="456">Вывод</text><text class="it" x="24" y="482">Семейство решений ξ(u) =</text><text class="it" x="24" y="508">C₁·e^(−u²), где C₁ пока не</text><text class="it" x="24" y="534">определена.</text><rect class="i-warn" x="12" y="558" width="316" height="154" rx="6"/><text class="ih" x="24" y="590">Где ломается</text><text class="it" x="24" y="616">Без условий задачи</text><text class="it" x="24" y="642">постоянная C₁ остаётся</text><text class="it" x="24" y="668">неизвестной, и решение не</text><text class="it" x="24" y="694">выбрано однозначно.</text><rect class="i-warn" x="12" y="718" width="316" height="128" rx="6"/><text class="ih" x="24" y="750">Где ломается</text><text class="it" x="24" y="776">Деление на ξ теряет</text><text class="it" x="24" y="802">решения, где ξ равна нулю.</text><text class="it" x="24" y="828">Это проверяют отдельно.</text><rect x="249" y="864" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="885">схема</text></svg>