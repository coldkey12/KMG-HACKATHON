<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1112" role="img" aria-label="Схема шага «Дебит галереи падает со временем»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Дебит галереи падает со временем»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Перепад давления p_k − p_r</text><text class="it" x="24" y="96">на галерее и время t после</text><text class="it" x="24" y="122">пуска.</text><rect class="i-in" x="12" y="146" width="316" height="154" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Коэффициент</text><text class="it" x="24" y="230">пьезопроводности κ,</text><text class="it" x="24" y="256">отношение k/μ, ширина B и</text><text class="it" x="24" y="282">толщина h пласта.</text><line class="ia" x1="170" y1="310" x2="170" y2="330"/><path class="iah" d="M170 336 l-6 -9 h12 z"/><rect class="i-node" x="12" y="340" width="316" height="76" rx="6"/><text class="it" x="24" y="372">Дебит галереи падает со</text><text class="it" x="24" y="398">временем</text><line class="ia" x1="170" y1="420" x2="170" y2="440"/><path class="iah" d="M170 446 l-6 -9 h12 z"/><rect class="i-out" x="12" y="450" width="316" height="102" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Дебит Q(t), который падает</text><text class="it" x="24" y="534">как 1/√t.</text><rect class="i-out" x="12" y="558" width="316" height="180" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Для данных: при больших t</text><text class="it" x="24" y="642">зависимость Q от 1/√t</text><text class="it" x="24" y="668">должна быть близка к</text><text class="it" x="24" y="694">прямой через начало</text><text class="it" x="24" y="720">координат.</text><rect class="i-warn" x="12" y="744" width="316" height="154" rx="6"/><text class="ih" x="24" y="776">Где ломается</text><text class="it" x="24" y="802">При t = 0 формула даёт</text><text class="it" x="24" y="828">бесконечность, поэтому</text><text class="it" x="24" y="854">самые ранние точки нельзя</text><text class="it" x="24" y="880">описывать ею напрямую.</text><rect class="i-warn" x="12" y="904" width="316" height="154" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Реальные кривые на</text><text class="it" x="24" y="988">начальном участке могут</text><text class="it" x="24" y="1014">отклоняться от идеального</text><text class="it" x="24" y="1040">скачка давления.</text><rect x="249" y="1076" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1097">схема</text></svg>