<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1138" role="img" aria-label="Схема шага «Дебит галереи по закону Дарси»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Дебит галереи по закону Дарси»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Давление на галерее p_г и</text><text class="it" x="24" y="96">начальное пластовое</text><text class="it" x="24" y="122">давление p_к — величины,</text><text class="it" x="24" y="148">от которых зависит дебит.</text><rect class="i-in" x="12" y="172" width="316" height="180" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Проницаемость k, вязкость</text><text class="it" x="24" y="256">μ, коэффициент</text><text class="it" x="24" y="282">пьезопроводности κ, ширина</text><text class="it" x="24" y="308">B и толщина h пласта,</text><text class="it" x="24" y="334">время t.</text><rect class="i-in" x="12" y="358" width="316" height="180" rx="6"/><text class="ih" x="24" y="390">Вход</text><text class="it" x="24" y="416">Измеренные в скважинах</text><text class="it" x="24" y="442">дебиты и давления для</text><text class="it" x="24" y="468">сравнения с формулой; их</text><text class="it" x="24" y="494">качество в главе не</text><text class="it" x="24" y="520">обсуждается.</text><line class="ia" x1="170" y1="548" x2="170" y2="568"/><path class="iah" d="M170 574 l-6 -9 h12 z"/><rect class="i-node" x="12" y="578" width="316" height="76" rx="6"/><text class="it" x="24" y="610">Дебит галереи по закону</text><text class="it" x="24" y="636">Дарси</text><line class="ia" x1="170" y1="658" x2="170" y2="678"/><path class="iah" d="M170 684 l-6 -9 h12 z"/><rect class="i-out" x="12" y="688" width="316" height="102" rx="6"/><text class="ih" x="24" y="720">Вывод</text><text class="it" x="24" y="746">Дебит галереи Q(t) для</text><text class="it" x="24" y="772">заданного момента времени.</text><rect class="i-warn" x="12" y="796" width="316" height="154" rx="6"/><text class="ih" x="24" y="828">Где ломается</text><text class="it" x="24" y="854">Формула верна при</text><text class="it" x="24" y="880">постоянных k и μ,</text><text class="it" x="24" y="906">однофазном потоке и</text><text class="it" x="24" y="932">слабосжимаемой жидкости.</text><rect class="i-warn" x="12" y="956" width="316" height="128" rx="6"/><text class="ih" x="24" y="988">Где ломается</text><text class="it" x="24" y="1014">Если давление на галерее</text><text class="it" x="24" y="1040">не постоянно, формула по</text><text class="it" x="24" y="1066">этому узлу не применима.</text><rect x="249" y="1102" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1123">схема</text></svg>