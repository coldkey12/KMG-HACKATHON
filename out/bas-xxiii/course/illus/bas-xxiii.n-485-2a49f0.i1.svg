<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 900" role="img" aria-label="Схема шага «Накопленная добыча растёт как корень из времени»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Накопленная добыча растёт как корень из времени»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Дебит галереи Q(t) во</text><text class="it" x="24" y="96">времени при постоянном</text><text class="it" x="24" y="122">давлении на галерее.</text><rect class="i-in" x="12" y="146" width="316" height="102" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Параметры пласта: k, μ, B,</text><text class="it" x="24" y="230">h, κ и перепад p_к − p_г.</text><line class="ia" x1="170" y1="258" x2="170" y2="278"/><path class="iah" d="M170 284 l-6 -9 h12 z"/><rect class="i-node" x="12" y="288" width="316" height="76" rx="6"/><text class="it" x="24" y="320">Накопленная добыча растёт</text><text class="it" x="24" y="346">как корень из времени</text><line class="ia" x1="170" y1="368" x2="170" y2="388"/><path class="iah" d="M170 394 l-6 -9 h12 z"/><rect class="i-out" x="12" y="398" width="316" height="154" rx="6"/><text class="ih" x="24" y="430">Вывод</text><text class="it" x="24" y="456">Накопленный объём добытой</text><text class="it" x="24" y="482">жидкости V_доб(t),</text><text class="it" x="24" y="508">растущий пропорционально</text><text class="it" x="24" y="534">√t.</text><rect class="i-warn" x="12" y="558" width="316" height="154" rx="6"/><text class="ih" x="24" y="590">Где ломается</text><text class="it" x="24" y="616">Расчёт верен для</text><text class="it" x="24" y="642">постоянного давления на</text><text class="it" x="24" y="668">галерее; при другом режиме</text><text class="it" x="24" y="694">кривая может быть другой.</text><rect class="i-warn" x="12" y="718" width="316" height="128" rx="6"/><text class="ih" x="24" y="750">Где ломается</text><text class="it" x="24" y="776">Реальный дебит измеряется</text><text class="it" x="24" y="802">с погрешностью; формула</text><text class="it" x="24" y="828">даёт гладкую кривую.</text><rect x="249" y="864" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="885">схема</text></svg>