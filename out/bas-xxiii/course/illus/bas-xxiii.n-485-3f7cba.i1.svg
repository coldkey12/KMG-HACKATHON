<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1272" role="img" aria-label="Схема шага «Галерея с постоянным дебитом»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Галерея с постоянным дебитом»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Постоянный объёмный дебит</text><text class="it" x="24" y="96">Q галереи, заданный как</text><text class="it" x="24" y="122">условие после пуска.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Начальное контурное</text><text class="it" x="24" y="230">давление p_к во всём</text><text class="it" x="24" y="256">пласте.</text><rect class="i-in" x="12" y="280" width="316" height="154" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Проницаемость k и вязкость</text><text class="it" x="24" y="364">μ, входящие через</text><text class="it" x="24" y="390">отношение k/μ в условие на</text><text class="it" x="24" y="416">галерее.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Галерея с постоянным</text><text class="it" x="24" y="532">дебитом</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="154" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Давление p(x,t) в любой</text><text class="it" x="24" y="668">точке пласта и в любой</text><text class="it" x="24" y="694">момент времени — искомый</text><text class="it" x="24" y="720">результат.</text><rect class="i-out" x="12" y="744" width="316" height="154" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Давление на галерее в</text><text class="it" x="24" y="828">момент t не задано</text><text class="it" x="24" y="854">заранее. Оно получается из</text><text class="it" x="24" y="880">решения.</text><rect class="i-warn" x="12" y="904" width="316" height="154" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Условия работают только</text><text class="it" x="24" y="988">при t &gt; 0. До пуска</text><text class="it" x="24" y="1014">давление во всём пласте</text><text class="it" x="24" y="1040">одинаково.</text><rect class="i-warn" x="12" y="1064" width="316" height="154" rx="6"/><text class="ih" x="24" y="1096">Где ломается</text><text class="it" x="24" y="1122">Вывод сделан для</text><text class="it" x="24" y="1148">полубесконечного пласта.</text><text class="it" x="24" y="1174">Конечный пласт в этом узле</text><text class="it" x="24" y="1200">не рассматривается.</text><rect x="249" y="1236" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1257">схема</text></svg>