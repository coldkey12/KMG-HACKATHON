<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1004" role="img" aria-label="Схема шага «Уравнение для скорости фильтрации»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Уравнение для скорости фильтрации»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Поле давления p(x, t)</text><text class="it" x="24" y="96">вдоль пласта в разные</text><text class="it" x="24" y="122">моменты времени — вход</text><text class="it" x="24" y="148">вывода.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Коэффициент</text><text class="it" x="24" y="256">пьезопроводности κ и</text><text class="it" x="24" y="282">отношение k/μ.</text><line class="ia" x1="170" y1="310" x2="170" y2="330"/><path class="iah" d="M170 336 l-6 -9 h12 z"/><rect class="i-node" x="12" y="340" width="316" height="76" rx="6"/><text class="it" x="24" y="372">Уравнение для скорости</text><text class="it" x="24" y="398">фильтрации</text><line class="ia" x1="170" y1="420" x2="170" y2="440"/><path class="iah" d="M170 446 l-6 -9 h12 z"/><rect class="i-out" x="12" y="450" width="316" height="154" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Поле скорости фильтрации</text><text class="it" x="24" y="534">w(x, t) = (k/μ)·∂p/∂x,</text><text class="it" x="24" y="560">которое подчиняется</text><text class="it" x="24" y="586">уравнению (23.33).</text><rect class="i-warn" x="12" y="610" width="316" height="154" rx="6"/><text class="ih" x="24" y="642">Где ломается</text><text class="it" x="24" y="668">Вывод верен, если κ</text><text class="it" x="24" y="694">постоянен по x и t. Иначе</text><text class="it" x="24" y="720">вынос κ за знак</text><text class="it" x="24" y="746">производной не годится.</text><rect class="i-warn" x="12" y="770" width="316" height="180" rx="6"/><text class="ih" x="24" y="802">Где ломается</text><text class="it" x="24" y="828">Для нелинейного уравнения</text><text class="it" x="24" y="854">(см. шаг 23 «Где уравнение</text><text class="it" x="24" y="880">перестаёт работать») вид</text><text class="it" x="24" y="906">уравнения для w может не</text><text class="it" x="24" y="932">сохраниться.</text><rect x="249" y="968" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="989">схема</text></svg>