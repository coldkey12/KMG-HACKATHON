<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1164" role="img" aria-label="Схема шага «Общий вид решения для скорости»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Общий вид решения для скорости»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Начальное условие w(x,0)=0</text><text class="it" x="24" y="96">и граничное условие</text><text class="it" x="24" y="122">w(0,t)=w_1 у галереи.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Коэффициент</text><text class="it" x="24" y="230">пьезопроводности κ,</text><text class="it" x="24" y="256">входящий в аргумент erf.</text><rect class="i-in" x="12" y="280" width="316" height="154" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Ряды измеренной скорости</text><text class="it" x="24" y="364">фильтрации по времени и по</text><text class="it" x="24" y="390">расстоянию, если их</text><text class="it" x="24" y="416">удаётся получить.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Общий вид решения для</text><text class="it" x="24" y="532">скорости</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="180" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Общий вид w(x,t) с двумя</text><text class="it" x="24" y="668">постоянными C1 и C2;</text><text class="it" x="24" y="694">конкретный профиль</text><text class="it" x="24" y="720">появляется после</text><text class="it" x="24" y="746">подстановки условий.</text><rect class="i-warn" x="12" y="770" width="316" height="180" rx="6"/><text class="ih" x="24" y="802">Где ломается</text><text class="it" x="24" y="828">Вид решения выбран по</text><text class="it" x="24" y="854">аналогии с уравнением</text><text class="it" x="24" y="880">теплопроводности; при</text><text class="it" x="24" y="906">других условиях или среде</text><text class="it" x="24" y="932">форма может не подойти.</text><rect class="i-warn" x="12" y="956" width="316" height="154" rx="6"/><text class="ih" x="24" y="988">Где ломается</text><text class="it" x="24" y="1014">Без условий и данных о</text><text class="it" x="24" y="1040">скорости C1 и C2 не</text><text class="it" x="24" y="1066">определены, и модель не</text><text class="it" x="24" y="1092">даёт числового ответа.</text><rect x="249" y="1128" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1149">схема</text></svg>