<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1116" role="img" aria-label="Схема шага «Константы и профиль скорости»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Константы и профиль скорости»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">постоянная скорость w1 на</text><text class="it" x="24" y="96">галерее</text><rect class="i-in" x="12" y="120" width="316" height="76" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">координата x и время t</text><rect class="i-in" x="12" y="202" width="316" height="154" rx="6"/><text class="ih" x="24" y="234">Вход</text><text class="it" x="24" y="260">коэффициент</text><text class="it" x="24" y="286">пьезопроводности κ,</text><text class="it" x="24" y="312">проницаемость k и вязкость</text><text class="it" x="24" y="338">μ</text><line class="ia" x1="170" y1="366" x2="170" y2="386"/><path class="iah" d="M170 392 l-6 -9 h12 z"/><rect class="i-node" x="12" y="396" width="316" height="76" rx="6"/><text class="it" x="24" y="428">Константы и профиль</text><text class="it" x="24" y="454">скорости</text><line class="ia" x1="170" y1="476" x2="170" y2="496"/><path class="iah" d="M170 502 l-6 -9 h12 z"/><rect class="i-out" x="12" y="506" width="316" height="128" rx="6"/><text class="ih" x="24" y="538">Вывод</text><text class="it" x="24" y="564">профиль скорости</text><text class="it" x="24" y="590">фильтрации w(x,t) по</text><text class="it" x="24" y="616">формуле (23.35)</text><rect class="i-out" x="12" y="640" width="316" height="128" rx="6"/><text class="ih" x="24" y="672">Вывод</text><text class="it" x="24" y="698">производная давления по x,</text><text class="it" x="24" y="724">найденная через закон</text><text class="it" x="24" y="750">Дарси</text><rect class="i-warn" x="12" y="774" width="316" height="128" rx="6"/><text class="ih" x="24" y="806">Где ломается</text><text class="it" x="24" y="832">Если условие на галерее</text><text class="it" x="24" y="858">другое, константы и</text><text class="it" x="24" y="884">профиль будут другими.</text><rect class="i-warn" x="12" y="908" width="316" height="154" rx="6"/><text class="ih" x="24" y="940">Где ломается</text><text class="it" x="24" y="966">Скорость обычно не</text><text class="it" x="24" y="992">измеряют напрямую, поэтому</text><text class="it" x="24" y="1018">профиль нужно сверять с</text><text class="it" x="24" y="1044">данными о давлении.</text><rect x="249" y="1080" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1101">схема</text></svg>