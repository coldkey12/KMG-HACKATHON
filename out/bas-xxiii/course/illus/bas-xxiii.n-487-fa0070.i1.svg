<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1324" role="img" aria-label="Схема шага «Давление у галереи падает как √t»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Давление у галереи падает как √t»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Давление на галерее</text><text class="it" x="24" y="96">p_r(t), измеренное в</text><text class="it" x="24" y="122">разные моменты времени</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Постоянный дебит Q или</text><text class="it" x="24" y="230">постоянная скорость w_1 на</text><text class="it" x="24" y="256">галерее</text><rect class="i-in" x="12" y="280" width="316" height="154" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Вязкость μ, проницаемость</text><text class="it" x="24" y="364">k, коэффициент</text><text class="it" x="24" y="390">пьезопроводности κ,</text><text class="it" x="24" y="416">размеры B и h</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Давление у галереи падает</text><text class="it" x="24" y="532">как √t</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="180" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Падение p_k − p_r(t)</text><text class="it" x="24" y="668">растёт пропорционально √t;</text><text class="it" x="24" y="694">на графике против √t это</text><text class="it" x="24" y="720">прямая через начало</text><text class="it" x="24" y="746">координат.</text><rect class="i-out" x="12" y="770" width="316" height="154" rx="6"/><text class="ih" x="24" y="802">Вывод</text><text class="it" x="24" y="828">По наклону такой прямой</text><text class="it" x="24" y="854">можно оценить κ или k/μ,</text><text class="it" x="24" y="880">если остальные величины</text><text class="it" x="24" y="906">известны.</text><rect class="i-warn" x="12" y="930" width="316" height="154" rx="6"/><text class="ih" x="24" y="962">Где ломается</text><text class="it" x="24" y="988">Формула выведена для</text><text class="it" x="24" y="1014">постоянной w_1; при</text><text class="it" x="24" y="1040">переменном отборе она не</text><text class="it" x="24" y="1066">применима.</text><rect class="i-warn" x="12" y="1090" width="316" height="180" rx="6"/><text class="ih" x="24" y="1122">Где ломается</text><text class="it" x="24" y="1148">Аналитическая формула —</text><text class="it" x="24" y="1174">эталон; реальные замеры</text><text class="it" x="24" y="1200">давления содержат шум и</text><text class="it" x="24" y="1226">требуют отдельной</text><text class="it" x="24" y="1252">проверки.</text><rect x="249" y="1288" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1309">схема</text></svg>