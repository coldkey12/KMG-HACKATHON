<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1034" role="img" aria-label="Схема шага «Давление на галерее падает как √t»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Давление на галерее падает как √t»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Дебит галереи Q</text><text class="it" x="24" y="96">(постоянный)</text><rect class="i-in" x="12" y="120" width="316" height="128" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Вязкость μ, проницаемость</text><text class="it" x="24" y="204">k, коэффициент</text><text class="it" x="24" y="230">пьезопроводности κ</text><rect class="i-in" x="12" y="254" width="316" height="102" rx="6"/><text class="ih" x="24" y="286">Вход</text><text class="it" x="24" y="312">Ширина B и толщина h</text><text class="it" x="24" y="338">пласта</text><line class="ia" x1="170" y1="366" x2="170" y2="386"/><path class="iah" d="M170 392 l-6 -9 h12 z"/><rect class="i-node" x="12" y="396" width="316" height="76" rx="6"/><text class="it" x="24" y="428">Давление на галерее падает</text><text class="it" x="24" y="454">как √t</text><line class="ia" x1="170" y1="476" x2="170" y2="496"/><path class="iah" d="M170 502 l-6 -9 h12 z"/><rect class="i-out" x="12" y="506" width="316" height="154" rx="6"/><text class="ih" x="24" y="538">Вывод</text><text class="it" x="24" y="564">Давление на галерее как</text><text class="it" x="24" y="590">функция √t: график p</text><text class="it" x="24" y="616">против √t ближе к прямой</text><text class="it" x="24" y="642">линии</text><rect class="i-warn" x="12" y="666" width="316" height="180" rx="6"/><text class="ih" x="24" y="698">Где ломается</text><text class="it" x="24" y="724">Формула получена для</text><text class="it" x="24" y="750">предела x → ∞; в точке</text><text class="it" x="24" y="776">рядом с галереей результат</text><text class="it" x="24" y="802">может отличаться от</text><text class="it" x="24" y="828">измерения</text><rect class="i-warn" x="12" y="852" width="316" height="128" rx="6"/><text class="ih" x="24" y="884">Где ломается</text><text class="it" x="24" y="910">Если в расчёте взять k</text><text class="it" x="24" y="936">вместо κ под корнем,</text><text class="it" x="24" y="962">единицы не сходятся</text><rect x="249" y="998" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1019">схема</text></svg>