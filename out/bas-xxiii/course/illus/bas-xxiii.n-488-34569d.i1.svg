<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1220" role="img" aria-label="Схема шага «Условия: постоянный дебит скважины»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Условия: постоянный дебит скважины»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Постоянный дебит Q_0 из</text><text class="it" x="24" y="96">скважины при t &gt; 0.</text><rect class="i-in" x="12" y="120" width="316" height="154" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Контурное давление p_к:</text><text class="it" x="24" y="204">начальное давление во всём</text><text class="it" x="24" y="230">пласте и давление на</text><text class="it" x="24" y="256">удалении.</text><rect class="i-in" x="12" y="280" width="316" height="154" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Проницаемость k, вязкость</text><text class="it" x="24" y="364">μ и толщина пласта h</text><text class="it" x="24" y="390">входят в условие на</text><text class="it" x="24" y="416">скважине.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Условия: постоянный дебит</text><text class="it" x="24" y="532">скважины</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="128" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Давление p(r, t) в любой</text><text class="it" x="24" y="668">точке пласта и в любой</text><text class="it" x="24" y="694">момент времени.</text><rect class="i-out" x="12" y="718" width="316" height="128" rx="6"/><text class="ih" x="24" y="750">Вывод</text><text class="it" x="24" y="776">Граница возмущённой зоны —</text><text class="it" x="24" y="802">радиус, где давление равно</text><text class="it" x="24" y="828">контурному.</text><rect class="i-warn" x="12" y="852" width="316" height="154" rx="6"/><text class="ih" x="24" y="884">Где ломается</text><text class="it" x="24" y="910">Условие на бесконечности</text><text class="it" x="24" y="936">задаёт пласт без края;</text><text class="it" x="24" y="962">реальный пласт может иметь</text><text class="it" x="24" y="988">границу.</text><rect class="i-warn" x="12" y="1012" width="316" height="154" rx="6"/><text class="ih" x="24" y="1044">Где ломается</text><text class="it" x="24" y="1070">Условие при r = 0</text><text class="it" x="24" y="1096">относится к точке;</text><text class="it" x="24" y="1122">реальная скважина имеет</text><text class="it" x="24" y="1148">конечный радиус.</text><rect x="249" y="1184" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1205">схема</text></svg>