<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1034" role="img" aria-label="Схема шага «Логарифмическое приближение и его точность»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Логарифмическое приближение и его точность»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Радиус r и время t: из них</text><text class="it" x="24" y="96">считается x = r²/(4κt).</text><rect class="i-in" x="12" y="120" width="316" height="180" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Коэффициент</text><text class="it" x="24" y="204">пьезопроводности κ,</text><text class="it" x="24" y="230">связанный с</text><text class="it" x="24" y="256">проницаемостью, вязкостью</text><text class="it" x="24" y="282">и упругоёмкостью пласта.</text><line class="ia" x1="170" y1="310" x2="170" y2="330"/><path class="iah" d="M170 336 l-6 -9 h12 z"/><rect class="i-node" x="12" y="340" width="316" height="76" rx="6"/><text class="it" x="24" y="372">Логарифмическое</text><text class="it" x="24" y="398">приближение и его точность</text><line class="ia" x1="170" y1="420" x2="170" y2="440"/><path class="iah" d="M170 446 l-6 -9 h12 z"/><rect class="i-out" x="12" y="450" width="316" height="128" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Давление p(r,t) по формуле</text><text class="it" x="24" y="534">(23.53) в точке r в момент</text><text class="it" x="24" y="560">t.</text><rect class="i-out" x="12" y="584" width="316" height="128" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Оценка того, можно ли</text><text class="it" x="24" y="668">использовать логарифм, по</text><text class="it" x="24" y="694">порогу x.</text><rect class="i-warn" x="12" y="718" width="316" height="128" rx="6"/><text class="ih" x="24" y="750">Где ломается</text><text class="it" x="24" y="776">При x больше порога</text><text class="it" x="24" y="802">погрешность растёт; книга</text><text class="it" x="24" y="828">даёт 9,7 % при x ≤ 0,14.</text><rect class="i-warn" x="12" y="852" width="316" height="128" rx="6"/><text class="ih" x="24" y="884">Где ломается</text><text class="it" x="24" y="910">Порог r²/(4κt) ≤ 1 в</text><text class="it" x="24" y="936">тексте не подтверждён</text><text class="it" x="24" y="962">указанными погрешностями.</text><rect x="249" y="998" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1019">схема</text></svg>