<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 978" role="img" aria-label="Схема шага «Скважина не точка: насколько это важно»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Скважина не точка: насколько это важно»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Коэффициент</text><text class="it" x="24" y="96">пьезопроводности κ (м²/с)</text><text class="it" x="24" y="122">и радиус скважины r_c (м):</text><text class="it" x="24" y="148">из них считается f0.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Время t после пуска</text><text class="it" x="24" y="256">скважины (с): f0 =</text><text class="it" x="24" y="282">κt/r_c², то есть t =</text><text class="it" x="24" y="308">f0·r_c²/κ.</text><line class="ia" x1="170" y1="336" x2="170" y2="356"/><path class="iah" d="M170 362 l-6 -9 h12 z"/><rect class="i-node" x="12" y="366" width="316" height="76" rx="6"/><text class="it" x="24" y="398">Скважина не точка:</text><text class="it" x="24" y="424">насколько это важно</text><line class="ia" x1="170" y1="446" x2="170" y2="466"/><path class="iah" d="M170 472 l-6 -9 h12 z"/><rect class="i-out" x="12" y="476" width="316" height="128" rx="6"/><text class="ih" x="24" y="508">Вывод</text><text class="it" x="24" y="534">Оценка погрешности формулы</text><text class="it" x="24" y="560">(23.52) в процентах для</text><text class="it" x="24" y="586">заданного f0.</text><rect class="i-warn" x="12" y="610" width="316" height="154" rx="6"/><text class="ih" x="24" y="642">Где ломается</text><text class="it" x="24" y="668">При малых f0 (ранний</text><text class="it" x="24" y="694">период) погрешность</text><text class="it" x="24" y="720">растёт: по книге 9,4% при</text><text class="it" x="24" y="746">f0 = 5.</text><rect class="i-warn" x="12" y="770" width="316" height="154" rx="6"/><text class="ih" x="24" y="802">Где ломается</text><text class="it" x="24" y="828">Значения погрешности</text><text class="it" x="24" y="854">получены сравнением</text><text class="it" x="24" y="880">расчётов, а не измерениями</text><text class="it" x="24" y="906">на скважинах.</text><rect x="249" y="942" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="963">схема</text></svg>