<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1246" role="img" aria-label="Схема шага «У скважины поток быстро стационарен»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «У скважины поток быстро стационарен»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Дебит скважины Q_0 (символ</text><text class="it" x="24" y="96">в формуле стационарной</text><text class="it" x="24" y="122">скорости).</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Расстояние r от оси</text><text class="it" x="24" y="230">скважины и толщина пласта</text><text class="it" x="24" y="256">h.</text><rect class="i-in" x="12" y="280" width="316" height="154" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Время t после пуска и</text><text class="it" x="24" y="364">коэффициент</text><text class="it" x="24" y="390">пьезопроводности κ; важно</text><text class="it" x="24" y="416">их отношение к r².</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">У скважины поток быстро</text><text class="it" x="24" y="532">стационарен</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="102" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Скорость фильтрации w(r,</text><text class="it" x="24" y="668">t) по формуле (23.55).</text><rect class="i-out" x="12" y="692" width="316" height="154" rx="6"/><text class="ih" x="24" y="724">Вывод</text><text class="it" x="24" y="750">Стационарная скорость</text><text class="it" x="24" y="776">Q_0/(2πrh), к которой w</text><text class="it" x="24" y="802">приближается вблизи</text><text class="it" x="24" y="828">скважины.</text><rect class="i-warn" x="12" y="852" width="316" height="154" rx="6"/><text class="ih" x="24" y="884">Где ломается</text><text class="it" x="24" y="910">Вдали от скважины или при</text><text class="it" x="24" y="936">малом κ множитель далёк от</text><text class="it" x="24" y="962">единицы, и скорость</text><text class="it" x="24" y="988">зависит от времени.</text><rect class="i-warn" x="12" y="1012" width="316" height="180" rx="6"/><text class="ih" x="24" y="1044">Где ломается</text><text class="it" x="24" y="1070">Формулы выведены для</text><text class="it" x="24" y="1096">постоянного дебита. При</text><text class="it" x="24" y="1122">переменном дебите</text><text class="it" x="24" y="1148">стационарная оценка может</text><text class="it" x="24" y="1174">не работать.</text><rect x="249" y="1210" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1231">схема</text></svg>