<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1272" role="img" aria-label="Схема шага «Как меняются кривые давления у скважины»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Как меняются кривые давления у скважины»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Постоянный дебит Q₀,</text><text class="it" x="24" y="96">вязкость μ, проницаемость</text><text class="it" x="24" y="122">k и толщина пласта h как</text><text class="it" x="24" y="148">параметры режима и пласта.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Давление на забое во</text><text class="it" x="24" y="256">времени при работе</text><text class="it" x="24" y="282">скважины.</text><rect class="i-in" x="12" y="306" width="316" height="154" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Давления в нескольких</text><text class="it" x="24" y="390">точках на разных</text><text class="it" x="24" y="416">расстояниях от скважины в</text><text class="it" x="24" y="442">один момент времени.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Как меняются кривые</text><text class="it" x="24" y="558">давления у скважины</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="154" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Логарифмическая форма</text><text class="it" x="24" y="694">кривой p(r) вблизи</text><text class="it" x="24" y="720">скважины для точек, где r²</text><text class="it" x="24" y="746">≤ 0,03 · 4κt.</text><rect class="i-out" x="12" y="770" width="316" height="128" rx="6"/><text class="ih" x="24" y="802">Вывод</text><text class="it" x="24" y="828">Наклон кривой у забоя,</text><text class="it" x="24" y="854">одинаковый для записей в</text><text class="it" x="24" y="880">разные моменты времени.</text><rect class="i-warn" x="12" y="904" width="316" height="180" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Вне области r² ≤ 0,03 ·</text><text class="it" x="24" y="988">4κt градиент может</text><text class="it" x="24" y="1014">зависеть от времени, и</text><text class="it" x="24" y="1040">логарифмическая форма не</text><text class="it" x="24" y="1066">работает.</text><rect class="i-warn" x="12" y="1090" width="316" height="128" rx="6"/><text class="ih" x="24" y="1122">Где ломается</text><text class="it" x="24" y="1148">Если дебит меняется,</text><text class="it" x="24" y="1174">описанная картина не</text><text class="it" x="24" y="1200">сохраняется.</text><rect x="249" y="1236" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1257">схема</text></svg>