<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1302" role="img" aria-label="Схема шага «Пьезометрические кривые вокруг скважины»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Пьезометрические кривые вокруг скважины»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Постоянный дебит Q₀</text><text class="it" x="24" y="96">скважины</text><rect class="i-in" x="12" y="120" width="316" height="128" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Вязкость μ, коэффициент</text><text class="it" x="24" y="204">проницаемости k, толщина</text><text class="it" x="24" y="230">пласта h</text><rect class="i-in" x="12" y="254" width="316" height="128" rx="6"/><text class="ih" x="24" y="286">Вход</text><text class="it" x="24" y="312">Расстояние r от скважины и</text><text class="it" x="24" y="338">момент t для проверки</text><text class="it" x="24" y="364">условия r² ≤ 0,03·4κt</text><line class="ia" x1="170" y1="392" x2="170" y2="412"/><path class="iah" d="M170 418 l-6 -9 h12 z"/><rect class="i-node" x="12" y="422" width="316" height="76" rx="6"/><text class="it" x="24" y="454">Пьезометрические кривые</text><text class="it" x="24" y="480">вокруг скважины</text><line class="ia" x1="170" y1="502" x2="170" y2="522"/><path class="iah" d="M170 528 l-6 -9 h12 z"/><rect class="i-out" x="12" y="532" width="316" height="154" rx="6"/><text class="ih" x="24" y="564">Вывод</text><text class="it" x="24" y="590">Кривая давления p(r)</text><text class="it" x="24" y="616">вблизи скважины для</text><text class="it" x="24" y="642">нескольких моментов</text><text class="it" x="24" y="668">времени</text><rect class="i-out" x="12" y="692" width="316" height="128" rx="6"/><text class="ih" x="24" y="724">Вывод</text><text class="it" x="24" y="750">Градиент у забоя,</text><text class="it" x="24" y="776">одинаковый для всех</text><text class="it" x="24" y="802">моментов времени</text><rect class="i-out" x="12" y="826" width="316" height="102" rx="6"/><text class="ih" x="24" y="858">Вывод</text><text class="it" x="24" y="884">Давление на забое со</text><text class="it" x="24" y="910">временем падает</text><rect class="i-warn" x="12" y="934" width="316" height="154" rx="6"/><text class="ih" x="24" y="966">Где ломается</text><text class="it" x="24" y="992">Логарифмическая форма</text><text class="it" x="24" y="1018">описана только для точек</text><text class="it" x="24" y="1044">вблизи забоя, при r² ≤</text><text class="it" x="24" y="1070">0,03·4κt</text><rect class="i-warn" x="12" y="1094" width="316" height="154" rx="6"/><text class="ih" x="24" y="1126">Где ломается</text><text class="it" x="24" y="1152">Если записать градиент без</text><text class="it" x="24" y="1178">h, размерность не</text><text class="it" x="24" y="1204">сходится: получится Па, а</text><text class="it" x="24" y="1230">не Па/м</text><rect x="249" y="1266" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1287">схема</text></svg>