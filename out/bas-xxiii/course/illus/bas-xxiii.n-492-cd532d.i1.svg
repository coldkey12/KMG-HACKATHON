<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1216" role="img" aria-label="Схема шага «Пласт не бесконечен: пороги Fo»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Пласт не бесконечен: пороги Fo»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="206" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Время после пуска,</text><text class="it" x="24" y="96">коэффициент</text><text class="it" x="24" y="122">пьезопроводности и радиус</text><text class="it" x="24" y="148">контура Rк. Из них считают</text><text class="it" x="24" y="174">Fo (данные берутся из</text><text class="it" x="24" y="200">модели пласта).</text><rect class="i-in" x="12" y="224" width="316" height="154" rx="6"/><text class="ih" x="24" y="256">Вход</text><text class="it" x="24" y="282">Радиус скважины rc и</text><text class="it" x="24" y="308">радиус точки r. Они нужны</text><text class="it" x="24" y="334">для условий r ≤ 0,1 Rк и</text><text class="it" x="24" y="360">Rк ≥ 10⁵ rc.</text><line class="ia" x1="170" y1="388" x2="170" y2="408"/><path class="iah" d="M170 414 l-6 -9 h12 z"/><rect class="i-node" x="12" y="418" width="316" height="76" rx="6"/><text class="it" x="24" y="450">Пласт не бесконечен:</text><text class="it" x="24" y="476">пороги Fo</text><line class="ia" x1="170" y1="498" x2="170" y2="518"/><path class="iah" d="M170 524 l-6 -9 h12 z"/><rect class="i-out" x="12" y="528" width="316" height="180" rx="6"/><text class="ih" x="24" y="560">Вывод</text><text class="it" x="24" y="586">Оценка: можно ли брать</text><text class="it" x="24" y="612">формулу для бесконечного</text><text class="it" x="24" y="638">пласта и какая погрешность</text><text class="it" x="24" y="664">ожидается для забоя: до</text><text class="it" x="24" y="690">0,08%, 1% или 1,9%.</text><rect class="i-out" x="12" y="714" width="316" height="128" rx="6"/><text class="ih" x="24" y="746">Вывод</text><text class="it" x="24" y="772">Для точки в пласта оценка</text><text class="it" x="24" y="798">до 0,2% при выполнении</text><text class="it" x="24" y="824">трёх условий.</text><rect class="i-warn" x="12" y="848" width="316" height="180" rx="6"/><text class="ih" x="24" y="880">Где ломается</text><text class="it" x="24" y="906">Fo близко к порогу,</text><text class="it" x="24" y="932">например между 0,2 и 0,35.</text><text class="it" x="24" y="958">Какой уровень погрешности</text><text class="it" x="24" y="984">брать, решает специалист,</text><text class="it" x="24" y="1010">книга выбора не делает.</text><rect class="i-warn" x="12" y="1034" width="316" height="128" rx="6"/><text class="ih" x="24" y="1066">Где ломается</text><text class="it" x="24" y="1092">Для точки около границы,</text><text class="it" x="24" y="1118">при r больше 0,1 Rк, порог</text><text class="it" x="24" y="1144">0,2% не применим.</text><rect x="249" y="1180" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1201">схема</text></svg>