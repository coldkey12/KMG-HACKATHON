<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1060" role="img" aria-label="Схема шага «Две зоны и движущаяся граница»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Две зоны и движущаяся граница»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Начальное пластовое</text><text class="it" x="24" y="96">давление, заданное как</text><text class="it" x="24" y="122">контурное для</text><text class="it" x="24" y="148">невозмущенной области.</text><rect class="i-in" x="12" y="172" width="316" height="76" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Граничные условия задачи.</text><rect class="i-in" x="12" y="254" width="316" height="154" rx="6"/><text class="ih" x="24" y="286">Вход</text><text class="it" x="24" y="312">Давление в скважине во</text><text class="it" x="24" y="338">времени: вход для проверки</text><text class="it" x="24" y="364">модели (в главе не</text><text class="it" x="24" y="390">описано).</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Две зоны и движущаяся</text><text class="it" x="24" y="506">граница</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="128" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Положение подвижной</text><text class="it" x="24" y="642">границы во времени, то</text><text class="it" x="24" y="668">есть закон её движения.</text><rect class="i-warn" x="12" y="692" width="316" height="180" rx="6"/><text class="ih" x="24" y="724">Где ломается</text><text class="it" x="24" y="750">Когда граница достигает</text><text class="it" x="24" y="776">естественной границы</text><text class="it" x="24" y="802">пласта, нужна вторая фаза.</text><text class="it" x="24" y="828">Для бесконечного пласта её</text><text class="it" x="24" y="854">не рассматривают.</text><rect class="i-warn" x="12" y="878" width="316" height="128" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Резкая граница между</text><text class="it" x="24" y="962">областями — упрощение</text><text class="it" x="24" y="988">модели, а не наблюдение.</text><rect x="249" y="1024" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1045">схема</text></svg>