<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1272" role="img" aria-label="Схема шага «Две области: возмущённая и невозмущённая»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Две области: возмущённая и невозмущённая»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Давление у стенки</text><text class="it" x="24" y="96">скважины, с которого</text><text class="it" x="24" y="122">начинается возмущённая</text><text class="it" x="24" y="148">область.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Начальное контурное</text><text class="it" x="24" y="256">давление, которое имеет</text><text class="it" x="24" y="282">невозмущённая область.</text><rect class="i-in" x="12" y="306" width="316" height="154" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Уравнение материального</text><text class="it" x="24" y="390">баланса и граничные</text><text class="it" x="24" y="416">условия, по которым</text><text class="it" x="24" y="442">находят границу.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Две области: возмущённая и</text><text class="it" x="24" y="558">невозмущённая</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="128" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Положение подвижной</text><text class="it" x="24" y="694">границы в каждый момент</text><text class="it" x="24" y="720">времени.</text><rect class="i-out" x="12" y="744" width="316" height="154" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Распределение давления в</text><text class="it" x="24" y="828">возмущённой области по</text><text class="it" x="24" y="854">закону установившегося</text><text class="it" x="24" y="880">движения.</text><rect class="i-warn" x="12" y="904" width="316" height="128" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Граница условная: прямо по</text><text class="it" x="24" y="988">измерениям её не видно, её</text><text class="it" x="24" y="1014">можно только рассчитать.</text><rect class="i-warn" x="12" y="1038" width="316" height="180" rx="6"/><text class="ih" x="24" y="1070">Где ломается</text><text class="it" x="24" y="1096">Допущение установившегося</text><text class="it" x="24" y="1122">движения в возмущённой</text><text class="it" x="24" y="1148">области — упрощение. Где</text><text class="it" x="24" y="1174">оно не выполняется, расчёт</text><text class="it" x="24" y="1200">границы будет неточным.</text><rect x="249" y="1236" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1257">схема</text></svg>