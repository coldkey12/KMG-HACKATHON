<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1272" role="img" aria-label="Схема шага «Баланс запаса в возмущенной зоне»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Баланс запаса в возмущенной зоне»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Давление на галерее p_г(t)</text><text class="it" x="24" y="96">и начальное давление p_к.</text><text class="it" x="24" y="122">Их разность задаёт перепад</text><text class="it" x="24" y="148">давления.</text><rect class="i-in" x="12" y="172" width="316" height="102" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Дебит галереи Q. В балансе</text><text class="it" x="24" y="256">он стоит как добыча за dt.</text><rect class="i-in" x="12" y="280" width="316" height="154" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Размеры пласта B и h и</text><text class="it" x="24" y="364">коэффициент упругоемкости</text><text class="it" x="24" y="390">β*. Они входят в объём</text><text class="it" x="24" y="416">зоны и в баланс.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Баланс запаса в</text><text class="it" x="24" y="532">возмущенной зоне</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="154" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Связь Qμl(t)/(2kBh) = (p_к</text><text class="it" x="24" y="668">− p_г)/2 между дебитом,</text><text class="it" x="24" y="694">длиной зоны и перепадом</text><text class="it" x="24" y="720">давления.</text><rect class="i-out" x="12" y="744" width="316" height="128" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Среднее падение давления</text><text class="it" x="24" y="828">Δp = (p_к − p_г)/2 для</text><text class="it" x="24" y="854">расчёта упругого запаса.</text><rect class="i-warn" x="12" y="878" width="316" height="154" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Если давление в зоне не</text><text class="it" x="24" y="962">линейное, среднее давление</text><text class="it" x="24" y="988">и связь (24.5) будут</text><text class="it" x="24" y="1014">другими.</text><rect class="i-warn" x="12" y="1038" width="316" height="180" rx="6"/><text class="ih" x="24" y="1070">Где ломается</text><text class="it" x="24" y="1096">Δp меняется со временем,</text><text class="it" x="24" y="1122">поэтому его нельзя</text><text class="it" x="24" y="1148">выносить из-под</text><text class="it" x="24" y="1174">производной вместе с</text><text class="it" x="24" y="1200">постоянным объёмом.</text><rect x="249" y="1236" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1257">схема</text></svg>