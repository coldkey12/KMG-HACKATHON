<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1064" role="img" aria-label="Схема шага «ПССС для галереи: линейный профиль»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «ПССС для галереи: линейный профиль»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Дебит галереи Q (по</text><text class="it" x="24" y="96">условию постоянен).</text><rect class="i-in" x="12" y="120" width="316" height="102" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Толщина h и ширина B</text><text class="it" x="24" y="204">пласта.</text><rect class="i-in" x="12" y="228" width="316" height="128" rx="6"/><text class="ih" x="24" y="260">Вход</text><text class="it" x="24" y="286">Начальное давление p_к (до</text><text class="it" x="24" y="312">пуска одинаково во всём</text><text class="it" x="24" y="338">пласте).</text><line class="ia" x1="170" y1="366" x2="170" y2="386"/><path class="iah" d="M170 392 l-6 -9 h12 z"/><rect class="i-node" x="12" y="396" width="316" height="76" rx="6"/><text class="it" x="24" y="428">ПССС для галереи: линейный</text><text class="it" x="24" y="454">профиль</text><line class="ia" x1="170" y1="476" x2="170" y2="496"/><path class="iah" d="M170 502 l-6 -9 h12 z"/><rect class="i-out" x="12" y="506" width="316" height="102" rx="6"/><text class="ih" x="24" y="538">Вывод</text><text class="it" x="24" y="564">Давление p(x, t) внутри</text><text class="it" x="24" y="590">зоны 0 ≤ x ≤ l(t).</text><rect class="i-out" x="12" y="614" width="316" height="128" rx="6"/><text class="ih" x="24" y="646">Вывод</text><text class="it" x="24" y="672">Граница зоны l(t)</text><text class="it" x="24" y="698">неизвестна; её ищут</text><text class="it" x="24" y="724">отдельным расчётом.</text><rect class="i-warn" x="12" y="748" width="316" height="102" rx="6"/><text class="ih" x="24" y="780">Где ломается</text><text class="it" x="24" y="806">Вне отрезка 0 ≤ x ≤ l(t)</text><text class="it" x="24" y="832">формула не работает.</text><rect class="i-warn" x="12" y="856" width="316" height="154" rx="6"/><text class="ih" x="24" y="888">Где ломается</text><text class="it" x="24" y="914">Если распределение в зоне</text><text class="it" x="24" y="940">не установилось, линейный</text><text class="it" x="24" y="966">профиль не даст точной</text><text class="it" x="24" y="992">картины.</text><rect x="249" y="1028" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1049">схема</text></svg>