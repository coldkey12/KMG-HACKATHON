<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1038" role="img" aria-label="Схема шага «Галерея с постоянным дебитом по методу ПССС»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Галерея с постоянным дебитом по методу ПССС»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="76" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">постоянный дебит Q галереи</text><rect class="i-in" x="12" y="94" width="316" height="102" rx="6"/><text class="ih" x="24" y="126">Вход</text><text class="it" x="24" y="152">толщина h и ширина B</text><text class="it" x="24" y="178">пласта</text><rect class="i-in" x="12" y="202" width="316" height="102" rx="6"/><text class="ih" x="24" y="234">Вход</text><text class="it" x="24" y="260">вязкость μ и проницаемость</text><text class="it" x="24" y="286">k</text><line class="ia" x1="170" y1="314" x2="170" y2="334"/><path class="iah" d="M170 340 l-6 -9 h12 z"/><rect class="i-node" x="12" y="344" width="316" height="76" rx="6"/><text class="it" x="24" y="376">Галерея с постоянным</text><text class="it" x="24" y="402">дебитом по методу ПССС</text><line class="ia" x1="170" y1="424" x2="170" y2="444"/><path class="iah" d="M170 450 l-6 -9 h12 z"/><rect class="i-out" x="12" y="454" width="316" height="154" rx="6"/><text class="ih" x="24" y="486">Вывод</text><text class="it" x="24" y="512">при известном l(t) —</text><text class="it" x="24" y="538">линейный профиль давления</text><text class="it" x="24" y="564">p(x,t) внутри зоны 0 ≤ x ≤</text><text class="it" x="24" y="590">l(t)</text><rect class="i-out" x="12" y="614" width="316" height="128" rx="6"/><text class="ih" x="24" y="646">Вывод</text><text class="it" x="24" y="672">искомая функция l(t) —</text><text class="it" x="24" y="698">положение внешней границы</text><text class="it" x="24" y="724">зоны</text><rect class="i-warn" x="12" y="748" width="316" height="128" rx="6"/><text class="ih" x="24" y="780">Где ломается</text><text class="it" x="24" y="806">профиль линейный только по</text><text class="it" x="24" y="832">допущению установившегося</text><text class="it" x="24" y="858">распределения</text><rect class="i-warn" x="12" y="882" width="316" height="102" rx="6"/><text class="ih" x="24" y="914">Где ломается</text><text class="it" x="24" y="940">формула записана только</text><text class="it" x="24" y="966">для 0 ≤ x ≤ l(t)</text><rect x="249" y="1002" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1023">схема</text></svg>