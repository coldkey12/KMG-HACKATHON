<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1112" role="img" aria-label="Схема шага «Граница возмущённой зоны растёт как √(2κt)»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Граница возмущённой зоны растёт как √(2κt)»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Дебит галереи Q, принятый</text><text class="it" x="24" y="96">постоянным (условие</text><text class="it" x="24" y="122">вывода).</text><rect class="i-in" x="12" y="146" width="316" height="154" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Коэффициент κ = k/(μβ*):</text><text class="it" x="24" y="230">проницаемость, вязкость и</text><text class="it" x="24" y="256">коэффициент упругоёмкости</text><text class="it" x="24" y="282">пласта.</text><rect class="i-in" x="12" y="306" width="316" height="102" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Время t после пуска</text><text class="it" x="24" y="390">галереи.</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Граница возмущённой зоны</text><text class="it" x="24" y="506">растёт как √(2κt)</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="128" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Длина l(t) внешней границы</text><text class="it" x="24" y="642">возмущённой области в</text><text class="it" x="24" y="668">любой момент времени.</text><rect class="i-warn" x="12" y="692" width="316" height="154" rx="6"/><text class="ih" x="24" y="724">Где ломается</text><text class="it" x="24" y="750">Если дебит меняется во</text><text class="it" x="24" y="776">времени, закон √(2κt) не</text><text class="it" x="24" y="802">применим: формула выведена</text><text class="it" x="24" y="828">для Q = const.</text><rect class="i-warn" x="12" y="852" width="316" height="206" rx="6"/><text class="ih" x="24" y="884">Где ломается</text><text class="it" x="24" y="910">Если проницаемость или</text><text class="it" x="24" y="936">упругоёмкость меняются с</text><text class="it" x="24" y="962">давлением, κ перестаёт</text><text class="it" x="24" y="988">быть постоянной. Этот</text><text class="it" x="24" y="1014">случай здесь не</text><text class="it" x="24" y="1040">разбирается.</text><rect x="249" y="1076" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1097">схема</text></svg>