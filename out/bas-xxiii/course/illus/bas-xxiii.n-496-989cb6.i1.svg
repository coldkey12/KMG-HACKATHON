<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1168" role="img" aria-label="Схема шага «Приближённый профиль давления: ошибка 25 %»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Приближённый профиль давления: ошибка 25 %»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Дебит галереи Q, который</text><text class="it" x="24" y="96">считается постоянным.</text><rect class="i-in" x="12" y="120" width="316" height="128" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Проницаемость k, вязкость</text><text class="it" x="24" y="204">μ, ширина B и толщина h</text><text class="it" x="24" y="230">пласта.</text><rect class="i-in" x="12" y="254" width="316" height="154" rx="6"/><text class="ih" x="24" y="286">Вход</text><text class="it" x="24" y="312">Коэффициент</text><text class="it" x="24" y="338">пьезопроводности κ и время</text><text class="it" x="24" y="364">t, из которых считается</text><text class="it" x="24" y="390">граница зоны √(2κt).</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Приближённый профиль</text><text class="it" x="24" y="506">давления: ошибка 25 %</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="128" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Давление p(x, t) в точке</text><text class="it" x="24" y="642">x: линейный профиль внутри</text><text class="it" x="24" y="668">зоны и p_k вне её.</text><rect class="i-out" x="12" y="692" width="316" height="154" rx="6"/><text class="ih" x="24" y="724">Вывод</text><text class="it" x="24" y="750">Депрессия на галерее p_k −</text><text class="it" x="24" y="776">p_r по приближённой</text><text class="it" x="24" y="802">формуле с погрешностью 25</text><text class="it" x="24" y="828">%.</text><rect class="i-warn" x="12" y="852" width="316" height="128" rx="6"/><text class="ih" x="24" y="884">Где ломается</text><text class="it" x="24" y="910">Погрешность 25 % относится</text><text class="it" x="24" y="936">к депрессии. Для других</text><text class="it" x="24" y="962">величин данных в узле нет.</text><rect class="i-warn" x="12" y="986" width="316" height="128" rx="6"/><text class="ih" x="24" y="1018">Где ломается</text><text class="it" x="24" y="1044">Если режим отбора не</text><text class="it" x="24" y="1070">постоянный, формула не</text><text class="it" x="24" y="1096">применима.</text><rect x="249" y="1132" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1153">схема</text></svg>