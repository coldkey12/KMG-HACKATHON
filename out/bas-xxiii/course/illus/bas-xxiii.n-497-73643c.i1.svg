<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1138" role="img" aria-label="Схема шага «Скважина с постоянным дебитом: постановка»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Скважина с постоянным дебитом: постановка»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Радиус скважины r_c задан</text><text class="it" x="24" y="96">в постановке; в формулу</text><text class="it" x="24" y="122">(24.10) он напрямую не</text><text class="it" x="24" y="148">входит.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Дебит Q, проницаемость k,</text><text class="it" x="24" y="256">вязкость μ и толщина h</text><text class="it" x="24" y="282">входят в множитель формулы</text><text class="it" x="24" y="308">(24.10).</text><rect class="i-in" x="12" y="332" width="316" height="102" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Начальное давление p_κ и</text><text class="it" x="24" y="416">время t после пуска.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Скважина с постоянным</text><text class="it" x="24" y="532">дебитом: постановка</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="128" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Давление p(r, t) внутри</text><text class="it" x="24" y="668">возмущенной области по</text><text class="it" x="24" y="694">формуле (24.10).</text><rect class="i-out" x="12" y="718" width="316" height="154" rx="6"/><text class="ih" x="24" y="750">Вывод</text><text class="it" x="24" y="776">Граница R(t): она нужна</text><text class="it" x="24" y="802">как результат, но в</text><text class="it" x="24" y="828">постановке задана только</text><text class="it" x="24" y="854">символом.</text><rect class="i-warn" x="12" y="878" width="316" height="206" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Допущение о стационарном</text><text class="it" x="24" y="962">давлении внутри R(t)</text><text class="it" x="24" y="988">принято заранее; если оно</text><text class="it" x="24" y="1014">не выполняется, формула</text><text class="it" x="24" y="1040">(24.10) может давать</text><text class="it" x="24" y="1066">неверную картину.</text><rect x="249" y="1102" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1123">схема</text></svg>