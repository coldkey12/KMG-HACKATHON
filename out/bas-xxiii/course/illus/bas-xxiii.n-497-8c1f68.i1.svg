<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1328" role="img" aria-label="Схема шага «Граница зоны и дебит галереи»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Граница зоны и дебит галереи»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Давления p_к (начальное) и</text><text class="it" x="24" y="96">p_г (забойное) на галерее.</text><rect class="i-in" x="12" y="120" width="316" height="128" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Параметры пласта:</text><text class="it" x="24" y="204">проницаемость, вязкость,</text><text class="it" x="24" y="230">ширина B и толщина h.</text><rect class="i-in" x="12" y="254" width="316" height="206" rx="6"/><text class="ih" x="24" y="286">Вход</text><text class="it" x="24" y="312">Коэффициент</text><text class="it" x="24" y="338">пьезопроводности κ,</text><text class="it" x="24" y="364">выводимый из</text><text class="it" x="24" y="390">проницаемости, вязкости и</text><text class="it" x="24" y="416">упругоемкости (определение</text><text class="it" x="24" y="442">в предыдущих узлах).</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Граница зоны и дебит</text><text class="it" x="24" y="558">галереи</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="102" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Граница зоны l(t) =</text><text class="it" x="24" y="694">2√(κt).</text><rect class="i-out" x="12" y="718" width="316" height="128" rx="6"/><text class="ih" x="24" y="750">Вывод</text><text class="it" x="24" y="776">Профиль давления внутри</text><text class="it" x="24" y="802">зоны и p_к за её</text><text class="it" x="24" y="828">пределами.</text><rect class="i-out" x="12" y="852" width="316" height="102" rx="6"/><text class="ih" x="24" y="884">Вывод</text><text class="it" x="24" y="910">Дебит Q(t), падающий как</text><text class="it" x="24" y="936">1/√t.</text><rect class="i-warn" x="12" y="960" width="316" height="154" rx="6"/><text class="ih" x="24" y="992">Где ломается</text><text class="it" x="24" y="1018">Формулы относятся только к</text><text class="it" x="24" y="1044">зоне 0 &lt; x ≤ 2√(κt). За её</text><text class="it" x="24" y="1070">пределами они не</text><text class="it" x="24" y="1096">применимы.</text><rect class="i-warn" x="12" y="1120" width="316" height="154" rx="6"/><text class="ih" x="24" y="1152">Где ломается</text><text class="it" x="24" y="1178">В начальный момент дебит</text><text class="it" x="24" y="1204">по формуле неограничен.</text><text class="it" x="24" y="1230">Данные около пуска этой</text><text class="it" x="24" y="1256">формулой не описываются.</text><rect x="249" y="1292" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1313">схема</text></svg>