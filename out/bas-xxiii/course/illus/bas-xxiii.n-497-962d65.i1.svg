<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1056" role="img" aria-label="Схема шага «Когда приближённый метод точнее»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Когда приближённый метод точнее»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Режим галереи: постоянный</text><text class="it" x="24" y="96">дебит или заданная</text><text class="it" x="24" y="122">постоянная депрессия.</text><rect class="i-in" x="12" y="146" width="316" height="154" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Точная формула для того же</text><text class="it" x="24" y="230">режима и той же величины,</text><text class="it" x="24" y="256">с которой сравнивают</text><text class="it" x="24" y="282">приближение.</text><line class="ia" x1="170" y1="310" x2="170" y2="330"/><path class="iah" d="M170 336 l-6 -9 h12 z"/><rect class="i-node" x="12" y="340" width="316" height="76" rx="6"/><text class="it" x="24" y="372">Когда приближённый метод</text><text class="it" x="24" y="398">точнее</text><line class="ia" x1="170" y1="420" x2="170" y2="440"/><path class="iah" d="M170 446 l-6 -9 h12 z"/><rect class="i-out" x="12" y="450" width="316" height="232" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Погрешность приближённого</text><text class="it" x="24" y="534">результата в процентах:</text><text class="it" x="24" y="560">11% для дебита при</text><text class="it" x="24" y="586">заданной постоянной</text><text class="it" x="24" y="612">депрессии и 25% для</text><text class="it" x="24" y="638">депрессии по формуле</text><text class="it" x="24" y="664">(24.7).</text><rect class="i-warn" x="12" y="688" width="316" height="128" rx="6"/><text class="ih" x="24" y="720">Где ломается</text><text class="it" x="24" y="746">Погрешности разных величин</text><text class="it" x="24" y="772">нельзя ставить на одну</text><text class="it" x="24" y="798">шкалу.</text><rect class="i-warn" x="12" y="822" width="316" height="180" rx="6"/><text class="ih" x="24" y="854">Где ломается</text><text class="it" x="24" y="880">Номера ссылок на точные</text><text class="it" x="24" y="906">формулы (24.39) и (24.8)</text><text class="it" x="24" y="932">стоит сверить по скану.</text><text class="it" x="24" y="958">Иначе неясно, с чем именно</text><text class="it" x="24" y="984">сравнивали.</text><rect x="249" y="1020" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1041">схема</text></svg>