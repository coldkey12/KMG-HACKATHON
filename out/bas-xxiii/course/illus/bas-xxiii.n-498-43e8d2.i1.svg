<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1272" role="img" aria-label="Схема шага «Средневзвешенное давление в воронке»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Средневзвешенное давление в воронке»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Дебит скважины Q, вязкость</text><text class="it" x="24" y="96">μ, проницаемость k и</text><text class="it" x="24" y="122">толщина h — входы итоговой</text><text class="it" x="24" y="148">формулы (24.13).</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Начальное давление p_к и</text><text class="it" x="24" y="256">забойное давление p_c —</text><text class="it" x="24" y="282">входы формулы для среднего</text><text class="it" x="24" y="308">давления.</text><rect class="i-in" x="12" y="332" width="316" height="154" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Радиус скважины r_c и</text><text class="it" x="24" y="416">радиус зоны R(t) —</text><text class="it" x="24" y="442">геометрия возмущённой</text><text class="it" x="24" y="468">области.</text><line class="ia" x1="170" y1="496" x2="170" y2="516"/><path class="iah" d="M170 522 l-6 -9 h12 z"/><rect class="i-node" x="12" y="526" width="316" height="76" rx="6"/><text class="it" x="24" y="558">Средневзвешенное давление</text><text class="it" x="24" y="584">в воронке</text><line class="ia" x1="170" y1="606" x2="170" y2="626"/><path class="iah" d="M170 632 l-6 -9 h12 z"/><rect class="i-out" x="12" y="636" width="316" height="128" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Средний перепад давления</text><text class="it" x="24" y="720">Δp по зоне — величина,</text><text class="it" x="24" y="746">которую вводят в баланс.</text><rect class="i-out" x="12" y="770" width="316" height="128" rx="6"/><text class="ih" x="24" y="802">Вывод</text><text class="it" x="24" y="828">Средневзвешенное давление</text><text class="it" x="24" y="854">p̄ при известных p_к, p_c,</text><text class="it" x="24" y="880">R и r_c.</text><rect class="i-warn" x="12" y="904" width="316" height="180" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Формула для p̄ записана</text><text class="it" x="24" y="988">для установившегося</text><text class="it" x="24" y="1014">плоскорадиального потока.</text><text class="it" x="24" y="1040">В неустановившемся потоке</text><text class="it" x="24" y="1066">условие автора нарушено.</text><rect class="i-warn" x="12" y="1090" width="316" height="128" rx="6"/><text class="ih" x="24" y="1122">Где ломается</text><text class="it" x="24" y="1148">Формула Δp = Qμ/(4πkh) не</text><text class="it" x="24" y="1174">содержит R, поэтому по ней</text><text class="it" x="24" y="1200">нельзя найти радиус зоны.</text><rect x="249" y="1236" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1257">схема</text></svg>