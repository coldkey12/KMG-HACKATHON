<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1220" role="img" aria-label="Схема шага «Радиус воронки давления: √(rc² + 4κt)»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Радиус воронки давления: √(rc² + 4κt)»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Радиус скважины rc и</text><text class="it" x="24" y="96">коэффициент</text><text class="it" x="24" y="122">пьезопроводности κ,</text><text class="it" x="24" y="148">которые задают форму роста</text><text class="it" x="24" y="174">зоны.</text><rect class="i-in" x="12" y="198" width="316" height="102" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Момент времени t после</text><text class="it" x="24" y="282">пуска скважины.</text><rect class="i-in" x="12" y="306" width="316" height="154" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Для давления дополнительно</text><text class="it" x="24" y="390">нужны дебит Q, вязкость μ,</text><text class="it" x="24" y="416">проницаемость k, толщина h</text><text class="it" x="24" y="442">и начальное давление pκ.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Радиус воронки давления:</text><text class="it" x="24" y="558">√(rc² + 4κt)</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="128" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Радиус R(t) возмущённой</text><text class="it" x="24" y="694">зоны, за которым давление</text><text class="it" x="24" y="720">равно начальному.</text><rect class="i-out" x="12" y="744" width="316" height="128" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Давление p(r, t) внутри</text><text class="it" x="24" y="828">зоны, которое ниже</text><text class="it" x="24" y="854">начального.</text><rect class="i-warn" x="12" y="878" width="316" height="154" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">R(t) — расчётная граница</text><text class="it" x="24" y="962">модели; в реальном пласте</text><text class="it" x="24" y="988">граница размыта и её</text><text class="it" x="24" y="1014">трудно увидеть на данных.</text><rect class="i-warn" x="12" y="1038" width="316" height="128" rx="6"/><text class="ih" x="24" y="1070">Где ломается</text><text class="it" x="24" y="1096">Формула (24.15) не годится</text><text class="it" x="24" y="1122">для точек r вне интервала</text><text class="it" x="24" y="1148">от rc до R(t).</text><rect x="249" y="1184" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1205">схема</text></svg>