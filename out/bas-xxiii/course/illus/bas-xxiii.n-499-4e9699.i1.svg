<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1090" role="img" aria-label="Схема шага «Скважина с постоянным забойным давлением»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Скважина с постоянным забойным давлением»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Давление на забое p_c,</text><text class="it" x="24" y="96">поддержанное постоянным</text><text class="it" x="24" y="122">(условие случая 2).</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Безразмерное время f0 —</text><text class="it" x="24" y="230">аргумент графика рис.</text><text class="it" x="24" y="256">24.3.</text><rect class="i-in" x="12" y="280" width="316" height="128" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Радиус скважины r_c — для</text><text class="it" x="24" y="364">перехода от R(t)/r_c к</text><text class="it" x="24" y="390">радиусу R(t).</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Скважина с постоянным</text><text class="it" x="24" y="506">забойным давлением</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="128" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">R(t)/r_c — безразмерный</text><text class="it" x="24" y="642">радиус возмущённой зоны,</text><text class="it" x="24" y="668">снимается с графика.</text><rect class="i-out" x="12" y="692" width="316" height="102" rx="6"/><text class="ih" x="24" y="724">Вывод</text><text class="it" x="24" y="750">Дебит по формуле Дюпюи</text><text class="it" x="24" y="776">(24.11) при p_c = const.</text><rect class="i-warn" x="12" y="800" width="316" height="128" rx="6"/><text class="ih" x="24" y="832">Где ломается</text><text class="it" x="24" y="858">Точной формулы для границы</text><text class="it" x="24" y="884">в книге нет. Ответ берут с</text><text class="it" x="24" y="910">графика.</text><rect class="i-warn" x="12" y="934" width="316" height="102" rx="6"/><text class="ih" x="24" y="966">Где ломается</text><text class="it" x="24" y="992">Погрешность дебита по</text><text class="it" x="24" y="1018">методу ПССС около 5%.</text><rect x="249" y="1054" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1075">схема</text></svg>