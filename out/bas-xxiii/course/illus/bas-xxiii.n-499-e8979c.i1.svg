<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1354" role="img" aria-label="Схема шага «Давление и депрессия в скважине по ПССС»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Давление и депрессия в скважине по ПССС»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Дебит Q, вязкость μ,</text><text class="it" x="24" y="96">проницаемость k и толщина</text><text class="it" x="24" y="122">h входят в множитель перед</text><text class="it" x="24" y="148">логарифмом.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Радиус скважины r_c и</text><text class="it" x="24" y="256">радиус точки r — аргументы</text><text class="it" x="24" y="282">логарифма.</text><rect class="i-in" x="12" y="306" width="316" height="128" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Время t и коэффициент κ</text><text class="it" x="24" y="390">входят через корень из</text><text class="it" x="24" y="416">r_c² + 4κt.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Давление и депрессия в</text><text class="it" x="24" y="532">скважине по ПССС</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="128" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Давление p(r,t) в точке</text><text class="it" x="24" y="668">пласта на расстоянии r в</text><text class="it" x="24" y="694">момент t.</text><rect class="i-out" x="12" y="718" width="316" height="102" rx="6"/><text class="ih" x="24" y="750">Вывод</text><text class="it" x="24" y="776">Депрессия Δp_c на забое в</text><text class="it" x="24" y="802">момент t.</text><rect class="i-out" x="12" y="826" width="316" height="154" rx="6"/><text class="ih" x="24" y="858">Вывод</text><text class="it" x="24" y="884">Оценка погрешности</text><text class="it" x="24" y="910">приближения относительно</text><text class="it" x="24" y="936">формулы (23.52) для</text><text class="it" x="24" y="962">заданного f0.</text><rect class="i-warn" x="12" y="986" width="316" height="154" rx="6"/><text class="ih" x="24" y="1018">Где ломается</text><text class="it" x="24" y="1044">За границей r &gt; √(r_c² +</text><text class="it" x="24" y="1070">4κt) формула (24.15) не</text><text class="it" x="24" y="1096">действует. Давление равно</text><text class="it" x="24" y="1122">начальному.</text><rect class="i-warn" x="12" y="1146" width="316" height="154" rx="6"/><text class="ih" x="24" y="1178">Где ломается</text><text class="it" x="24" y="1204">При малых f0 погрешность</text><text class="it" x="24" y="1230">больше. В тексте значения</text><text class="it" x="24" y="1256">приведены только для f0 =</text><text class="it" x="24" y="1282">100, 10^3 и 10^4.</text><rect x="249" y="1318" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1339">схема</text></svg>