<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1004" role="img" aria-label="Схема шага «Фации: обстановки внутри дельты»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Фации: обстановки внутри дельты»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Описание пород в разрезе:</text><text class="it" x="24" y="96">состав, размер зёрен,</text><text class="it" x="24" y="122">текстура, цвет.</text><line class="ia" x1="170" y1="150" x2="170" y2="170"/><path class="iah" d="M170 176 l-6 -9 h12 z"/><rect class="i-node" x="12" y="180" width="316" height="76" rx="6"/><text class="it" x="24" y="212">Фации: обстановки внутри</text><text class="it" x="24" y="238">дельты</text><line class="ia" x1="170" y1="260" x2="170" y2="280"/><path class="iah" d="M170 286 l-6 -9 h12 z"/><rect class="i-out" x="12" y="290" width="316" height="206" rx="6"/><text class="ih" x="24" y="322">Вывод</text><text class="it" x="24" y="348">Название фации из типового</text><text class="it" x="24" y="374">списка (протоковая,</text><text class="it" x="24" y="400">прирусловый вал,</text><text class="it" x="24" y="426">межпротоковое понижение,</text><text class="it" x="24" y="452">залив или лагуна,</text><text class="it" x="24" y="478">авандельта).</text><rect class="i-out" x="12" y="502" width="316" height="154" rx="6"/><text class="ih" x="24" y="534">Вывод</text><text class="it" x="24" y="560">Парагенез (фациальная</text><text class="it" x="24" y="586">ассоциация), который</text><text class="it" x="24" y="612">указывает тип дельты и</text><text class="it" x="24" y="638">стадию её развития.</text><rect class="i-warn" x="12" y="662" width="316" height="154" rx="6"/><text class="ih" x="24" y="694">Где ломается</text><text class="it" x="24" y="720">Список типичный</text><text class="it" x="24" y="746">(«обычно»). В другой</text><text class="it" x="24" y="772">дельте набор фаций может</text><text class="it" x="24" y="798">отличаться.</text><rect class="i-warn" x="12" y="822" width="316" height="128" rx="6"/><text class="ih" x="24" y="854">Где ломается</text><text class="it" x="24" y="880">Одна фация не говорит о</text><text class="it" x="24" y="906">типе дельты. Нужен</text><text class="it" x="24" y="932">парагенез.</text><rect x="249" y="968" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="989">схема</text></svg>