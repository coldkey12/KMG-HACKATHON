<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1194" role="img" aria-label="Схема шага «Почему разрезы фронта такие разные»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Почему разрезы фронта такие разные»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Вертикальный разрез фронта</text><text class="it" x="24" y="96">дельты по керну или</text><text class="it" x="24" y="122">каротажу:</text><text class="it" x="24" y="148">последовательность фаций</text><text class="it" x="24" y="174">снизу вверх.</text><rect class="i-in" x="12" y="198" width="316" height="128" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Положение скважины</text><text class="it" x="24" y="282">относительно устья рукава:</text><text class="it" x="24" y="308">близко или далеко.</text><rect class="i-in" x="12" y="332" width="316" height="128" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Оценка режима фронта</text><text class="it" x="24" y="416">дельты и признаки</text><text class="it" x="24" y="442">деформаций в слоях.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Почему разрезы фронта</text><text class="it" x="24" y="558">такие разные</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="154" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Тип разреза фронта:</text><text class="it" x="24" y="694">регрессивный (частый) или</text><text class="it" x="24" y="720">трансгрессивный</text><text class="it" x="24" y="746">(обратный).</text><rect class="i-out" x="12" y="770" width="316" height="102" rx="6"/><text class="ih" x="24" y="802">Вывод</text><text class="it" x="24" y="828">Вывод о геометрии дельты</text><text class="it" x="24" y="854">по набору разрезов.</text><rect class="i-warn" x="12" y="878" width="316" height="128" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Разрез в одной точке не</text><text class="it" x="24" y="962">переносится на другую без</text><text class="it" x="24" y="988">учёта близости к устью.</text><rect class="i-warn" x="12" y="1012" width="316" height="128" rx="6"/><text class="ih" x="24" y="1044">Где ломается</text><text class="it" x="24" y="1070">Разрезы из разных дельт</text><text class="it" x="24" y="1096">нельзя сравнивать напрямую</text><text class="it" x="24" y="1122">без учёта режима фронта.</text><rect x="249" y="1158" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1179">схема</text></svg>