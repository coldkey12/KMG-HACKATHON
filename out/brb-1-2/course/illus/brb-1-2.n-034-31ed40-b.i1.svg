<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1168" role="img" aria-label="Схема шага «Приметы глин залива в керне»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Приметы глин залива в керне»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Описание керна: текстура,</text><text class="it" x="24" y="96">степень переработки</text><text class="it" x="24" y="122">норами, наличие отдельных</text><text class="it" x="24" y="148">участков слоистости.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Список найденной фауны и</text><text class="it" x="24" y="256">растительных остатков с</text><text class="it" x="24" y="282">оценкой их обилия.</text><rect class="i-in" x="12" y="306" width="316" height="102" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Наличие конкреций и</text><text class="it" x="24" y="390">прослоев сидерита.</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Приметы глин залива в</text><text class="it" x="24" y="506">керне</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="154" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Вывод: нижняя часть</text><text class="it" x="24" y="642">разреза — аргиллиты и</text><text class="it" x="24" y="668">алевролиты залива, осевшие</text><text class="it" x="24" y="694">из взвеси.</text><rect class="i-out" x="12" y="718" width="316" height="102" rx="6"/><text class="ih" x="24" y="750">Вывод</text><text class="it" x="24" y="776">Мощность разреза залива по</text><text class="it" x="24" y="802">главе: 4–10 м.</text><rect class="i-warn" x="12" y="826" width="316" height="128" rx="6"/><text class="ih" x="24" y="858">Где ломается</text><text class="it" x="24" y="884">Признаки не обязательны:</text><text class="it" x="24" y="910">слоистость иногда</text><text class="it" x="24" y="936">сохраняется, а иногда нет.</text><rect class="i-warn" x="12" y="960" width="316" height="154" rx="6"/><text class="ih" x="24" y="992">Где ломается</text><text class="it" x="24" y="1018">Если весь разрез</text><text class="it" x="24" y="1044">глинистый, отделить нижнюю</text><text class="it" x="24" y="1070">часть от верхней по керну</text><text class="it" x="24" y="1096">нельзя.</text><rect x="249" y="1132" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1153">схема</text></svg>