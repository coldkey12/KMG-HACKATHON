<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1484" role="img" aria-label="Схема шага «Устьевой бар и питающий канал»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Устьевой бар и питающий канал»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Описание разреза с</text><text class="it" x="24" y="96">размером зерна по глубине:</text><text class="it" x="24" y="122">укрупняется ли зерно</text><text class="it" x="24" y="148">кверху.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Мощность слоёв и наличие</text><text class="it" x="24" y="256">поверхностей размыва и</text><text class="it" x="24" y="282">глинистых прослоев.</text><rect class="i-in" x="12" y="306" width="316" height="206" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Кривые ГИС (геофизические</text><text class="it" x="24" y="390">исследования скважин) по</text><text class="it" x="24" y="416">этому интервалу. Как</text><text class="it" x="24" y="442">именно бар и канал на них</text><text class="it" x="24" y="468">проявятся, текст не</text><text class="it" x="24" y="494">говорит.</text><line class="ia" x1="170" y1="522" x2="170" y2="542"/><path class="iah" d="M170 548 l-6 -9 h12 z"/><rect class="i-node" x="12" y="552" width="316" height="76" rx="6"/><text class="it" x="24" y="584">Устьевой бар и питающий</text><text class="it" x="24" y="610">канал</text><line class="ia" x1="170" y1="632" x2="170" y2="652"/><path class="iah" d="M170 658 l-6 -9 h12 z"/><rect class="i-out" x="12" y="662" width="316" height="180" rx="6"/><text class="ih" x="24" y="694">Вывод</text><text class="it" x="24" y="720">Тип тела: устьевой бар</text><text class="it" x="24" y="746">(укрупнение кверху) или</text><text class="it" x="24" y="772">канал (1–4 м, поверхности</text><text class="it" x="24" y="798">размыва, глинистые</text><text class="it" x="24" y="824">прослои).</text><rect class="i-out" x="12" y="848" width="316" height="128" rx="6"/><text class="ih" x="24" y="880">Вывод</text><text class="it" x="24" y="906">Признаки низкой воды в</text><text class="it" x="24" y="932">канале: следы временных</text><text class="it" x="24" y="958">донных форм и осушение.</text><rect class="i-out" x="12" y="982" width="316" height="128" rx="6"/><text class="ih" x="24" y="1014">Вывод</text><text class="it" x="24" y="1040">Ожидаемая полнота бара:</text><text class="it" x="24" y="1066">верхняя часть может быть</text><text class="it" x="24" y="1092">срезана каналом.</text><rect class="i-warn" x="12" y="1116" width="316" height="154" rx="6"/><text class="ih" x="24" y="1148">Где ломается</text><text class="it" x="24" y="1174">Верхняя часть бара часто</text><text class="it" x="24" y="1200">срезана, поэтому тренд</text><text class="it" x="24" y="1226">укрупнения может</text><text class="it" x="24" y="1252">обрываться.</text><rect class="i-warn" x="12" y="1276" width="316" height="154" rx="6"/><text class="ih" x="24" y="1308">Где ломается</text><text class="it" x="24" y="1334">Укрупнение кверху и срезы</text><text class="it" x="24" y="1360">описаны как «свойственные»</text><text class="it" x="24" y="1386">и «часто», не у каждого</text><text class="it" x="24" y="1412">разреза.</text><rect x="249" y="1448" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1469">схема</text></svg>