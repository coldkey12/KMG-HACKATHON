<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1272" role="img" aria-label="Схема шага «Финал залива: волны, песок, торф»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Финал залива: волны, песок, торф»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Описание разреза: размер</text><text class="it" x="24" y="96">зерна по высоте от подошвы</text><text class="it" x="24" y="122">к кровле.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Наличие палеопочв или</text><text class="it" x="24" y="230">торфа в верхней части</text><text class="it" x="24" y="256">разреза.</text><rect class="i-in" x="12" y="280" width="316" height="128" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Толщина и протяжённость</text><text class="it" x="24" y="364">песчаного слоя между</text><text class="it" x="24" y="390">скважинами.</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Финал залива: волны,</text><text class="it" x="24" y="506">песок, торф</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="180" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Разрез с укрупнением зерна</text><text class="it" x="24" y="642">кверху указывает на</text><text class="it" x="24" y="668">волновую переработку и</text><text class="it" x="24" y="694">миграцию береговых</text><text class="it" x="24" y="720">отмелей.</text><rect class="i-out" x="12" y="744" width="316" height="154" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Широкий песчаный пласт</text><text class="it" x="24" y="828">понимается как итог</text><text class="it" x="24" y="854">слияния многих тонких</text><text class="it" x="24" y="880">слоёв.</text><rect class="i-warn" x="12" y="904" width="316" height="128" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Тонкий невыдержанный слой</text><text class="it" x="24" y="988">может не совпасть между</text><text class="it" x="24" y="1014">соседними скважинами.</text><rect class="i-warn" x="12" y="1038" width="316" height="180" rx="6"/><text class="ih" x="24" y="1070">Где ломается</text><text class="it" x="24" y="1096">Палеопочвы и торф</text><text class="it" x="24" y="1122">встречаются «нередко», а</text><text class="it" x="24" y="1148">не всегда. Их отсутствие</text><text class="it" x="24" y="1174">не доказывает отсутствие</text><text class="it" x="24" y="1200">суши.</text><rect x="249" y="1236" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1257">схема</text></svg>