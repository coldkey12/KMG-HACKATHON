<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1194" role="img" aria-label="Схема шага «Разрез дельтового рукава»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Разрез дельтового рукава»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Фото породы из скважины с</text><text class="it" x="24" y="96">косой слоистостью (Рис.</text><text class="it" x="24" y="122">1.17, Рис. 1.19).</text><rect class="i-in" x="12" y="146" width="316" height="154" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Описание основания</text><text class="it" x="24" y="230">разреза: поверхность</text><text class="it" x="24" y="256">размыва, конгломераты,</text><text class="it" x="24" y="282">растительные остатки.</text><rect class="i-in" x="12" y="306" width="316" height="128" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Мощность и извилистость</text><text class="it" x="24" y="390">песчаного тела в сравнении</text><text class="it" x="24" y="416">с каналом промоины.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="50" rx="6"/><text class="it" x="24" y="506">Разрез дельтового рукава</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="102" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Тип тела: дельтовый рукав</text><text class="it" x="24" y="642">или канал промоины.</text><rect class="i-out" x="12" y="666" width="316" height="128" rx="6"/><text class="ih" x="24" y="698">Вывод</text><text class="it" x="24" y="724">Характер течения:</text><text class="it" x="24" y="750">однонаправленное, с</text><text class="it" x="24" y="776">переменной силой.</text><rect class="i-warn" x="12" y="800" width="316" height="154" rx="6"/><text class="ih" x="24" y="832">Где ломается</text><text class="it" x="24" y="858">Текстура может быть</text><text class="it" x="24" y="884">размыта или перекрыта</text><text class="it" x="24" y="910">следующим слоем; тогда</text><text class="it" x="24" y="936">признаков меньше.</text><rect class="i-warn" x="12" y="960" width="316" height="180" rx="6"/><text class="ih" x="24" y="992">Где ломается</text><text class="it" x="24" y="1018">Одна и та же косая</text><text class="it" x="24" y="1044">слоистость может появиться</text><text class="it" x="24" y="1070">в разных обстановках; по</text><text class="it" x="24" y="1096">одному фото рукав не</text><text class="it" x="24" y="1122">определить.</text><rect x="249" y="1158" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1179">схема</text></svg>