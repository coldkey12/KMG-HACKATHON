<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1194" role="img" aria-label="Схема шага «Отмирание равнины: морской горизонт и торф»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Отмирание равнины: морской горизонт и торф»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Описание разреза: тонкий</text><text class="it" x="24" y="96">горизонт аргиллитов и</text><text class="it" x="24" y="122">алевролитов или слой</text><text class="it" x="24" y="148">лигнита и торфа.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Состав фауны в горизонте:</text><text class="it" x="24" y="256">морская или</text><text class="it" x="24" y="282">солоноватоводная.</text><rect class="i-in" x="12" y="306" width="316" height="128" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Положение слоя в дельтовой</text><text class="it" x="24" y="390">равнине: нижняя, средняя</text><text class="it" x="24" y="416">или верхняя часть.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Отмирание равнины: морской</text><text class="it" x="24" y="532">горизонт и торф</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="128" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Вывод о том, какая часть</text><text class="it" x="24" y="668">равнины была залита морем,</text><text class="it" x="24" y="694">а какая осушена.</text><rect class="i-out" x="12" y="718" width="316" height="102" rx="6"/><text class="ih" x="24" y="750">Вывод</text><text class="it" x="24" y="776">Опорный маркер для</text><text class="it" x="24" y="802">сопоставления разрезов.</text><rect class="i-warn" x="12" y="826" width="316" height="180" rx="6"/><text class="ih" x="24" y="858">Где ломается</text><text class="it" x="24" y="884">Угли и торф книга</text><text class="it" x="24" y="910">связывает с тропическим</text><text class="it" x="24" y="936">гумидным климатом; без</text><text class="it" x="24" y="962">этого условия вывод не</text><text class="it" x="24" y="988">обоснован.</text><rect class="i-warn" x="12" y="1012" width="316" height="128" rx="6"/><text class="ih" x="24" y="1044">Где ломается</text><text class="it" x="24" y="1070">Тонкий горизонт может быть</text><text class="it" x="24" y="1096">пропущен при описании</text><text class="it" x="24" y="1122">керна.</text><rect x="249" y="1158" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1179">схема</text></svg>