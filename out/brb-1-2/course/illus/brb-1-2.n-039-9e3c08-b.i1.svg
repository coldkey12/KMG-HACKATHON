<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1354" role="img" aria-label="Схема шага «Паводковые слои на фронте дельты»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Паводковые слои на фронте дельты»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Подошва каждого грубого</text><text class="it" x="24" y="96">слоя: ровная размытая или</text><text class="it" x="24" y="122">постепенная.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Текстура снизу вверх:</text><text class="it" x="24" y="230">параллельная слоистость,</text><text class="it" x="24" y="256">затем асимметричная рябь.</text><rect class="i-in" x="12" y="280" width="316" height="154" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Форма поверхностей слоёв:</text><text class="it" x="24" y="364">асимметричная или</text><text class="it" x="24" y="390">симметричная рябь с</text><text class="it" x="24" y="416">прямыми гребнями.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Паводковые слои на фронте</text><text class="it" x="24" y="532">дельты</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="154" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Вывод о паводковом слое:</text><text class="it" x="24" y="668">ровная размытая подошва и</text><text class="it" x="24" y="694">рябь при убывании силы</text><text class="it" x="24" y="720">течения.</text><rect class="i-out" x="12" y="744" width="316" height="154" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Вывод о послепаводковой</text><text class="it" x="24" y="828">волновой переработке:</text><text class="it" x="24" y="854">симметричная рябь с</text><text class="it" x="24" y="880">прямыми гребнями.</text><rect class="i-out" x="12" y="904" width="316" height="128" rx="6"/><text class="ih" x="24" y="936">Вывод</text><text class="it" x="24" y="962">Вывод о линзе как</text><text class="it" x="24" y="988">продолжении протоки у</text><text class="it" x="24" y="1014">фронта дельты.</text><rect class="i-warn" x="12" y="1038" width="316" height="128" rx="6"/><text class="ih" x="24" y="1070">Где ломается</text><text class="it" x="24" y="1096">Симметричная рябь может</text><text class="it" x="24" y="1122">быть, а может не быть:</text><text class="it" x="24" y="1148">автор пишет «могут иметь».</text><rect class="i-warn" x="12" y="1172" width="316" height="128" rx="6"/><text class="ih" x="24" y="1204">Где ломается</text><text class="it" x="24" y="1230">Один разрез не показывает,</text><text class="it" x="24" y="1256">выдержан ли слой по</text><text class="it" x="24" y="1282">площади.</text><rect x="249" y="1318" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1339">схема</text></svg>