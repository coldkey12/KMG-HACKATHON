<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1246" role="img" aria-label="Схема шага «Разрез фронта волновой дельты»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Разрез фронта волновой дельты»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Профиль зернистости снизу</text><text class="it" x="24" y="96">вверх по керну или</text><text class="it" x="24" y="122">описанию разреза.</text><rect class="i-in" x="12" y="146" width="316" height="154" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Тип слоистости в каждом</text><text class="it" x="24" y="230">интервале: выпуклая косая,</text><text class="it" x="24" y="256">волновая рябь,</text><text class="it" x="24" y="282">параллельная, косая.</text><rect class="i-in" x="12" y="306" width="316" height="154" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Степень биотурбации:</text><text class="it" x="24" y="390">насколько норы</text><text class="it" x="24" y="416">беспозвоночных нарушили</text><text class="it" x="24" y="442">первичные текстуры.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Разрез фронта волновой</text><text class="it" x="24" y="558">дельты</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="180" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Интервал похож на фронт</text><text class="it" x="24" y="694">волновой дельты, если</text><text class="it" x="24" y="720">зерно растёт вверх и есть</text><text class="it" x="24" y="746">хорошо сортированный</text><text class="it" x="24" y="772">песок.</text><rect class="i-out" x="12" y="796" width="316" height="128" rx="6"/><text class="ih" x="24" y="828">Вывод</text><text class="it" x="24" y="854">Внизу может быть штормовой</text><text class="it" x="24" y="880">слой, если тонкий элемент</text><text class="it" x="24" y="906">присутствует.</text><rect class="i-warn" x="12" y="930" width="316" height="128" rx="6"/><text class="ih" x="24" y="962">Где ломается</text><text class="it" x="24" y="988">Тонкий слой внизу может</text><text class="it" x="24" y="1014">отсутствовать: «может» не</text><text class="it" x="24" y="1040">означает обязательность.</text><rect class="i-warn" x="12" y="1064" width="316" height="128" rx="6"/><text class="ih" x="24" y="1096">Где ломается</text><text class="it" x="24" y="1122">Биотурбация может нарушить</text><text class="it" x="24" y="1148">первичные текстуры и</text><text class="it" x="24" y="1174">затруднить чтение.</text><rect x="249" y="1210" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1231">схема</text></svg>