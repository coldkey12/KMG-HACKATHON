<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1272" role="img" aria-label="Схема шага «Приливные рукава и внутренние дельты»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Приливные рукава и внутренние дельты»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Форма русла в плане:</text><text class="it" x="24" y="96">извилистость и ширина</text><text class="it" x="24" y="122">рукава.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Состав осадка: песчаные</text><text class="it" x="24" y="230">бары и илистые отмели во</text><text class="it" x="24" y="256">внутренней дельте.</text><rect class="i-in" x="12" y="280" width="316" height="154" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Отношение ширины к глубине</text><text class="it" x="24" y="364">по съёмке или промерам.</text><text class="it" x="24" y="390">Источник данных в главе не</text><text class="it" x="24" y="416">указан.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Приливные рукава и</text><text class="it" x="24" y="532">внутренние дельты</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="128" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Отнесение рукава к</text><text class="it" x="24" y="668">приливным по признакам</text><text class="it" x="24" y="694">формы, а не к речным.</text><rect class="i-out" x="12" y="718" width="316" height="154" rx="6"/><text class="ih" x="24" y="750">Вывод</text><text class="it" x="24" y="776">Место внутренней дельты:</text><text class="it" x="24" y="802">выше слияния рукавов и</text><text class="it" x="24" y="828">выше точек впадения в</text><text class="it" x="24" y="854">море.</text><rect class="i-warn" x="12" y="878" width="316" height="154" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Признаки даны для рукавов,</text><text class="it" x="24" y="962">на которые действуют</text><text class="it" x="24" y="988">приливы. Без приливов</text><text class="it" x="24" y="1014">форма другая.</text><rect class="i-warn" x="12" y="1038" width="316" height="180" rx="6"/><text class="ih" x="24" y="1070">Где ломается</text><text class="it" x="24" y="1096">Форма русла в плане и</text><text class="it" x="24" y="1122">состав осадка по одной</text><text class="it" x="24" y="1148">скважине могут не видны.</text><text class="it" x="24" y="1174">Это предположение о</text><text class="it" x="24" y="1200">данных.</text><rect x="249" y="1236" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1257">схема</text></svg>