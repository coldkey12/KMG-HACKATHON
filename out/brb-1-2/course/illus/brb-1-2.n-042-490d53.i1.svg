<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1168" role="img" aria-label="Схема шага «Разрез приливного рукава: два течения»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Разрез приливного рукава: два течения»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Направления косых слоёв в</text><text class="it" x="24" y="96">разрезе, по которым видно,</text><text class="it" x="24" y="122">куда шёл поток.</text><rect class="i-in" x="12" y="146" width="316" height="102" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Смена фаций по вертикали и</text><text class="it" x="24" y="230">частота мелких смен.</text><rect class="i-in" x="12" y="254" width="316" height="102" rx="6"/><text class="ih" x="24" y="286">Вход</text><text class="it" x="24" y="312">Ходы илоедов и корневые</text><text class="it" x="24" y="338">следы в глинах.</text><line class="ia" x1="170" y1="366" x2="170" y2="386"/><path class="iah" d="M170 392 l-6 -9 h12 z"/><rect class="i-node" x="12" y="396" width="316" height="76" rx="6"/><text class="it" x="24" y="428">Разрез приливного рукава:</text><text class="it" x="24" y="454">два течения</text><line class="ia" x1="170" y1="476" x2="170" y2="496"/><path class="iah" d="M170 502 l-6 -9 h12 z"/><rect class="i-out" x="12" y="506" width="316" height="154" rx="6"/><text class="ih" x="24" y="538">Вывод</text><text class="it" x="24" y="564">Вывод о приливном влиянии,</text><text class="it" x="24" y="590">если в разрезе есть два</text><text class="it" x="24" y="616">противоположных</text><text class="it" x="24" y="642">направления течения.</text><rect class="i-out" x="12" y="666" width="316" height="128" rx="6"/><text class="ih" x="24" y="698">Вывод</text><text class="it" x="24" y="724">Вывод, что верх разреза</text><text class="it" x="24" y="750">относится к зоне мангровых</text><text class="it" x="24" y="776">болот.</text><rect class="i-warn" x="12" y="800" width="316" height="154" rx="6"/><text class="ih" x="24" y="832">Где ломается</text><text class="it" x="24" y="858">Мелкие и частые колебания:</text><text class="it" x="24" y="884">одно направление слоя</text><text class="it" x="24" y="910">может не отражать общий</text><text class="it" x="24" y="936">поток.</text><rect class="i-warn" x="12" y="960" width="316" height="154" rx="6"/><text class="ih" x="24" y="992">Где ломается</text><text class="it" x="24" y="1018">Прибрежные каналы</text><text class="it" x="24" y="1044">кончаются баровыми</text><text class="it" x="24" y="1070">песками, поэтому верх</text><text class="it" x="24" y="1096">разреза зависит от места.</text><rect x="249" y="1132" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1153">схема</text></svg>