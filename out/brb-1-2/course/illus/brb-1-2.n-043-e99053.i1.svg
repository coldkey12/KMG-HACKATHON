<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1246" role="img" aria-label="Схема шага «Мигрирующие протоки и размеры песков»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Мигрирующие протоки и размеры песков»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Размер и форма протоки.</text><text class="it" x="24" y="96">Автор называет их как</text><text class="it" x="24" y="122">фактор размеров песчаного</text><text class="it" x="24" y="148">тела.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Степень латеральной</text><text class="it" x="24" y="256">миграции протоки:</text><text class="it" x="24" y="282">насколько протока</text><text class="it" x="24" y="308">смещалась вбок.</text><rect class="i-in" x="12" y="332" width="316" height="154" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Какие именно данные</text><text class="it" x="24" y="416">(карты, разрезы, сейсмика)</text><text class="it" x="24" y="442">дают эти признаки, в</text><text class="it" x="24" y="468">тексте не сказано.</text><line class="ia" x1="170" y1="496" x2="170" y2="516"/><path class="iah" d="M170 522 l-6 -9 h12 z"/><rect class="i-node" x="12" y="526" width="316" height="76" rx="6"/><text class="it" x="24" y="558">Мигрирующие протоки и</text><text class="it" x="24" y="584">размеры песков</text><line class="ia" x1="170" y1="606" x2="170" y2="626"/><path class="iah" d="M170 632 l-6 -9 h12 z"/><rect class="i-out" x="12" y="636" width="316" height="154" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Удлинённое песчаное тело:</text><text class="it" x="24" y="720">длина 4–5 км, ширина</text><text class="it" x="24" y="746">0,5–1,5 км, мощность до 10</text><text class="it" x="24" y="772">м.</text><rect class="i-out" x="12" y="796" width="316" height="102" rx="6"/><text class="ih" x="24" y="828">Вывод</text><text class="it" x="24" y="854">Крупное песчаное тело:</text><text class="it" x="24" y="880">ширина 20 км, длина 50 км.</text><rect class="i-warn" x="12" y="904" width="316" height="128" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Текст не даёт правила,</text><text class="it" x="24" y="988">которое связывает признаки</text><text class="it" x="24" y="1014">с конкретным размером.</text><rect class="i-warn" x="12" y="1038" width="316" height="154" rx="6"/><text class="ih" x="24" y="1070">Где ломается</text><text class="it" x="24" y="1096">Модель описывает одну</text><text class="it" x="24" y="1122">реальную свиту. Перенос на</text><text class="it" x="24" y="1148">другие данные требует</text><text class="it" x="24" y="1174">проверки.</text><rect x="249" y="1210" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1231">схема</text></svg>