<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1004" role="img" aria-label="Схема шага «Почему уравнение нельзя решить сразу»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Почему уравнение нельзя решить сразу»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Давление в точках пласта</text><text class="it" x="24" y="96">как функция места и</text><text class="it" x="24" y="122">времени. От него зависят</text><text class="it" x="24" y="148">коэффициенты.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Вид флюида: жидкость с</text><text class="it" x="24" y="256">малой постоянной</text><text class="it" x="24" y="282">сжимаемостью или газ.</text><line class="ia" x1="170" y1="310" x2="170" y2="330"/><path class="iah" d="M170 336 l-6 -9 h12 z"/><rect class="i-node" x="12" y="340" width="316" height="76" rx="6"/><text class="it" x="24" y="372">Почему уравнение нельзя</text><text class="it" x="24" y="398">решить сразу</text><line class="ia" x1="170" y1="420" x2="170" y2="440"/><path class="iah" d="M170 446 l-6 -9 h12 z"/><rect class="i-out" x="12" y="450" width="316" height="180" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Уравнение с постоянными</text><text class="it" x="24" y="534">коэффициентами после</text><text class="it" x="24" y="560">линеаризации, для которого</text><text class="it" x="24" y="586">можно найти аналитическое</text><text class="it" x="24" y="612">решение.</text><rect class="i-warn" x="12" y="636" width="316" height="154" rx="6"/><text class="ih" x="24" y="668">Где ломается</text><text class="it" x="24" y="694">Для газа простая</text><text class="it" x="24" y="720">линеаризация не подходит.</text><text class="it" x="24" y="746">Нужно преобразование</text><text class="it" x="24" y="772">Кирхгофа.</text><rect class="i-warn" x="12" y="796" width="316" height="154" rx="6"/><text class="ih" x="24" y="828">Где ломается</text><text class="it" x="24" y="854">Если коэффициенты заметно</text><text class="it" x="24" y="880">меняются с давлением,</text><text class="it" x="24" y="906">постоянные коэффициенты</text><text class="it" x="24" y="932">дают неверное описание.</text><rect x="249" y="968" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="989">схема</text></svg>