<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1138" role="img" aria-label="Схема шага «Замена объёмов на замеры дебитов»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Замена объёмов на замеры дебитов»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Замеренные дебиты каждой</text><text class="it" x="24" y="96">скважины по зонам</text><text class="it" x="24" y="122">дренирования за весь срок</text><text class="it" x="24" y="148">разработки.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Средние давления отдельных</text><text class="it" x="24" y="256">зон, определяемые методом</text><text class="it" x="24" y="282">главы 7.</text><rect class="i-in" x="12" y="306" width="316" height="128" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Оценка разброса</text><text class="it" x="24" y="390">сжимаемости по зонам,</text><text class="it" x="24" y="416">чтобы проверить допущение.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Замена объёмов на замеры</text><text class="it" x="24" y="532">дебитов</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="154" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Среднее пластовое давление</text><text class="it" x="24" y="668">по дебитам (5.13), на</text><text class="it" x="24" y="694">которое опирается</text><text class="it" x="24" y="720">материальный баланс.</text><rect class="i-warn" x="12" y="744" width="316" height="180" rx="6"/><text class="ih" x="24" y="776">Где ломается</text><text class="it" x="24" y="802">Если сжимаемость зон</text><text class="it" x="24" y="828">заметно различается, дебит</text><text class="it" x="24" y="854">перестаёт быть</text><text class="it" x="24" y="880">пропорциональным объёму.</text><text class="it" x="24" y="906">Замена не годится.</text><rect class="i-warn" x="12" y="930" width="316" height="154" rx="6"/><text class="ih" x="24" y="962">Где ломается</text><text class="it" x="24" y="988">Если дебиты замерены не по</text><text class="it" x="24" y="1014">всем зонам или с ошибкой,</text><text class="it" x="24" y="1040">взвешенное давление будет</text><text class="it" x="24" y="1066">смещено.</text><rect x="249" y="1102" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1123">схема</text></svg>