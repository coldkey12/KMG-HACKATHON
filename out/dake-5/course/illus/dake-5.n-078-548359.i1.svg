<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 978" role="img" aria-label="Схема шага «Режимы в жизни: приближения, не законы»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Режимы в жизни: приближения, не законы»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Дебит скважины во времени:</text><text class="it" x="24" y="96">медленно меняющаяся кривая</text><text class="it" x="24" y="122">или ступени после</text><text class="it" x="24" y="148">ремонтов.</text><rect class="i-in" x="12" y="172" width="316" height="102" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Момент смены дебита одной</text><text class="it" x="24" y="256">скважины.</text><line class="ia" x1="170" y1="284" x2="170" y2="304"/><path class="iah" d="M170 310 l-6 -9 h12 z"/><rect class="i-node" x="12" y="314" width="316" height="76" rx="6"/><text class="it" x="24" y="346">Режимы в жизни:</text><text class="it" x="24" y="372">приближения, не законы</text><line class="ia" x1="170" y1="394" x2="170" y2="414"/><path class="iah" d="M170 420 l-6 -9 h12 z"/><rect class="i-out" x="12" y="424" width="316" height="154" rx="6"/><text class="ih" x="24" y="456">Вывод</text><text class="it" x="24" y="482">Отрезок времени, на</text><text class="it" x="24" y="508">котором стабилизированная</text><text class="it" x="24" y="534">формула считается</text><text class="it" x="24" y="560">приближением.</text><rect class="i-warn" x="12" y="584" width="316" height="180" rx="6"/><text class="ih" x="24" y="616">Где ломается</text><text class="it" x="24" y="642">Сразу после смены дебита</text><text class="it" x="24" y="668">кривая давления ещё в</text><text class="it" x="24" y="694">переходном периоде.</text><text class="it" x="24" y="720">Стабилизированная формула</text><text class="it" x="24" y="746">здесь не подходит.</text><rect class="i-warn" x="12" y="770" width="316" height="154" rx="6"/><text class="ih" x="24" y="802">Где ломается</text><text class="it" x="24" y="828">Частые смены дебита</text><text class="it" x="24" y="854">повторяют переходный</text><text class="it" x="24" y="880">период, и стабилизация</text><text class="it" x="24" y="906">может не наступить.</text><rect x="249" y="942" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="963">схема</text></svg>