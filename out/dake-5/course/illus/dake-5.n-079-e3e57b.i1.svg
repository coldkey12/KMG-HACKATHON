<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1030" role="img" aria-label="Схема шага «Три допущения для жидкости: что отбрасываем»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Три допущения для жидкости: что отбрасываем»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Параметры пласта и флюида</text><text class="it" x="24" y="96">φ, μ, c, k собраны в</text><text class="it" x="24" y="122">коэффициент φμc/k. При</text><text class="it" x="24" y="148">постоянстве он становится</text><text class="it" x="24" y="174">одним числом.</text><rect class="i-in" x="12" y="198" width="316" height="154" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Давление p, измеренное в</text><text class="it" x="24" y="282">точке r в момент t: в</text><text class="it" x="24" y="308">уравнении входит его</text><text class="it" x="24" y="334">производная по времени.</text><line class="ia" x1="170" y1="362" x2="170" y2="382"/><path class="iah" d="M170 388 l-6 -9 h12 z"/><rect class="i-node" x="12" y="392" width="316" height="76" rx="6"/><text class="it" x="24" y="424">Три допущения для</text><text class="it" x="24" y="450">жидкости: что отбрасываем</text><line class="ia" x1="170" y1="472" x2="170" y2="492"/><path class="iah" d="M170 498 l-6 -9 h12 z"/><rect class="i-out" x="12" y="502" width="316" height="154" rx="6"/><text class="ih" x="24" y="534">Вывод</text><text class="it" x="24" y="560">Линейное уравнение (5.20),</text><text class="it" x="24" y="586">на котором можно искать</text><text class="it" x="24" y="612">решения; пригодно для</text><text class="it" x="24" y="638">обработки кривых давления.</text><rect class="i-warn" x="12" y="662" width="316" height="154" rx="6"/><text class="ih" x="24" y="694">Где ломается</text><text class="it" x="24" y="720">Если μ, φ или c зависят от</text><text class="it" x="24" y="746">давления, коэффициент не</text><text class="it" x="24" y="772">постоянен, и уравнение</text><text class="it" x="24" y="798">(5.20) не годится.</text><rect class="i-warn" x="12" y="822" width="316" height="154" rx="6"/><text class="ih" x="24" y="854">Где ломается</text><text class="it" x="24" y="880">Если градиент давления</text><text class="it" x="24" y="906">велик, отброшенный квадрат</text><text class="it" x="24" y="932">градиента может стать</text><text class="it" x="24" y="958">заметным.</text><rect x="249" y="994" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1015">схема</text></svg>