<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1142" role="img" aria-label="Схема шага «Давление на забое при испытании скважины»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Давление на забое при испытании скважины»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Время t от начала</text><text class="it" x="24" y="96">испытания.</text><rect class="i-in" x="12" y="120" width="316" height="128" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Дебит q, вязкость μ,</text><text class="it" x="24" y="204">проницаемость k, толщина</text><text class="it" x="24" y="230">h.</text><rect class="i-in" x="12" y="254" width="316" height="128" rx="6"/><text class="ih" x="24" y="286">Вход</text><text class="it" x="24" y="312">Пористость φ, сжимаемость</text><text class="it" x="24" y="338">c, радиус скважины r_w —</text><text class="it" x="24" y="364">входят в аргумент x.</text><line class="ia" x1="170" y1="392" x2="170" y2="412"/><path class="iah" d="M170 418 l-6 -9 h12 z"/><rect class="i-node" x="12" y="422" width="316" height="76" rx="6"/><text class="it" x="24" y="454">Давление на забое при</text><text class="it" x="24" y="480">испытании скважины</text><line class="ia" x1="170" y1="502" x2="170" y2="522"/><path class="iah" d="M170 528 l-6 -9 h12 z"/><rect class="i-out" x="12" y="532" width="316" height="102" rx="6"/><text class="ih" x="24" y="564">Вывод</text><text class="it" x="24" y="590">Забойное давление p_wf как</text><text class="it" x="24" y="616">функция логарифма времени.</text><rect class="i-out" x="12" y="640" width="316" height="128" rx="6"/><text class="ih" x="24" y="672">Вывод</text><text class="it" x="24" y="698">Сдвиг давления на</text><text class="it" x="24" y="724">величину, связанную с 2S</text><text class="it" x="24" y="750">внутри скобок.</text><rect class="i-warn" x="12" y="774" width="316" height="154" rx="6"/><text class="ih" x="24" y="806">Где ломается</text><text class="it" x="24" y="832">Для точек далеко от ствола</text><text class="it" x="24" y="858">x может быть не меньше</text><text class="it" x="24" y="884">0.01; логарифм тогда не</text><text class="it" x="24" y="910">годится.</text><rect class="i-warn" x="12" y="934" width="316" height="154" rx="6"/><text class="ih" x="24" y="966">Где ломается</text><text class="it" x="24" y="992">После долгого испытания</text><text class="it" x="24" y="1018">формула перестаёт</text><text class="it" x="24" y="1044">описывать процесс, так как</text><text class="it" x="24" y="1070">граница начинает влиять.</text><rect x="249" y="1106" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1127">схема</text></svg>