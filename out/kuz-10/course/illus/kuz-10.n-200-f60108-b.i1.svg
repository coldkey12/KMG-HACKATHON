<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 632" role="img" aria-label="Схема шага «Не всякий известняк — риф»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Не всякий известняк — риф»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Описание карбонатной</text><text class="it" x="24" y="96">толщи: состав пород и их</text><text class="it" x="24" y="122">строение, включая</text><text class="it" x="24" y="148">биоморфную структуру.</text><line class="ia" x1="170" y1="176" x2="170" y2="196"/><path class="iah" d="M170 202 l-6 -9 h12 z"/><rect class="i-node" x="12" y="206" width="316" height="50" rx="6"/><text class="it" x="24" y="238">Не всякий известняк — риф</text><line class="ia" x1="170" y1="260" x2="170" y2="280"/><path class="iah" d="M170 286 l-6 -9 h12 z"/><rect class="i-out" x="12" y="290" width="316" height="128" rx="6"/><text class="ih" x="24" y="322">Вывод</text><text class="it" x="24" y="348">Решение, относить ли толщу</text><text class="it" x="24" y="374">к рифам или только к</text><text class="it" x="24" y="400">органогенным постройкам.</text><rect class="i-warn" x="12" y="424" width="316" height="154" rx="6"/><text class="ih" x="24" y="456">Где ломается</text><text class="it" x="24" y="482">Биоморфная структура сама</text><text class="it" x="24" y="508">по себе не доказывает риф.</text><text class="it" x="24" y="534">Автор называет такую</text><text class="it" x="24" y="560">подмену перекосом.</text><rect x="249" y="596" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="617">схема</text></svg>