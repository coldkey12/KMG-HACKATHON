<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1004" role="img" aria-label="Схема шага «Риф: растёт быстрее соседей»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Риф: растёт быстрее соседей»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Толщины рифового тела и</text><text class="it" x="24" y="96">синхронных отложений</text><text class="it" x="24" y="122">рядом: их сравнивают по</text><text class="it" x="24" y="148">мощности.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Откуда берутся эти толщины</text><text class="it" x="24" y="256">— из разрезов скважин или</text><text class="it" x="24" y="282">профилей — в тексте не</text><text class="it" x="24" y="308">указано.</text><line class="ia" x1="170" y1="336" x2="170" y2="356"/><path class="iah" d="M170 362 l-6 -9 h12 z"/><rect class="i-node" x="12" y="366" width="316" height="76" rx="6"/><text class="it" x="24" y="398">Риф: растёт быстрее</text><text class="it" x="24" y="424">соседей</text><line class="ia" x1="170" y1="446" x2="170" y2="466"/><path class="iah" d="M170 472 l-6 -9 h12 z"/><rect class="i-out" x="12" y="476" width="316" height="180" rx="6"/><text class="ih" x="24" y="508">Вывод</text><text class="it" x="24" y="534">Вывод: тело толще</text><text class="it" x="24" y="560">синхронных отложений и</text><text class="it" x="24" y="586">возвышается над ними; по</text><text class="it" x="24" y="612">тексту это признак рифа в</text><text class="it" x="24" y="638">узком смысле.</text><rect class="i-warn" x="12" y="662" width="316" height="154" rx="6"/><text class="ih" x="24" y="694">Где ломается</text><text class="it" x="24" y="720">Синхронность пород нельзя</text><text class="it" x="24" y="746">увидеть напрямую; её</text><text class="it" x="24" y="772">устанавливают по возрасту</text><text class="it" x="24" y="798">образования.</text><rect class="i-warn" x="12" y="822" width="316" height="128" rx="6"/><text class="ih" x="24" y="854">Где ломается</text><text class="it" x="24" y="880">Порога толщины в тексте</text><text class="it" x="24" y="906">нет: сравнение</text><text class="it" x="24" y="932">качественное.</text><rect x="249" y="968" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="989">схема</text></svg>