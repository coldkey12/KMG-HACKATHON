<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 740" role="img" aria-label="Схема шага «Обломки рифа — главная порода»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Обломки рифа — главная порода»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Описание керна или шлама:</text><text class="it" x="24" y="96">какая доля породы имеет</text><text class="it" x="24" y="122">обломочную структуру.</text><line class="ia" x1="170" y1="150" x2="170" y2="170"/><path class="iah" d="M170 176 l-6 -9 h12 z"/><rect class="i-node" x="12" y="180" width="316" height="76" rx="6"/><text class="it" x="24" y="212">Обломки рифа — главная</text><text class="it" x="24" y="238">порода</text><line class="ia" x1="170" y1="260" x2="170" y2="280"/><path class="iah" d="M170 286 l-6 -9 h12 z"/><rect class="i-out" x="12" y="290" width="316" height="102" rx="6"/><text class="ih" x="24" y="322">Вывод</text><text class="it" x="24" y="348">Оценка доли обломочных</text><text class="it" x="24" y="374">пород в рифовом комплексе.</text><rect class="i-warn" x="12" y="398" width="316" height="154" rx="6"/><text class="ih" x="24" y="430">Где ломается</text><text class="it" x="24" y="456">Обломочная и каркасная</text><text class="it" x="24" y="482">породы могут выглядеть</text><text class="it" x="24" y="508">похоже без подробного</text><text class="it" x="24" y="534">описания структуры.</text><rect class="i-warn" x="12" y="558" width="316" height="128" rx="6"/><text class="ih" x="24" y="590">Где ломается</text><text class="it" x="24" y="616">В тексте не дано порога,</text><text class="it" x="24" y="642">по которому породу относят</text><text class="it" x="24" y="668">к обломочной.</text><rect x="249" y="704" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="725">схема</text></svg>