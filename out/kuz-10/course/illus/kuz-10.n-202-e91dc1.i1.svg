<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1298" role="img" aria-label="Схема шага «Одиночные рифы и рифовые системы»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Одиночные рифы и рифовые системы»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Форма поперечного сечения</text><text class="it" x="24" y="96">рифа: симметричная или</text><text class="it" x="24" y="122">асимметричная.</text><rect class="i-in" x="12" y="146" width="316" height="206" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Положение рифа</text><text class="it" x="24" y="230">относительно рельефа дна:</text><text class="it" x="24" y="256">локальное поднятие или</text><text class="it" x="24" y="282">крутой перегиб между</text><text class="it" x="24" y="308">мелководьем и</text><text class="it" x="24" y="334">глубоководьем.</text><rect class="i-in" x="12" y="358" width="316" height="128" rx="6"/><text class="ih" x="24" y="390">Вход</text><text class="it" x="24" y="416">Форма одиночного рифа в</text><text class="it" x="24" y="442">поперечном сечении: купол,</text><text class="it" x="24" y="468">плоская вершина или атолл.</text><line class="ia" x1="170" y1="496" x2="170" y2="516"/><path class="iah" d="M170 522 l-6 -9 h12 z"/><rect class="i-node" x="12" y="526" width="316" height="76" rx="6"/><text class="it" x="24" y="558">Одиночные рифы и рифовые</text><text class="it" x="24" y="584">системы</text><line class="ia" x1="170" y1="606" x2="170" y2="626"/><path class="iah" d="M170 632 l-6 -9 h12 z"/><rect class="i-out" x="12" y="636" width="316" height="128" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Тип рифа: одиночный или</text><text class="it" x="24" y="720">асимметричная рифовая</text><text class="it" x="24" y="746">система.</text><rect class="i-out" x="12" y="770" width="316" height="128" rx="6"/><text class="ih" x="24" y="802">Вывод</text><text class="it" x="24" y="828">Для одиночного рифа —</text><text class="it" x="24" y="854">куполовидный,</text><text class="it" x="24" y="880">плосковершинный или атолл.</text><rect class="i-warn" x="12" y="904" width="316" height="180" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Глубина воды не отделяет</text><text class="it" x="24" y="988">одиночные рифы от систем:</text><text class="it" x="24" y="1014">одиночные бывают и на</text><text class="it" x="24" y="1040">мелководье, и на</text><text class="it" x="24" y="1066">глубоководье.</text><rect class="i-warn" x="12" y="1090" width="316" height="154" rx="6"/><text class="ih" x="24" y="1122">Где ломается</text><text class="it" x="24" y="1148">Граница между «примерно</text><text class="it" x="24" y="1174">симметричным» и</text><text class="it" x="24" y="1200">асимметричным сечением в</text><text class="it" x="24" y="1226">тексте не задана.</text><rect x="249" y="1262" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1283">схема</text></svg>