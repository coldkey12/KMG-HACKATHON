<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1030" role="img" aria-label="Схема шага «Атолл: кольцо вокруг лагуны»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Атолл: кольцо вокруг лагуны»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Описание керна и шлама по</text><text class="it" x="24" y="96">скважинам: тип известняка</text><text class="it" x="24" y="122">(биогермный, обломочный,</text><text class="it" x="24" y="148">светлый микрозернистый) и</text><text class="it" x="24" y="174">его слоистость.</text><rect class="i-in" x="12" y="198" width="316" height="154" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Положение точки</text><text class="it" x="24" y="282">относительно гребня и</text><text class="it" x="24" y="308">лагуны, если известно из</text><text class="it" x="24" y="334">карты или разреза.</text><line class="ia" x1="170" y1="362" x2="170" y2="382"/><path class="iah" d="M170 388 l-6 -9 h12 z"/><rect class="i-node" x="12" y="392" width="316" height="76" rx="6"/><text class="it" x="24" y="424">Атолл: кольцо вокруг</text><text class="it" x="24" y="450">лагуны</text><line class="ia" x1="170" y1="472" x2="170" y2="492"/><path class="iah" d="M170 498 l-6 -9 h12 z"/><rect class="i-out" x="12" y="502" width="316" height="128" rx="6"/><text class="ih" x="24" y="534">Вывод</text><text class="it" x="24" y="560">Тип фации для точки: ядро,</text><text class="it" x="24" y="586">внешний склон, внутренний</text><text class="it" x="24" y="612">склон гребня или лагуна.</text><rect class="i-warn" x="12" y="636" width="316" height="154" rx="6"/><text class="ih" x="24" y="668">Где ломается</text><text class="it" x="24" y="694">Лагунные отложения могут</text><text class="it" x="24" y="720">быть похожи на ядро по</text><text class="it" x="24" y="746">литологии, если смотреть</text><text class="it" x="24" y="772">только на тип породы.</text><rect class="i-warn" x="12" y="796" width="316" height="180" rx="6"/><text class="ih" x="24" y="828">Где ломается</text><text class="it" x="24" y="854">«Как правило» значит:</text><text class="it" x="24" y="880">тонкость лагуны и</text><text class="it" x="24" y="906">слоистость разного</text><text class="it" x="24" y="932">масштаба — типичны, но не</text><text class="it" x="24" y="958">обязательны.</text><rect x="249" y="994" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1015">схема</text></svg>