<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 974" role="img" aria-label="Схема шага «Зоны одиночного купола рифа»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Зоны одиночного купола рифа»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="206" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Описания пород из керна</text><text class="it" x="24" y="96">или шлама с указанием их</text><text class="it" x="24" y="122">положения относительно</text><text class="it" x="24" y="148">центра купола (в главе не</text><text class="it" x="24" y="174">описано как входные</text><text class="it" x="24" y="200">данные).</text><line class="ia" x1="170" y1="228" x2="170" y2="248"/><path class="iah" d="M170 254 l-6 -9 h12 z"/><rect class="i-node" x="12" y="258" width="316" height="76" rx="6"/><text class="it" x="24" y="290">Зоны одиночного купола</text><text class="it" x="24" y="316">рифа</text><line class="ia" x1="170" y1="338" x2="170" y2="358"/><path class="iah" d="M170 364 l-6 -9 h12 z"/><rect class="i-out" x="12" y="368" width="316" height="206" rx="6"/><text class="ih" x="24" y="400">Вывод</text><text class="it" x="24" y="426">Порядок пород от ядра</text><text class="it" x="24" y="452">наружу: биогермные и</text><text class="it" x="24" y="478">детритовые породы в ядре,</text><text class="it" x="24" y="504">затем конгломераты и</text><text class="it" x="24" y="530">гравелиты, затем тонкие</text><text class="it" x="24" y="556">породы.</text><rect class="i-warn" x="12" y="580" width="316" height="180" rx="6"/><text class="ih" x="24" y="612">Где ломается</text><text class="it" x="24" y="638">Перекристаллизация и</text><text class="it" x="24" y="664">доломитизация меняют</text><text class="it" x="24" y="690">состав ядра: порода</text><text class="it" x="24" y="716">становится кристаллической</text><text class="it" x="24" y="742">и доломитовой.</text><rect class="i-warn" x="12" y="766" width="316" height="154" rx="6"/><text class="ih" x="24" y="798">Где ломается</text><text class="it" x="24" y="824">Слово «в целом» означает,</text><text class="it" x="24" y="850">что отдельные купола могут</text><text class="it" x="24" y="876">отклоняться от</text><text class="it" x="24" y="902">симметричной картины.</text><rect x="249" y="938" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="959">схема</text></svg>