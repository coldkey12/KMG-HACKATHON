<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1190" role="img" aria-label="Схема шага «Межзерновые поры и пещеры рифа»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Межзерновые поры и пещеры рифа»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Тип известняка:</text><text class="it" x="24" y="96">обломочный,</text><text class="it" x="24" y="122">органогенно-обломочный или</text><text class="it" x="24" y="148">оолитовый. В них важна</text><text class="it" x="24" y="174">межгранулярная пористость.</text><rect class="i-in" x="12" y="198" width="316" height="206" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Признаки крупной полости:</text><text class="it" x="24" y="282">место в зоне прибоя, ниша,</text><text class="it" x="24" y="308">туннель или шов срастания</text><text class="it" x="24" y="334">построек. Способ, которым</text><text class="it" x="24" y="360">это видят (керн, шлиф,</text><text class="it" x="24" y="386">каротаж), — гипотеза.</text><line class="ia" x1="170" y1="414" x2="170" y2="434"/><path class="iah" d="M170 440 l-6 -9 h12 z"/><rect class="i-node" x="12" y="444" width="316" height="76" rx="6"/><text class="it" x="24" y="476">Межзерновые поры и пещеры</text><text class="it" x="24" y="502">рифа</text><line class="ia" x1="170" y1="524" x2="170" y2="544"/><path class="iah" d="M170 550 l-6 -9 h12 z"/><rect class="i-out" x="12" y="554" width="316" height="154" rx="6"/><text class="ih" x="24" y="586">Вывод</text><text class="it" x="24" y="612">Пустоты разделяются по</text><text class="it" x="24" y="638">типу: межгранулярные поры</text><text class="it" x="24" y="664">и крупные пещеровидные</text><text class="it" x="24" y="690">полости.</text><rect class="i-out" x="12" y="714" width="316" height="128" rx="6"/><text class="ih" x="24" y="746">Вывод</text><text class="it" x="24" y="772">Пустоты от сверлильщиков —</text><text class="it" x="24" y="798">кандидаты в первичные, но</text><text class="it" x="24" y="824">отнесение не однозначно.</text><rect class="i-warn" x="12" y="848" width="316" height="154" rx="6"/><text class="ih" x="24" y="880">Где ломается</text><text class="it" x="24" y="906">В тексте нет чисел о доле</text><text class="it" x="24" y="932">пустот или их размерах.</text><text class="it" x="24" y="958">«Нередко крупные» —</text><text class="it" x="24" y="984">качественная оценка.</text><rect class="i-warn" x="12" y="1008" width="316" height="128" rx="6"/><text class="ih" x="24" y="1040">Где ломается</text><text class="it" x="24" y="1066">Как пещеры и поры видны в</text><text class="it" x="24" y="1092">данных ГИС, этот текст не</text><text class="it" x="24" y="1118">описывает.</text><rect x="249" y="1154" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1175">схема</text></svg>