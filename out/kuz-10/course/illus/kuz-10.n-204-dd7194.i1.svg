<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1294" role="img" aria-label="Схема шага «Первичные поры: «придавленный стог»»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Первичные поры: «придавленный стог»»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Состав остатков: какие</text><text class="it" x="24" y="96">организмы образуют скелеты</text><text class="it" x="24" y="122">и каркас (кораллы,</text><text class="it" x="24" y="148">водоросли, раковины и</text><text class="it" x="24" y="174">др.).</text><rect class="i-in" x="12" y="198" width="316" height="180" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Расположение полостей:</text><text class="it" x="24" y="282">внутри скелета, между</text><text class="it" x="24" y="308">каркасом, между слойками,</text><text class="it" x="24" y="334">на контакте раковины с</text><text class="it" x="24" y="360">илом.</text><line class="ia" x1="170" y1="388" x2="170" y2="408"/><path class="iah" d="M170 414 l-6 -9 h12 z"/><rect class="i-node" x="12" y="418" width="316" height="76" rx="6"/><text class="it" x="24" y="450">Первичные поры:</text><text class="it" x="24" y="476">«придавленный стог»</text><line class="ia" x1="170" y1="498" x2="170" y2="518"/><path class="iah" d="M170 524 l-6 -9 h12 z"/><rect class="i-out" x="12" y="528" width="316" height="180" rx="6"/><text class="ih" x="24" y="560">Вывод</text><text class="it" x="24" y="586">Тип первичной пустоты:</text><text class="it" x="24" y="612">внутриформенная или</text><text class="it" x="24" y="638">межформенная, с</text><text class="it" x="24" y="664">щелевидной, линзовидной</text><text class="it" x="24" y="690">или иной формой.</text><rect class="i-out" x="12" y="714" width="316" height="154" rx="6"/><text class="ih" x="24" y="746">Вывод</text><text class="it" x="24" y="772">Оценка разнообразия</text><text class="it" x="24" y="798">пустотного пространства,</text><text class="it" x="24" y="824">от которого зависят типы и</text><text class="it" x="24" y="850">качество коллекторов.</text><rect class="i-warn" x="12" y="874" width="316" height="180" rx="6"/><text class="ih" x="24" y="906">Где ломается</text><text class="it" x="24" y="932">Фрагмент даёт качественное</text><text class="it" x="24" y="958">описание без величин</text><text class="it" x="24" y="984">пористости. По нему нельзя</text><text class="it" x="24" y="1010">рассчитать коэффициент</text><text class="it" x="24" y="1036">пористости.</text><rect class="i-warn" x="12" y="1060" width="316" height="180" rx="6"/><text class="ih" x="24" y="1092">Где ломается</text><text class="it" x="24" y="1118">Вторичная переработка</text><text class="it" x="24" y="1144">может менять поры. Тогда</text><text class="it" x="24" y="1170">по форме пустоты уже не</text><text class="it" x="24" y="1196">видно, была ли она</text><text class="it" x="24" y="1222">первичной.</text><rect x="249" y="1258" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1279">схема</text></svg>