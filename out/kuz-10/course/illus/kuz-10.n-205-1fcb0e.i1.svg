<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1406" role="img" aria-label="Схема шага «Каверны и карст: пустоты, созданные водой»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Каверны и карст: пустоты, созданные водой»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Проницаемость породы: по</text><text class="it" x="24" y="96">книге, у рифов она</text><text class="it" x="24" y="122">высокая.</text><rect class="i-in" x="12" y="146" width="316" height="154" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Химический состав породы:</text><text class="it" x="24" y="230">чистота химического</text><text class="it" x="24" y="256">состава влияет на</text><text class="it" x="24" y="282">растворение.</text><rect class="i-in" x="12" y="306" width="316" height="128" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Наличие глинистых и иных</text><text class="it" x="24" y="390">экранирующих пачек: у</text><text class="it" x="24" y="416">рифов их практически нет.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Каверны и карст: пустоты,</text><text class="it" x="24" y="532">созданные водой</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="128" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Каверновая пустотность как</text><text class="it" x="24" y="668">главный тип вторичной</text><text class="it" x="24" y="694">пористости рифа.</text><rect class="i-out" x="12" y="718" width="316" height="154" rx="6"/><text class="ih" x="24" y="750">Вывод</text><text class="it" x="24" y="776">Каверны разной формы,</text><text class="it" x="24" y="802">происхождения и размера:</text><text class="it" x="24" y="828">от долей миллиметра до</text><text class="it" x="24" y="854">крупных пещер.</text><rect class="i-out" x="12" y="878" width="316" height="128" rx="6"/><text class="ih" x="24" y="910">Вывод</text><text class="it" x="24" y="936">Отдельная запись</text><text class="it" x="24" y="962">каверновых пустот в</text><text class="it" x="24" y="988">описании пород.</text><rect class="i-warn" x="12" y="1012" width="316" height="180" rx="6"/><text class="ih" x="24" y="1044">Где ломается</text><text class="it" x="24" y="1070">Способность к</text><text class="it" x="24" y="1096">выщелачиванию определяется</text><text class="it" x="24" y="1122">рифом «во многом», а не</text><text class="it" x="24" y="1148">полностью — одних его</text><text class="it" x="24" y="1174">свойств мало.</text><rect class="i-warn" x="12" y="1198" width="316" height="154" rx="6"/><text class="ih" x="24" y="1230">Где ломается</text><text class="it" x="24" y="1256">Выход над уровнем моря</text><text class="it" x="24" y="1282">происходит «нередко»,</text><text class="it" x="24" y="1308">поэтому он не обязательное</text><text class="it" x="24" y="1334">условие карста.</text><rect x="249" y="1370" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1391">схема</text></svg>