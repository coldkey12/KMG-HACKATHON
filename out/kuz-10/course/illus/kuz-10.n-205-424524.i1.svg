<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1354" role="img" aria-label="Схема шага «Риф Рейнбоу А: как устроен пример»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Риф Рейнбоу А: как устроен пример»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Профильный разрез рифа с</text><text class="it" x="24" y="96">номерами типов известняков</text><text class="it" x="24" y="122">1–13 (панель а).</text><rect class="i-in" x="12" y="146" width="316" height="180" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Высота интервалов</text><text class="it" x="24" y="230">нефтенасыщения и</text><text class="it" x="24" y="256">газонасыщения: 90 м и 60 м</text><text class="it" x="24" y="282">при общей мощности 200–250</text><text class="it" x="24" y="308">м.</text><rect class="i-in" x="12" y="332" width="316" height="206" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Перечень типов пустот:</text><text class="it" x="24" y="416">межформенные и</text><text class="it" x="24" y="442">внутриформенные поры,</text><text class="it" x="24" y="468">мелкие каверны (ваги),</text><text class="it" x="24" y="494">пустоты-шаблоны (молдик),</text><text class="it" x="24" y="520">трещины.</text><line class="ia" x1="170" y1="548" x2="170" y2="568"/><path class="iah" d="M170 574 l-6 -9 h12 z"/><rect class="i-node" x="12" y="578" width="316" height="76" rx="6"/><text class="it" x="24" y="610">Риф Рейнбоу А: как устроен</text><text class="it" x="24" y="636">пример</text><line class="ia" x1="170" y1="658" x2="170" y2="678"/><path class="iah" d="M170 684 l-6 -9 h12 z"/><rect class="i-out" x="12" y="688" width="316" height="102" rx="6"/><text class="ih" x="24" y="720">Вывод</text><text class="it" x="24" y="746">Толщина зон нефти и газа в</text><text class="it" x="24" y="772">разрезе рифа.</text><rect class="i-out" x="12" y="796" width="316" height="102" rx="6"/><text class="ih" x="24" y="828">Вывод</text><text class="it" x="24" y="854">Литологическая схема</text><text class="it" x="24" y="880">разреза по номерам 1–13.</text><rect class="i-out" x="12" y="904" width="316" height="102" rx="6"/><text class="ih" x="24" y="936">Вывод</text><text class="it" x="24" y="962">Разделение рифа на ядро и</text><text class="it" x="24" y="988">шлейф.</text><rect class="i-warn" x="12" y="1012" width="316" height="128" rx="6"/><text class="ih" x="24" y="1044">Где ломается</text><text class="it" x="24" y="1070">Номера 1–13 не читаются</text><text class="it" x="24" y="1096">без легенды. Без неё тип</text><text class="it" x="24" y="1122">породы не определить.</text><rect class="i-warn" x="12" y="1146" width="316" height="154" rx="6"/><text class="ih" x="24" y="1178">Где ломается</text><text class="it" x="24" y="1204">Тип пустот не связан с</text><text class="it" x="24" y="1230">цифрами: доли и величины</text><text class="it" x="24" y="1256">по каждому типу в тексте</text><text class="it" x="24" y="1282">не даны.</text><rect x="249" y="1318" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1339">схема</text></svg>