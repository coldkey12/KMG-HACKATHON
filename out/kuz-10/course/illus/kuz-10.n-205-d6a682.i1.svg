<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1030" role="img" aria-label="Схема шага «Первичные поры не сохраняются»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Первичные поры не сохраняются»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Пористость рифового</text><text class="it" x="24" y="96">известняка по образцам</text><text class="it" x="24" y="122">керна или шлифов. Как</text><text class="it" x="24" y="148">именно её измеряют, в</text><text class="it" x="24" y="174">главе не описано.</text><rect class="i-in" x="12" y="198" width="316" height="154" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Описание того, чем</text><text class="it" x="24" y="282">заполнены пустоты: цемент,</text><text class="it" x="24" y="308">корки водорослей, детрит,</text><text class="it" x="24" y="334">поздние кристаллы.</text><line class="ia" x1="170" y1="362" x2="170" y2="382"/><path class="iah" d="M170 388 l-6 -9 h12 z"/><rect class="i-node" x="12" y="392" width="316" height="76" rx="6"/><text class="it" x="24" y="424">Первичные поры не</text><text class="it" x="24" y="450">сохраняются</text><line class="ia" x1="170" y1="472" x2="170" y2="492"/><path class="iah" d="M170 498 l-6 -9 h12 z"/><rect class="i-out" x="12" y="502" width="316" height="154" rx="6"/><text class="ih" x="24" y="534">Вывод</text><text class="it" x="24" y="560">Оценка того, какая часть</text><text class="it" x="24" y="586">пор могла быть первичной,</text><text class="it" x="24" y="612">а какая появилась или</text><text class="it" x="24" y="638">заполнилась позже.</text><rect class="i-warn" x="12" y="662" width="316" height="154" rx="6"/><text class="ih" x="24" y="694">Где ломается</text><text class="it" x="24" y="720">Одна измеренная пористость</text><text class="it" x="24" y="746">не показывает, когда и чем</text><text class="it" x="24" y="772">пустоты заполнены. Нужна</text><text class="it" x="24" y="798">история породы.</text><rect class="i-warn" x="12" y="822" width="316" height="154" rx="6"/><text class="ih" x="24" y="854">Где ломается</text><text class="it" x="24" y="880">Автор не даёт величин</text><text class="it" x="24" y="906">сокращения пористости,</text><text class="it" x="24" y="932">поэтому числа для таких</text><text class="it" x="24" y="958">оценок из главы не взять.</text><rect x="249" y="994" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1015">схема</text></svg>