<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1324" role="img" aria-label="Схема шага «Трещины на краю рифа дают высокие дебиты»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Трещины на краю рифа дают высокие дебиты»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Дебиты скважин, в первую</text><text class="it" x="24" y="96">очередь аномально высокие,</text><text class="it" x="24" y="122">сопоставленные с</text><text class="it" x="24" y="148">положением скважины на</text><text class="it" x="24" y="174">рифе.</text><rect class="i-in" x="12" y="198" width="316" height="128" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Плотность трещин по керну</text><text class="it" x="24" y="282">или по изображению стенки</text><text class="it" x="24" y="308">скважины.</text><rect class="i-in" x="12" y="332" width="316" height="128" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Карты пористости и</text><text class="it" x="24" y="416">проницаемости по</text><text class="it" x="24" y="442">фациальным зонам рифа.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Трещины на краю рифа дают</text><text class="it" x="24" y="558">высокие дебиты</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="180" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Пространственная картина:</text><text class="it" x="24" y="694">где проницаемость,</text><text class="it" x="24" y="720">по-видимому, выше — у</text><text class="it" x="24" y="746">гребня и склона, а не в</text><text class="it" x="24" y="772">центре.</text><rect class="i-out" x="12" y="796" width="316" height="128" rx="6"/><text class="ih" x="24" y="828">Вывод</text><text class="it" x="24" y="854">Предположение о</text><text class="it" x="24" y="880">трещиноватости как причине</text><text class="it" x="24" y="906">высоких дебитов.</text><rect class="i-warn" x="12" y="930" width="316" height="180" rx="6"/><text class="ih" x="24" y="962">Где ломается</text><text class="it" x="24" y="988">Трещины в тексте только</text><text class="it" x="24" y="1014">предполагаются, не</text><text class="it" x="24" y="1040">измерены. Дебит —</text><text class="it" x="24" y="1066">косвенный признак, а не</text><text class="it" x="24" y="1092">прямое доказательство.</text><rect class="i-warn" x="12" y="1116" width="316" height="154" rx="6"/><text class="ih" x="24" y="1148">Где ломается</text><text class="it" x="24" y="1174">Высокий дебит без трещин и</text><text class="it" x="24" y="1200">трещины без высокого</text><text class="it" x="24" y="1226">дебита данные могут</text><text class="it" x="24" y="1252">различить не всегда.</text><rect x="249" y="1288" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1309">схема</text></svg>