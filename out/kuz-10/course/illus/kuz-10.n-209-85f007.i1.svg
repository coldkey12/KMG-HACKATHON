<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1380" role="img" aria-label="Схема шага «Карачаганак: разные возрасты, разные коллекторы»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Карачаганак: разные возрасты, разные коллекторы»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Доля пор размером более</text><text class="it" x="24" y="96">0,1 мм в поровых</text><text class="it" x="24" y="122">коллекторах, % — по зонам</text><text class="it" x="24" y="148">рифа.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Средняя проницаемость</text><text class="it" x="24" y="256">поровых коллекторов, 10⁻¹⁵</text><text class="it" x="24" y="282">м².</text><rect class="i-in" x="12" y="306" width="316" height="154" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Кавернозность по</text><text class="it" x="24" y="390">скважинам: доля</text><text class="it" x="24" y="416">кавернозных пород, %</text><text class="it" x="24" y="442">(диапазон и среднее).</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="102" rx="6"/><text class="it" x="24" y="532">Карачаганак: разные</text><text class="it" x="24" y="558">возрасты, разные</text><text class="it" x="24" y="584">коллекторы</text><line class="ia" x1="170" y1="606" x2="170" y2="626"/><path class="iah" d="M170 632 l-6 -9 h12 z"/><rect class="i-out" x="12" y="636" width="316" height="128" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Сравнение значений между</text><text class="it" x="24" y="720">зонами одного рифа и между</text><text class="it" x="24" y="746">возрастными интервалами.</text><rect class="i-out" x="12" y="770" width="316" height="128" rx="6"/><text class="ih" x="24" y="802">Вывод</text><text class="it" x="24" y="828">Диапазон и среднее</text><text class="it" x="24" y="854">кавернозности по зонам:</text><text class="it" x="24" y="880">где её больше.</text><rect class="i-out" x="12" y="904" width="316" height="128" rx="6"/><text class="ih" x="24" y="936">Вывод</text><text class="it" x="24" y="962">Доля рифовой толщи,</text><text class="it" x="24" y="988">которая несёт коллектор,</text><text class="it" x="24" y="1014">по зонам.</text><rect class="i-warn" x="12" y="1038" width="316" height="128" rx="6"/><text class="ih" x="24" y="1070">Где ломается</text><text class="it" x="24" y="1096">В отдельных зонах мало</text><text class="it" x="24" y="1122">скважин: для шлейфа данные</text><text class="it" x="24" y="1148">одной скважины.</text><rect class="i-warn" x="12" y="1172" width="316" height="154" rx="6"/><text class="ih" x="24" y="1204">Где ломается</text><text class="it" x="24" y="1230">В атолловидном рифе</text><text class="it" x="24" y="1256">диапазоны гребня и склона</text><text class="it" x="24" y="1282">перекрываются: 13,2–57,5 %</text><text class="it" x="24" y="1308">и 10,1–40,4 %.</text><rect x="249" y="1344" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1365">схема</text></svg>