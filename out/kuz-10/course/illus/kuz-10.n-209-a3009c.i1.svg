<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1246" role="img" aria-label="Схема шага «Риф не однороден по высоте»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Риф не однороден по высоте»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Литологический профиль</text><text class="it" x="24" y="96">рифа по высоте (рис. 10.6,</text><text class="it" x="24" y="122">а).</text><rect class="i-in" x="12" y="146" width="316" height="154" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Профиль природного</text><text class="it" x="24" y="230">резервуара с</text><text class="it" x="24" y="256">коллекторскими свойствами</text><text class="it" x="24" y="282">по высоте (рис. 10.6, б).</text><rect class="i-in" x="12" y="306" width="316" height="154" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Легенда: типы пород и</text><text class="it" x="24" y="390">знаки промышленных</text><text class="it" x="24" y="416">коллекторов и</text><text class="it" x="24" y="442">полупокрышек.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="50" rx="6"/><text class="it" x="24" y="532">Риф не однороден по высоте</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="154" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Видно, какие интервалы по</text><text class="it" x="24" y="668">высоте — промышленные</text><text class="it" x="24" y="694">коллекторы, а какие —</text><text class="it" x="24" y="720">полупокрышки.</text><rect class="i-out" x="12" y="744" width="316" height="128" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Решение, можно ли в первом</text><text class="it" x="24" y="828">приближении считать</text><text class="it" x="24" y="854">резервуар массивным.</text><rect class="i-warn" x="12" y="878" width="316" height="128" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Один пример (Большетирская</text><text class="it" x="24" y="962">площадь) не даёт общего</text><text class="it" x="24" y="988">правила для всех рифов.</text><rect class="i-warn" x="12" y="1012" width="316" height="180" rx="6"/><text class="ih" x="24" y="1044">Где ломается</text><text class="it" x="24" y="1070">Для крупных и долго</text><text class="it" x="24" y="1096">растущих комплексов</text><text class="it" x="24" y="1122">картина может быть</text><text class="it" x="24" y="1148">сложнее; это разбирается</text><text class="it" x="24" y="1174">дальше.</text><rect x="249" y="1210" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1231">схема</text></svg>