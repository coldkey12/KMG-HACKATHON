<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1272" role="img" aria-label="Схема шага «Асимметричные системы: зоны смещаются»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Асимметричные системы: зоны смещаются»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Значения пористости и</text><text class="it" x="24" y="96">проницаемости породы по</text><text class="it" x="24" y="122">точкам разреза. По ним</text><text class="it" x="24" y="148">задаётся граница</text><text class="it" x="24" y="174">коллектора.</text><rect class="i-in" x="12" y="198" width="316" height="128" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Фациальный профиль: тип</text><text class="it" x="24" y="282">отложения в каждой точке.</text><text class="it" x="24" y="308">По нему видна зональность.</text><rect class="i-in" x="12" y="332" width="316" height="102" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Положение рифового гребня</text><text class="it" x="24" y="416">на разных этапах роста.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Асимметричные системы:</text><text class="it" x="24" y="532">зоны смещаются</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="154" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Класс точки: коллектор</text><text class="it" x="24" y="668">(пористость более 6 %,</text><text class="it" x="24" y="694">проницаемость более 0,0001</text><text class="it" x="24" y="720">мкм²) или неколлектор.</text><rect class="i-out" x="12" y="744" width="316" height="154" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Карта зон улучшенных</text><text class="it" x="24" y="828">коллекторов, которая</text><text class="it" x="24" y="854">смещается вместе с</text><text class="it" x="24" y="880">гребнем.</text><rect class="i-warn" x="12" y="904" width="316" height="154" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Порог задан для одного</text><text class="it" x="24" y="988">рисунка. При другом пороге</text><text class="it" x="24" y="1014">граница класса будет в</text><text class="it" x="24" y="1040">другом месте.</text><rect class="i-warn" x="12" y="1064" width="316" height="154" rx="6"/><text class="ih" x="24" y="1096">Где ломается</text><text class="it" x="24" y="1122">Карта одного момента</text><text class="it" x="24" y="1148">времени не описывает</text><text class="it" x="24" y="1174">другой момент. Нужны срезы</text><text class="it" x="24" y="1200">для разных этапов роста.</text><rect x="249" y="1236" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1257">схема</text></svg>