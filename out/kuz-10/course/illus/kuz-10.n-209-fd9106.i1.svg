<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1350" role="img" aria-label="Схема шага «Риф то под водой, то остров»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Риф то под водой, то остров»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Литология интервалов:</text><text class="it" x="24" y="96">морские осадки, обломочные</text><text class="it" x="24" y="122">и оолитовые карбонатные</text><text class="it" x="24" y="148">осадки, эоловые</text><text class="it" x="24" y="174">отсортированные обломки.</text><rect class="i-in" x="12" y="198" width="316" height="154" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Признаки субаэрального</text><text class="it" x="24" y="282">выветривания,</text><text class="it" x="24" y="308">выщелачивания и</text><text class="it" x="24" y="334">карстования по разрезу.</text><rect class="i-in" x="12" y="358" width="316" height="154" rx="6"/><text class="ih" x="24" y="390">Вход</text><text class="it" x="24" y="416">Пористость и проницаемость</text><text class="it" x="24" y="442">интервалов, связанные с</text><text class="it" x="24" y="468">типом пустотного</text><text class="it" x="24" y="494">пространства.</text><line class="ia" x1="170" y1="522" x2="170" y2="542"/><path class="iah" d="M170 548 l-6 -9 h12 z"/><rect class="i-node" x="12" y="552" width="316" height="76" rx="6"/><text class="it" x="24" y="584">Риф то под водой, то</text><text class="it" x="24" y="610">остров</text><line class="ia" x1="170" y1="632" x2="170" y2="652"/><path class="iah" d="M170 658 l-6 -9 h12 z"/><rect class="i-out" x="12" y="662" width="316" height="154" rx="6"/><text class="ih" x="24" y="694">Вывод</text><text class="it" x="24" y="720">Разрез, разбитый на</text><text class="it" x="24" y="746">интервалы разной</text><text class="it" x="24" y="772">обстановки: плато, отмель,</text><text class="it" x="24" y="798">остров.</text><rect class="i-out" x="12" y="822" width="316" height="128" rx="6"/><text class="ih" x="24" y="854">Вывод</text><text class="it" x="24" y="880">Пласты зоны выщелачивания,</text><text class="it" x="24" y="906">которые лежат слоями, а не</text><text class="it" x="24" y="932">одним телом.</text><rect class="i-warn" x="12" y="956" width="316" height="206" rx="6"/><text class="ih" x="24" y="988">Где ломается</text><text class="it" x="24" y="1014">Похожие по виду породы</text><text class="it" x="24" y="1040">могут образоваться в</text><text class="it" x="24" y="1066">разных обстановках. Одного</text><text class="it" x="24" y="1092">типа породы может быть</text><text class="it" x="24" y="1118">недостаточно для вывода об</text><text class="it" x="24" y="1144">обстановке.</text><rect class="i-warn" x="12" y="1168" width="316" height="128" rx="6"/><text class="ih" x="24" y="1200">Где ломается</text><text class="it" x="24" y="1226">Конкретный порог мощности</text><text class="it" x="24" y="1252">зоны выщелачивания в этом</text><text class="it" x="24" y="1278">фрагменте не назван.</text><rect x="249" y="1314" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1335">схема</text></svg>