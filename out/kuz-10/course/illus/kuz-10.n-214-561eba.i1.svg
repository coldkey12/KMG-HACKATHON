<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 762" role="img" aria-label="Схема шага «Вторая причина слоистости рифа»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Вторая причина слоистости рифа»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="206" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Описание разреза рифа</text><text class="it" x="24" y="96">(керн или геологическое</text><text class="it" x="24" y="122">описание): какие пачки</text><text class="it" x="24" y="148">лежат друг над другом,</text><text class="it" x="24" y="174">биогермные, детритовые,</text><text class="it" x="24" y="200">микрозернистые известняки.</text><line class="ia" x1="170" y1="228" x2="170" y2="248"/><path class="iah" d="M170 254 l-6 -9 h12 z"/><rect class="i-node" x="12" y="258" width="316" height="76" rx="6"/><text class="it" x="24" y="290">Вторая причина слоистости</text><text class="it" x="24" y="316">рифа</text><line class="ia" x1="170" y1="338" x2="170" y2="358"/><path class="iah" d="M170 364 l-6 -9 h12 z"/><rect class="i-out" x="12" y="368" width="316" height="154" rx="6"/><text class="ih" x="24" y="400">Вывод</text><text class="it" x="24" y="426">Слоистая картина по</text><text class="it" x="24" y="452">разрезу: пачки с разной</text><text class="it" x="24" y="478">пустотностью и разными</text><text class="it" x="24" y="504">коллекторскими свойствами.</text><rect class="i-warn" x="12" y="528" width="316" height="180" rx="6"/><text class="ih" x="24" y="560">Где ломается</text><text class="it" x="24" y="586">Вторичная</text><text class="it" x="24" y="612">перекристаллизация и</text><text class="it" x="24" y="638">доломитизация усложняют</text><text class="it" x="24" y="664">картину слоёв, но обычно</text><text class="it" x="24" y="690">не стирают неоднородность.</text><rect x="249" y="726" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="747">схема</text></svg>