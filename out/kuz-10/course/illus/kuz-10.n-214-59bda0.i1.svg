<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1004" role="img" aria-label="Схема шага «Как флюид движется внутри рифа»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Как флюид движется внутри рифа»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Форма и размер рифа:</text><text class="it" x="24" y="96">небольшой купол или мощное</text><text class="it" x="24" y="122">тело.</text><rect class="i-in" x="12" y="146" width="316" height="154" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Расслоение разреза: где</text><text class="it" x="24" y="230">чередуются пористые и</text><text class="it" x="24" y="256">плотные зоны. Источник —</text><text class="it" x="24" y="282">скважинные данные.</text><line class="ia" x1="170" y1="310" x2="170" y2="330"/><path class="iah" d="M170 336 l-6 -9 h12 z"/><rect class="i-node" x="12" y="340" width="316" height="76" rx="6"/><text class="it" x="24" y="372">Как флюид движется внутри</text><text class="it" x="24" y="398">рифа</text><line class="ia" x1="170" y1="420" x2="170" y2="440"/><path class="iah" d="M170 446 l-6 -9 h12 z"/><rect class="i-out" x="12" y="450" width="316" height="154" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Оценка того, есть ли</text><text class="it" x="24" y="534">вероятная вертикальная</text><text class="it" x="24" y="560">связь между пористыми</text><text class="it" x="24" y="586">зонами.</text><rect class="i-warn" x="12" y="610" width="316" height="154" rx="6"/><text class="ih" x="24" y="642">Где ломается</text><text class="it" x="24" y="668">Условие «может быть</text><text class="it" x="24" y="694">затруднена» не всегда</text><text class="it" x="24" y="720">выполняется. Порогов в</text><text class="it" x="24" y="746">тексте нет.</text><rect class="i-warn" x="12" y="770" width="316" height="180" rx="6"/><text class="ih" x="24" y="802">Где ломается</text><text class="it" x="24" y="828">Вертикальная связь может</text><text class="it" x="24" y="854">идти и через трещины, а не</text><text class="it" x="24" y="880">только через поры. Это</text><text class="it" x="24" y="906">выходит за рамки данного</text><text class="it" x="24" y="932">фрагмента.</text><rect x="249" y="968" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="989">схема</text></svg>