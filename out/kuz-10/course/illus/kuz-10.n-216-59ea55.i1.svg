<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1164" role="img" aria-label="Схема шага «Где в рифе лучше течёт флюид»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Где в рифе лучше течёт флюид»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Тип рифа: плосковершинный</text><text class="it" x="24" y="96">или атолловидный (кольцо)</text><text class="it" x="24" y="122">либо асимметричная система</text><text class="it" x="24" y="148">(полоса).</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Свойства пород по</text><text class="it" x="24" y="256">участкам: гребень, верхний</text><text class="it" x="24" y="282">склон, центр, лагуна,</text><text class="it" x="24" y="308">зарифовые отложения.</text><line class="ia" x1="170" y1="336" x2="170" y2="356"/><path class="iah" d="M170 362 l-6 -9 h12 z"/><rect class="i-node" x="12" y="366" width="316" height="76" rx="6"/><text class="it" x="24" y="398">Где в рифе лучше течёт</text><text class="it" x="24" y="424">флюид</text><line class="ia" x1="170" y1="446" x2="170" y2="466"/><path class="iah" d="M170 472 l-6 -9 h12 z"/><rect class="i-out" x="12" y="476" width="316" height="154" rx="6"/><text class="ih" x="24" y="508">Вывод</text><text class="it" x="24" y="534">Форма зоны лучших</text><text class="it" x="24" y="560">коллекторов в плане:</text><text class="it" x="24" y="586">кольцо или линия вдоль</text><text class="it" x="24" y="612">простирания рифов.</text><rect class="i-out" x="12" y="636" width="316" height="128" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Оценка, где фильтрация</text><text class="it" x="24" y="720">лучше, а где затруднена</text><text class="it" x="24" y="746">или невозможна.</text><rect class="i-warn" x="12" y="770" width="316" height="154" rx="6"/><text class="ih" x="24" y="802">Где ломается</text><text class="it" x="24" y="828">Центр рифа и лагуна:</text><text class="it" x="24" y="854">фильтрация затруднена или</text><text class="it" x="24" y="880">невозможна, но степень в</text><text class="it" x="24" y="906">тексте не задана числом.</text><rect class="i-warn" x="12" y="930" width="316" height="180" rx="6"/><text class="ih" x="24" y="962">Где ломается</text><text class="it" x="24" y="988">Зарифовые отложения:</text><text class="it" x="24" y="1014">бедные порами или</text><text class="it" x="24" y="1040">непроницаемые. Граница</text><text class="it" x="24" y="1066">между этими случаями в</text><text class="it" x="24" y="1092">тексте не проведена.</text><rect x="249" y="1128" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1149">схема</text></svg>