<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 926" role="img" aria-label="Схема шага «Когда ловушку создаёт тектоника, а не риф»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Когда ловушку создаёт тектоника, а не риф»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Карта или разрез рифового</text><text class="it" x="24" y="96">тела с отметками кровли и</text><text class="it" x="24" y="122">контуром локального</text><text class="it" x="24" y="148">поднятия над ним.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Оценка первичной высоты</text><text class="it" x="24" y="256">постройки: заметна она или</text><text class="it" x="24" y="282">её нет (биостром).</text><line class="ia" x1="170" y1="310" x2="170" y2="330"/><path class="iah" d="M170 336 l-6 -9 h12 z"/><rect class="i-node" x="12" y="340" width="316" height="76" rx="6"/><text class="it" x="24" y="372">Когда ловушку создаёт</text><text class="it" x="24" y="398">тектоника, а не риф</text><line class="ia" x1="170" y1="420" x2="170" y2="440"/><path class="iah" d="M170 446 l-6 -9 h12 z"/><rect class="i-out" x="12" y="450" width="316" height="128" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Вывод: ловушку создала</text><text class="it" x="24" y="534">наложенная тектоника, а не</text><text class="it" x="24" y="560">высота самого рифа.</text><rect class="i-warn" x="12" y="584" width="316" height="128" rx="6"/><text class="ih" x="24" y="616">Где ломается</text><text class="it" x="24" y="642">Если локального поднятия</text><text class="it" x="24" y="668">нет, правило не даёт</text><text class="it" x="24" y="694">вывода о ловушке.</text><rect class="i-warn" x="12" y="718" width="316" height="154" rx="6"/><text class="ih" x="24" y="750">Где ломается</text><text class="it" x="24" y="776">По карте и разрезу низкий</text><text class="it" x="24" y="802">биогерм и биостром могут</text><text class="it" x="24" y="828">выглядеть похоже. Различие</text><text class="it" x="24" y="854">этот абзац не разбирает.</text><rect x="249" y="890" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="911">схема</text></svg>