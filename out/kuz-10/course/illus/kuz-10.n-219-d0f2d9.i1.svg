<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1510" role="img" aria-label="Схема шага «Какой высоты может быть залежь в рифе»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Какой высоты может быть залежь в рифе»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="206" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Морфология рифа: одиночный</text><text class="it" x="24" y="96">куполовидный,</text><text class="it" x="24" y="122">плосковершинный,</text><text class="it" x="24" y="148">атолловидный или</text><text class="it" x="24" y="174">асимметричная система</text><text class="it" x="24" y="200">(краевой или барьерный).</text><rect class="i-in" x="12" y="224" width="316" height="102" rx="6"/><text class="ih" x="24" y="256">Вход</text><text class="it" x="24" y="282">Превышение рифа над</text><text class="it" x="24" y="308">окружающими отложениями.</text><rect class="i-in" x="12" y="332" width="316" height="154" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Проницаемы или</text><text class="it" x="24" y="416">непроницаемы отложения за</text><text class="it" x="24" y="442">пределами рифа</text><text class="it" x="24" y="468">(латеральный экран).</text><line class="ia" x1="170" y1="496" x2="170" y2="516"/><path class="iah" d="M170 522 l-6 -9 h12 z"/><rect class="i-node" x="12" y="526" width="316" height="76" rx="6"/><text class="it" x="24" y="558">Какой высоты может быть</text><text class="it" x="24" y="584">залежь в рифе</text><line class="ia" x1="170" y1="606" x2="170" y2="626"/><path class="iah" d="M170 632 l-6 -9 h12 z"/><rect class="i-out" x="12" y="636" width="316" height="180" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Максимально возможная</text><text class="it" x="24" y="720">нефтенасыщенная мощность</text><text class="it" x="24" y="746">(высота залежи): от</text><text class="it" x="24" y="772">превышения рифа до почти</text><text class="it" x="24" y="798">полной мощности рифа.</text><rect class="i-out" x="12" y="822" width="316" height="102" rx="6"/><text class="ih" x="24" y="854">Вывод</text><text class="it" x="24" y="880">Возможная высокая висячая</text><text class="it" x="24" y="906">залежь в барьерном рифе.</text><rect class="i-out" x="12" y="930" width="316" height="128" rx="6"/><text class="ih" x="24" y="962">Вывод</text><text class="it" x="24" y="988">Увеличенная высота залежи</text><text class="it" x="24" y="1014">после тектонического</text><text class="it" x="24" y="1040">формирования структуры.</text><rect class="i-warn" x="12" y="1064" width="316" height="180" rx="6"/><text class="ih" x="24" y="1096">Где ломается</text><text class="it" x="24" y="1122">Текст не даёт числовых</text><text class="it" x="24" y="1148">порогов: высота описана</text><text class="it" x="24" y="1174">словами «может быть</text><text class="it" x="24" y="1200">равна», «возможно», «как</text><text class="it" x="24" y="1226">правило».</text><rect class="i-warn" x="12" y="1250" width="316" height="206" rx="6"/><text class="ih" x="24" y="1282">Где ломается</text><text class="it" x="24" y="1308">Высоту, найденную по</text><text class="it" x="24" y="1334">рельефу древнего рифа,</text><text class="it" x="24" y="1360">нельзя принимать за</text><text class="it" x="24" y="1386">современную высоту залежи</text><text class="it" x="24" y="1412">без учёта позднейшей</text><text class="it" x="24" y="1438">тектоники.</text><rect x="249" y="1474" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1495">схема</text></svg>