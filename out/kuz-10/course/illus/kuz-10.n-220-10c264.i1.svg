<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1216" role="img" aria-label="Схема шага «Группа 2: столовые рифы и атоллы — край»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Группа 2: столовые рифы и атоллы — край»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Геологические и</text><text class="it" x="24" y="96">геофизические материалы:</text><text class="it" x="24" y="122">признаки крупного</text><text class="it" x="24" y="148">столового рифа или атолла.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Результат первых скважин:</text><text class="it" x="24" y="256">нашли ли залежь в центре</text><text class="it" x="24" y="282">или на периферии.</text><line class="ia" x1="170" y1="310" x2="170" y2="330"/><path class="iah" d="M170 336 l-6 -9 h12 z"/><rect class="i-node" x="12" y="340" width="316" height="76" rx="6"/><text class="it" x="24" y="372">Группа 2: столовые рифы и</text><text class="it" x="24" y="398">атоллы — край</text><line class="ia" x1="170" y1="420" x2="170" y2="440"/><path class="iah" d="M170 446 l-6 -9 h12 z"/><rect class="i-out" x="12" y="450" width="316" height="154" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Решение, где ставить</text><text class="it" x="24" y="534">первые скважины: на</text><text class="it" x="24" y="560">периферии предполагаемой</text><text class="it" x="24" y="586">ловушки или в центре.</text><rect class="i-out" x="12" y="610" width="316" height="154" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Набор оценочных скважин по</text><text class="it" x="24" y="694">периферии для</text><text class="it" x="24" y="720">предварительной оценки</text><text class="it" x="24" y="746">залежи.</text><rect class="i-warn" x="12" y="770" width="316" height="180" rx="6"/><text class="ih" x="24" y="802">Где ломается</text><text class="it" x="24" y="828">Залежь первыми скважинами</text><text class="it" x="24" y="854">не всегда обнаруживается</text><text class="it" x="24" y="880">из-за плотности</text><text class="it" x="24" y="906">внутририфовых и лагунных</text><text class="it" x="24" y="932">отложений.</text><rect class="i-warn" x="12" y="956" width="316" height="206" rx="6"/><text class="ih" x="24" y="988">Где ломается</text><text class="it" x="24" y="1014">Правило периферийного</text><text class="it" x="24" y="1040">бурения опирается на</text><text class="it" x="24" y="1066">предположение о крупном</text><text class="it" x="24" y="1092">столовом или атолловидном</text><text class="it" x="24" y="1118">рифе. Иначе порядок</text><text class="it" x="24" y="1144">другой.</text><rect x="249" y="1180" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1201">схема</text></svg>