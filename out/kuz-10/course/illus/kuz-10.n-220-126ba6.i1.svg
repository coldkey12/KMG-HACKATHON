<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1034" role="img" aria-label="Схема шага «Тип рифа определяет, как его разведывать»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Тип рифа определяет, как его разведывать»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Данные разведочной</text><text class="it" x="24" y="96">геофизики, в частности</text><text class="it" x="24" y="122">сейсмики, о строении рифа</text><rect class="i-in" x="12" y="146" width="316" height="154" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Предварительная</text><text class="it" x="24" y="230">интерпретация: какой тип</text><text class="it" x="24" y="256">рифа соответствует картине</text><text class="it" x="24" y="282">по сейсмике</text><line class="ia" x1="170" y1="310" x2="170" y2="330"/><path class="iah" d="M170 336 l-6 -9 h12 z"/><rect class="i-node" x="12" y="340" width="316" height="76" rx="6"/><text class="it" x="24" y="372">Тип рифа определяет, как</text><text class="it" x="24" y="398">его разведывать</text><line class="ia" x1="170" y1="420" x2="170" y2="440"/><path class="iah" d="M170 446 l-6 -9 h12 z"/><rect class="i-out" x="12" y="450" width="316" height="102" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Вероятный тип ловушки и</text><text class="it" x="24" y="534">тип рифового резервуара</text><rect class="i-out" x="12" y="558" width="316" height="128" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Стратегия разведки: где и</text><text class="it" x="24" y="642">на каком этапе размещать</text><text class="it" x="24" y="668">скважины</text><rect class="i-warn" x="12" y="692" width="316" height="128" rx="6"/><text class="ih" x="24" y="724">Где ломается</text><text class="it" x="24" y="750">Тип рифа определяется</text><text class="it" x="24" y="776">достаточно достоверно, а</text><text class="it" x="24" y="802">не точно</text><rect class="i-warn" x="12" y="826" width="316" height="154" rx="6"/><text class="ih" x="24" y="858">Где ломается</text><text class="it" x="24" y="884">Тип ловушки и резервуара</text><text class="it" x="24" y="910">только прогнозируется, по</text><text class="it" x="24" y="936">сейсмике напрямую не</text><text class="it" x="24" y="962">измеряется</text><rect x="249" y="998" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1019">схема</text></svg>