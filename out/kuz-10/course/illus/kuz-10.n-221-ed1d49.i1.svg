<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1324" role="img" aria-label="Схема шага «Самое слабое место ловушки»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Самое слабое место ловушки»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Положение тыльно-рифовой и</text><text class="it" x="24" y="96">предрифовой зон</text><text class="it" x="24" y="122">относительно рифа: какие</text><text class="it" x="24" y="148">фации выше по высоте.</text><rect class="i-in" x="12" y="172" width="316" height="180" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Наличие перегиба, его</text><text class="it" x="24" y="256">амплитуда и возможность</text><text class="it" x="24" y="282">литологического экрана по</text><text class="it" x="24" y="308">данным скважин в</text><text class="it" x="24" y="334">тыльно-рифовой зоне.</text><rect class="i-in" x="12" y="358" width="316" height="154" rx="6"/><text class="ih" x="24" y="390">Вход</text><text class="it" x="24" y="416">Направление регионального</text><text class="it" x="24" y="442">наклона относительно</text><text class="it" x="24" y="468">пологого зарифового</text><text class="it" x="24" y="494">склона.</text><line class="ia" x1="170" y1="522" x2="170" y2="542"/><path class="iah" d="M170 548 l-6 -9 h12 z"/><rect class="i-node" x="12" y="552" width="316" height="50" rx="6"/><text class="it" x="24" y="584">Самое слабое место ловушки</text><line class="ia" x1="170" y1="606" x2="170" y2="626"/><path class="iah" d="M170 632 l-6 -9 h12 z"/><rect class="i-out" x="12" y="636" width="316" height="180" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Место критического</text><text class="it" x="24" y="720">направления:</text><text class="it" x="24" y="746">тыльно-рифовая зона или,</text><text class="it" x="24" y="772">при противоположном</text><text class="it" x="24" y="798">наклоне, предрифовая зона.</text><rect class="i-out" x="12" y="822" width="316" height="128" rx="6"/><text class="ih" x="24" y="854">Вывод</text><text class="it" x="24" y="880">Оценка возможности</text><text class="it" x="24" y="906">сохранения залежи и её</text><text class="it" x="24" y="932">вероятной высоты.</text><rect class="i-warn" x="12" y="956" width="316" height="154" rx="6"/><text class="ih" x="24" y="988">Где ломается</text><text class="it" x="24" y="1014">Если предрифовые фации</text><text class="it" x="24" y="1040">выше рифовых, изучение</text><text class="it" x="24" y="1066">переходит в предрифовую</text><text class="it" x="24" y="1092">зону.</text><rect class="i-warn" x="12" y="1116" width="316" height="154" rx="6"/><text class="ih" x="24" y="1148">Где ломается</text><text class="it" x="24" y="1174">Без литологического экрана</text><text class="it" x="24" y="1200">высота залежи не</text><text class="it" x="24" y="1226">увеличивается за счёт</text><text class="it" x="24" y="1252">него.</text><rect x="249" y="1288" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1309">схема</text></svg>