<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1328" role="img" aria-label="Схема шага «Сетка скважин: объём важнее площади»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Сетка скважин: объём важнее площади»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Положение скважин</text><text class="it" x="24" y="96">относительно сводовой</text><text class="it" x="24" y="122">части залежи.</text><rect class="i-in" x="12" y="146" width="316" height="154" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Параметры, полученные по</text><text class="it" x="24" y="230">скважинам; их</text><text class="it" x="24" y="256">достоверность растёт с</text><text class="it" x="24" y="282">числом скважин в центре.</text><rect class="i-in" x="12" y="306" width="316" height="128" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Контур залежи и её</text><text class="it" x="24" y="390">приконтурная зона на</text><text class="it" x="24" y="416">карте.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Сетка скважин: объём</text><text class="it" x="24" y="532">важнее площади</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="102" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Сетка, густая в своде и</text><text class="it" x="24" y="668">редкая у края.</text><rect class="i-out" x="12" y="692" width="316" height="128" rx="6"/><text class="ih" x="24" y="724">Вывод</text><text class="it" x="24" y="750">Более надёжные параметры</text><text class="it" x="24" y="776">для подсчёта запасов и</text><text class="it" x="24" y="802">проекта разработки.</text><rect class="i-out" x="12" y="826" width="316" height="154" rx="6"/><text class="ih" x="24" y="858">Вывод</text><text class="it" x="24" y="884">Меньше бурения</text><text class="it" x="24" y="910">приконтурных скважин,</text><text class="it" x="24" y="936">малоэффективных для</text><text class="it" x="24" y="962">разведки.</text><rect class="i-warn" x="12" y="986" width="316" height="128" rx="6"/><text class="ih" x="24" y="1018">Где ломается</text><text class="it" x="24" y="1044">Правило сформулировано как</text><text class="it" x="24" y="1070">допущение о цели: освещать</text><text class="it" x="24" y="1096">объём, а не площадь.</text><rect class="i-warn" x="12" y="1120" width="316" height="154" rx="6"/><text class="ih" x="24" y="1152">Где ломается</text><text class="it" x="24" y="1178">Если скважин в центре</text><text class="it" x="24" y="1204">мало, параметры для</text><text class="it" x="24" y="1230">подсчёта запасов</text><text class="it" x="24" y="1256">ненадёжны.</text><rect x="249" y="1292" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1313">схема</text></svg>