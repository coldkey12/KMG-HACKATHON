<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1224" role="img" aria-label="Схема шага «Диаметр скважины как признак породы»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Диаметр скважины как признак породы»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Фактический диаметр</text><text class="it" x="24" y="96">скважины d_c по глубине.</text><rect class="i-in" x="12" y="120" width="316" height="102" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Номинальный диаметр d_a</text><text class="it" x="24" y="204">как эталон для сравнения.</text><rect class="i-in" x="12" y="228" width="316" height="154" rx="6"/><text class="ih" x="24" y="260">Вход</text><text class="it" x="24" y="286">Фактический диаметр</text><text class="it" x="24" y="312">измеряют каверномером;</text><text class="it" x="24" y="338">запись называют</text><text class="it" x="24" y="364">кавернограммой.</text><line class="ia" x1="170" y1="392" x2="170" y2="412"/><path class="iah" d="M170 418 l-6 -9 h12 z"/><rect class="i-node" x="12" y="422" width="316" height="76" rx="6"/><text class="it" x="24" y="454">Диаметр скважины как</text><text class="it" x="24" y="480">признак породы</text><line class="ia" x1="170" y1="502" x2="170" y2="522"/><path class="iah" d="M170 528 l-6 -9 h12 z"/><rect class="i-out" x="12" y="532" width="316" height="128" rx="6"/><text class="ih" x="24" y="564">Вывод</text><text class="it" x="24" y="590">d_c &lt; d_a: межзерновой</text><text class="it" x="24" y="616">коллектор с глинистой</text><text class="it" x="24" y="642">коркой.</text><rect class="i-out" x="12" y="666" width="316" height="102" rx="6"/><text class="ih" x="24" y="698">Вывод</text><text class="it" x="24" y="724">d_c = d_a: плотная</text><text class="it" x="24" y="750">сцементированная порода.</text><rect class="i-out" x="12" y="774" width="316" height="128" rx="6"/><text class="ih" x="24" y="806">Вывод</text><text class="it" x="24" y="832">d_c &gt; d_a: глина,</text><text class="it" x="24" y="858">трещиноватая порода, карст</text><text class="it" x="24" y="884">или растворимая соль.</text><rect class="i-warn" x="12" y="908" width="316" height="154" rx="6"/><text class="ih" x="24" y="940">Где ломается</text><text class="it" x="24" y="966">Рост диаметра есть в</text><text class="it" x="24" y="992">разных породах. Один знак</text><text class="it" x="24" y="1018">отклонения не выбирает</text><text class="it" x="24" y="1044">единственную породу.</text><rect class="i-warn" x="12" y="1068" width="316" height="102" rx="6"/><text class="ih" x="24" y="1100">Где ломается</text><text class="it" x="24" y="1126">Признаки описаны только</text><text class="it" x="24" y="1152">для глинистого раствора.</text><rect x="249" y="1188" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1209">схема</text></svg>