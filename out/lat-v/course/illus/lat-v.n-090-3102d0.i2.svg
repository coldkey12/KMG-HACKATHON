<svg viewBox="0 0 340 280" role="img" aria-label="Условные цвета шага «Диаметр скважины как признак породы»: глина, соль, плотная порода, фильтрат раствора." xmlns="http://www.w3.org/2000/svg"><title>Условные цвета шага «Диаметр скважины как признак породы»: глина, соль, плотная порода, фильтрат раствора.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><text class="ih" x="12" y="32">Породы</text><rect class="isw" x="12" y="44" width="44" height="28" rx="4" fill="#6B8E5A"/><text class="it" x="68" y="65">глина</text><rect class="isw" x="12" y="82" width="44" height="28" rx="4" fill="#C9D6DF"/><text class="it" x="68" y="103">соль</text><rect class="isw" x="12" y="120" width="44" height="28" rx="4" fill="#8C7B6B"/><text class="it" x="68" y="141">плотная порода</text><text class="ih" x="12" y="182">Флюиды</text><rect class="isw" x="12" y="194" width="44" height="28" rx="4" fill="#9BD7F5"/><text class="it" x="68" y="215">фильтрат раствора</text><rect x="249" y="244" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="265">схема</text></svg>