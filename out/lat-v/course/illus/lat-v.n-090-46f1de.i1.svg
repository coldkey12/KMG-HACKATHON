<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1112" role="img" aria-label="Схема шага «Что ГИС должна сказать о разрезе»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Что ГИС должна сказать о разрезе»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Данные геофизических</text><text class="it" x="24" y="96">исследований поисковых,</text><text class="it" x="24" y="122">разведочных и</text><text class="it" x="24" y="148">эксплуатационных скважин</text><text class="it" x="24" y="174">на нефть и газ.</text><line class="ia" x1="170" y1="202" x2="170" y2="222"/><path class="iah" d="M170 228 l-6 -9 h12 z"/><rect class="i-node" x="12" y="232" width="316" height="76" rx="6"/><text class="it" x="24" y="264">Что ГИС должна сказать о</text><text class="it" x="24" y="290">разрезе</text><line class="ia" x1="170" y1="312" x2="170" y2="332"/><path class="iah" d="M170 338 l-6 -9 h12 z"/><rect class="i-out" x="12" y="342" width="316" height="102" rx="6"/><text class="ih" x="24" y="374">Вывод</text><text class="it" x="24" y="400">Литологический разрез</text><text class="it" x="24" y="426">скважины.</text><rect class="i-out" x="12" y="450" width="316" height="102" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Выделенные коллекторы и</text><text class="it" x="24" y="534">характер их насыщения.</text><rect class="i-out" x="12" y="558" width="316" height="154" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Эффективная толщина,</text><text class="it" x="24" y="642">коэффициенты пористости и</text><text class="it" x="24" y="668">насыщения нефтью или</text><text class="it" x="24" y="694">газом.</text><rect class="i-warn" x="12" y="718" width="316" height="154" rx="6"/><text class="ih" x="24" y="750">Где ломается</text><text class="it" x="24" y="776">Разные задачи требуют</text><text class="it" x="24" y="802">разных признаков, поэтому</text><text class="it" x="24" y="828">один показатель не даёт</text><text class="it" x="24" y="854">всех ответов.</text><rect class="i-warn" x="12" y="878" width="316" height="180" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Вопрос о контактах связан</text><text class="it" x="24" y="962">в тексте с</text><text class="it" x="24" y="988">эксплуатационными</text><text class="it" x="24" y="1014">скважинами, а не со всеми</text><text class="it" x="24" y="1040">скважинами.</text><rect x="249" y="1076" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1097">схема</text></svg>