<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1298" role="img" aria-label="Схема шага «Водоотдача — главный параметр раствора»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Водоотдача — главный параметр раствора»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Водоотдача раствора в</text><text class="it" x="24" y="96">см³/ч из данных о растворе</text><text class="it" x="24" y="122">(отчёта буровой).</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Тип раствора: водоотдача в</text><text class="it" x="24" y="230">тексте описана для</text><text class="it" x="24" y="256">глинистого раствора.</text><rect class="i-in" x="12" y="280" width="316" height="154" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Плотность раствора и</text><text class="it" x="24" y="364">минерализация фильтрата —</text><text class="it" x="24" y="390">входные параметры рядом с</text><text class="it" x="24" y="416">водоотдачей.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Водоотдача — главный</text><text class="it" x="24" y="532">параметр раствора</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="180" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Оценка условий изучения:</text><text class="it" x="24" y="668">благоприятные при 4—8</text><text class="it" x="24" y="694">см³/ч, крайне</text><text class="it" x="24" y="720">неблагоприятные при 20</text><text class="it" x="24" y="746">см³/ч.</text><rect class="i-out" x="12" y="770" width="316" height="128" rx="6"/><text class="ih" x="24" y="802">Вывод</text><text class="it" x="24" y="828">Вывод, можно ли оценивать</text><text class="it" x="24" y="854">продуктивность глубинными</text><text class="it" x="24" y="880">электрическими методами.</text><rect class="i-warn" x="12" y="904" width="316" height="154" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Значения между 8 и 20</text><text class="it" x="24" y="988">см³/ч текст не разбирает:</text><text class="it" x="24" y="1014">граница условий в книге не</text><text class="it" x="24" y="1040">задана.</text><rect class="i-warn" x="12" y="1064" width="316" height="180" rx="6"/><text class="ih" x="24" y="1096">Где ломается</text><text class="it" x="24" y="1122">Плотность и минерализация</text><text class="it" x="24" y="1148">фильтрата тоже меняют</text><text class="it" x="24" y="1174">результат; по одной</text><text class="it" x="24" y="1200">водоотдаче оценку не</text><text class="it" x="24" y="1226">делают.</text><rect x="249" y="1262" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1283">схема</text></svg>