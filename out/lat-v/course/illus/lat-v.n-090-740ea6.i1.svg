<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 930" role="img" aria-label="Схема шага «Плотность раствора давит на пласт»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Плотность раствора давит на пласт»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Плотность глинистого</text><text class="it" x="24" y="96">раствора δp.</text><rect class="i-in" x="12" y="120" width="316" height="102" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Пластовое давление p_пл на</text><text class="it" x="24" y="204">заданной глубине.</text><line class="ia" x1="170" y1="232" x2="170" y2="252"/><path class="iah" d="M170 258 l-6 -9 h12 z"/><rect class="i-node" x="12" y="262" width="316" height="76" rx="6"/><text class="it" x="24" y="294">Плотность раствора давит</text><text class="it" x="24" y="320">на пласт</text><line class="ia" x1="170" y1="342" x2="170" y2="362"/><path class="iah" d="M170 368 l-6 -9 h12 z"/><rect class="i-out" x="12" y="372" width="316" height="102" rx="6"/><text class="ih" x="24" y="404">Вывод</text><text class="it" x="24" y="430">Давление в скважине p_c и</text><text class="it" x="24" y="456">репрессия Δp = p_c − p_пл.</text><rect class="i-out" x="12" y="480" width="316" height="102" rx="6"/><text class="ih" x="24" y="512">Вывод</text><text class="it" x="24" y="538">Глубина проникновения</text><text class="it" x="24" y="564">фильтрата в коллектор.</text><rect class="i-warn" x="12" y="588" width="316" height="128" rx="6"/><text class="ih" x="24" y="620">Где ломается</text><text class="it" x="24" y="646">Текст не даёт порога Δp,</text><text class="it" x="24" y="672">после которого данные</text><text class="it" x="24" y="698">становятся непригодными.</text><rect class="i-warn" x="12" y="722" width="316" height="154" rx="6"/><text class="ih" x="24" y="754">Где ломается</text><text class="it" x="24" y="780">Вклад плотности и</text><text class="it" x="24" y="806">водоотдачи назван лишь</text><text class="it" x="24" y="832">приблизительно; точная</text><text class="it" x="24" y="858">доля каждого не указана.</text><rect x="249" y="894" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="915">схема</text></svg>