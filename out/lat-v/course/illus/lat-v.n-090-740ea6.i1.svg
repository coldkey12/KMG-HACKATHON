<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1190" role="img" aria-label="Схема шага «Тяжёлый раствор давит фильтрат вглубь»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Тяжёлый раствор давит фильтрат вглубь»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Плотность глинистого</text><text class="it" x="24" y="96">раствора δp по интервалу</text><text class="it" x="24" y="122">(из данных о режиме</text><text class="it" x="24" y="148">бурения)</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Пластовое давление pпл на</text><text class="it" x="24" y="256">той же глубине (для</text><text class="it" x="24" y="282">расчёта Δp)</text><line class="ia" x1="170" y1="310" x2="170" y2="330"/><path class="iah" d="M170 336 l-6 -9 h12 z"/><rect class="i-node" x="12" y="340" width="316" height="76" rx="6"/><text class="it" x="24" y="372">Тяжёлый раствор давит</text><text class="it" x="24" y="398">фильтрат вглубь</text><line class="ia" x1="170" y1="420" x2="170" y2="440"/><path class="iah" d="M170 446 l-6 -9 h12 z"/><rect class="i-out" x="12" y="450" width="316" height="154" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Качественная оценка</text><text class="it" x="24" y="534">глубины проникновения</text><text class="it" x="24" y="560">фильтрата: чем больше Δp,</text><text class="it" x="24" y="586">тем глубже</text><rect class="i-out" x="12" y="610" width="316" height="128" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Вывод о том, близки ли</text><text class="it" x="24" y="694">условия бурения к</text><text class="it" x="24" y="720">равновесию (Δp ≈ 0)</text><rect class="i-warn" x="12" y="744" width="316" height="154" rx="6"/><text class="ih" x="24" y="776">Где ломается</text><text class="it" x="24" y="802">Численного pпл в этом</text><text class="it" x="24" y="828">фрагменте нет, поэтому Δp</text><text class="it" x="24" y="854">по одним этим данным не</text><text class="it" x="24" y="880">вычислить.</text><rect class="i-warn" x="12" y="904" width="316" height="232" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Плотность раствора — не</text><text class="it" x="24" y="988">единственный фактор</text><text class="it" x="24" y="1014">проникновения. Книга</text><text class="it" x="24" y="1040">называет и водоотдачу (см.</text><text class="it" x="24" y="1066">шаг 8 «Водоотдача —</text><text class="it" x="24" y="1092">главный показатель</text><text class="it" x="24" y="1118">раствора»).</text><rect x="249" y="1154" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1175">схема</text></svg>