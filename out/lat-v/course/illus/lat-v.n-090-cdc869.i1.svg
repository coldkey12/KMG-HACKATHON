<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1030" role="img" aria-label="Схема шага «Качественная и количественная интерпретация»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Качественная и количественная интерпретация»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривые основных диаграмм</text><text class="it" x="24" y="96">геофизического комплекса,</text><text class="it" x="24" y="122">по которым сопоставляют</text><text class="it" x="24" y="148">признаки типов пород.</text><line class="ia" x1="170" y1="176" x2="170" y2="196"/><path class="iah" d="M170 202 l-6 -9 h12 z"/><rect class="i-node" x="12" y="206" width="316" height="102" rx="6"/><text class="it" x="24" y="238">Качественная и</text><text class="it" x="24" y="264">количественная</text><text class="it" x="24" y="290">интерпретация</text><line class="ia" x1="170" y1="312" x2="170" y2="332"/><path class="iah" d="M170 338 l-6 -9 h12 z"/><rect class="i-out" x="12" y="342" width="316" height="180" rx="6"/><text class="ih" x="24" y="374">Вывод</text><text class="it" x="24" y="400">Качественно: тип породы,</text><text class="it" x="24" y="426">характер насыщения и</text><text class="it" x="24" y="452">эффективная толщина</text><text class="it" x="24" y="478">простейшего межзернового</text><text class="it" x="24" y="504">коллектора.</text><rect class="i-out" x="12" y="528" width="316" height="180" rx="6"/><text class="ih" x="24" y="560">Вывод</text><text class="it" x="24" y="586">Количественно:</text><text class="it" x="24" y="612">коэффициенты пористости,</text><text class="it" x="24" y="638">глинистости,</text><text class="it" x="24" y="664">нефтегазонасыщения или</text><text class="it" x="24" y="690">параметр насыщения Pн.</text><rect class="i-warn" x="12" y="714" width="316" height="128" rx="6"/><text class="ih" x="24" y="746">Где ломается</text><text class="it" x="24" y="772">Для сложных коллекторов</text><text class="it" x="24" y="798">качественного чтения</text><text class="it" x="24" y="824">недостаточно.</text><rect class="i-warn" x="12" y="848" width="316" height="128" rx="6"/><text class="ih" x="24" y="880">Где ломается</text><text class="it" x="24" y="906">Для запасов и разработки</text><text class="it" x="24" y="932">нужна проницаемость в виде</text><text class="it" x="24" y="958">числа.</text><rect x="249" y="994" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1015">схема</text></svg>