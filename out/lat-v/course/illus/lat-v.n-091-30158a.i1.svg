<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1220" role="img" aria-label="Схема шага «Четыре группы методов комплекса»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Четыре группы методов комплекса»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривые микрозондов и</text><text class="it" x="24" y="96">каверномера: признак</text><text class="it" x="24" y="122">фильтрующих интервалов.</text><rect class="i-in" x="12" y="146" width="316" height="102" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Кривая ЯМР: эффективная</text><text class="it" x="24" y="230">пористость.</text><rect class="i-in" x="12" y="254" width="316" height="128" rx="6"/><text class="ih" x="24" y="286">Вход</text><text class="it" x="24" y="312">Кривые ГГМ, акустического</text><text class="it" x="24" y="338">метода и нейтронных</text><text class="it" x="24" y="364">методов: пористость.</text><line class="ia" x1="170" y1="392" x2="170" y2="412"/><path class="iah" d="M170 418 l-6 -9 h12 z"/><rect class="i-node" x="12" y="422" width="316" height="76" rx="6"/><text class="it" x="24" y="454">Четыре группы методов</text><text class="it" x="24" y="480">комплекса</text><line class="ia" x1="170" y1="502" x2="170" y2="522"/><path class="iah" d="M170 528 l-6 -9 h12 z"/><rect class="i-out" x="12" y="532" width="316" height="154" rx="6"/><text class="ih" x="24" y="564">Вывод</text><text class="it" x="24" y="590">Выбор группы методов под</text><text class="it" x="24" y="616">задачу: выделение,</text><text class="it" x="24" y="642">пористость, глинистость</text><text class="it" x="24" y="668">или продуктивность.</text><rect class="i-out" x="12" y="692" width="316" height="180" rx="6"/><text class="ih" x="24" y="724">Вывод</text><text class="it" x="24" y="750">Из кривых группы получают</text><text class="it" x="24" y="776">ответ на её задачу:</text><text class="it" x="24" y="802">признак коллектора,</text><text class="it" x="24" y="828">пористость или</text><text class="it" x="24" y="854">глинистость.</text><rect class="i-warn" x="12" y="878" width="316" height="128" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Группа выделения опирается</text><text class="it" x="24" y="962">на глинистый раствор, при</text><text class="it" x="24" y="988">котором образуется корка.</text><rect class="i-warn" x="12" y="1012" width="316" height="154" rx="6"/><text class="ih" x="24" y="1044">Где ломается</text><text class="it" x="24" y="1070">Группа пористости</text><text class="it" x="24" y="1096">одинаково применима на</text><text class="it" x="24" y="1122">всех перечисленных типах</text><text class="it" x="24" y="1148">раствора.</text><rect x="249" y="1184" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1205">схема</text></svg>