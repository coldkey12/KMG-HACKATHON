<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 978" role="img" aria-label="Схема шага «Фильтрат той же минерализации, что пластовая вода»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Фильтрат той же минерализации, что пластовая вода»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривые сопротивления</text><text class="it" x="24" y="96">разной глубинности по</text><text class="it" x="24" y="122">одному интервалу разреза.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Сопротивление фильтрата и</text><text class="it" x="24" y="230">сопротивление пластовой</text><text class="it" x="24" y="256">воды (ρф и ρв).</text><line class="ia" x1="170" y1="284" x2="170" y2="304"/><path class="iah" d="M170 310 l-6 -9 h12 z"/><rect class="i-node" x="12" y="314" width="316" height="102" rx="6"/><text class="it" x="24" y="346">Фильтрат той же</text><text class="it" x="24" y="372">минерализации, что</text><text class="it" x="24" y="398">пластовая вода</text><line class="ia" x1="170" y1="420" x2="170" y2="440"/><path class="iah" d="M170 446 l-6 -9 h12 z"/><rect class="i-out" x="12" y="450" width="316" height="180" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Характер соотношения зон:</text><text class="it" x="24" y="534">понижающее проникновение у</text><text class="it" x="24" y="560">продуктивного коллектора,</text><text class="it" x="24" y="586">почти равные сопротивления</text><text class="it" x="24" y="612">у водоносного.</text><rect class="i-warn" x="12" y="636" width="316" height="154" rx="6"/><text class="ih" x="24" y="668">Где ломается</text><text class="it" x="24" y="694">Вывод работает только при</text><text class="it" x="24" y="720">равенстве ρф и ρв. Книга в</text><text class="it" x="24" y="746">этом абзаце других</text><text class="it" x="24" y="772">соотношений не разбирает.</text><rect class="i-warn" x="12" y="796" width="316" height="128" rx="6"/><text class="ih" x="24" y="828">Где ломается</text><text class="it" x="24" y="854">Слово «≈» означает</text><text class="it" x="24" y="880">приблизительное равенство.</text><text class="it" x="24" y="906">Точный порог не задан.</text><rect x="249" y="942" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="963">схема</text></svg>