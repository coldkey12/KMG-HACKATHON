<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 978" role="img" aria-label="Схема шага «Растворы на нефтяной основе»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Растворы на нефтяной основе»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Тип промывочной жидкости,</text><text class="it" x="24" y="96">которой бурили скважину.</text><rect class="i-in" x="12" y="120" width="316" height="128" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Удельное сопротивление</text><text class="it" x="24" y="204">раствора: очень большое, ρ</text><text class="it" x="24" y="230">→ ∞.</text><line class="ia" x1="170" y1="258" x2="170" y2="278"/><path class="iah" d="M170 284 l-6 -9 h12 z"/><rect class="i-node" x="12" y="288" width="316" height="76" rx="6"/><text class="it" x="24" y="320">Растворы на нефтяной</text><text class="it" x="24" y="346">основе</text><line class="ia" x1="170" y1="368" x2="170" y2="388"/><path class="iah" d="M170 394 l-6 -9 h12 z"/><rect class="i-out" x="12" y="398" width="316" height="180" rx="6"/><text class="ih" x="24" y="430">Вывод</text><text class="it" x="24" y="456">Допустимый набор методов:</text><text class="it" x="24" y="482">индукционный зонд плюс</text><text class="it" x="24" y="508">ядерные и акустические</text><text class="it" x="24" y="534">методы для характера</text><text class="it" x="24" y="560">насыщения.</text><rect class="i-warn" x="12" y="584" width="316" height="154" rx="6"/><text class="ih" x="24" y="616">Где ломается</text><text class="it" x="24" y="642">Глинистой корки нет,</text><text class="it" x="24" y="668">поэтому признаки</text><text class="it" x="24" y="694">коллектора по корке не</text><text class="it" x="24" y="720">получить.</text><rect class="i-warn" x="12" y="744" width="316" height="180" rx="6"/><text class="ih" x="24" y="776">Где ломается</text><text class="it" x="24" y="802">Ядерные и акустические</text><text class="it" x="24" y="828">методы видят только</text><text class="it" x="24" y="854">близкую к скважине часть</text><text class="it" x="24" y="880">пласта (средняя и малая</text><text class="it" x="24" y="906">глубинность).</text><rect x="249" y="942" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="963">схема</text></svg>