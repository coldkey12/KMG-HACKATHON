<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 684" role="img" aria-label="Схема шага «Три главных типа разреза скважины»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Три главных типа разреза скважины»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Тип разреза по составу</text><text class="it" x="24" y="96">пород и по типу пустот —</text><text class="it" x="24" y="122">вход для выбора набора</text><text class="it" x="24" y="148">методов ГИС.</text><line class="ia" x1="170" y1="176" x2="170" y2="196"/><path class="iah" d="M170 202 l-6 -9 h12 z"/><rect class="i-node" x="12" y="206" width="316" height="76" rx="6"/><text class="it" x="24" y="238">Три главных типа разреза</text><text class="it" x="24" y="264">скважины</text><line class="ia" x1="170" y1="286" x2="170" y2="306"/><path class="iah" d="M170 312 l-6 -9 h12 z"/><rect class="i-out" x="12" y="316" width="316" height="154" rx="6"/><text class="ih" x="24" y="348">Вывод</text><text class="it" x="24" y="374">Метка типа разреза:</text><text class="it" x="24" y="400">терригенный, карбонатный,</text><text class="it" x="24" y="426">гидрохимический или</text><text class="it" x="24" y="452">смешанный.</text><rect class="i-warn" x="12" y="476" width="316" height="154" rx="6"/><text class="ih" x="24" y="508">Где ломается</text><text class="it" x="24" y="534">Вулканогенные породы</text><text class="it" x="24" y="560">получают признаки двух</text><text class="it" x="24" y="586">типов, и одна метка может</text><text class="it" x="24" y="612">оказаться неоднозначной.</text><rect x="249" y="648" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="669">схема</text></svg>