<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1194" role="img" aria-label="Схема шага «Бурение на воде: риск потерь»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Бурение на воде: риск потерь»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Тип промывочной жидкости:</text><text class="it" x="24" y="96">вода или глинистый</text><text class="it" x="24" y="122">раствор.</text><rect class="i-in" x="12" y="146" width="316" height="154" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Минерализация воды,</text><text class="it" x="24" y="230">которой бурят: от низкой</text><text class="it" x="24" y="256">до минерализации пластовой</text><text class="it" x="24" y="282">воды.</text><rect class="i-in" x="12" y="306" width="316" height="102" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Наличие глин и глинистых</text><text class="it" x="24" y="390">пород в разрезе.</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Бурение на воде: риск</text><text class="it" x="24" y="506">потерь</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="180" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Глубокая зона</text><text class="it" x="24" y="642">проникновения, из-за</text><text class="it" x="24" y="668">которой оценка характера</text><text class="it" x="24" y="694">насыщения, как правило,</text><text class="it" x="24" y="720">исключена.</text><rect class="i-out" x="12" y="744" width="316" height="128" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Низкая эффективность</text><text class="it" x="24" y="828">микрозондов и каверномера</text><text class="it" x="24" y="854">для выделения коллектора.</text><rect class="i-warn" x="12" y="878" width="316" height="128" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Глины в разрезе при</text><text class="it" x="24" y="962">бурении на воде дают очень</text><text class="it" x="24" y="988">высокую водоотдачу.</text><rect class="i-warn" x="12" y="1012" width="316" height="128" rx="6"/><text class="ih" x="24" y="1044">Где ломается</text><text class="it" x="24" y="1070">Высокая минерализация без</text><text class="it" x="24" y="1096">толстых пластов солей не</text><text class="it" x="24" y="1122">оправдана.</text><rect x="249" y="1158" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1179">схема</text></svg>