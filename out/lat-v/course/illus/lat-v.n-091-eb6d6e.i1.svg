<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1198" role="img" aria-label="Схема шага «Соль раствора и приборы в скважине»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Соль раствора и приборы в скважине»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Диаграмма СП против</text><text class="it" x="24" y="96">проницаемых пластов.</text><rect class="i-in" x="12" y="120" width="316" height="128" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Диаграммы микрозондов:</text><text class="it" x="24" y="204">приращения между близкими</text><text class="it" x="24" y="230">электродами.</text><rect class="i-in" x="12" y="254" width="316" height="102" rx="6"/><text class="ih" x="24" y="286">Вход</text><text class="it" x="24" y="312">Индукционный каротаж:</text><text class="it" x="24" y="338">проводимость пород.</text><line class="ia" x1="170" y1="366" x2="170" y2="386"/><path class="iah" d="M170 392 l-6 -9 h12 z"/><rect class="i-node" x="12" y="396" width="316" height="76" rx="6"/><text class="it" x="24" y="428">Соль раствора и приборы в</text><text class="it" x="24" y="454">скважине</text><line class="ia" x1="170" y1="476" x2="170" y2="496"/><path class="iah" d="M170 502 l-6 -9 h12 z"/><rect class="i-out" x="12" y="506" width="316" height="102" rx="6"/><text class="ih" x="24" y="538">Вывод</text><text class="it" x="24" y="564">Знак и величина аномалии</text><text class="it" x="24" y="590">СП в пласте.</text><rect class="i-out" x="12" y="614" width="316" height="128" rx="6"/><text class="ih" x="24" y="646">Вывод</text><text class="it" x="24" y="672">Положительное приращение</text><text class="it" x="24" y="698">микрозондов против</text><text class="it" x="24" y="724">коллектора.</text><rect class="i-out" x="12" y="748" width="316" height="154" rx="6"/><text class="ih" x="24" y="780">Вывод</text><text class="it" x="24" y="806">Оценка, насколько надёжно</text><text class="it" x="24" y="832">каждый метод выделяет</text><text class="it" x="24" y="858">коллектор при данном</text><text class="it" x="24" y="884">соотношении ρф и ρв.</text><rect class="i-warn" x="12" y="908" width="316" height="128" rx="6"/><text class="ih" x="24" y="940">Где ломается</text><text class="it" x="24" y="966">При сближении ρф и ρв СП и</text><text class="it" x="24" y="992">микрозонды резко теряют</text><text class="it" x="24" y="1018">эффективность.</text><rect class="i-warn" x="12" y="1042" width="316" height="102" rx="6"/><text class="ih" x="24" y="1074">Где ломается</text><text class="it" x="24" y="1100">Индукционный метод слабеет</text><text class="it" x="24" y="1126">при росте минерализации.</text><rect x="249" y="1162" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1183">схема</text></svg>