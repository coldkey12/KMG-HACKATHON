<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1060" role="img" aria-label="Схема шага «Две операции построения разреза»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Две операции построения разреза»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Диаграммы (кривые по</text><text class="it" x="24" y="96">глубине) разных</text><text class="it" x="24" y="122">геофизических методов по</text><text class="it" x="24" y="148">одной скважине.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Признаки на диаграммах:</text><text class="it" x="24" y="256">особенности кривой внутри</text><text class="it" x="24" y="282">каждого однородного</text><text class="it" x="24" y="308">интервала.</text><line class="ia" x1="170" y1="336" x2="170" y2="356"/><path class="iah" d="M170 362 l-6 -9 h12 z"/><rect class="i-node" x="12" y="366" width="316" height="76" rx="6"/><text class="it" x="24" y="398">Две операции построения</text><text class="it" x="24" y="424">разреза</text><line class="ia" x1="170" y1="446" x2="170" y2="466"/><path class="iah" d="M170 472 l-6 -9 h12 z"/><rect class="i-out" x="12" y="476" width="316" height="102" rx="6"/><text class="ih" x="24" y="508">Вывод</text><text class="it" x="24" y="534">Границы и толщины пластов</text><text class="it" x="24" y="560">по глубине.</text><rect class="i-out" x="12" y="584" width="316" height="154" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Литологическая</text><text class="it" x="24" y="668">характеристика каждого</text><text class="it" x="24" y="694">однородного интервала по</text><text class="it" x="24" y="720">сумме признаков.</text><rect class="i-warn" x="12" y="744" width="316" height="102" rx="6"/><text class="ih" x="24" y="776">Где ломается</text><text class="it" x="24" y="802">Мало признаков — порода</text><text class="it" x="24" y="828">определяется менее точно.</text><rect class="i-warn" x="12" y="852" width="316" height="154" rx="6"/><text class="ih" x="24" y="884">Где ломается</text><text class="it" x="24" y="910">Неверно проведённые</text><text class="it" x="24" y="936">границы дают неоднородный</text><text class="it" x="24" y="962">интервал, и оценка породы</text><text class="it" x="24" y="988">в нём будет смешанной.</text><rect x="249" y="1024" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1045">схема</text></svg>