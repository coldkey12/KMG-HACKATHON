<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1298" role="img" aria-label="Схема шага «Продуктивность: сопротивление плюс пористость»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Продуктивность: сопротивление плюс пористость»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Удельное сопротивление</text><text class="it" x="24" y="96">неизменённой части пласта</text><text class="it" x="24" y="122">по боковому зондированию,</text><text class="it" x="24" y="148">экранированным и</text><text class="it" x="24" y="174">индукционным зондам.</text><rect class="i-in" x="12" y="198" width="316" height="102" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Пористость по методам</text><text class="it" x="24" y="282">пористости.</text><rect class="i-in" x="12" y="306" width="316" height="128" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Известное удельное</text><text class="it" x="24" y="390">сопротивление пластовой</text><text class="it" x="24" y="416">воды.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="102" rx="6"/><text class="it" x="24" y="506">Продуктивность:</text><text class="it" x="24" y="532">сопротивление плюс</text><text class="it" x="24" y="558">пористость</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="128" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Значение Pн. При Pн больше</text><text class="it" x="24" y="694">1 порода нефте- или</text><text class="it" x="24" y="720">газосодержащая.</text><rect class="i-out" x="12" y="744" width="316" height="154" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Оценка изменения</text><text class="it" x="24" y="828">сопротивления по радиусу и</text><text class="it" x="24" y="854">характера проникновения</text><text class="it" x="24" y="880">фильтрата.</text><rect class="i-warn" x="12" y="904" width="316" height="180" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Если удельное</text><text class="it" x="24" y="988">сопротивление воды</text><text class="it" x="24" y="1014">неизвестно, сопротивление</text><text class="it" x="24" y="1040">водонасыщенного пласта не</text><text class="it" x="24" y="1066">вычислить.</text><rect class="i-warn" x="12" y="1090" width="316" height="154" rx="6"/><text class="ih" x="24" y="1122">Где ломается</text><text class="it" x="24" y="1148">Если не сочетать</text><text class="it" x="24" y="1174">сопротивление с</text><text class="it" x="24" y="1200">пористостью, связь между</text><text class="it" x="24" y="1226">ними не получится.</text><rect x="249" y="1262" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1283">схема</text></svg>