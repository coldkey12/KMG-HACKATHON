<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1406" role="img" aria-label="Схема шага «СП и ГМ: две мерки глинистости»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «СП и ГМ: две мерки глинистости»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривая СП по разрезу</text><text class="it" x="24" y="96">скважины; для терригенного</text><text class="it" x="24" y="122">разреза по ней судят об</text><text class="it" x="24" y="148">относительной глинистости.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Кривая ГМ по разрезу</text><text class="it" x="24" y="256">скважины; по ней судят об</text><text class="it" x="24" y="282">объёмной глинистости</text><text class="it" x="24" y="308">терригенного разреза.</text><rect class="i-in" x="12" y="332" width="316" height="154" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Условия скважины: тип</text><text class="it" x="24" y="416">раствора, обсажена ли</text><text class="it" x="24" y="442">скважина; для СП —</text><text class="it" x="24" y="468">соотношение ρф и ρн.</text><line class="ia" x1="170" y1="496" x2="170" y2="516"/><path class="iah" d="M170 522 l-6 -9 h12 z"/><rect class="i-node" x="12" y="526" width="316" height="76" rx="6"/><text class="it" x="24" y="558">СП и ГМ: две мерки</text><text class="it" x="24" y="584">глинистости</text><line class="ia" x1="170" y1="606" x2="170" y2="626"/><path class="iah" d="M170 632 l-6 -9 h12 z"/><rect class="i-out" x="12" y="636" width="316" height="128" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Относительная глинистость</text><text class="it" x="24" y="720">ηгл по СП для терригенного</text><text class="it" x="24" y="746">разреза.</text><rect class="i-out" x="12" y="770" width="316" height="128" rx="6"/><text class="ih" x="24" y="802">Вывод</text><text class="it" x="24" y="828">Объёмная глинистость kгл</text><text class="it" x="24" y="854">по ГМ для терригенного</text><text class="it" x="24" y="880">разреза.</text><rect class="i-out" x="12" y="904" width="316" height="154" rx="6"/><text class="ih" x="24" y="936">Вывод</text><text class="it" x="24" y="962">Нерастворимый остаток:</text><text class="it" x="24" y="988">относительный по СП и</text><text class="it" x="24" y="1014">объёмный по ГМ для</text><text class="it" x="24" y="1040">карбонатного разреза.</text><rect class="i-warn" x="12" y="1064" width="316" height="128" rx="6"/><text class="ih" x="24" y="1096">Где ломается</text><text class="it" x="24" y="1122">СП не даёт вывода о</text><text class="it" x="24" y="1148">глинистости, если условие</text><text class="it" x="24" y="1174">ρф &gt; ρн не выполнено.</text><rect class="i-warn" x="12" y="1198" width="316" height="154" rx="6"/><text class="ih" x="24" y="1230">Где ломается</text><text class="it" x="24" y="1256">ГМ не зависит от типа</text><text class="it" x="24" y="1282">раствора и обсадки: книга</text><text class="it" x="24" y="1308">говорит, что он применим</text><text class="it" x="24" y="1334">во всех скважинах.</text><rect x="249" y="1370" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1391">схема</text></svg>