<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1134" role="img" aria-label="Схема шага «Таблица признаков: карбонаты, сульфаты, соли»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Таблица признаков: карбонаты, сульфаты, соли»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривые сопротивления, СП,</text><text class="it" x="24" y="96">кавернограмма (диаметр</text><text class="it" x="24" y="122">скважины), микрозонды,</text><text class="it" x="24" y="148">гамма-метод и нейтронные</text><text class="it" x="24" y="174">методы.</text><rect class="i-in" x="12" y="198" width="316" height="180" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Для гидрохимического</text><text class="it" x="24" y="282">разреза дополнительно:</text><text class="it" x="24" y="308">гамма-гамма-метод</text><text class="it" x="24" y="334">плотностной (ГГМ) и</text><text class="it" x="24" y="360">акустический метод (АК).</text><line class="ia" x1="170" y1="388" x2="170" y2="408"/><path class="iah" d="M170 414 l-6 -9 h12 z"/><rect class="i-node" x="12" y="418" width="316" height="76" rx="6"/><text class="it" x="24" y="450">Таблица признаков:</text><text class="it" x="24" y="476">карбонаты, сульфаты, соли</text><line class="ia" x1="170" y1="498" x2="170" y2="518"/><path class="iah" d="M170 524 l-6 -9 h12 z"/><rect class="i-out" x="12" y="528" width="316" height="206" rx="6"/><text class="ih" x="24" y="560">Вывод</text><text class="it" x="24" y="586">Класс породы по сочетанию</text><text class="it" x="24" y="612">признаков: низкопористый</text><text class="it" x="24" y="638">карбонат, глинистый</text><text class="it" x="24" y="664">известняк, ангидрит, гипс,</text><text class="it" x="24" y="690">каменная соль или калийная</text><text class="it" x="24" y="716">соль.</text><rect class="i-warn" x="12" y="740" width="316" height="180" rx="6"/><text class="ih" x="24" y="772">Где ломается</text><text class="it" x="24" y="798">Гипс и ангидрит совпадают</text><text class="it" x="24" y="824">по всем методам, кроме</text><text class="it" x="24" y="850">нейтронного. Без</text><text class="it" x="24" y="876">нейтронной кривой их не</text><text class="it" x="24" y="902">разделить.</text><rect class="i-warn" x="12" y="926" width="316" height="154" rx="6"/><text class="ih" x="24" y="958">Где ломается</text><text class="it" x="24" y="984">Для солей результат</text><text class="it" x="24" y="1010">зависит от диаметра</text><text class="it" x="24" y="1036">скважины и от насыщения</text><text class="it" x="24" y="1062">раствора солью.</text><rect x="249" y="1098" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1119">схема</text></svg>