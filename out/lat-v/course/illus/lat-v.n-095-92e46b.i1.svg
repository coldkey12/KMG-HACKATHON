<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1190" role="img" aria-label="Схема шага «Практикум: колонка по реальным кривым»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Практикум: колонка по реальным кривым»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Набор каротажных кривых</text><text class="it" x="24" y="96">участка: кавернограмма,</text><text class="it" x="24" y="122">СП, микрозонды, ГМ, НГМ,</text><text class="it" x="24" y="148">интервал 2190–2250 м (по</text><text class="it" x="24" y="174">описанию рисунка).</text><rect class="i-in" x="12" y="198" width="316" height="128" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Подпись рисунка: d_r =</text><text class="it" x="24" y="282">0,25 м и ρ_p = 1,2 Ом·м</text><text class="it" x="24" y="308">при температуре пласта.</text><line class="ia" x1="170" y1="336" x2="170" y2="356"/><path class="iah" d="M170 362 l-6 -9 h12 z"/><rect class="i-node" x="12" y="366" width="316" height="76" rx="6"/><text class="it" x="24" y="398">Практикум: колонка по</text><text class="it" x="24" y="424">реальным кривым</text><line class="ia" x1="170" y1="446" x2="170" y2="466"/><path class="iah" d="M170 472 l-6 -9 h12 z"/><rect class="i-out" x="12" y="476" width="316" height="180" rx="6"/><text class="ih" x="24" y="508">Вывод</text><text class="it" x="24" y="534">Литологическая колонка по</text><text class="it" x="24" y="560">трём интервалам:</text><text class="it" x="24" y="586">2190–2210, 2210–2230,</text><text class="it" x="24" y="612">2230–2250 м (по описанию</text><text class="it" x="24" y="638">рисунка).</text><rect class="i-out" x="12" y="662" width="316" height="128" rx="6"/><text class="ih" x="24" y="694">Вывод</text><text class="it" x="24" y="720">Список интервалов, где</text><text class="it" x="24" y="746">интерпретация не</text><text class="it" x="24" y="772">однозначна.</text><rect class="i-warn" x="12" y="796" width="316" height="180" rx="6"/><text class="ih" x="24" y="828">Где ломается</text><text class="it" x="24" y="854">Отбивки пластов и</text><text class="it" x="24" y="880">результаты интерпретации</text><text class="it" x="24" y="906">на рисунке не подписаны;</text><text class="it" x="24" y="932">проверить ответ не по</text><text class="it" x="24" y="958">чему.</text><rect class="i-warn" x="12" y="982" width="316" height="154" rx="6"/><text class="ih" x="24" y="1014">Где ломается</text><text class="it" x="24" y="1040">Символы d_r и ρ_p в</text><text class="it" x="24" y="1066">подписи могли искажиться</text><text class="it" x="24" y="1092">при распознавании; сверить</text><text class="it" x="24" y="1118">со сканом.</text><rect x="249" y="1154" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1175">схема</text></svg>