<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1324" role="img" aria-label="Схема шага «Ловить коллектор во времени»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Ловить коллектор во времени»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Серия замеров одним</text><text class="it" x="24" y="96">методом в одной скважине</text><text class="it" x="24" y="122">при неизменных условиях:</text><text class="it" x="24" y="148">БЭЗ или комплекс</text><text class="it" x="24" y="174">фокусированных зондов.</text><rect class="i-in" x="12" y="198" width="316" height="128" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Замеры до и после смены</text><text class="it" x="24" y="282">скважинных условий в</text><text class="it" x="24" y="308">методе двух растворов.</text><rect class="i-in" x="12" y="332" width="316" height="154" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Нейтронные замеры в</text><text class="it" x="24" y="416">обсаженной скважине во</text><text class="it" x="24" y="442">время расформирования</text><text class="it" x="24" y="468">зоны.</text><line class="ia" x1="170" y1="496" x2="170" y2="516"/><path class="iah" d="M170 522 l-6 -9 h12 z"/><rect class="i-node" x="12" y="526" width="316" height="76" rx="6"/><text class="it" x="24" y="558">Ловить коллектор во</text><text class="it" x="24" y="584">времени</text><line class="ia" x1="170" y1="606" x2="170" y2="626"/><path class="iah" d="M170 632 l-6 -9 h12 z"/><rect class="i-out" x="12" y="636" width="316" height="154" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Изменение показаний во</text><text class="it" x="24" y="720">времени, по которому судят</text><text class="it" x="24" y="746">о формировании или</text><text class="it" x="24" y="772">расформировании зоны.</text><rect class="i-out" x="12" y="796" width="316" height="128" rx="6"/><text class="ih" x="24" y="828">Вывод</text><text class="it" x="24" y="854">Вывод о наличии газового</text><text class="it" x="24" y="880">коллектора при</text><text class="it" x="24" y="906">расформировании зоны.</text><rect class="i-warn" x="12" y="930" width="316" height="180" rx="6"/><text class="ih" x="24" y="962">Где ломается</text><text class="it" x="24" y="988">Если условия в скважине</text><text class="it" x="24" y="1014">меняются во время серии</text><text class="it" x="24" y="1040">повторных замеров,</text><text class="it" x="24" y="1066">изменение может быть</text><text class="it" x="24" y="1092">вызвано не зоной.</text><rect class="i-warn" x="12" y="1116" width="316" height="154" rx="6"/><text class="ih" x="24" y="1148">Где ломается</text><text class="it" x="24" y="1174">Книга не даёт критерия, по</text><text class="it" x="24" y="1200">которому изменение</text><text class="it" x="24" y="1226">показаний считают</text><text class="it" x="24" y="1252">признаком коллектора.</text><rect x="249" y="1288" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1309">схема</text></svg>