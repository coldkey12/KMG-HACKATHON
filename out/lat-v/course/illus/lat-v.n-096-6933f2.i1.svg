<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1138" role="img" aria-label="Схема шага «Прямые признаки коллектора на диаграммах»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Прямые признаки коллектора на диаграммах»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кавернограмма: диаметр</text><text class="it" x="24" y="96">скважины d_c относительно</text><text class="it" x="24" y="122">номинального d_a.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Кривые микрозондов ρГМЗ и</text><text class="it" x="24" y="230">ρПМЗ по интервалам</text><text class="it" x="24" y="256">разреза.</text><rect class="i-in" x="12" y="280" width="316" height="128" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Радиальная кривая</text><text class="it" x="24" y="364">сопротивления по БЭЗ или</text><text class="it" x="24" y="390">разноглубинным зондам.</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Прямые признаки коллектора</text><text class="it" x="24" y="506">на диаграммах</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="206" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Оценка наличия прямых</text><text class="it" x="24" y="642">признаков коллектора по</text><text class="it" x="24" y="668">трём группам: сужение</text><text class="it" x="24" y="694">ствола, приращение</text><text class="it" x="24" y="720">микрозондов, радиальный</text><text class="it" x="24" y="746">градиент.</text><rect class="i-warn" x="12" y="770" width="316" height="180" rx="6"/><text class="ih" x="24" y="802">Где ломается</text><text class="it" x="24" y="828">Раствор не соответствует</text><text class="it" x="24" y="854">условиям главы (высокая</text><text class="it" x="24" y="880">водоотдача или</text><text class="it" x="24" y="906">минерализация): признаки</text><text class="it" x="24" y="932">не устанавливают.</text><rect class="i-warn" x="12" y="956" width="316" height="128" rx="6"/><text class="ih" x="24" y="988">Где ломается</text><text class="it" x="24" y="1014">Радиальный градиент может</text><text class="it" x="24" y="1040">отсутствовать и в</text><text class="it" x="24" y="1066">продуктивном коллекторе.</text><rect x="249" y="1102" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1123">схема</text></svg>