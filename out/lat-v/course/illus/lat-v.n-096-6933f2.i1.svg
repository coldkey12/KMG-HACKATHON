<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1008" role="img" aria-label="Схема шага «Прямые признаки при хорошем растворе»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Прямые признаки при хорошем растворе»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Диаметр ствола по</text><text class="it" x="24" y="96">кавернограмме относительно</text><text class="it" x="24" y="122">номинального.</text><rect class="i-in" x="12" y="146" width="316" height="154" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Показания</text><text class="it" x="24" y="230">градиент-микрозонда и</text><text class="it" x="24" y="256">потенциал-микрозонда на</text><text class="it" x="24" y="282">одном интервале.</text><rect class="i-in" x="12" y="306" width="316" height="128" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Сопротивление по радиусу</text><text class="it" x="24" y="390">от БЭЗ или разноглубинных</text><text class="it" x="24" y="416">зондов.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Прямые признаки при</text><text class="it" x="24" y="532">хорошем растворе</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="128" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Пометка интервала как</text><text class="it" x="24" y="668">возможного коллектора по</text><text class="it" x="24" y="694">совокупности признаков.</text><rect class="i-warn" x="12" y="718" width="316" height="102" rx="6"/><text class="ih" x="24" y="750">Где ломается</text><text class="it" x="24" y="776">При неподходящем растворе</text><text class="it" x="24" y="802">признаки не работают.</text><rect class="i-warn" x="12" y="826" width="316" height="128" rx="6"/><text class="ih" x="24" y="858">Где ломается</text><text class="it" x="24" y="884">Радиальный градиент может</text><text class="it" x="24" y="910">отсутствовать даже в</text><text class="it" x="24" y="936">продуктивном коллекторе.</text><rect x="249" y="972" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="993">схема</text></svg>