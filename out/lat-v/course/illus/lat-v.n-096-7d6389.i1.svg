<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 930" role="img" aria-label="Схема шага «Рентабельный дебит и коэффициент продуктивности»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Рентабельный дебит и коэффициент продуктивности»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Минимальный рентабельный</text><text class="it" x="24" y="96">дебит Q для района, м³/сут</text><rect class="i-in" x="12" y="120" width="316" height="102" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Депрессия Δp при</text><text class="it" x="24" y="204">испытании, Па</text><rect class="i-in" x="12" y="228" width="316" height="102" rx="6"/><text class="ih" x="24" y="260">Вход</text><text class="it" x="24" y="286">Эффективная толщина</text><text class="it" x="24" y="312">коллектора h, м</text><line class="ia" x1="170" y1="340" x2="170" y2="360"/><path class="iah" d="M170 366 l-6 -9 h12 z"/><rect class="i-node" x="12" y="370" width="316" height="76" rx="6"/><text class="it" x="24" y="402">Рентабельный дебит и</text><text class="it" x="24" y="428">коэффициент продуктивности</text><line class="ia" x1="170" y1="450" x2="170" y2="470"/><path class="iah" d="M170 476 l-6 -9 h12 z"/><rect class="i-out" x="12" y="480" width="316" height="102" rx="6"/><text class="ih" x="24" y="512">Вывод</text><text class="it" x="24" y="538">Коэффициент продуктивности</text><text class="it" x="24" y="564">η, м³/(Па·сут·м)</text><rect class="i-warn" x="12" y="588" width="316" height="154" rx="6"/><text class="ih" x="24" y="620">Где ломается</text><text class="it" x="24" y="646">Q задан для района. η из</text><text class="it" x="24" y="672">другого района нельзя</text><text class="it" x="24" y="698">сравнивать без пересчёта</text><text class="it" x="24" y="724">Q.</text><rect class="i-warn" x="12" y="748" width="316" height="128" rx="6"/><text class="ih" x="24" y="780">Где ломается</text><text class="it" x="24" y="806">Если h взята не для того</text><text class="it" x="24" y="832">интервала, который дал</text><text class="it" x="24" y="858">приток, η искажён.</text><rect x="249" y="894" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="915">схема</text></svg>