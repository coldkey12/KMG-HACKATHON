<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 606" role="img" aria-label="Схема шага «Чем коллектор отличается от неколлектора»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Чем коллектор отличается от неколлектора»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Набор каротажных диаграмм</text><text class="it" x="24" y="96">ГИС по разрезу скважины.</text><line class="ia" x1="170" y1="124" x2="170" y2="144"/><path class="iah" d="M170 150 l-6 -9 h12 z"/><rect class="i-node" x="12" y="154" width="316" height="76" rx="6"/><text class="it" x="24" y="186">Чем коллектор отличается</text><text class="it" x="24" y="212">от неколлектора</text><line class="ia" x1="170" y1="234" x2="170" y2="254"/><path class="iah" d="M170 260 l-6 -9 h12 z"/><rect class="i-out" x="12" y="264" width="316" height="128" rx="6"/><text class="ih" x="24" y="296">Вывод</text><text class="it" x="24" y="322">Разделение разреза на</text><text class="it" x="24" y="348">интервалы коллекторов и</text><text class="it" x="24" y="374">неколлекторов.</text><rect class="i-warn" x="12" y="398" width="316" height="154" rx="6"/><text class="ih" x="24" y="430">Где ломается</text><text class="it" x="24" y="456">Если разные породы дают</text><text class="it" x="24" y="482">одинаковый отклик,</text><text class="it" x="24" y="508">различие по трём свойствам</text><text class="it" x="24" y="534">не видно.</text><rect x="249" y="570" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="591">схема</text></svg>