<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1060" role="img" aria-label="Схема шага «Плохой раствор стирает признаки коллектора»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Плохой раствор стирает признаки коллектора»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Показания микрозондов</text><text class="it" x="24" y="96">разной длины и разница</text><text class="it" x="24" y="122">между ними.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Водоотдача и тип</text><text class="it" x="24" y="230">промывочной жидкости</text><text class="it" x="24" y="256">(условия бурения).</text><rect class="i-in" x="12" y="280" width="316" height="128" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Оценка толщины корки по</text><text class="it" x="24" y="364">признакам на диаграммах</text><text class="it" x="24" y="390">или по кавернограмме.</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Плохой раствор стирает</text><text class="it" x="24" y="506">признаки коллектора</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="128" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Наличие разницы показаний</text><text class="it" x="24" y="642">микрозондов как признак</text><text class="it" x="24" y="668">промытой зоны.</text><rect class="i-warn" x="12" y="692" width="316" height="128" rx="6"/><text class="ih" x="24" y="724">Где ломается</text><text class="it" x="24" y="750">Толстая корка: промытая</text><text class="it" x="24" y="776">зона и тонкие прослои не</text><text class="it" x="24" y="802">видны микрометодам.</text><rect class="i-warn" x="12" y="826" width="316" height="180" rx="6"/><text class="ih" x="24" y="858">Где ломается</text><text class="it" x="24" y="884">Высокая минерализация:</text><text class="it" x="24" y="910">корка есть, но</text><text class="it" x="24" y="936">качественные диаграммы</text><text class="it" x="24" y="962">микрозондов почти не</text><text class="it" x="24" y="988">получаются.</text><rect x="249" y="1024" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1045">схема</text></svg>