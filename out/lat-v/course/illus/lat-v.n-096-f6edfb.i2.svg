<svg viewBox="0 0 340 242" role="img" aria-label="Условные цвета шага «Плохой раствор стирает признаки коллектора»: глина, плотная порода, кавернограмма." xmlns="http://www.w3.org/2000/svg"><title>Условные цвета шага «Плохой раствор стирает признаки коллектора»: глина, плотная порода, кавернограмма.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><text class="ih" x="12" y="32">Породы</text><rect class="isw" x="12" y="44" width="44" height="28" rx="4" fill="#6B8E5A"/><text class="it" x="68" y="65">глина</text><rect class="isw" x="12" y="82" width="44" height="28" rx="4" fill="#8C7B6B"/><text class="it" x="68" y="103">плотная порода</text><text class="ih" x="12" y="144">Кривые</text><rect class="isw" x="12" y="156" width="44" height="28" rx="4" fill="#BDC3C7"/><text class="it" x="68" y="177">кавернограмма</text><rect x="249" y="206" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="227">схема</text></svg>