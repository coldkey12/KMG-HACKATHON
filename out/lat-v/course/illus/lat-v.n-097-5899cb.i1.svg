<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1276" role="img" aria-label="Схема шага «Параметр насыщения связывает сопротивление, пористость и воду»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Параметр насыщения связывает сопротивление, пористость и воду»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Сопротивление неизменённой</text><text class="it" x="24" y="96">части пласта (ρп) — из</text><text class="it" x="24" y="122">метода сопротивления.</text><rect class="i-in" x="12" y="146" width="316" height="102" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Пористость, переведённая в</text><text class="it" x="24" y="230">параметр пористости Pп.</text><rect class="i-in" x="12" y="254" width="316" height="154" rx="6"/><text class="ih" x="24" y="286">Вход</text><text class="it" x="24" y="312">Сопротивление пластовой</text><text class="it" x="24" y="338">воды (ρв) — из метода,</text><text class="it" x="24" y="364">дающего сведения о</text><text class="it" x="24" y="390">качестве воды.</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="102" rx="6"/><text class="it" x="24" y="480">Параметр насыщения</text><text class="it" x="24" y="506">связывает сопротивление,</text><text class="it" x="24" y="532">пористость и воду</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="102" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Pн = ρп / ρвп — параметр</text><text class="it" x="24" y="668">насыщения.</text><rect class="i-out" x="12" y="692" width="316" height="128" rx="6"/><text class="ih" x="24" y="724">Вывод</text><text class="it" x="24" y="750">Коэффициент водонасыщения</text><text class="it" x="24" y="776">kв — при количественном</text><text class="it" x="24" y="802">решении соотношения (10).</text><rect class="i-out" x="12" y="826" width="316" height="128" rx="6"/><text class="ih" x="24" y="858">Вывод</text><text class="it" x="24" y="884">Качественный характер</text><text class="it" x="24" y="910">насыщения разреза — при</text><text class="it" x="24" y="936">качественном решении.</text><rect class="i-warn" x="12" y="960" width="316" height="128" rx="6"/><text class="ih" x="24" y="992">Где ломается</text><text class="it" x="24" y="1018">ρвп не измеряют, а считают</text><text class="it" x="24" y="1044">по пористости: ошибка</text><text class="it" x="24" y="1070">пористости переходит в Pн.</text><rect class="i-warn" x="12" y="1094" width="316" height="128" rx="6"/><text class="ih" x="24" y="1126">Где ломается</text><text class="it" x="24" y="1152">Если ρп взято не из</text><text class="it" x="24" y="1178">неизменённой части пласта,</text><text class="it" x="24" y="1204">Pн искажается.</text><rect x="249" y="1240" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1261">схема</text></svg>