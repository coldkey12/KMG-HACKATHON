<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1086" role="img" aria-label="Схема шага «Палетка: по сопротивлению и пористости — характер насыщения»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Палетка: по сопротивлению и пористости — характер насыщения»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Удельное сопротивление</text><text class="it" x="24" y="96">пласта ρп (Ом·м; в книге</text><text class="it" x="24" y="122">ρn).</text><rect class="i-in" x="12" y="146" width="316" height="102" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Пористость пласта kп</text><text class="it" x="24" y="230">(коэффициент пористости).</text><rect class="i-in" x="12" y="254" width="316" height="128" rx="6"/><text class="ih" x="24" y="286">Вход</text><text class="it" x="24" y="312">Семейство кривых по шифру</text><text class="it" x="24" y="338">kв* и граница коллектора</text><text class="it" x="24" y="364">рис. 69.</text><line class="ia" x1="170" y1="392" x2="170" y2="412"/><path class="iah" d="M170 418 l-6 -9 h12 z"/><rect class="i-node" x="12" y="422" width="316" height="102" rx="6"/><text class="it" x="24" y="454">Палетка: по сопротивлению</text><text class="it" x="24" y="480">и пористости — характер</text><text class="it" x="24" y="506">насыщения</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="154" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Зона на графике: безводная</text><text class="it" x="24" y="642">нефть (I), нефть с водой</text><text class="it" x="24" y="668">(II), вода (III) или</text><text class="it" x="24" y="694">неколлектор (А).</text><rect class="i-warn" x="12" y="718" width="316" height="180" rx="6"/><text class="ih" x="24" y="750">Где ломается</text><text class="it" x="24" y="776">Глинистые коллекторы</text><text class="it" x="24" y="802">описываются отдельным</text><text class="it" x="24" y="828">семейством (зона IV);</text><text class="it" x="24" y="854">одного семейства для всех</text><text class="it" x="24" y="880">недостаточно.</text><rect class="i-warn" x="12" y="904" width="316" height="128" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">В двухфазной области вода</text><text class="it" x="24" y="988">и нефть текут вместе;</text><text class="it" x="24" y="1014">граница задана кривыми 3.</text><rect x="249" y="1050" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1071">схема</text></svg>