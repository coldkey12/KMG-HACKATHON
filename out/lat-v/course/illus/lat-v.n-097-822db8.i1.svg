<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1350" role="img" aria-label="Схема шага «Как устроена палетка ρп–kп»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Как устроена палетка ρп–kп»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Удельное сопротивление</text><text class="it" x="24" y="96">пласта ρп, Ом·м —</text><text class="it" x="24" y="122">откладывают на палетке;</text><text class="it" x="24" y="148">получают из каротажа.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Коэффициент пористости kп</text><text class="it" x="24" y="256">— откладывают по</text><text class="it" x="24" y="282">горизонтали; получают из</text><text class="it" x="24" y="308">методов пористости.</text><rect class="i-in" x="12" y="332" width="316" height="154" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Относительное</text><text class="it" x="24" y="416">водонасыщение — выбирают</text><text class="it" x="24" y="442">семейство кривых; шкала от</text><text class="it" x="24" y="468">0 до 1.</text><line class="ia" x1="170" y1="496" x2="170" y2="516"/><path class="iah" d="M170 522 l-6 -9 h12 z"/><rect class="i-node" x="12" y="526" width="316" height="50" rx="6"/><text class="it" x="24" y="558">Как устроена палетка ρп–kп</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="154" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Положение точки (ρп, kп)</text><text class="it" x="24" y="694">относительно кривых и</text><text class="it" x="24" y="720">областей I–III указывает</text><text class="it" x="24" y="746">характер насыщения.</text><rect class="i-out" x="12" y="770" width="316" height="180" rx="6"/><text class="ih" x="24" y="802">Вывод</text><text class="it" x="24" y="828">Попадание в поле</text><text class="it" x="24" y="854">коллекторов Б по</text><text class="it" x="24" y="880">граничному значению 17 %</text><text class="it" x="24" y="906">на этом рисунке — признак</text><text class="it" x="24" y="932">коллектора.</text><rect class="i-warn" x="12" y="956" width="316" height="154" rx="6"/><text class="ih" x="24" y="988">Где ломается</text><text class="it" x="24" y="1014">Граница 17 % действует</text><text class="it" x="24" y="1040">только для рисунка 69; для</text><text class="it" x="24" y="1066">другого объекта её берут</text><text class="it" x="24" y="1092">заново.</text><rect class="i-warn" x="12" y="1116" width="316" height="180" rx="6"/><text class="ih" x="24" y="1148">Где ломается</text><text class="it" x="24" y="1174">Обозначение kn в книге</text><text class="it" x="24" y="1200">используется и для оси, и</text><text class="it" x="24" y="1226">в формуле; значение оси</text><text class="it" x="24" y="1252">нужно уточнить (вопрос</text><text class="it" x="24" y="1278">q1).</text><rect x="249" y="1314" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1335">схема</text></svg>