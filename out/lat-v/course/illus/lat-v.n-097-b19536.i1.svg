<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1302" role="img" aria-label="Схема шага «От проницаемости к порогу на кривой»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «От проницаемости к порогу на кривой»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Граничная проницаемость</text><text class="it" x="24" y="96">kпр*.</text><rect class="i-in" x="12" y="120" width="316" height="102" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Связь ΔJнт = f(kн) для</text><text class="it" x="24" y="204">пути по пористости.</text><rect class="i-in" x="12" y="228" width="316" height="102" rx="6"/><text class="ih" x="24" y="260">Вход</text><text class="it" x="24" y="286">Связь kпр = f(kгл или ηгл)</text><text class="it" x="24" y="312">для пути по глинистости.</text><line class="ia" x1="170" y1="340" x2="170" y2="360"/><path class="iah" d="M170 366 l-6 -9 h12 z"/><rect class="i-node" x="12" y="370" width="316" height="76" rx="6"/><text class="it" x="24" y="402">От проницаемости к порогу</text><text class="it" x="24" y="428">на кривой</text><line class="ia" x1="170" y1="450" x2="170" y2="470"/><path class="iah" d="M170 476 l-6 -9 h12 z"/><rect class="i-out" x="12" y="480" width="316" height="128" rx="6"/><text class="ih" x="24" y="512">Вывод</text><text class="it" x="24" y="538">Граничная пористость kн*</text><text class="it" x="24" y="564">или граничная глинистость</text><text class="it" x="24" y="590">ηгл* (kгл*).</text><rect class="i-out" x="12" y="614" width="316" height="128" rx="6"/><text class="ih" x="24" y="646">Вывод</text><text class="it" x="24" y="672">Граничные значения</text><text class="it" x="24" y="698">диаграмм ΔJнт*, ΔТ* и</text><text class="it" x="24" y="724">αСП*.</text><rect class="i-out" x="12" y="748" width="316" height="154" rx="6"/><text class="ih" x="24" y="780">Вывод</text><text class="it" x="24" y="806">Уровень на диаграммах,</text><text class="it" x="24" y="832">который делит пласты на</text><text class="it" x="24" y="858">классы «коллектор» и</text><text class="it" x="24" y="884">«неколлектор».</text><rect class="i-warn" x="12" y="908" width="316" height="154" rx="6"/><text class="ih" x="24" y="940">Где ломается</text><text class="it" x="24" y="966">Для пути по пористости в</text><text class="it" x="24" y="992">тексте не показано, как</text><text class="it" x="24" y="1018">связь с kн переводит kпр*</text><text class="it" x="24" y="1044">в kн*.</text><rect class="i-warn" x="12" y="1068" width="316" height="180" rx="6"/><text class="ih" x="24" y="1100">Где ломается</text><text class="it" x="24" y="1126">Связи получают для</text><text class="it" x="24" y="1152">конкретного разреза. Одна</text><text class="it" x="24" y="1178">связь не переносится на</text><text class="it" x="24" y="1204">другой разрез без</text><text class="it" x="24" y="1230">проверки.</text><rect x="249" y="1266" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1287">схема</text></svg>