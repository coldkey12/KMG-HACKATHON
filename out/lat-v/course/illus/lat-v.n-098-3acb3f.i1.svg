<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1008" role="img" aria-label="Схема шага «Сравниваем параметр насыщения с порогом»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Сравниваем параметр насыщения с порогом»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Pн, вычисленный по</text><text class="it" x="24" y="96">формулам (10) и (11) или</text><text class="it" x="24" y="122">снятый с рис. 7</text><rect class="i-in" x="12" y="146" width="316" height="102" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Зависимость Pн = f(kв) для</text><text class="it" x="24" y="230">изучаемого коллектора</text><rect class="i-in" x="12" y="254" width="316" height="128" rx="6"/><text class="ih" x="24" y="286">Вход</text><text class="it" x="24" y="312">Критические значения Pн,кр</text><text class="it" x="24" y="338">и kв,кр для того же</text><text class="it" x="24" y="364">коллектора</text><line class="ia" x1="170" y1="392" x2="170" y2="412"/><path class="iah" d="M170 418 l-6 -9 h12 z"/><rect class="i-node" x="12" y="422" width="316" height="76" rx="6"/><text class="it" x="24" y="454">Сравниваем параметр</text><text class="it" x="24" y="480">насыщения с порогом</text><line class="ia" x1="170" y1="502" x2="170" y2="522"/><path class="iah" d="M170 528 l-6 -9 h12 z"/><rect class="i-out" x="12" y="532" width="316" height="128" rx="6"/><text class="ih" x="24" y="564">Вывод</text><text class="it" x="24" y="590">Класс коллектора:</text><text class="it" x="24" y="616">продуктивный или</text><text class="it" x="24" y="642">непродуктивный</text><rect class="i-warn" x="12" y="666" width="316" height="154" rx="6"/><text class="ih" x="24" y="698">Где ломается</text><text class="it" x="24" y="724">Критические значения взяты</text><text class="it" x="24" y="750">не для изучаемого</text><text class="it" x="24" y="776">коллектора, и вывод</text><text class="it" x="24" y="802">становится неверным</text><rect class="i-warn" x="12" y="826" width="316" height="128" rx="6"/><text class="ih" x="24" y="858">Где ломается</text><text class="it" x="24" y="884">Одно условие выполнено,</text><text class="it" x="24" y="910">второе нет: текст такого</text><text class="it" x="24" y="936">случая не описывает</text><rect x="249" y="972" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="993">схема</text></svg>