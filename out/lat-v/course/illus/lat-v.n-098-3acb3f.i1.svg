<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1354" role="img" aria-label="Схема шага «Два порога: чистая нефть и промышленный приток»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Два порога: чистая нефть и промышленный приток»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Pн для пласта,</text><text class="it" x="24" y="96">рассчитанный по формулам</text><text class="it" x="24" y="122">(10) и (11) или снятый с</text><text class="it" x="24" y="148">рисунка 7.</text><rect class="i-in" x="12" y="172" width="316" height="102" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Зависимость Pн = f(kв) для</text><text class="it" x="24" y="256">изучаемого коллектора.</text><rect class="i-in" x="12" y="280" width="316" height="154" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Критические Pн,кр и kв,кр</text><text class="it" x="24" y="364">для того же коллектора.</text><text class="it" x="24" y="390">Откуда их берут, в этом</text><text class="it" x="24" y="416">узле не сказано.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Два порога: чистая нефть и</text><text class="it" x="24" y="532">промышленный приток</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="128" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Вывод: коллектор</text><text class="it" x="24" y="668">продуктивный или</text><text class="it" x="24" y="694">непродуктивный.</text><rect class="i-out" x="12" y="718" width="316" height="128" rx="6"/><text class="ih" x="24" y="750">Вывод</text><text class="it" x="24" y="776">Отнесение пласта к чистой</text><text class="it" x="24" y="802">нефти (газу) или к смеси с</text><text class="it" x="24" y="828">водой по паре Pн* и kв*.</text><rect class="i-out" x="12" y="852" width="316" height="128" rx="6"/><text class="ih" x="24" y="884">Вывод</text><text class="it" x="24" y="910">Отнесение притока к</text><text class="it" x="24" y="936">промышленному по паре</text><text class="it" x="24" y="962">Pн,кр и kв,кр.</text><rect class="i-warn" x="12" y="986" width="316" height="154" rx="6"/><text class="ih" x="24" y="1018">Где ломается</text><text class="it" x="24" y="1044">Если одна величина выше</text><text class="it" x="24" y="1070">порога, а другая нет,</text><text class="it" x="24" y="1096">правило из текста не даёт</text><text class="it" x="24" y="1122">однозначного вывода.</text><rect class="i-warn" x="12" y="1146" width="316" height="154" rx="6"/><text class="ih" x="24" y="1178">Где ломается</text><text class="it" x="24" y="1204">Пороги относятся к</text><text class="it" x="24" y="1230">изучаемому коллектору.</text><text class="it" x="24" y="1256">Переносить их на другой</text><text class="it" x="24" y="1282">пласт без проверки нельзя.</text><rect x="249" y="1318" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1339">схема</text></svg>