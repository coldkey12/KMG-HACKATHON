<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1134" role="img" aria-label="Схема шага «Два способа найти критические значения»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Два способа найти критические значения»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Данные опробования</text><text class="it" x="24" y="96">продуктивных и</text><text class="it" x="24" y="122">непродуктивных объектов:</text><text class="it" x="24" y="148">значения Pн для каждой</text><text class="it" x="24" y="174">группы.</text><rect class="i-in" x="12" y="198" width="316" height="206" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Лабораторная связь Pн =</text><text class="it" x="24" y="282">f(kв) и зависимости</text><text class="it" x="24" y="308">относительной фазовой</text><text class="it" x="24" y="334">проницаемости по нефти и</text><text class="it" x="24" y="360">воде от kв, полученные по</text><text class="it" x="24" y="386">керну.</text><line class="ia" x1="170" y1="414" x2="170" y2="434"/><path class="iah" d="M170 440 l-6 -9 h12 z"/><rect class="i-node" x="12" y="444" width="316" height="76" rx="6"/><text class="it" x="24" y="476">Два способа найти</text><text class="it" x="24" y="502">критические значения</text><line class="ia" x1="170" y1="524" x2="170" y2="544"/><path class="iah" d="M170 550 l-6 -9 h12 z"/><rect class="i-out" x="12" y="554" width="316" height="180" rx="6"/><text class="ih" x="24" y="586">Вывод</text><text class="it" x="24" y="612">Критические значения Pн и</text><text class="it" x="24" y="638">соответствующее kв — из</text><text class="it" x="24" y="664">пересечения распределений</text><text class="it" x="24" y="690">или сопоставления</text><text class="it" x="24" y="716">зависимостей.</text><rect class="i-warn" x="12" y="740" width="316" height="154" rx="6"/><text class="ih" x="24" y="772">Где ломается</text><text class="it" x="24" y="798">Статистический результат</text><text class="it" x="24" y="824">приходит поздно: в начале</text><text class="it" x="24" y="850">разведки опробованных</text><text class="it" x="24" y="876">интервалов мало.</text><rect class="i-warn" x="12" y="900" width="316" height="180" rx="6"/><text class="ih" x="24" y="932">Где ломается</text><text class="it" x="24" y="958">Значения действуют для</text><text class="it" x="24" y="984">изучаемой группы</text><text class="it" x="24" y="1010">коллекторов; переносить их</text><text class="it" x="24" y="1036">на другую группу без</text><text class="it" x="24" y="1062">проверки нельзя.</text><rect x="249" y="1098" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1119">схема</text></svg>