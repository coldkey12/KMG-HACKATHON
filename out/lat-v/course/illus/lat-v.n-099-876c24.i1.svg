<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1168" role="img" aria-label="Схема шага «Пороги Рн: нефть, неопределённость, вода»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Пороги Рн: нефть, неопределённость, вода»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Пары значений Pн и kв для</text><text class="it" x="24" y="96">коллектора.</text><rect class="i-in" x="12" y="120" width="316" height="180" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Минимальная</text><text class="it" x="24" y="204">водонасыщенность</text><text class="it" x="24" y="230">коллектора (kв.св) —</text><text class="it" x="24" y="256">точка, которой</text><text class="it" x="24" y="282">соответствует Pн max.</text><rect class="i-in" x="12" y="306" width="316" height="102" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Соотношение нефти и воды в</text><text class="it" x="24" y="390">притоке, например, 1.</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Пороги Рн: нефть,</text><text class="it" x="24" y="506">неопределённость, вода</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="128" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Зона: чистая нефть,</text><text class="it" x="24" y="642">неопределённо или чистая</text><text class="it" x="24" y="668">вода.</text><rect class="i-out" x="12" y="692" width="316" height="102" rx="6"/><text class="ih" x="24" y="724">Вывод</text><text class="it" x="24" y="750">Пара kв,кр и Pн,кр из</text><text class="it" x="24" y="776">точки пересечения кривых.</text><rect class="i-warn" x="12" y="800" width="316" height="102" rx="6"/><text class="ih" x="24" y="832">Где ломается</text><text class="it" x="24" y="858">Зона между Pн* и Pн** не</text><text class="it" x="24" y="884">даёт одного ответа.</text><rect class="i-warn" x="12" y="908" width="316" height="206" rx="6"/><text class="ih" x="24" y="940">Где ломается</text><text class="it" x="24" y="966">Пороги Pн* и Pн** зависят</text><text class="it" x="24" y="992">от коллектора и</text><text class="it" x="24" y="1018">соотношения нефти и воды,</text><text class="it" x="24" y="1044">поэтому их нельзя</text><text class="it" x="24" y="1070">переносить между пластами</text><text class="it" x="24" y="1096">без проверки.</text><rect x="249" y="1132" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1153">схема</text></svg>