<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 930" role="img" aria-label="Схема шага «Примеры 49–50: что даст пласт при испытании»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Примеры 49–50: что даст пласт при испытании»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривая фазовой</text><text class="it" x="24" y="96">проницаемости (рис. 70, б)</text><text class="it" x="24" y="122">для граничных kв.</text><rect class="i-in" x="12" y="146" width="316" height="102" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Кривая Pн = f(kв) (рис.</text><text class="it" x="24" y="230">70, а) для граничных Pн.</text><rect class="i-in" x="12" y="254" width="316" height="76" rx="6"/><text class="ih" x="24" y="286">Вход</text><text class="it" x="24" y="312">Измеренный Pн пласта.</text><line class="ia" x1="170" y1="340" x2="170" y2="360"/><path class="iah" d="M170 366 l-6 -9 h12 z"/><rect class="i-node" x="12" y="370" width="316" height="76" rx="6"/><text class="it" x="24" y="402">Примеры 49–50: что даст</text><text class="it" x="24" y="428">пласт при испытании</text><line class="ia" x1="170" y1="450" x2="170" y2="470"/><path class="iah" d="M170 476 l-6 -9 h12 z"/><rect class="i-out" x="12" y="480" width="316" height="154" rx="6"/><text class="ih" x="24" y="512">Вывод</text><text class="it" x="24" y="538">Вид притока при испытании:</text><text class="it" x="24" y="564">чистая нефть, нефть с</text><text class="it" x="24" y="590">водой, вода с признаками</text><text class="it" x="24" y="616">нефти или чистая вода.</text><rect class="i-warn" x="12" y="640" width="316" height="102" rx="6"/><text class="ih" x="24" y="672">Где ломается</text><text class="it" x="24" y="698">Кривая для другого αсп</text><text class="it" x="24" y="724">даёт другой ответ.</text><rect class="i-warn" x="12" y="748" width="316" height="128" rx="6"/><text class="ih" x="24" y="780">Где ломается</text><text class="it" x="24" y="806">Pн близкий к порогу: ответ</text><text class="it" x="24" y="832">зависит от точности</text><text class="it" x="24" y="858">порога.</text><rect x="249" y="894" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="915">схема</text></svg>