<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1086" role="img" aria-label="Схема шага «Пласт у контакта: считаем до ВНК»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Пласт у контакта: считаем до ВНК»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Диаграмма сопротивления по</text><text class="it" x="24" y="96">коллектору: высокие</text><text class="it" x="24" y="122">значения в верхней</text><text class="it" x="24" y="148">продуктивной части.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Признак характера</text><text class="it" x="24" y="256">насыщения интервала: нефть</text><text class="it" x="24" y="282">или газ либо вода.</text><line class="ia" x1="170" y1="310" x2="170" y2="330"/><path class="iah" d="M170 336 l-6 -9 h12 z"/><rect class="i-node" x="12" y="340" width="316" height="76" rx="6"/><text class="it" x="24" y="372">Пласт у контакта: считаем</text><text class="it" x="24" y="398">до ВНК</text><line class="ia" x1="170" y1="420" x2="170" y2="440"/><path class="iah" d="M170 446 l-6 -9 h12 z"/><rect class="i-out" x="12" y="450" width="316" height="154" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Эффективная толщина:</text><text class="it" x="24" y="534">отрезок от кровли</text><text class="it" x="24" y="560">коллектора до уровня</text><text class="it" x="24" y="586">контакта.</text><rect class="i-out" x="12" y="610" width="316" height="128" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Уровень ВНК или ГВК как</text><text class="it" x="24" y="694">граница продуктивной части</text><text class="it" x="24" y="720">в разрезе.</text><rect class="i-warn" x="12" y="744" width="316" height="154" rx="6"/><text class="ih" x="24" y="776">Где ломается</text><text class="it" x="24" y="802">Граница размыта, есть</text><text class="it" x="24" y="828">переходная зона: подошва</text><text class="it" x="24" y="854">высокоомного пласта не</text><text class="it" x="24" y="880">даёт однозначный контакт.</text><rect class="i-warn" x="12" y="904" width="316" height="128" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Вода и остаточная нефть у</text><text class="it" x="24" y="988">контакта по одной кривой</text><text class="it" x="24" y="1014">могут выглядеть похоже.</text><rect x="249" y="1050" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1071">схема</text></svg>