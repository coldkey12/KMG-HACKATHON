<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1328" role="img" aria-label="Схема шага «Глинистые коллекторы: семейство порогов»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Глинистые коллекторы: семейство порогов»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Зависимость Pн от kв для</text><text class="it" x="24" y="96">каждого класса</text><text class="it" x="24" y="122">коллекторов: отдельная</text><text class="it" x="24" y="148">кривая на класс.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Кривые фазовых</text><text class="it" x="24" y="256">проницаемостей по нефти и</text><text class="it" x="24" y="282">воде для каждого класса.</text><rect class="i-in" x="12" y="306" width="316" height="128" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Значение параметра</text><text class="it" x="24" y="390">глинистости, например αСП,</text><text class="it" x="24" y="416">для глинистого коллектора.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Глинистые коллекторы:</text><text class="it" x="24" y="532">семейство порогов</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="128" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Характерные точки на</text><text class="it" x="24" y="668">каждой кривой: kв.св, k* и</text><text class="it" x="24" y="694">k**.</text><rect class="i-out" x="12" y="718" width="316" height="128" rx="6"/><text class="ih" x="24" y="750">Вывод</text><text class="it" x="24" y="776">Граничные линии (P*, k*) и</text><text class="it" x="24" y="802">(P**, k**): области нефти,</text><text class="it" x="24" y="828">нефти с водой и воды.</text><rect class="i-out" x="12" y="852" width="316" height="128" rx="6"/><text class="ih" x="24" y="884">Вывод</text><text class="it" x="24" y="910">Кривая промышленного</text><text class="it" x="24" y="936">притока по точкам (P_sp,</text><text class="it" x="24" y="962">k_sp).</text><rect class="i-warn" x="12" y="986" width="316" height="154" rx="6"/><text class="ih" x="24" y="1018">Где ломается</text><text class="it" x="24" y="1044">Без параметра глинистости</text><text class="it" x="24" y="1070">для глинистого коллектора</text><text class="it" x="24" y="1096">нужную кривую выбрать</text><text class="it" x="24" y="1122">нельзя.</text><rect class="i-warn" x="12" y="1146" width="316" height="128" rx="6"/><text class="ih" x="24" y="1178">Где ломается</text><text class="it" x="24" y="1204">Если класс коллекторов не</text><text class="it" x="24" y="1230">выделен, одна кривая</text><text class="it" x="24" y="1256">смешивает разные породы.</text><rect x="249" y="1292" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1313">схема</text></svg>