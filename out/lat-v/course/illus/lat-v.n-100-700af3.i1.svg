<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1168" role="img" aria-label="Схема шага «Пороги насыщения для каждого класса пласта»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Пороги насыщения для каждого класса пласта»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Класс пласта по</text><text class="it" x="24" y="96">относительной амплитуде СП</text><text class="it" x="24" y="122">(αСП): значения 1; 0,9;</text><text class="it" x="24" y="148">0,8; 0,7.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Кривые относительной</text><text class="it" x="24" y="256">фазовой проницаемости</text><text class="it" x="24" y="282">нефти и воды для класса</text><text class="it" x="24" y="308">коллектора.</text><rect class="i-in" x="12" y="332" width="316" height="128" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Графики Pн = f(kв) для</text><text class="it" x="24" y="416">каждого фиксированного</text><text class="it" x="24" y="442">αСП.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Пороги насыщения для</text><text class="it" x="24" y="558">каждого класса пласта</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="128" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Строка таблицы 22: три</text><text class="it" x="24" y="694">пары (Pн, kв) для одного</text><text class="it" x="24" y="720">класса.</text><rect class="i-out" x="12" y="744" width="316" height="128" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Ответ по точке (Pн, αСП):</text><text class="it" x="24" y="828">область I, II или III на</text><text class="it" x="24" y="854">рис. 7, б.</text><rect class="i-warn" x="12" y="878" width="316" height="128" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">αСП вне таблицы (например</text><text class="it" x="24" y="962">0,95 в примере 53): строки</text><text class="it" x="24" y="988">в таблице нет.</text><rect class="i-warn" x="12" y="1012" width="316" height="102" rx="6"/><text class="ih" x="24" y="1044">Где ломается</text><text class="it" x="24" y="1070">Одна и та же Pн при разном</text><text class="it" x="24" y="1096">αСП даёт разный ответ.</text><rect x="249" y="1132" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1153">схема</text></svg>