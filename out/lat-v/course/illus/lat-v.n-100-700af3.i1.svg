<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1030" role="img" aria-label="Схема шага «Таблица порогов для разных классов коллекторов»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Таблица порогов для разных классов коллекторов»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Пара Pн и α_СП для точки</text><text class="it" x="24" y="96">пласта.</text><rect class="i-in" x="12" y="120" width="316" height="154" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Кривые относительной</text><text class="it" x="24" y="204">фазовой проницаемости и</text><text class="it" x="24" y="230">графики Pн = f(kв) для</text><text class="it" x="24" y="256">каждого класса.</text><line class="ia" x1="170" y1="284" x2="170" y2="304"/><path class="iah" d="M170 310 l-6 -9 h12 z"/><rect class="i-node" x="12" y="314" width="316" height="76" rx="6"/><text class="it" x="24" y="346">Таблица порогов для разных</text><text class="it" x="24" y="372">классов коллекторов</text><line class="ia" x1="170" y1="394" x2="170" y2="414"/><path class="iah" d="M170 420 l-6 -9 h12 z"/><rect class="i-out" x="12" y="424" width="316" height="232" rx="6"/><text class="ih" x="24" y="456">Вывод</text><text class="it" x="24" y="482">Характер насыщения:</text><text class="it" x="24" y="508">нефтеносный, нефть с</text><text class="it" x="24" y="534">небольшим количеством</text><text class="it" x="24" y="560">воды, предельно</text><text class="it" x="24" y="586">нефтенасыщенный, нефть с</text><text class="it" x="24" y="612">водой, вода с признаками</text><text class="it" x="24" y="638">нефти.</text><rect class="i-warn" x="12" y="662" width="316" height="180" rx="6"/><text class="ih" x="24" y="694">Где ломается</text><text class="it" x="24" y="720">Класс α_СП между</text><text class="it" x="24" y="746">значениями таблицы</text><text class="it" x="24" y="772">(например 0,95) определяют</text><text class="it" x="24" y="798">по рис. 7, б, а не по</text><text class="it" x="24" y="824">строке таблицы.</text><rect class="i-warn" x="12" y="848" width="316" height="128" rx="6"/><text class="ih" x="24" y="880">Где ломается</text><text class="it" x="24" y="906">Условие точки «50 на 50»</text><text class="it" x="24" y="932">записано неясно; его смысл</text><text class="it" x="24" y="958">проверяют по скану.</text><rect x="249" y="994" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1015">схема</text></svg>