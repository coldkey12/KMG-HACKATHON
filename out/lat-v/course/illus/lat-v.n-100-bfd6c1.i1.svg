<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1164" role="img" aria-label="Схема шага «Практикум: насыщение по диаграммам»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Практикум: насыщение по диаграммам»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Диаграммы комплекса ГИС из</text><text class="it" x="24" y="96">условий: рис. 67 и 76</text><text class="it" x="24" y="122">(задача 92), рис. 14 и 68</text><text class="it" x="24" y="148">(задача 93).</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Диаграммы рис. 58 и 46</text><text class="it" x="24" y="256">(задача 94) и рис. 73</text><text class="it" x="24" y="282">(задача 95).</text><rect class="i-in" x="12" y="306" width="316" height="154" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Удельное сопротивление</text><text class="it" x="24" y="390">пластовых вод, которое</text><text class="it" x="24" y="416">задача 94 просит</text><text class="it" x="24" y="442">установить и объяснить.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Практикум: насыщение по</text><text class="it" x="24" y="558">диаграммам</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="180" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Вывод о характере</text><text class="it" x="24" y="694">насыщения каждого</text><text class="it" x="24" y="720">выделенного коллектора:</text><text class="it" x="24" y="746">нефть, вода или</text><text class="it" x="24" y="772">неоднозначно.</text><rect class="i-warn" x="12" y="796" width="316" height="154" rx="6"/><text class="ih" x="24" y="828">Где ломается</text><text class="it" x="24" y="854">Вывод может быть</text><text class="it" x="24" y="880">неоднозначным; задача 93</text><text class="it" x="24" y="906">просит назвать причины</text><text class="it" x="24" y="932">этой неоднозначности.</text><rect class="i-warn" x="12" y="956" width="316" height="154" rx="6"/><text class="ih" x="24" y="988">Где ломается</text><text class="it" x="24" y="1014">В тонкослоистом коллекторе</text><text class="it" x="24" y="1040">трудно разделить</text><text class="it" x="24" y="1066">продуктивные и водоносные</text><text class="it" x="24" y="1092">пласты.</text><rect x="249" y="1128" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1149">схема</text></svg>