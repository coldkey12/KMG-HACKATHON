<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1454" role="img" aria-label="Схема шага «ГНК по повторным нейтронным замерам»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «ГНК по повторным нейтронным замерам»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Серия повторных</text><text class="it" x="24" y="96">стационарных нейтронных</text><text class="it" x="24" y="122">замеров в обсаженной</text><text class="it" x="24" y="148">скважине: показания во</text><text class="it" x="24" y="174">времени по глубине.</text><rect class="i-in" x="12" y="198" width="316" height="180" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Один замер стационарным</text><text class="it" x="24" y="282">или импульсным нейтронным</text><text class="it" x="24" y="308">прибором в необсаженной</text><text class="it" x="24" y="334">скважине на</text><text class="it" x="24" y="360">нефильтрующемся растворе.</text><rect class="i-in" x="12" y="384" width="316" height="180" rx="6"/><text class="ih" x="24" y="416">Вход</text><text class="it" x="24" y="442">Диаграммы других</text><text class="it" x="24" y="468">геофизических методов для</text><text class="it" x="24" y="494">сопоставления; на рис. 71</text><text class="it" x="24" y="520">это глины, коллекторы,</text><text class="it" x="24" y="546">нефть и газ.</text><line class="ia" x1="170" y1="574" x2="170" y2="594"/><path class="iah" d="M170 600 l-6 -9 h12 z"/><rect class="i-node" x="12" y="604" width="316" height="76" rx="6"/><text class="it" x="24" y="636">ГНК по повторным</text><text class="it" x="24" y="662">нейтронным замерам</text><line class="ia" x1="170" y1="684" x2="170" y2="704"/><path class="iah" d="M170 710 l-6 -9 h12 z"/><rect class="i-out" x="12" y="714" width="316" height="206" rx="6"/><text class="ih" x="24" y="746">Вывод</text><text class="it" x="24" y="772">Положение ГНК по</text><text class="it" x="24" y="798">диаграмме, найденное по</text><text class="it" x="24" y="824">стабильному участку</text><text class="it" x="24" y="850">повторных замеров и</text><text class="it" x="24" y="876">сопоставлению с другими</text><text class="it" x="24" y="902">методами.</text><rect class="i-out" x="12" y="926" width="316" height="154" rx="6"/><text class="ih" x="24" y="958">Вывод</text><text class="it" x="24" y="984">Момент завершения</text><text class="it" x="24" y="1010">расформирования зоны</text><text class="it" x="24" y="1036">проникновения: показания</text><text class="it" x="24" y="1062">перестали меняться.</text><rect class="i-warn" x="12" y="1086" width="316" height="154" rx="6"/><text class="ih" x="24" y="1118">Где ломается</text><text class="it" x="24" y="1144">Пока показания меняются во</text><text class="it" x="24" y="1170">времени, по одному замеру</text><text class="it" x="24" y="1196">положение контакта не</text><text class="it" x="24" y="1222">определяется.</text><rect class="i-warn" x="12" y="1246" width="316" height="154" rx="6"/><text class="ih" x="24" y="1278">Где ломается</text><text class="it" x="24" y="1304">Низкая проницаемость и</text><text class="it" x="24" y="1330">большой радиус зоны</text><text class="it" x="24" y="1356">проникновения удлиняют</text><text class="it" x="24" y="1382">программу замеров.</text><rect x="249" y="1418" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1439">схема</text></svg>