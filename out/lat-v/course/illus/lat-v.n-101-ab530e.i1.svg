<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1432" role="img" aria-label="Схема шага «ГНК по повторным нейтронным замерам»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «ГНК по повторным нейтронным замерам»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Серия повторных нейтронных</text><text class="it" x="24" y="96">диаграмм одной обсаженной</text><text class="it" x="24" y="122">скважины, записанных во</text><text class="it" x="24" y="148">времени</text><rect class="i-in" x="12" y="172" width="316" height="180" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Однократная диаграмма</text><text class="it" x="24" y="256">стационарного или</text><text class="it" x="24" y="282">импульсного НМ в</text><text class="it" x="24" y="308">необсаженной скважине на</text><text class="it" x="24" y="334">нефильтрующемся растворе</text><rect class="i-in" x="12" y="358" width="316" height="102" rx="6"/><text class="ih" x="24" y="390">Вход</text><text class="it" x="24" y="416">Интервалы времени между</text><text class="it" x="24" y="442">повторными замерами</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">ГНК по повторным</text><text class="it" x="24" y="558">нейтронным замерам</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="128" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Положение ГНК по</text><text class="it" x="24" y="694">стабилизированной</text><text class="it" x="24" y="720">диаграмме</text><rect class="i-out" x="12" y="744" width="316" height="128" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Момент стабилизации как</text><text class="it" x="24" y="828">признак окончания</text><text class="it" x="24" y="854">расформирования зоны</text><rect class="i-out" x="12" y="878" width="316" height="154" rx="6"/><text class="ih" x="24" y="910">Вывод</text><text class="it" x="24" y="936">Газовый интервал,</text><text class="it" x="24" y="962">выделенный по НГМ в</text><text class="it" x="24" y="988">комплексе с другими</text><text class="it" x="24" y="1014">методами (пример рис. 71)</text><rect class="i-warn" x="12" y="1038" width="316" height="180" rx="6"/><text class="ih" x="24" y="1070">Где ломается</text><text class="it" x="24" y="1096">Пока показания НМ</text><text class="it" x="24" y="1122">повышены, книга не</text><text class="it" x="24" y="1148">предлагает по ним</text><text class="it" x="24" y="1174">определять ГНК. Замеры</text><text class="it" x="24" y="1200">повторяют до стабилизации.</text><rect class="i-warn" x="12" y="1224" width="316" height="154" rx="6"/><text class="ih" x="24" y="1256">Где ломается</text><text class="it" x="24" y="1282">Низкая проницаемость и</text><text class="it" x="24" y="1308">большой радиус зоны</text><text class="it" x="24" y="1334">продлевают расформирование</text><text class="it" x="24" y="1360">и замеры.</text><rect x="249" y="1396" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1417">схема</text></svg>