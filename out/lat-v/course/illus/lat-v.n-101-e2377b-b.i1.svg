<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1350" role="img" aria-label="Схема шага «Тонкослоистая пачка: считаем через сопротивление»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Тонкослоистая пачка: считаем через сопротивление»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Удельное сопротивление</text><text class="it" x="24" y="96">пачки ρ_n берут по</text><text class="it" x="24" y="122">диаграммам БЭЗ или</text><text class="it" x="24" y="148">комплекса фокусированных</text><text class="it" x="24" y="174">методов.</text><rect class="i-in" x="12" y="198" width="316" height="128" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Удельное сопротивление</text><text class="it" x="24" y="282">глин ρ_cn берут обычно по</text><text class="it" x="24" y="308">глинам, вмещающим пачку.</text><rect class="i-in" x="12" y="332" width="316" height="180" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Удельное сопротивление</text><text class="it" x="24" y="416">коллектора ρ_nm берут по</text><text class="it" x="24" y="442">керну или по наиболее</text><text class="it" x="24" y="468">чистому продуктивному</text><text class="it" x="24" y="494">коллектору в разрезе.</text><line class="ia" x1="170" y1="522" x2="170" y2="542"/><path class="iah" d="M170 548 l-6 -9 h12 z"/><rect class="i-node" x="12" y="552" width="316" height="102" rx="6"/><text class="it" x="24" y="584">Тонкослоистая пачка:</text><text class="it" x="24" y="610">считаем через</text><text class="it" x="24" y="636">сопротивление</text><line class="ia" x1="170" y1="658" x2="170" y2="678"/><path class="iah" d="M170 684 l-6 -9 h12 z"/><rect class="i-out" x="12" y="688" width="316" height="154" rx="6"/><text class="ih" x="24" y="720">Вывод</text><text class="it" x="24" y="746">Относительная по толщине</text><text class="it" x="24" y="772">глинистость χ_cn</text><text class="it" x="24" y="798">получается из формулы</text><text class="it" x="24" y="824">(63).</text><rect class="i-out" x="12" y="848" width="316" height="128" rx="6"/><text class="ih" x="24" y="880">Вывод</text><text class="it" x="24" y="906">Суммарная эффективная</text><text class="it" x="24" y="932">толщина пачки получается</text><text class="it" x="24" y="958">из формулы (64).</text><rect class="i-warn" x="12" y="982" width="316" height="180" rx="6"/><text class="ih" x="24" y="1014">Где ломается</text><text class="it" x="24" y="1040">Отдельные тонкие прослои</text><text class="it" x="24" y="1066">не выделяются, поэтому</text><text class="it" x="24" y="1092">отбивку по ним не сделать.</text><text class="it" x="24" y="1118">Нужен расчёт по всей</text><text class="it" x="24" y="1144">пачке.</text><rect class="i-warn" x="12" y="1168" width="316" height="128" rx="6"/><text class="ih" x="24" y="1200">Где ломается</text><text class="it" x="24" y="1226">Ошибка в ρ_cn или ρ_nm</text><text class="it" x="24" y="1252">переходит в χ_cn и в</text><text class="it" x="24" y="1278">толщину.</text><rect x="249" y="1314" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1335">схема</text></svg>