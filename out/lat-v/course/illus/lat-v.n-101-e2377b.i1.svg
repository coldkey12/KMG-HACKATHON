<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1116" role="img" aria-label="Схема шага «Вычитаем прослои неколлектора»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Вычитаем прослои неколлектора»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривые микрозондов и</text><text class="it" x="24" y="96">нейтронных методов по</text><text class="it" x="24" y="122">интервалу пласта</text><rect class="i-in" x="12" y="146" width="316" height="102" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Кривые ГМ и СП по тому же</text><text class="it" x="24" y="230">интервалу</text><rect class="i-in" x="12" y="254" width="316" height="102" rx="6"/><text class="ih" x="24" y="286">Вход</text><text class="it" x="24" y="312">Толщина всего мощного</text><text class="it" x="24" y="338">пласта h</text><line class="ia" x1="170" y1="366" x2="170" y2="386"/><path class="iah" d="M170 392 l-6 -9 h12 z"/><rect class="i-node" x="12" y="396" width="316" height="76" rx="6"/><text class="it" x="24" y="428">Вычитаем прослои</text><text class="it" x="24" y="454">неколлектора</text><line class="ia" x1="170" y1="476" x2="170" y2="496"/><path class="iah" d="M170 502 l-6 -9 h12 z"/><rect class="i-out" x="12" y="506" width="316" height="128" rx="6"/><text class="ih" x="24" y="538">Вывод</text><text class="it" x="24" y="564">Толщины прослоев</text><text class="it" x="24" y="590">неколлектора и их сумма</text><text class="it" x="24" y="616">Σhпл</text><rect class="i-out" x="12" y="640" width="316" height="102" rx="6"/><text class="ih" x="24" y="672">Вывод</text><text class="it" x="24" y="698">Эффективная толщина h_эф =</text><text class="it" x="24" y="724">h − Σhпл</text><rect class="i-warn" x="12" y="748" width="316" height="180" rx="6"/><text class="ih" x="24" y="780">Где ломается</text><text class="it" x="24" y="806">Тонкие прослои, которые</text><text class="it" x="24" y="832">приборы не различают по</text><text class="it" x="24" y="858">отдельности, в этом</text><text class="it" x="24" y="884">правиле не учтены</text><text class="it" x="24" y="910">(следующий узел).</text><rect class="i-warn" x="12" y="934" width="316" height="128" rx="6"/><text class="ih" x="24" y="966">Где ломается</text><text class="it" x="24" y="992">Глинистый цемент в плотном</text><text class="it" x="24" y="1018">прослое меняет его</text><text class="it" x="24" y="1044">показания на ГМ и СП.</text><rect x="249" y="1080" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1101">схема</text></svg>