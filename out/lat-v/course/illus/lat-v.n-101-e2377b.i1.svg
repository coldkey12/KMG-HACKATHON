<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1164" role="img" aria-label="Схема шага «Вычитаем прослои неколлектора»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Вычитаем прослои неколлектора»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Диаграммы микрозондов:</text><text class="it" x="24" y="96">повышенные показания у</text><text class="it" x="24" y="122">глин и плотных пород с</text><text class="it" x="24" y="148">глинистым цементом.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Значения kп: низкие, kп &lt;</text><text class="it" x="24" y="256">kп*, у глин и плотных</text><text class="it" x="24" y="282">пород с глинистым</text><text class="it" x="24" y="308">цементом.</text><rect class="i-in" x="12" y="332" width="316" height="180" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Диаграммы микрозондов и</text><text class="it" x="24" y="416">нейтронных методов:</text><text class="it" x="24" y="442">высокие значения у плотных</text><text class="it" x="24" y="468">пород с неактивным</text><text class="it" x="24" y="494">цементом.</text><line class="ia" x1="170" y1="522" x2="170" y2="542"/><path class="iah" d="M170 548 l-6 -9 h12 z"/><rect class="i-node" x="12" y="552" width="316" height="76" rx="6"/><text class="it" x="24" y="584">Вычитаем прослои</text><text class="it" x="24" y="610">неколлектора</text><line class="ia" x1="170" y1="632" x2="170" y2="652"/><path class="iah" d="M170 658 l-6 -9 h12 z"/><rect class="i-out" x="12" y="662" width="316" height="102" rx="6"/><text class="ih" x="24" y="694">Вывод</text><text class="it" x="24" y="720">Эффективная толщина h_эф =</text><text class="it" x="24" y="746">h − Σh_пл.</text><rect class="i-warn" x="12" y="770" width="316" height="128" rx="6"/><text class="ih" x="24" y="802">Где ломается</text><text class="it" x="24" y="828">Формула работает только</text><text class="it" x="24" y="854">для пласта, однородного по</text><text class="it" x="24" y="880">характеру насыщения.</text><rect class="i-warn" x="12" y="904" width="316" height="206" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Плотная порода с</text><text class="it" x="24" y="988">неактивным цементом и</text><text class="it" x="24" y="1014">глинистым цементом видна</text><text class="it" x="24" y="1040">на СП и ГМ. Её нельзя</text><text class="it" x="24" y="1066">отнести к плотным прослоям</text><text class="it" x="24" y="1092">по этим методам.</text><rect x="249" y="1128" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1149">схема</text></svg>