<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1116" role="img" aria-label="Схема шага «Глинистость пачки по амплитуде СП»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Глинистость пачки по амплитуде СП»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Средняя аномалия СП в</text><text class="it" x="24" y="96">пачке ΔU_СП, снятая с</text><text class="it" x="24" y="122">кривой СП.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Максимальная аномалия СП</text><text class="it" x="24" y="230">ΔE_max в близлежащем</text><text class="it" x="24" y="256">чистом коллекторе.</text><rect class="i-in" x="12" y="280" width="316" height="102" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Сопротивление вмещающих</text><text class="it" x="24" y="364">глин ρгл.</text><line class="ia" x1="170" y1="392" x2="170" y2="412"/><path class="iah" d="M170 418 l-6 -9 h12 z"/><rect class="i-node" x="12" y="422" width="316" height="76" rx="6"/><text class="it" x="24" y="454">Глинистость пачки по</text><text class="it" x="24" y="480">амплитуде СП</text><line class="ia" x1="170" y1="502" x2="170" y2="522"/><path class="iah" d="M170 528 l-6 -9 h12 z"/><rect class="i-out" x="12" y="532" width="316" height="102" rx="6"/><text class="ih" x="24" y="564">Вывод</text><text class="it" x="24" y="590">Относительная по толщине</text><text class="it" x="24" y="616">глинистость пачки χгл.</text><rect class="i-out" x="12" y="640" width="316" height="128" rx="6"/><text class="ih" x="24" y="672">Вывод</text><text class="it" x="24" y="698">Эффективная толщина пачки</text><text class="it" x="24" y="724">после расчёта по формуле</text><text class="it" x="24" y="750">(64).</text><rect class="i-warn" x="12" y="774" width="316" height="128" rx="6"/><text class="ih" x="24" y="806">Где ломается</text><text class="it" x="24" y="832">Если опорный чистый</text><text class="it" x="24" y="858">коллектор далеко, ΔE_max</text><text class="it" x="24" y="884">не сравним с пачкой.</text><rect class="i-warn" x="12" y="908" width="316" height="154" rx="6"/><text class="ih" x="24" y="940">Где ломается</text><text class="it" x="24" y="966">Палетка рассчитана на одно</text><text class="it" x="24" y="992">отношение ρнм/ρгл. При</text><text class="it" x="24" y="1018">другом отношении её</text><text class="it" x="24" y="1044">использовать нельзя.</text><rect x="249" y="1080" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1101">схема</text></svg>