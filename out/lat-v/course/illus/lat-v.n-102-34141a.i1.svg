<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1056" role="img" aria-label="Схема шага «Практикум: тонкослоистый газоносный пласт»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Практикум: тонкослоистый газоносный пласт»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Диаграммы БЭЗ и СП по</text><text class="it" x="24" y="96">интервалу тонкослоистого</text><text class="it" x="24" y="122">газоносного пласта (рис.</text><text class="it" x="24" y="148">73).</text><rect class="i-in" x="12" y="172" width="316" height="232" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Удельное сопротивление</text><text class="it" x="24" y="256">глин, среднее</text><text class="it" x="24" y="282">сопротивление пачки,</text><text class="it" x="24" y="308">пористость чистых</text><text class="it" x="24" y="334">прослоев, сопротивление</text><text class="it" x="24" y="360">воды, газонасыщение и</text><text class="it" x="24" y="386">общая толщина пачки.</text><line class="ia" x1="170" y1="414" x2="170" y2="434"/><path class="iah" d="M170 440 l-6 -9 h12 z"/><rect class="i-node" x="12" y="444" width="316" height="76" rx="6"/><text class="it" x="24" y="476">Практикум: тонкослоистый</text><text class="it" x="24" y="502">газоносный пласт</text><line class="ia" x1="170" y1="524" x2="170" y2="544"/><path class="iah" d="M170 550 l-6 -9 h12 z"/><rect class="i-out" x="12" y="554" width="316" height="128" rx="6"/><text class="ih" x="24" y="586">Вывод</text><text class="it" x="24" y="612">Глинистость пачки χгл и</text><text class="it" x="24" y="638">эффективная толщина</text><text class="it" x="24" y="664">газоносного коллектора.</text><rect class="i-warn" x="12" y="688" width="316" height="154" rx="6"/><text class="ih" x="24" y="720">Где ломается</text><text class="it" x="24" y="746">Тонкие слои не разбираются</text><text class="it" x="24" y="772">по одной кривой; ответ</text><text class="it" x="24" y="798">дают средние по пачке</text><text class="it" x="24" y="824">величины.</text><rect class="i-warn" x="12" y="848" width="316" height="154" rx="6"/><text class="ih" x="24" y="880">Где ломается</text><text class="it" x="24" y="906">Обработка БЭЗ трудоёмка в</text><text class="it" x="24" y="932">слоистом коллекторе,</text><text class="it" x="24" y="958">поэтому принимают ρmax ≡</text><text class="it" x="24" y="984">ρsn.</text><rect x="249" y="1020" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1041">схема</text></svg>