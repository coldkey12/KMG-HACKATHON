<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1172" role="img" aria-label="Схема шага «Практикум: эффективная толщина пачек»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Практикум: эффективная толщина пачек»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Диаграммы БЭЗ и СП по</text><text class="it" x="24" y="96">газоносному разрезу (рис.</text><text class="it" x="24" y="122">73).</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Сопротивления глин,</text><text class="it" x="24" y="230">плотных разностей и</text><text class="it" x="24" y="256">продуктивных коллекторов.</text><rect class="i-in" x="12" y="280" width="316" height="128" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Среднее удельное</text><text class="it" x="24" y="364">сопротивление пачки и её</text><text class="it" x="24" y="390">общая толщина.</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Практикум: эффективная</text><text class="it" x="24" y="506">толщина пачек</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="76" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Глинистость пачки.</text><rect class="i-out" x="12" y="640" width="316" height="102" rx="6"/><text class="ih" x="24" y="672">Вывод</text><text class="it" x="24" y="698">Эффективная толщина</text><text class="it" x="24" y="724">коллектора в пачке.</text><rect class="i-out" x="12" y="748" width="316" height="102" rx="6"/><text class="ih" x="24" y="780">Вывод</text><text class="it" x="24" y="806">Оценка ошибки, если</text><text class="it" x="24" y="832">плотные прослои не учтены.</text><rect class="i-warn" x="12" y="856" width="316" height="102" rx="6"/><text class="ih" x="24" y="888">Где ломается</text><text class="it" x="24" y="914">Плотные прослои не учтены:</text><text class="it" x="24" y="940">толщина выходит неверной.</text><rect class="i-warn" x="12" y="964" width="316" height="154" rx="6"/><text class="ih" x="24" y="996">Где ломается</text><text class="it" x="24" y="1022">Обработка БЭЗ в слоистом</text><text class="it" x="24" y="1048">коллекторе трудоёмка,</text><text class="it" x="24" y="1074">поэтому ρmax принимают</text><text class="it" x="24" y="1100">равным ρsn.</text><rect x="249" y="1136" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1157">схема</text></svg>