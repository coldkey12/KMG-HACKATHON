<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1168" role="img" aria-label="Схема шага «Доля глины в пачке по сопротивлению»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Доля глины в пачке по сопротивлению»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Удельное сопротивление</text><text class="it" x="24" y="96">пачки ρп по диаграмме БЭЗ</text><text class="it" x="24" y="122">или фокусированного</text><text class="it" x="24" y="148">комплекса.</text><rect class="i-in" x="12" y="172" width="316" height="102" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Удельное сопротивление</text><text class="it" x="24" y="256">глин, вмещающих пачку.</text><rect class="i-in" x="12" y="280" width="316" height="180" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Удельное сопротивление</text><text class="it" x="24" y="364">чистого продуктивного</text><text class="it" x="24" y="390">коллектора из керна или из</text><text class="it" x="24" y="416">наиболее чистых интервалов</text><text class="it" x="24" y="442">разреза.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Доля глины в пачке по</text><text class="it" x="24" y="558">сопротивлению</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="102" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Относительная по толщине</text><text class="it" x="24" y="694">глинистость χгл пачки.</text><rect class="i-out" x="12" y="718" width="316" height="102" rx="6"/><text class="ih" x="24" y="750">Вывод</text><text class="it" x="24" y="776">Суммарная эффективная</text><text class="it" x="24" y="802">толщина пачки h_эфΣ.</text><rect class="i-warn" x="12" y="826" width="316" height="128" rx="6"/><text class="ih" x="24" y="858">Где ломается</text><text class="it" x="24" y="884">Ответ зависит от выбора</text><text class="it" x="24" y="910">ρгл и ρпм. Неверный</text><text class="it" x="24" y="936">интервал сдвигает χгл.</text><rect class="i-warn" x="12" y="960" width="316" height="154" rx="6"/><text class="ih" x="24" y="992">Где ломается</text><text class="it" x="24" y="1018">Формула учитывает только</text><text class="it" x="24" y="1044">глину и продуктивный</text><text class="it" x="24" y="1070">коллектор. Плотные прослои</text><text class="it" x="24" y="1096">в неё не входят.</text><rect x="249" y="1132" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1153">схема</text></svg>