<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1272" role="img" aria-label="Схема шага «Пачка с глинами и плотными прослоями»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Пачка с глинами и плотными прослоями»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Среднее удельное</text><text class="it" x="24" y="96">сопротивление пачки</text><text class="it" x="24" y="122">(ρ_nav), Ом·м.</text><rect class="i-in" x="12" y="146" width="316" height="154" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Сопротивления слоёв: глины</text><text class="it" x="24" y="230">(ρ_cn), плотной породы</text><text class="it" x="24" y="256">(ρ_ns) и коллектора</text><text class="it" x="24" y="282">(ρ_nm), Ом·м.</text><rect class="i-in" x="12" y="306" width="316" height="180" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Относительные по толщине</text><text class="it" x="24" y="390">доли глинистых и плотных</text><text class="it" x="24" y="416">прослоев (χ_cn, χ_ns) —</text><text class="it" x="24" y="442">неизвестные, которые надо</text><text class="it" x="24" y="468">оценить.</text><line class="ia" x1="170" y1="496" x2="170" y2="516"/><path class="iah" d="M170 522 l-6 -9 h12 z"/><rect class="i-node" x="12" y="526" width="316" height="76" rx="6"/><text class="it" x="24" y="558">Пачка с глинами и плотными</text><text class="it" x="24" y="584">прослоями</text><line class="ia" x1="170" y1="606" x2="170" y2="626"/><path class="iah" d="M170 632 l-6 -9 h12 z"/><rect class="i-out" x="12" y="636" width="316" height="128" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Связь между ρ_nav и долями</text><text class="it" x="24" y="720">с сопротивлениями слоёв по</text><text class="it" x="24" y="746">формуле (65).</text><rect class="i-out" x="12" y="770" width="316" height="128" rx="6"/><text class="ih" x="24" y="802">Вывод</text><text class="it" x="24" y="828">Вклад плотных прослоев в</text><text class="it" x="24" y="854">ρ_nav слабый, если ρ_ns</text><text class="it" x="24" y="880">близко к ρ_nm.</text><rect class="i-warn" x="12" y="904" width="316" height="154" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Формула относится к тонким</text><text class="it" x="24" y="988">прослоям двух типов:</text><text class="it" x="24" y="1014">глинистым и плотным с</text><text class="it" x="24" y="1040">неактивным цементом.</text><rect class="i-warn" x="12" y="1064" width="316" height="154" rx="6"/><text class="ih" x="24" y="1096">Где ломается</text><text class="it" x="24" y="1122">Если ρ_ns сильно</text><text class="it" x="24" y="1148">отличается от ρ_nm,</text><text class="it" x="24" y="1174">плотные прослои влияют на</text><text class="it" x="24" y="1200">ρ_nav заметнее.</text><rect x="249" y="1236" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1257">схема</text></svg>