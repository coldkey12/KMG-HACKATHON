<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1402" role="img" aria-label="Схема шага «Глинистые и плотные прослои вместе»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Глинистые и плотные прослои вместе»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="206" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Среднее сопротивление</text><text class="it" x="24" y="96">пачки ρnav; в соседнем</text><text class="it" x="24" y="122">разделе главы его</text><text class="it" x="24" y="148">определяют по диаграммам</text><text class="it" x="24" y="174">БЭЗ или фокусированных</text><text class="it" x="24" y="200">методов.</text><rect class="i-in" x="12" y="224" width="316" height="128" rx="6"/><text class="ih" x="24" y="256">Вход</text><text class="it" x="24" y="282">Сопротивления глинистых</text><text class="it" x="24" y="308">прослоев ρcn и прослоев</text><text class="it" x="24" y="334">коллектора ρnm.</text><rect class="i-in" x="12" y="358" width="316" height="128" rx="6"/><text class="ih" x="24" y="390">Вход</text><text class="it" x="24" y="416">Доля глинистых прослоев по</text><text class="it" x="24" y="442">толщине χcn (относительная</text><text class="it" x="24" y="468">глинистость пачки).</text><line class="ia" x1="170" y1="496" x2="170" y2="516"/><path class="iah" d="M170 522 l-6 -9 h12 z"/><rect class="i-node" x="12" y="526" width="316" height="76" rx="6"/><text class="it" x="24" y="558">Глинистые и плотные</text><text class="it" x="24" y="584">прослои вместе</text><line class="ia" x1="170" y1="606" x2="170" y2="626"/><path class="iah" d="M170 632 l-6 -9 h12 z"/><rect class="i-out" x="12" y="636" width="316" height="154" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Сопротивление прослоев</text><text class="it" x="24" y="720">коллектора ρnm, если все</text><text class="it" x="24" y="746">остальные величины</text><text class="it" x="24" y="772">известны по формуле (65).</text><rect class="i-out" x="12" y="796" width="316" height="128" rx="6"/><text class="ih" x="24" y="828">Вывод</text><text class="it" x="24" y="854">Суммарная толщина плотных</text><text class="it" x="24" y="880">прослоев: её находят одним</text><text class="it" x="24" y="906">из трёх путей.</text><rect class="i-warn" x="12" y="930" width="316" height="154" rx="6"/><text class="ih" x="24" y="962">Где ломается</text><text class="it" x="24" y="988">Плотные прослои не видны</text><text class="it" x="24" y="1014">на СП и ГМ, поэтому по</text><text class="it" x="24" y="1040">этим кривым их доля не</text><text class="it" x="24" y="1066">определяется.</text><rect class="i-warn" x="12" y="1090" width="316" height="258" rx="6"/><text class="ih" x="24" y="1122">Где ломается</text><text class="it" x="24" y="1148">Если сопротивления плотных</text><text class="it" x="24" y="1174">прослоев и коллектора</text><text class="it" x="24" y="1200">заметно различаются, учёт</text><text class="it" x="24" y="1226">плотных прослоев в ρnm уже</text><text class="it" x="24" y="1252">не будет слабым. Автор</text><text class="it" x="24" y="1278">говорит «обычно»,</text><text class="it" x="24" y="1304">исключения он не</text><text class="it" x="24" y="1330">описывает.</text><rect x="249" y="1366" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1387">схема</text></svg>