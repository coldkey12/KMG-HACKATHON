<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1246" role="img" aria-label="Схема шага «Практикум: плотные прослои меняют ответ»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Практикум: плотные прослои меняют ответ»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Удельные сопротивления</text><text class="it" x="24" y="96">плотных разностей, глин и</text><text class="it" x="24" y="122">продуктивных коллекторов,</text><text class="it" x="24" y="148">Ом·м</text><rect class="i-in" x="12" y="172" width="316" height="102" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Среднее удельное</text><text class="it" x="24" y="256">сопротивление пачки, Ом·м</text><rect class="i-in" x="12" y="280" width="316" height="128" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Доля плотных прослоев по</text><text class="it" x="24" y="364">керну, не более 20 % общей</text><text class="it" x="24" y="390">толщины</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Практикум: плотные прослои</text><text class="it" x="24" y="506">меняют ответ</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="154" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Эффективная толщина пачки:</text><text class="it" x="24" y="642">полная толщина минус</text><text class="it" x="24" y="668">толщины неколлекторных</text><text class="it" x="24" y="694">прослоев</text><rect class="i-out" x="12" y="718" width="316" height="128" rx="6"/><text class="ih" x="24" y="750">Вывод</text><text class="it" x="24" y="776">Ошибка эффективной</text><text class="it" x="24" y="802">толщины, если плотные</text><text class="it" x="24" y="828">прослои не вычитать</text><rect class="i-warn" x="12" y="852" width="316" height="180" rx="6"/><text class="ih" x="24" y="884">Где ломается</text><text class="it" x="24" y="910">Плотные прослои слабо</text><text class="it" x="24" y="936">влияют на оценку</text><text class="it" x="24" y="962">сопротивления чистого</text><text class="it" x="24" y="988">коллектора, в отличие от</text><text class="it" x="24" y="1014">глинистых</text><rect class="i-warn" x="12" y="1038" width="316" height="154" rx="6"/><text class="ih" x="24" y="1070">Где ломается</text><text class="it" x="24" y="1096">На СП и ГМ плотные прослои</text><text class="it" x="24" y="1122">почти не видны, поэтому</text><text class="it" x="24" y="1148">эти методы не показывают</text><text class="it" x="24" y="1174">их толщину</text><rect x="249" y="1210" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1231">схема</text></svg>