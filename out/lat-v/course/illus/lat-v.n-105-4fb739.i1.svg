<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1350" role="img" aria-label="Схема шага «Почему карбонаты труднее терригенных»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Почему карбонаты труднее терригенных»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривые сопротивления ρп:</text><text class="it" x="24" y="96">по ним сравнивают</text><text class="it" x="24" y="122">продуктивный коллектор и</text><text class="it" x="24" y="148">неколлектор.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Кривые пористости по</text><text class="it" x="24" y="256">карбонатному интервалу для</text><text class="it" x="24" y="282">оценки коэффициента</text><text class="it" x="24" y="308">пористости.</text><rect class="i-in" x="12" y="332" width="316" height="180" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Кривые СП и ГМ: в</text><text class="it" x="24" y="416">карбонатах с малой</text><text class="it" x="24" y="442">глинистостью их отклик</text><text class="it" x="24" y="468">слабо связан с</text><text class="it" x="24" y="494">коллекторскими свойствами.</text><line class="ia" x1="170" y1="522" x2="170" y2="542"/><path class="iah" d="M170 548 l-6 -9 h12 z"/><rect class="i-node" x="12" y="552" width="316" height="76" rx="6"/><text class="it" x="24" y="584">Почему карбонаты труднее</text><text class="it" x="24" y="610">терригенных</text><line class="ia" x1="170" y1="632" x2="170" y2="652"/><path class="iah" d="M170 658 l-6 -9 h12 z"/><rect class="i-out" x="12" y="662" width="316" height="154" rx="6"/><text class="ih" x="24" y="694">Вывод</text><text class="it" x="24" y="720">Оценка характера насыщения</text><text class="it" x="24" y="746">карбонатного коллектора по</text><text class="it" x="24" y="772">сопротивлению становится</text><text class="it" x="24" y="798">труднее.</text><rect class="i-out" x="12" y="822" width="316" height="154" rx="6"/><text class="ih" x="24" y="854">Вывод</text><text class="it" x="24" y="880">Вывод о продуктивности</text><text class="it" x="24" y="906">интервала требует</text><text class="it" x="24" y="932">дополнительных признаков,</text><text class="it" x="24" y="958">не только сопротивления.</text><rect class="i-warn" x="12" y="982" width="316" height="154" rx="6"/><text class="ih" x="24" y="1014">Где ломается</text><text class="it" x="24" y="1040">Низкая пористость:</text><text class="it" x="24" y="1066">фильтрат уходит глубже, и</text><text class="it" x="24" y="1092">сопротивление отражает</text><text class="it" x="24" y="1118">зону проникновения.</text><rect class="i-warn" x="12" y="1142" width="316" height="154" rx="6"/><text class="ih" x="24" y="1174">Где ломается</text><text class="it" x="24" y="1200">Сопротивления коллектора и</text><text class="it" x="24" y="1226">неколлектора соизмеримы,</text><text class="it" x="24" y="1252">одного сопротивления</text><text class="it" x="24" y="1278">недостаточно.</text><rect x="249" y="1314" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1335">схема</text></svg>