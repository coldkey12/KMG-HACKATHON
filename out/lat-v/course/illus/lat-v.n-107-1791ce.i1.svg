<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1138" role="img" aria-label="Схема шага «Граничная пористость карбонатов: от 1 до 13 %»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Граничная пористость карбонатов: от 1 до 13 %»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривая зависимости kп,cn =</text><text class="it" x="24" y="96">f(kп) для класса</text><text class="it" x="24" y="122">карбонатного межзернового</text><text class="it" x="24" y="148">коллектора (рис. 77).</text><rect class="i-in" x="12" y="172" width="316" height="102" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Критерий kп,cn = 70 %, по</text><text class="it" x="24" y="256">которому берут kп*.</text><line class="ia" x1="170" y1="284" x2="170" y2="304"/><path class="iah" d="M170 310 l-6 -9 h12 z"/><rect class="i-node" x="12" y="314" width="316" height="76" rx="6"/><text class="it" x="24" y="346">Граничная пористость</text><text class="it" x="24" y="372">карбонатов: от 1 до 13 %</text><line class="ia" x1="170" y1="394" x2="170" y2="414"/><path class="iah" d="M170 420 l-6 -9 h12 z"/><rect class="i-out" x="12" y="424" width="316" height="206" rx="6"/><text class="ih" x="24" y="456">Вывод</text><text class="it" x="24" y="482">Граничная пористость kп*</text><text class="it" x="24" y="508">для данного класса</text><text class="it" x="24" y="534">коллекторов. По ней</text><text class="it" x="24" y="560">отбирают коллекторы при</text><text class="it" x="24" y="586">расчёте эффективной</text><text class="it" x="24" y="612">толщины.</text><rect class="i-out" x="12" y="636" width="316" height="102" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Ориентиры из таблицы 23:</text><text class="it" x="24" y="720">от 1 до 13 %.</text><rect class="i-warn" x="12" y="744" width="316" height="154" rx="6"/><text class="ih" x="24" y="776">Где ломается</text><text class="it" x="24" y="802">kп*, взятое не для своих</text><text class="it" x="24" y="828">отложений, даёт серьёзные</text><text class="it" x="24" y="854">погрешности в эффективной</text><text class="it" x="24" y="880">толщине.</text><rect class="i-warn" x="12" y="904" width="316" height="180" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Подписи строк таблицы 23 и</text><text class="it" x="24" y="988">кривых рис. 77 не</text><text class="it" x="24" y="1014">совпадают полностью.</text><text class="it" x="24" y="1040">Источник значений нужно</text><text class="it" x="24" y="1066">проверить.</text><rect x="249" y="1102" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1123">схема</text></svg>