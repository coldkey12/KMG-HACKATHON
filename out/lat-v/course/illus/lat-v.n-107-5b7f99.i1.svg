<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1302" role="img" aria-label="Схема шага «Пример 54: ВНК и толщина нормализацией»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Пример 54: ВНК и толщина нормализацией»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривая сопротивления зонда</text><text class="it" x="24" y="96">БК-3 и кривая</text><text class="it" x="24" y="122">сопротивления</text><text class="it" x="24" y="148">индукционного метода</text><text class="it" x="24" y="174">(ρnHM).</text><rect class="i-in" x="12" y="198" width="316" height="154" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Кривая НГМ как показатель</text><text class="it" x="24" y="282">пористости, приведённая к</text><text class="it" x="24" y="308">общему масштабу с кривыми</text><text class="it" x="24" y="334">сопротивления.</text><rect class="i-in" x="12" y="358" width="316" height="102" rx="6"/><text class="ih" x="24" y="390">Вход</text><text class="it" x="24" y="416">Критическое значение Pн,кр</text><text class="it" x="24" y="442">≈ 2,5.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Пример 54: ВНК и толщина</text><text class="it" x="24" y="558">нормализацией</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="128" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Продуктивная верхняя часть</text><text class="it" x="24" y="694">и водоносная нижняя часть</text><text class="it" x="24" y="720">разреза.</text><rect class="i-out" x="12" y="744" width="316" height="76" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Глубина ВНК 1083 м.</text><rect class="i-out" x="12" y="826" width="316" height="128" rx="6"/><text class="ih" x="24" y="858">Вывод</text><text class="it" x="24" y="884">Суммарная толщина прослоев</text><text class="it" x="24" y="910">неколлектора 4,5 м;</text><text class="it" x="24" y="936">эффективная толщина 9 м.</text><rect class="i-warn" x="12" y="960" width="316" height="128" rx="6"/><text class="ih" x="24" y="992">Где ломается</text><text class="it" x="24" y="1018">Если ρnHM заметно</text><text class="it" x="24" y="1044">отличается от ρn, отметка</text><text class="it" x="24" y="1070">ВНК может быть неверной.</text><rect class="i-warn" x="12" y="1094" width="316" height="154" rx="6"/><text class="ih" x="24" y="1126">Где ломается</text><text class="it" x="24" y="1152">Сближение кривых НГМ и</text><text class="it" x="24" y="1178">БК-3 — признак</text><text class="it" x="24" y="1204">неколлектора только в</text><text class="it" x="24" y="1230">отдельных случаях.</text><rect x="249" y="1266" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1287">схема</text></svg>