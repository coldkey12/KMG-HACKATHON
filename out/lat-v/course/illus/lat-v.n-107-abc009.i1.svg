<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1484" role="img" aria-label="Схема шага «Нормализация: наложить сопротивление на пористость»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Нормализация: наложить сопротивление на пористость»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="206" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривая сопротивления</text><text class="it" x="24" y="96">фокусированного</text><text class="it" x="24" y="122">электрического метода</text><text class="it" x="24" y="148">большой глубинности,</text><text class="it" x="24" y="174">например экранированного</text><text class="it" x="24" y="200">зонда.</text><rect class="i-in" x="12" y="224" width="316" height="102" rx="6"/><text class="ih" x="24" y="256">Вход</text><text class="it" x="24" y="282">Кривая метода пористости:</text><text class="it" x="24" y="308">НМ, АК или ГГМ.</text><rect class="i-in" x="12" y="332" width="316" height="180" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Глубинность электрического</text><text class="it" x="24" y="416">метода, проверенная по</text><text class="it" x="24" y="442">условию захвата</text><text class="it" x="24" y="468">неизменённой части</text><text class="it" x="24" y="494">водоносного коллектора.</text><line class="ia" x1="170" y1="522" x2="170" y2="542"/><path class="iah" d="M170 548 l-6 -9 h12 z"/><rect class="i-node" x="12" y="552" width="316" height="102" rx="6"/><text class="it" x="24" y="584">Нормализация: наложить</text><text class="it" x="24" y="610">сопротивление на</text><text class="it" x="24" y="636">пористость</text><line class="ia" x1="170" y1="658" x2="170" y2="678"/><path class="iah" d="M170 684 l-6 -9 h12 z"/><rect class="i-out" x="12" y="688" width="316" height="128" rx="6"/><text class="ih" x="24" y="720">Вывод</text><text class="it" x="24" y="746">Интервалы совпадения</text><text class="it" x="24" y="772">кривых: неколлекторы или</text><text class="it" x="24" y="798">водоносные коллекторы.</text><rect class="i-out" x="12" y="822" width="316" height="128" rx="6"/><text class="ih" x="24" y="854">Вывод</text><text class="it" x="24" y="880">Интервалы расхождения</text><text class="it" x="24" y="906">кривых: признак</text><text class="it" x="24" y="932">продуктивного коллектора.</text><rect class="i-out" x="12" y="956" width="316" height="128" rx="6"/><text class="ih" x="24" y="988">Вывод</text><text class="it" x="24" y="1014">При пресном фильтрате</text><text class="it" x="24" y="1040">расхождение указывает на</text><text class="it" x="24" y="1066">коллектор.</text><rect class="i-warn" x="12" y="1090" width="316" height="180" rx="6"/><text class="ih" x="24" y="1122">Где ломается</text><text class="it" x="24" y="1148">Если глубинность не</text><text class="it" x="24" y="1174">захватывает неизменённую</text><text class="it" x="24" y="1200">часть водоносного</text><text class="it" x="24" y="1226">коллектора, совмещение не</text><text class="it" x="24" y="1252">работает.</text><rect class="i-warn" x="12" y="1276" width="316" height="154" rx="6"/><text class="ih" x="24" y="1308">Где ломается</text><text class="it" x="24" y="1334">Расхождение — признак, а</text><text class="it" x="24" y="1360">не доказательство. Без</text><text class="it" x="24" y="1386">проверки другими методами</text><text class="it" x="24" y="1412">его нельзя считать нефтью.</text><rect x="249" y="1448" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1469">схема</text></svg>