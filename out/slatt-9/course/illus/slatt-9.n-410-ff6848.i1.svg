<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1004" role="img" aria-label="Схема шага «Меконг: датированная проградация за 6000 лет»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Меконг: датированная проградация за 6000 лет»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Колонки скважин с</text><text class="it" x="24" y="96">литологией и</text><text class="it" x="24" y="122">палеообстановкой — основа</text><text class="it" x="24" y="148">литостратиграфической</text><text class="it" x="24" y="174">корреляции.</text><rect class="i-in" x="12" y="198" width="316" height="154" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Измеренные линии времени —</text><text class="it" x="24" y="282">основа</text><text class="it" x="24" y="308">хроностратиграфической</text><text class="it" x="24" y="334">корреляции.</text><line class="ia" x1="170" y1="362" x2="170" y2="382"/><path class="iah" d="M170 388 l-6 -9 h12 z"/><rect class="i-node" x="12" y="392" width="316" height="76" rx="6"/><text class="it" x="24" y="424">Меконг: датированная</text><text class="it" x="24" y="450">проградация за 6000 лет</text><line class="ia" x1="170" y1="472" x2="170" y2="492"/><path class="iah" d="M170 498 l-6 -9 h12 z"/><rect class="i-out" x="12" y="502" width="316" height="154" rx="6"/><text class="ih" x="24" y="534">Вывод</text><text class="it" x="24" y="560">Два набора сопоставлений</text><text class="it" x="24" y="586">одних и тех же скважин. Их</text><text class="it" x="24" y="612">различие показывает</text><text class="it" x="24" y="638">возможные разрывы.</text><rect class="i-warn" x="12" y="662" width="316" height="154" rx="6"/><text class="ih" x="24" y="694">Где ломается</text><text class="it" x="24" y="720">Если интерпретация среды</text><text class="it" x="24" y="746">неверна,</text><text class="it" x="24" y="772">литостратиграфическая</text><text class="it" x="24" y="798">корреляция ошибается.</text><rect class="i-warn" x="12" y="822" width="316" height="128" rx="6"/><text class="ih" x="24" y="854">Где ломается</text><text class="it" x="24" y="880">В этом примере датировки</text><text class="it" x="24" y="906">есть только для последних</text><text class="it" x="24" y="932">6000 лет.</text><rect x="249" y="968" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="989">схема</text></svg>