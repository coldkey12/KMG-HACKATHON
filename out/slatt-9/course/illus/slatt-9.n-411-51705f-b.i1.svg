<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1298" role="img" aria-label="Схема шага «Узнаём фацию по огрублению зерна вверх»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Узнаём фацию по огрублению зерна вверх»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Керн с описанием слоёв:</text><text class="it" x="24" y="96">соотношение песка и глины,</text><text class="it" x="24" y="122">размер зерна по высоте,</text><text class="it" x="24" y="148">осадочные структуры.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Кривые каротажа по стволу</text><text class="it" x="24" y="256">скважины, по которым видно</text><text class="it" x="24" y="282">утонение и мельчание</text><text class="it" x="24" y="308">пласта.</text><rect class="i-in" x="12" y="332" width="316" height="154" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Гамма-каротаж (ГК) как</text><text class="it" x="24" y="416">типичная кривая для оценки</text><text class="it" x="24" y="442">глинистости, то есть</text><text class="it" x="24" y="468">мелкой зернистости.</text><line class="ia" x1="170" y1="496" x2="170" y2="516"/><path class="iah" d="M170 522 l-6 -9 h12 z"/><rect class="i-node" x="12" y="526" width="316" height="76" rx="6"/><text class="it" x="24" y="558">Узнаём фацию по огрублению</text><text class="it" x="24" y="584">зерна вверх</text><line class="ia" x1="170" y1="606" x2="170" y2="626"/><path class="iah" d="M170 632 l-6 -9 h12 z"/><rect class="i-out" x="12" y="636" width="316" height="128" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Фация (русло, устьевой бар</text><text class="it" x="24" y="720">и др.) по набору</text><text class="it" x="24" y="746">признаков.</text><rect class="i-out" x="12" y="770" width="316" height="180" rx="6"/><text class="ih" x="24" y="802">Вывод</text><text class="it" x="24" y="828">Вывод о положении пласта</text><text class="it" x="24" y="854">относительно оси русла:</text><text class="it" x="24" y="880">ближе к оси песок толще и</text><text class="it" x="24" y="906">крупнее, дальше — тоньше и</text><text class="it" x="24" y="932">мельче.</text><rect class="i-warn" x="12" y="956" width="316" height="128" rx="6"/><text class="ih" x="24" y="988">Где ломается</text><text class="it" x="24" y="1014">Один признак, например</text><text class="it" x="24" y="1040">только укрупнение вверх,</text><text class="it" x="24" y="1066">не доказывает фацию.</text><rect class="i-warn" x="12" y="1090" width="316" height="154" rx="6"/><text class="ih" x="24" y="1122">Где ломается</text><text class="it" x="24" y="1148">Тонкий песок у края русла</text><text class="it" x="24" y="1174">по кривой может походить</text><text class="it" x="24" y="1200">на другую фацию. Нужна</text><text class="it" x="24" y="1226">проверка на керне.</text><rect x="249" y="1262" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1283">схема</text></svg>