<script>/* Template claim_steps — FALLBACK, label «схема». Draws only the structure of the node's verified claims:
   numbered cards in book order, typed observation / condition / conclusion with the page, arrows from
   observations and conditions to conclusions, highlight of the cards the current part cites.
   No subsurface, fluids, tools or curves: nothing is drawn that the layer does not state.
   spec.case.cards = [{id, kind, page, short}] (computed in Python). state: {reveal, t0, t1, focus, arrows, wrong} */
(function () {
  "use strict";
  function font(ctx, w, px, U) { ctx.font = w + " " + px * U + "px " + window.FONT; }
  function kindColor(C, k) { return k === "inference" ? C.accent : (k === "assumption" ? C.measurement : C.ink); }

  function layout(box, n, U, portrait) {
    var cols = portrait ? 1 : (n > 4 ? 2 : 1), rows = Math.ceil(n / cols), gap = 18 * U;
    var w = (box.w - (cols - 1) * 60 * U) / cols, h = Math.min(150 * U, (box.h - 60 * U - (rows - 1) * gap) / rows);
    var out = [];
    for (var i = 0; i < n; i++) {
      var c = Math.floor(i / rows), r = i % rows;

    if (st.reveal && st.t0 == null) shown = cards.length;
    var cited = (st.focus === "claims" && st.beat && st.beat.claim_ids) ? st.beat.claim_ids : [];
    font(ctx, 600, 24, U); ctx.fillStyle = C.muted; ctx.fillText(Lb.legend_title + " · " + Lb.flow, box.x, box.y + 24 * U);
    // arrows: from every observation / condition card to the next conclusion card below it (book order)
    if (st.arrows) {
      cards.forEach(function (cd, i) {
        if (cd.kind === "inference") return;
        var j = -1; for (var k = i + 1; k < cards.length; k++) if (cards[k].kind === "inference") { j = k; break; }
        if (j < 0) return;
        var a = R[i], b = R[j], x0 = a.x + a.w - 30 * U, y0 = a.y + a.h, x1 = b.x + b.w - 30 * U, y1 = b.y;
        if (b.x !== a.x) { x0 = a.x + a.w; y0 = a.y + a.h / 2; x1 = b.x; y1 = b.y + b.h / 2; }
        ctx.strokeStyle = C.muted; ctx.lineWidth = 3 * U; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
        var an = Math.atan2(y1 - y0, x1 - x0); ctx.fillStyle = C.muted; ctx.beginPath();
        ctx.moveTo(x1, y1); ctx.lineTo(x1 - 16 * U * Math.cos(an - 0.4), y1 - 16 * U * Math.sin(an - 0.4));
        ctx.lineTo(x1 - 16 * U * Math.cos(an + 0.4), y1 - 16 * U * Math.sin(an + 0.4)); ctx.closePath(); ctx.fill();
      });
    }
    cards.forEach(function (cd, i) {
      var r = R[i], open = i < shown, hot = open && cited.indexOf(cd.id) >= 0;
      ctx.fillStyle = open ? C.panel : C.hidden; g.roundRect(r.x, r.y, r.w, r.h, 12 * U); ctx.fill();
      if (hot) { ctx.strokeStyle = C.accent; ctx.lineWidth = 5 * U; g.roundRect(r.x, r.y, r.w, r.h, 12 * U); ctx.stroke(); }
      font(ctx, 700, 30, U); ctx.fillStyle = C.ink; ctx.fillText(String(i + 1), r.x + 18 * U, r.y + 42 * U);
      if (!open) { font(ctx, 700, 40, U); ctx.fillStyle = C.muted; ctx.fillText(Lb.hidden, r.x + r.w / 2, r.y + r.h / 2 + 14 * U); return; }
      font(ctx, 700, 26, U); ctx.fillStyle = kindColor(C, cd.kind);
      ctx.fillText(Lb.kinds[cd.kind] || cd.kind, r.x + 60 * U, r.y + 40 * U);
      font(ctx, 500, 24, U); ctx.fillStyle = C.muted;
      var pg = Lb.page + " " + cd.page; ctx.fillText(pg, r.x + r.w - ctx.measureText(pg).width - 18 * U, r.y + 40 * U);
      if (hot || st.focus !== "claims" || !cited.length) {  // words of the claim only where the voice is (≤ 6 words on a card)
        var f = "600 " + 28 * U + "px " + window.FONT;
        var nl = r.h >= 120 * U ? 2 : 1, y0 = r.y + Math.min(80 * U, r.h - 16 * U);  // text stays inside the card
        g.wrap(cd.short, r.w - 80 * U, f).slice(0, nl).forEach(function (ln, k) { ctx.font = f; ctx.fillStyle = hot ? C.ink : C.muted; ctx.fillText(ln, r.x + 60 * U, y0 + k * 34 * U); });
      }
    });
    if (st.wrong) {
      var yy = box.y + box.h * 0.45;
      ctx.fillStyle = C.warnBg; g.roundRect(box.x + 20 * U, yy - 40 * U, box.w - 40 * U, 80 * U, 12 * U); ctx.fill();

    }
  }

  function invariants(spec) {
    var K = spec.case, out = [];
    out.push({ id: "cards_from_layer", ok: K.cards.length >= 3 && K.cards.every(function (c) { return c.id && c.page != null; }),
      text: "каждая карточка — проверенное утверждение узла со страницей книги" });
    out.push({ id: "kinds_separated", ok: K.cards.every(function (c) { return ["observation", "assumption", "inference"].indexOf(c.kind) >= 0; }),
      text: "у каждой карточки один вид: наблюдение, условие или вывод" });
    out.push({ id: "cards_stable", ok: K.cards.every(function (c, i) { return !i || c.page >= K.cards[i - 1].page; }),
      text: "карточки идут в порядке страниц книги и не меняются между кадрами" });
    return out;
  }

  window.TEMPLATES = window.TEMPLATES || {};
  window.TEMPLATES.claim_steps = { draw: draw, invariants: invariants };
})();

<script>/* Scene player: draws a scene spec at time t on one canvas.

(function () {

    return shown.slice(chunk, chunk + 8).filter(Boolean).join(" ").replace(/\u0301/g, "");
  }

  var dom = DOM ? { pv: document.getElementById("pv"), pvn: document.getElementById("pvn"), ex: document.getElementById("ex"),
                    head: document.getElementById("head"), sub: document.getElementById("sub") } : null, seen = {};
  function setText(k, v, html) { if (seen[k] === v) return; seen[k] = v; if (html) dom[k].innerHTML = v; else dom[k].textContent = v; }
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }

    if (pv.note) {
      ctx.font = "600 " + (26 * U) + "px " + window.FONT;
      if (x + ctx.measureText(pv.note).width + 28 * U > L.top.x + L.top.w) { x = L.top.x; y += 54 * U; }
      x += chip(x, y, pv.note, C.chipFg, C.chipBg) + 10 * U;
    }
    var ex = (T.exaggeration ? T.exaggeration(S.spec, st) : null) || S.labels.exaggeration;
    if (ex) {
      ctx.font = "600 " + (26 * U) + "px " + window.FONT;
      x = L.top.x; y += 54 * U;
      chip(x, y, ex, C.warnFg, C.warnBg);
    }
    // headline (on-screen words ≤ 7–8)
    if (b.on_screen) {
      var wide = !portrait && T.layout === "wide";
      var hp = portrait ? (sz ? 60 : 64) : wide ? 50 : 56, f = "700 " + hp * U + "px " + window.FONT;
      var ls = wrap(b.on_screen, L.head.w, f); ctx.fillStyle = b.slot === "misconception" ? C.warnFg : C.ink;
      ls.slice(0, wide ? 1 : (portrait && sz ? 2 : 3)).forEach(function (ln, i) { ctx.fillText(ln, L.head.x, L.head.y + (i + 1) * (wide ? 60 : hp * 1.22) * U); });
    }
    if (b.slot === "prediction" && t > b.voice_end) {
      ctx.fillStyle = C.accent; ctx.font = "600 " + 40 * U + "px " + window.FONT;
      var py = portrait ? L.head.y + (sz ? 150 : 250) * U : (T.layout === "wide" ? L.head.y + 60 * U : L.head.y + 330 * U);
      var px = T.layout === "wide" && !portrait ? L.head.x + L.head.w - 260 * U : L.head.x;
      ctx.fillText("Подумайте…", px, py);
    }
    // subtitles in the safe zone
    var sub = subtitleAt(t, b);
    if (sub && t <= b.voice_end + 0.2) {
      var sp = Math.max(S.spec.min_caption_px || 44, 44), sf = "500 " + sp * U + "px " + window.FONT;
      var sl = wrap(sub, L.sub.w - 40 * U, sf).slice(0, 3);
      var bh = sl.length * 58 * U + 30 * U;
      ctx.fillStyle = "rgba(0,0,0,0.62)"; roundRect(L.sub.x, L.sub.y, L.sub.w, bh, 14 * U); ctx.fill();
      ctx.fillStyle = "#FFFFFF"; ctx.font = sf;
      sl.forEach(function (ln, i) { ctx.fillText(ln, L.sub.x + 20 * U, L.sub.y + 50 * U + i * 58 * U); });
    }
  }

  window.renderAt = function (t) { draw(t); return true; };
  window.frameData = function (t) { draw(t); return cv.toDataURL("image/png"); };

  if (S.mode !== "interactive") { draw(0); return; }

  /* ---------- interactive mode (course) ---------- */
  var audio = document.getElementById("voice"), t = 0, playing = false, waitPred = null, last = null;
  var btn = document.getElementById("play"), bar = document.getElementById("seek"), more = document.getElementById("more");
  bar.max = S.timeline.duration;
  function setT(v) { t = Math.max(0, Math.min(S.timeline.duration, v)); bar.value = t; draw(t); showInfo(); }
  function showInfo() {
    var b = beatAt(t);
    more.textContent = "";
    if (!b.claims || !b.claims.length) return;
    b.claims.forEach(function (c) {
      var d = document.createElement("div"); d.className = "src";
      d.textContent = "стр. " + c.page + " — «" + c.quote + "»"; more.appendChild(d);
    });
  }
  function tick(ts) {
    if (!playing) return;
    if (audio && !audio.paused) t = audio.currentTime; else if (last != null) t += (ts - last) / 1000;
    last = ts;
    var b = beatAt(t);
    if (b.slot === "prediction" && t >= b.end - 0.05 && waitPred !== b.id) {
      waitPred = b.id; pause(); btn.textContent = "Показать ответ"; return;
    }
    if (t >= S.timeline.duration) { pause(); setT(S.timeline.duration); return; }
    bar.value = t; draw(t); showInfo();
    requestAnimationFrame(tick);
  }
  function play() { playing = true; last = null; btn.textContent = "Пауза"; if (audio) { audio.currentTime = t; audio.play().catch(function () {}); } requestAnimationFrame(tick); }
  function pause() { playing = false; btn.textContent = "Смотреть"; if (audio) audio.pause(); }
  btn.addEventListener("click", function () { if (playing) pause(); else { if (t >= S.timeline.duration - 0.05) setT(0); play(); } });
  bar.addEventListener("input", function () { pause(); setT(parseFloat(bar.value)); });
  cv.addEventListener("click", function () { btn.click(); });
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  setT(reduce ? S.timeline.duration : 0);
})();
</script>
</body>
</html>
