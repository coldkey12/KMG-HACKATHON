<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1164" role="img" aria-label="Схема шага «Порог из экономики: рентабельный дебит»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Порог из экономики: рентабельный дебит»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Дебит скважины — объём</text><text class="it" x="24" y="96">нефти или газа за единицу</text><text class="it" x="24" y="122">времени; сравнивается с Q*</text><text class="it" x="24" y="148">района.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Типичные эффективная</text><text class="it" x="24" y="256">мощность и депрессия для</text><text class="it" x="24" y="282">объекта — входы формулы</text><text class="it" x="24" y="308">(1.1).</text><rect class="i-in" x="12" y="332" width="316" height="154" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Граничный коэффициент η*пр</text><text class="it" x="24" y="416">служит входом для</text><text class="it" x="24" y="442">следующего шага — перехода</text><text class="it" x="24" y="468">к граничной проницаемости.</text><line class="ia" x1="170" y1="496" x2="170" y2="516"/><path class="iah" d="M170 522 l-6 -9 h12 z"/><rect class="i-node" x="12" y="526" width="316" height="76" rx="6"/><text class="it" x="24" y="558">Порог из экономики:</text><text class="it" x="24" y="584">рентабельный дебит</text><line class="ia" x1="170" y1="606" x2="170" y2="626"/><path class="iah" d="M170 632 l-6 -9 h12 z"/><rect class="i-out" x="12" y="636" width="316" height="128" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Граничный удельный</text><text class="it" x="24" y="720">коэффициент продуктивности</text><text class="it" x="24" y="746">η*пр.</text><rect class="i-warn" x="12" y="770" width="316" height="154" rx="6"/><text class="ih" x="24" y="802">Где ломается</text><text class="it" x="24" y="828">Q* задан для одного</text><text class="it" x="24" y="854">района; перенос на другой</text><text class="it" x="24" y="880">район даёт неверную</text><text class="it" x="24" y="906">границу.</text><rect class="i-warn" x="12" y="930" width="316" height="180" rx="6"/><text class="ih" x="24" y="962">Где ломается</text><text class="it" x="24" y="988">Типичные мощность и</text><text class="it" x="24" y="1014">депрессия подставляются</text><text class="it" x="24" y="1040">вместо реальных значений</text><text class="it" x="24" y="1066">объекта; разброс объектов</text><text class="it" x="24" y="1092">в расчёт не попадает.</text><rect x="249" y="1128" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1149">схема</text></svg>