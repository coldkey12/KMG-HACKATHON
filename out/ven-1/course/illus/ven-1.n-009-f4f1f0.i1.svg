<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1164" role="img" aria-label="Схема шага «Зачем нужны числовые пороги коллектора»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Зачем нужны числовые пороги коллектора»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Значения проницаемости,</text><text class="it" x="24" y="96">пористости и глинистости</text><text class="it" x="24" y="122">пород, полученные по</text><text class="it" x="24" y="148">образцам и испытаниям.</text><rect class="i-in" x="12" y="172" width="316" height="206" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Геофизические диаграммы:</text><text class="it" x="24" y="256">относительные амплитуды СП</text><text class="it" x="24" y="282">и ГМ, амплитуда ИСФ по</text><text class="it" x="24" y="308">ЯМР, удельное</text><text class="it" x="24" y="334">сопротивление и параметр</text><text class="it" x="24" y="360">насыщения.</text><line class="ia" x1="170" y1="388" x2="170" y2="408"/><path class="iah" d="M170 414 l-6 -9 h12 z"/><rect class="i-node" x="12" y="418" width="316" height="76" rx="6"/><text class="it" x="24" y="450">Зачем нужны числовые</text><text class="it" x="24" y="476">пороги коллектора</text><line class="ia" x1="170" y1="498" x2="170" y2="518"/><path class="iah" d="M170 524 l-6 -9 h12 z"/><rect class="i-out" x="12" y="528" width="316" height="128" rx="6"/><text class="ih" x="24" y="560">Вывод</text><text class="it" x="24" y="586">Значение параметра,</text><text class="it" x="24" y="612">соответствующее границе</text><text class="it" x="24" y="638">коллектор — неколлектор.</text><rect class="i-out" x="12" y="662" width="316" height="154" rx="6"/><text class="ih" x="24" y="694">Вывод</text><text class="it" x="24" y="720">Решение: порода относится</text><text class="it" x="24" y="746">к коллекторам или нет при</text><text class="it" x="24" y="772">сравнении с этим</text><text class="it" x="24" y="798">значением.</text><rect class="i-warn" x="12" y="822" width="316" height="128" rx="6"/><text class="ih" x="24" y="854">Где ломается</text><text class="it" x="24" y="880">Для других типов разреза</text><text class="it" x="24" y="906">набор параметров и граница</text><text class="it" x="24" y="932">могут быть другими.</text><rect class="i-warn" x="12" y="956" width="316" height="154" rx="6"/><text class="ih" x="24" y="988">Где ломается</text><text class="it" x="24" y="1014">Значение, полученное для</text><text class="it" x="24" y="1040">одного района, нельзя</text><text class="it" x="24" y="1066">переносить на другой без</text><text class="it" x="24" y="1092">проверки.</text><rect x="249" y="1128" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1149">схема</text></svg>