<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1454" role="img" aria-label="Схема шага «Отсечка по кривым пористости»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Отсечка по кривым пористости»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривая интервального</text><text class="it" x="24" y="96">времени ΔT акустического</text><text class="it" x="24" y="122">метода.</text><rect class="i-in" x="12" y="146" width="316" height="180" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Кривая относительной</text><text class="it" x="24" y="230">амплитуды ΔJ_ny</text><text class="it" x="24" y="256">нейтронного гамма-метода</text><text class="it" x="24" y="282">(соответствие по порядку</text><text class="it" x="24" y="308">перечисления в тексте).</text><rect class="i-in" x="12" y="332" width="316" height="180" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Кривая объёмной плотности</text><text class="it" x="24" y="416">δ_n плотностного</text><text class="it" x="24" y="442">гамма-гамма метода</text><text class="it" x="24" y="468">(соответствие по порядку</text><text class="it" x="24" y="494">перечисления в тексте).</text><line class="ia" x1="170" y1="522" x2="170" y2="542"/><path class="iah" d="M170 548 l-6 -9 h12 z"/><rect class="i-node" x="12" y="552" width="316" height="76" rx="6"/><text class="it" x="24" y="584">Отсечка по кривым</text><text class="it" x="24" y="610">пористости</text><line class="ia" x1="170" y1="632" x2="170" y2="652"/><path class="iah" d="M170 658 l-6 -9 h12 z"/><rect class="i-out" x="12" y="662" width="316" height="154" rx="6"/><text class="ih" x="24" y="694">Вывод</text><text class="it" x="24" y="720">Линия на диаграмме,</text><text class="it" x="24" y="746">параллельная оси глубин;</text><text class="it" x="24" y="772">она делит пласты на</text><text class="it" x="24" y="798">коллекторы и неколлекторы.</text><rect class="i-out" x="12" y="822" width="316" height="154" rx="6"/><text class="ih" x="24" y="854">Вывод</text><text class="it" x="24" y="880">Пласты, для которых ΔT</text><text class="it" x="24" y="906">выше ΔT*, а ΔJ_ny и δ_n</text><text class="it" x="24" y="932">ниже своих порогов, —</text><text class="it" x="24" y="958">коллекторы.</text><rect class="i-warn" x="12" y="982" width="316" height="180" rx="6"/><text class="ih" x="24" y="1014">Где ломается</text><text class="it" x="24" y="1040">Глинистость меняет</text><text class="it" x="24" y="1066">показания методов; в</text><text class="it" x="24" y="1092">типичных терригенных</text><text class="it" x="24" y="1118">разрезах её влияние трудно</text><text class="it" x="24" y="1144">учесть.</text><rect class="i-warn" x="12" y="1168" width="316" height="232" rx="6"/><text class="ih" x="24" y="1200">Где ломается</text><text class="it" x="24" y="1226">Способ уместен для</text><text class="it" x="24" y="1252">уплотнённых терригенных</text><text class="it" x="24" y="1278">пород с низкой</text><text class="it" x="24" y="1304">глинистостью; книга</text><text class="it" x="24" y="1330">отмечает, что для типичных</text><text class="it" x="24" y="1356">терригенных разрезов его</text><text class="it" x="24" y="1382">применяют редко.</text><rect x="249" y="1418" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1439">схема</text></svg>