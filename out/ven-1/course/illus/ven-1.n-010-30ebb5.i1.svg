<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1190" role="img" aria-label="Схема шага «Линия-порог на кривых пористости»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Линия-порог на кривых пористости»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="206" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривые диаграмм по</text><text class="it" x="24" y="96">глубине: ΔT (акустический</text><text class="it" x="24" y="122">метод), ΔJ_ny (нейтронный</text><text class="it" x="24" y="148">гамма-метод), δп</text><text class="it" x="24" y="174">(плотностной</text><text class="it" x="24" y="200">гамма-гамма-метод).</text><rect class="i-in" x="12" y="224" width="316" height="180" rx="6"/><text class="ih" x="24" y="256">Вход</text><text class="it" x="24" y="282">Граничное значение Kп* и</text><text class="it" x="24" y="308">корреляции: ΔT с Kп, ΔJ_ny</text><text class="it" x="24" y="334">с водосодержанием (с</text><text class="it" x="24" y="360">учётом глинистости), δп с</text><text class="it" x="24" y="386">Kп.</text><line class="ia" x1="170" y1="414" x2="170" y2="434"/><path class="iah" d="M170 440 l-6 -9 h12 z"/><rect class="i-node" x="12" y="444" width="316" height="76" rx="6"/><text class="it" x="24" y="476">Линия-порог на кривых</text><text class="it" x="24" y="502">пористости</text><line class="ia" x1="170" y1="524" x2="170" y2="544"/><path class="iah" d="M170 550 l-6 -9 h12 z"/><rect class="i-out" x="12" y="554" width="316" height="128" rx="6"/><text class="ih" x="24" y="586">Вывод</text><text class="it" x="24" y="612">Линия на диаграмме, идущая</text><text class="it" x="24" y="638">вдоль оси глубин на уровне</text><text class="it" x="24" y="664">граничного значения.</text><rect class="i-out" x="12" y="688" width="316" height="154" rx="6"/><text class="ih" x="24" y="720">Вывод</text><text class="it" x="24" y="746">Разделение пластов</text><text class="it" x="24" y="772">интервала на коллекторы и</text><text class="it" x="24" y="798">неколлекторы по условиям</text><text class="it" x="24" y="824">неравенств.</text><rect class="i-warn" x="12" y="848" width="316" height="154" rx="6"/><text class="ih" x="24" y="880">Где ломается</text><text class="it" x="24" y="906">Терригенный разрез с</text><text class="it" x="24" y="932">глинистостью: способ</text><text class="it" x="24" y="958">применяют редко, показания</text><text class="it" x="24" y="984">методов искажены.</text><rect class="i-warn" x="12" y="1008" width="316" height="128" rx="6"/><text class="ih" x="24" y="1040">Где ломается</text><text class="it" x="24" y="1066">Одна линия на весь</text><text class="it" x="24" y="1092">интервал — допущение</text><text class="it" x="24" y="1118">автора.</text><rect x="249" y="1154" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1175">схема</text></svg>