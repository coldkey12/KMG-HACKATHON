<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1272" role="img" aria-label="Схема шага «Пороги геофизических параметров по испытаниям»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Пороги геофизических параметров по испытаниям»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Интервалы с испытанием или</text><text class="it" x="24" y="96">пробной эксплуатацией, где</text><text class="it" x="24" y="122">проницаемость рассчитана</text><text class="it" x="24" y="148">по гидродинамическим</text><text class="it" x="24" y="174">данным.</text><rect class="i-in" x="12" y="198" width="316" height="154" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Усреднённое по каждому</text><text class="it" x="24" y="282">интервалу значение</text><text class="it" x="24" y="308">геофизического параметра,</text><text class="it" x="24" y="334">например Pп или α_СП.</text><rect class="i-in" x="12" y="358" width="316" height="128" rx="6"/><text class="ih" x="24" y="390">Вход</text><text class="it" x="24" y="416">Заданное граничное</text><text class="it" x="24" y="442">значение проницаемости</text><text class="it" x="24" y="468">Kпр*.</text><line class="ia" x1="170" y1="496" x2="170" y2="516"/><path class="iah" d="M170 522 l-6 -9 h12 z"/><rect class="i-node" x="12" y="526" width="316" height="76" rx="6"/><text class="it" x="24" y="558">Пороги геофизических</text><text class="it" x="24" y="584">параметров по испытаниям</text><line class="ia" x1="170" y1="606" x2="170" y2="626"/><path class="iah" d="M170 632 l-6 -9 h12 z"/><rect class="i-out" x="12" y="636" width="316" height="154" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Корреляционная связь</text><text class="it" x="24" y="720">параметра с проницаемостью</text><text class="it" x="24" y="746">для продуктивных</text><text class="it" x="24" y="772">отложений.</text><rect class="i-out" x="12" y="796" width="316" height="128" rx="6"/><text class="ih" x="24" y="828">Вывод</text><text class="it" x="24" y="854">Граничное значение</text><text class="it" x="24" y="880">параметра для заданного</text><text class="it" x="24" y="906">Kпр*.</text><rect class="i-warn" x="12" y="930" width="316" height="154" rx="6"/><text class="ih" x="24" y="962">Где ломается</text><text class="it" x="24" y="988">Интервалы неоднородны по</text><text class="it" x="24" y="1014">геофизической</text><text class="it" x="24" y="1040">характеристике: условие</text><text class="it" x="24" y="1066">однородности не выполнено.</text><rect class="i-warn" x="12" y="1090" width="316" height="128" rx="6"/><text class="ih" x="24" y="1122">Где ломается</text><text class="it" x="24" y="1148">Объект не продуктивный:</text><text class="it" x="24" y="1174">связь для него в тексте не</text><text class="it" x="24" y="1200">установлена.</text><rect x="249" y="1236" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1257">схема</text></svg>