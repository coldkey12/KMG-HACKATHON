<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1406" role="img" aria-label="Схема шага «Относительная глинистость — чёткий критерий коллектора»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Относительная глинистость — чёткий критерий коллектора»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Коэффициенты пористости Kп</text><text class="it" x="24" y="96">и глинистости Kгл или Cгл</text><text class="it" x="24" y="122">для продуктивных</text><text class="it" x="24" y="148">отложений, по керну или</text><text class="it" x="24" y="174">интервалам.</text><rect class="i-in" x="12" y="198" width="316" height="154" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Амплитуда аномалии СП</text><text class="it" x="24" y="282">против пласта (ΔUСП) и</text><text class="it" x="24" y="308">оценка постоянства</text><text class="it" x="24" y="334">минерализации и литологии.</text><rect class="i-in" x="12" y="358" width="316" height="128" rx="6"/><text class="ih" x="24" y="390">Вход</text><text class="it" x="24" y="416">Граничная проницаемость</text><text class="it" x="24" y="442">Kпр* для изучаемых</text><text class="it" x="24" y="468">отложений.</text><line class="ia" x1="170" y1="496" x2="170" y2="516"/><path class="iah" d="M170 522 l-6 -9 h12 z"/><rect class="i-node" x="12" y="526" width="316" height="102" rx="6"/><text class="it" x="24" y="558">Относительная глинистость</text><text class="it" x="24" y="584">— чёткий критерий</text><text class="it" x="24" y="610">коллектора</text><line class="ia" x1="170" y1="632" x2="170" y2="652"/><path class="iah" d="M170 658 l-6 -9 h12 z"/><rect class="i-out" x="12" y="662" width="316" height="128" rx="6"/><text class="ih" x="24" y="694">Вывод</text><text class="it" x="24" y="720">Значение ηгл для каждого</text><text class="it" x="24" y="746">пласта или интервала по</text><text class="it" x="24" y="772">формуле 1.3.</text><rect class="i-out" x="12" y="796" width="316" height="128" rx="6"/><text class="ih" x="24" y="828">Вывод</text><text class="it" x="24" y="854">Граничное ηгл* и линия</text><text class="it" x="24" y="880">постоянного ηгл на графике</text><text class="it" x="24" y="906">пористость — глинистость.</text><rect class="i-out" x="12" y="930" width="316" height="154" rx="6"/><text class="ih" x="24" y="962">Вывод</text><text class="it" x="24" y="988">Разделение на коллекторы и</text><text class="it" x="24" y="1014">неколлекторы; внутри</text><text class="it" x="24" y="1040">коллекторов — хорошие и</text><text class="it" x="24" y="1066">плохие.</text><rect class="i-warn" x="12" y="1090" width="316" height="128" rx="6"/><text class="ih" x="24" y="1122">Где ломается</text><text class="it" x="24" y="1148">Смена минерализации</text><text class="it" x="24" y="1174">пластовых вод: аномалия СП</text><text class="it" x="24" y="1200">перестаёт отражать ηгл.</text><rect class="i-warn" x="12" y="1224" width="316" height="128" rx="6"/><text class="ih" x="24" y="1256">Где ломается</text><text class="it" x="24" y="1282">Смена литологии вмещающих</text><text class="it" x="24" y="1308">пород: то же условие</text><text class="it" x="24" y="1334">нарушается.</text><rect x="249" y="1370" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1391">схема</text></svg>