<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1112" role="img" aria-label="Схема шага «Аномалия СП и глинистость пласта»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Аномалия СП и глинистость пласта»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривая СП против пласта и</text><text class="it" x="24" y="96">линия глин; по ним</text><text class="it" x="24" y="122">определяется аномалия</text><text class="it" x="24" y="148">ΔU_СП.</text><rect class="i-in" x="12" y="172" width="316" height="180" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Минерализация пластовых</text><text class="it" x="24" y="256">вод и сопротивление</text><text class="it" x="24" y="282">бурового раствора; от их</text><text class="it" x="24" y="308">различия зависит величина</text><text class="it" x="24" y="334">аномалии.</text><rect class="i-in" x="12" y="358" width="316" height="102" rx="6"/><text class="ih" x="24" y="390">Вход</text><text class="it" x="24" y="416">Коэффициенты K_гл и K_п</text><text class="it" x="24" y="442">для расчёта η_гл.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Аномалия СП и глинистость</text><text class="it" x="24" y="558">пласта</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="128" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Относительная глинистость</text><text class="it" x="24" y="694">η_гл при выполненных</text><text class="it" x="24" y="720">условиях.</text><rect class="i-warn" x="12" y="744" width="316" height="154" rx="6"/><text class="ih" x="24" y="776">Где ломается</text><text class="it" x="24" y="802">Минерализация пластовых</text><text class="it" x="24" y="828">вод меняется по разрезу:</text><text class="it" x="24" y="854">аномалия отражает уже не</text><text class="it" x="24" y="880">только глину.</text><rect class="i-warn" x="12" y="904" width="316" height="154" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Литология вмещающих пород</text><text class="it" x="24" y="988">неоднородна: контраст</text><text class="it" x="24" y="1014">глинистости искажает</text><text class="it" x="24" y="1040">аномалию.</text><rect x="249" y="1076" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1097">схема</text></svg>