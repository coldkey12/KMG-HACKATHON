<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1246" role="img" aria-label="Схема шага «СП и ГМ: старые признаки коллектора»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «СП и ГМ: старые признаки коллектора»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривая СП по разрезу</text><text class="it" x="24" y="96">терригенной скважины,</text><text class="it" x="24" y="122">пробуренной на пресном</text><text class="it" x="24" y="148">глинистом растворе.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Положение линии глин на</text><text class="it" x="24" y="256">кривой СП (устойчивый</text><text class="it" x="24" y="282">максимум у глин).</text><rect class="i-in" x="12" y="306" width="316" height="128" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Кривая гамма-метода с</text><text class="it" x="24" y="390">низкими показаниями в тех</text><text class="it" x="24" y="416">же интервалах.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">СП и ГМ: старые признаки</text><text class="it" x="24" y="532">коллектора</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="154" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Интервалы с отрицательной</text><text class="it" x="24" y="668">аномалией СП относительно</text><text class="it" x="24" y="694">линии глин как кандидаты в</text><text class="it" x="24" y="720">коллекторы.</text><rect class="i-out" x="12" y="744" width="316" height="128" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Совпадение низких</text><text class="it" x="24" y="828">показаний ГМ с аномалией</text><text class="it" x="24" y="854">СП как поддержка признака.</text><rect class="i-warn" x="12" y="878" width="316" height="154" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Другой тип бурового</text><text class="it" x="24" y="962">раствора: признак СП для</text><text class="it" x="24" y="988">пресного глинистого</text><text class="it" x="24" y="1014">раствора не применяют.</text><rect class="i-warn" x="12" y="1038" width="316" height="154" rx="6"/><text class="ih" x="24" y="1070">Где ломается</text><text class="it" x="24" y="1096">Плотные глинистые</text><text class="it" x="24" y="1122">алевролиты-неколлекторы</text><text class="it" x="24" y="1148">дают максимум, как глины,</text><text class="it" x="24" y="1174">а не аномалию.</text><rect x="249" y="1210" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1231">схема</text></svg>