<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1298" role="img" aria-label="Схема шага «Относительная глинистость — самый чёткий критерий»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Относительная глинистость — самый чёткий критерий»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Пары значений коэффициента</text><text class="it" x="24" y="96">пористости Kп и</text><text class="it" x="24" y="122">глинистости (Kгл или Cгл)</text><text class="it" x="24" y="148">по породам разреза.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Относительная глинистость</text><text class="it" x="24" y="256">ηгл, вычисляемая по Kгл и</text><text class="it" x="24" y="282">Kп (определена в</text><text class="it" x="24" y="308">предыдущем узле).</text><rect class="i-in" x="12" y="332" width="316" height="128" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Критическая проницаемость</text><text class="it" x="24" y="416">Kпр* для данных отложений,</text><text class="it" x="24" y="442">из которой получают ηгл*.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Относительная глинистость</text><text class="it" x="24" y="558">— самый чёткий критерий</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="154" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Класс породы: коллектор</text><text class="it" x="24" y="694">или неколлектор по</text><text class="it" x="24" y="720">положению относительно</text><text class="it" x="24" y="746">граничной линии ηгл*.</text><rect class="i-out" x="12" y="770" width="316" height="154" rx="6"/><text class="ih" x="24" y="802">Вывод</text><text class="it" x="24" y="828">Для коллекторов — деление</text><text class="it" x="24" y="854">на хорошие и плохие по</text><text class="it" x="24" y="880">положению внутри их</text><text class="it" x="24" y="906">области.</text><rect class="i-warn" x="12" y="930" width="316" height="154" rx="6"/><text class="ih" x="24" y="962">Где ломается</text><text class="it" x="24" y="988">Другой вид цемента в</text><text class="it" x="24" y="1014">коллекторе (кроме</text><text class="it" x="24" y="1040">глинистого): критерий</text><text class="it" x="24" y="1066">менее надёжен.</text><rect class="i-warn" x="12" y="1090" width="316" height="154" rx="6"/><text class="ih" x="24" y="1122">Где ломается</text><text class="it" x="24" y="1148">Неоднородный минеральный</text><text class="it" x="24" y="1174">состав глинистого цемента:</text><text class="it" x="24" y="1200">условия применения</text><text class="it" x="24" y="1226">нарушаются.</text><rect x="249" y="1262" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1283">схема</text></svg>