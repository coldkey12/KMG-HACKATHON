<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1246" role="img" aria-label="Схема шага «Пороги αСП для нефти, газа и слоистой глины»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Пороги αСП для нефти, газа и слоистой глины»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Относительная амплитуда</text><text class="it" x="24" y="96">αСП по кривой СП против</text><text class="it" x="24" y="122">пласта.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Относительная глинистость</text><text class="it" x="24" y="230">ηгл для того же пласта и</text><text class="it" x="24" y="256">граничное η*гл.</text><rect class="i-in" x="12" y="280" width="316" height="128" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Тип глинистости:</text><text class="it" x="24" y="364">рассеянная или</text><text class="it" x="24" y="390">слоистая/смешанная.</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Пороги αСП для нефти, газа</text><text class="it" x="24" y="506">и слоистой глины</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="154" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Пласт относят к</text><text class="it" x="24" y="642">коллекторам, если αСП</text><text class="it" x="24" y="668">больше α*СП и ηгл меньше</text><text class="it" x="24" y="694">η*гл.</text><rect class="i-out" x="12" y="718" width="316" height="154" rx="6"/><text class="ih" x="24" y="750">Вывод</text><text class="it" x="24" y="776">Порог выбирают по флюиду и</text><text class="it" x="24" y="802">типу глинистости, поэтому</text><text class="it" x="24" y="828">вывод о продуктивности</text><text class="it" x="24" y="854">зависит от этого выбора.</text><rect class="i-warn" x="12" y="878" width="316" height="154" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">При слоистой или смешанной</text><text class="it" x="24" y="962">глинистости порог ниже.</text><text class="it" x="24" y="988">Одна цифра для всего</text><text class="it" x="24" y="1014">разреза может дать ошибку.</text><rect class="i-warn" x="12" y="1038" width="316" height="154" rx="6"/><text class="ih" x="24" y="1070">Где ломается</text><text class="it" x="24" y="1096">Значения 0,5 и 0,4 даны</text><text class="it" x="24" y="1122">для крупных провинций. В</text><text class="it" x="24" y="1148">другом районе их нельзя</text><text class="it" x="24" y="1174">переносить без проверки.</text><rect x="249" y="1210" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1231">схема</text></svg>