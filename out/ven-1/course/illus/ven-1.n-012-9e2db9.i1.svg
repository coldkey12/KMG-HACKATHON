<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1272" role="img" aria-label="Схема шага «Аномалия СП ещё не коллектор»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Аномалия СП ещё не коллектор»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривая СП по разрезу с</text><text class="it" x="24" y="96">амплитудой ΔU_СП против</text><text class="it" x="24" y="122">пласта.</text><rect class="i-in" x="12" y="146" width="316" height="154" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Относительная амплитуда</text><text class="it" x="24" y="230">α_СП, рассчитанная</text><text class="it" x="24" y="256">относительно максимальной</text><text class="it" x="24" y="282">аномалии для разреза.</text><rect class="i-in" x="12" y="306" width="316" height="102" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Граничное значение α*_СП</text><text class="it" x="24" y="390">для изучаемых отложений.</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Аномалия СП ещё не</text><text class="it" x="24" y="506">коллектор</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="128" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Пласт отнесён к</text><text class="it" x="24" y="642">коллекторам, если α_СП</text><text class="it" x="24" y="668">больше α*_СП.</text><rect class="i-out" x="12" y="692" width="316" height="180" rx="6"/><text class="ih" x="24" y="724">Вывод</text><text class="it" x="24" y="750">Пласт исключён из</text><text class="it" x="24" y="776">коллекторов, если</text><text class="it" x="24" y="802">микрозонды и пористость</text><text class="it" x="24" y="828">показывают плотную породу</text><text class="it" x="24" y="854">с низкой пористостью.</text><rect class="i-warn" x="12" y="878" width="316" height="180" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Песчаники и алевролиты с</text><text class="it" x="24" y="962">карбонатным или силикатным</text><text class="it" x="24" y="988">цементом дают максимальные</text><text class="it" x="24" y="1014">ΔU_СП и α_СП, но обычно не</text><text class="it" x="24" y="1040">коллекторы.</text><rect class="i-warn" x="12" y="1064" width="316" height="154" rx="6"/><text class="ih" x="24" y="1096">Где ломается</text><text class="it" x="24" y="1122">Число граничного значения</text><text class="it" x="24" y="1148">α*_СП для таких пластов в</text><text class="it" x="24" y="1174">этом фрагменте не</text><text class="it" x="24" y="1200">приведено.</text><rect x="249" y="1236" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1257">схема</text></svg>