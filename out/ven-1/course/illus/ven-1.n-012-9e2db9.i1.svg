<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1008" role="img" aria-label="Схема шага «Ловушка: плотный песчаник выглядит коллектором»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Ловушка: плотный песчаник выглядит коллектором»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Диаграмма СП: амплитуда</text><text class="it" x="24" y="96">ΔUСП против каждого пласта</text><rect class="i-in" x="12" y="120" width="316" height="154" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Диаграммы микрозондов и</text><text class="it" x="24" y="204">методов пористости:</text><text class="it" x="24" y="230">признаки плотности и</text><text class="it" x="24" y="256">низкой пористости пласта</text><line class="ia" x1="170" y1="284" x2="170" y2="304"/><path class="iah" d="M170 310 l-6 -9 h12 z"/><rect class="i-node" x="12" y="314" width="316" height="76" rx="6"/><text class="it" x="24" y="346">Ловушка: плотный песчаник</text><text class="it" x="24" y="372">выглядит коллектором</text><line class="ia" x1="170" y1="394" x2="170" y2="414"/><path class="iah" d="M170 420 l-6 -9 h12 z"/><rect class="i-out" x="12" y="424" width="316" height="102" rx="6"/><text class="ih" x="24" y="456">Вывод</text><text class="it" x="24" y="482">αСП пласта и её сравнение</text><text class="it" x="24" y="508">с αСП*: коллектор или нет</text><rect class="i-out" x="12" y="532" width="316" height="102" rx="6"/><text class="ih" x="24" y="564">Вывод</text><text class="it" x="24" y="590">Исключение плотного</text><text class="it" x="24" y="616">песчаника из коллекторов</text><rect class="i-warn" x="12" y="640" width="316" height="180" rx="6"/><text class="ih" x="24" y="672">Где ломается</text><text class="it" x="24" y="698">Максимум ΔUСП и αСП у</text><text class="it" x="24" y="724">песчаника с карбонатным</text><text class="it" x="24" y="750">или силикатным цементом</text><text class="it" x="24" y="776">даёт ложный сигнал</text><text class="it" x="24" y="802">коллектора</text><rect class="i-warn" x="12" y="826" width="316" height="128" rx="6"/><text class="ih" x="24" y="858">Где ломается</text><text class="it" x="24" y="884">Одна диаграмма СП может не</text><text class="it" x="24" y="910">отличить такой пласт от</text><text class="it" x="24" y="936">коллектора</text><rect x="249" y="972" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="993">схема</text></svg>