<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1272" role="img" aria-label="Схема шага «Порог α*СП из данных испытаний»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Порог α*СП из данных испытаний»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Пары значений для каждого</text><text class="it" x="24" y="96">испытанного объекта: α_СП</text><text class="it" x="24" y="122">и η_пр, полученные по</text><text class="it" x="24" y="148">опробованию.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Распределения α_СП</text><text class="it" x="24" y="256">отдельно для коллекторов и</text><text class="it" x="24" y="282">отдельно для</text><text class="it" x="24" y="308">неколлекторов.</text><rect class="i-in" x="12" y="332" width="316" height="102" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Граничное η*_пр, если оно</text><text class="it" x="24" y="416">задано для объекта.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Порог α*СП из данных</text><text class="it" x="24" y="532">испытаний</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="128" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Граничное α*_СП по</text><text class="it" x="24" y="668">зависимости при заданном</text><text class="it" x="24" y="694">η*_пр или при η_пр = 0.</text><rect class="i-out" x="12" y="718" width="316" height="154" rx="6"/><text class="ih" x="24" y="750">Вывод</text><text class="it" x="24" y="776">Граничное α*_СП по точке</text><text class="it" x="24" y="802">пересечения распределений</text><text class="it" x="24" y="828">коллекторов и</text><text class="it" x="24" y="854">неколлекторов.</text><rect class="i-warn" x="12" y="878" width="316" height="154" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Нужны результаты</text><text class="it" x="24" y="962">опробования большого числа</text><text class="it" x="24" y="988">объектов. При малом числе</text><text class="it" x="24" y="1014">метод не применяют.</text><rect class="i-warn" x="12" y="1038" width="316" height="180" rx="6"/><text class="ih" x="24" y="1070">Где ломается</text><text class="it" x="24" y="1096">Продолжение до η_пр = 0</text><text class="it" x="24" y="1122">выходит за пределы</text><text class="it" x="24" y="1148">испытанных точек. Его</text><text class="it" x="24" y="1174">точность книга не</text><text class="it" x="24" y="1200">оценивает (вывод курса).</text><rect x="249" y="1236" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1257">схема</text></svg>