<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1242" role="img" aria-label="Схема шага «Когда гамма-метод обманывает: минералы»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Когда гамма-метод обманывает: минералы»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Диаграмма гамма-метода:</text><text class="it" x="24" y="96">запись естественного</text><text class="it" x="24" y="122">гамма-излучения пород по</text><text class="it" x="24" y="148">глубине.</text><rect class="i-in" x="12" y="172" width="316" height="206" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Диаграммы микрозондов,</text><text class="it" x="24" y="256">нейтронного гамма-метода и</text><text class="it" x="24" y="282">акустики в том же</text><text class="it" x="24" y="308">интервале для проверки</text><text class="it" x="24" y="334">плотных песчаников с</text><text class="it" x="24" y="360">карбонатным цементом.</text><rect class="i-in" x="12" y="384" width="316" height="154" rx="6"/><text class="ih" x="24" y="416">Вход</text><text class="it" x="24" y="442">Сведения о составе пласта:</text><text class="it" x="24" y="468">полимиктовый ли песчаник,</text><text class="it" x="24" y="494">есть ли глауконит,</text><text class="it" x="24" y="520">вулканогенный ли разрез.</text><line class="ia" x1="170" y1="548" x2="170" y2="568"/><path class="iah" d="M170 574 l-6 -9 h12 z"/><rect class="i-node" x="12" y="578" width="316" height="76" rx="6"/><text class="it" x="24" y="610">Когда гамма-метод</text><text class="it" x="24" y="636">обманывает: минералы</text><line class="ia" x1="170" y1="658" x2="170" y2="678"/><path class="iah" d="M170 684 l-6 -9 h12 z"/><rect class="i-out" x="12" y="688" width="316" height="180" rx="6"/><text class="ih" x="24" y="720">Вывод</text><text class="it" x="24" y="746">Признак коллектора по</text><text class="it" x="24" y="772">низкой радиоактивности. В</text><text class="it" x="24" y="798">сложном разрезе такой</text><text class="it" x="24" y="824">признак требует проверки</text><text class="it" x="24" y="850">другими методами.</text><rect class="i-warn" x="12" y="874" width="316" height="154" rx="6"/><text class="ih" x="24" y="906">Где ломается</text><text class="it" x="24" y="932">Плотный песчаник с</text><text class="it" x="24" y="958">карбонатным цементом может</text><text class="it" x="24" y="984">дать отклик, похожий на</text><text class="it" x="24" y="1010">коллектор.</text><rect class="i-warn" x="12" y="1034" width="316" height="154" rx="6"/><text class="ih" x="24" y="1066">Где ломается</text><text class="it" x="24" y="1092">Полевой шпат и обломки</text><text class="it" x="24" y="1118">других пород повышают</text><text class="it" x="24" y="1144">отклик. Коллектор может</text><text class="it" x="24" y="1170">выглядеть глинистым.</text><rect x="249" y="1206" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1227">схема</text></svg>