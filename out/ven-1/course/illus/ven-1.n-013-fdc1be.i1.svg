<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1220" role="img" aria-label="Схема шага «Как найти порог гамма-метода»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Как найти порог гамма-метода»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Значения относительной</text><text class="it" x="24" y="96">амплитуды ГМ ΔJγ по</text><text class="it" x="24" y="122">диаграмме гамма-метода.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Kгл или Cгл,</text><text class="it" x="24" y="230">сопоставленные с Kпр,</text><text class="it" x="24" y="256">полученной на образцах.</text><rect class="i-in" x="12" y="280" width="316" height="154" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Удельный коэффициент</text><text class="it" x="24" y="364">продуктивности ηпр для</text><text class="it" x="24" y="390">испытанных объектов</text><text class="it" x="24" y="416">(способ б).</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Как найти порог</text><text class="it" x="24" y="532">гамма-метода</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="102" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Граничное значение ΔJγ*</text><text class="it" x="24" y="668">для изучаемого разреза.</text><rect class="i-out" x="12" y="692" width="316" height="154" rx="6"/><text class="ih" x="24" y="724">Вывод</text><text class="it" x="24" y="750">Граничное значение Kгл*</text><text class="it" x="24" y="776">(или Cгл*),</text><text class="it" x="24" y="802">соответствующее принятой</text><text class="it" x="24" y="828">Kпр*.</text><rect class="i-warn" x="12" y="852" width="316" height="154" rx="6"/><text class="ih" x="24" y="884">Где ломается</text><text class="it" x="24" y="910">Для терригенных пород</text><text class="it" x="24" y="936">связь с ηгл теснее,</text><text class="it" x="24" y="962">поэтому ΔJγ* как критерий</text><text class="it" x="24" y="988">уступает СП.</text><rect class="i-warn" x="12" y="1012" width="316" height="154" rx="6"/><text class="ih" x="24" y="1044">Где ломается</text><text class="it" x="24" y="1070">Если качественную</text><text class="it" x="24" y="1096">диаграмму СП получить</text><text class="it" x="24" y="1122">нельзя, ГМ становится</text><text class="it" x="24" y="1148">первичным методом.</text><rect x="249" y="1184" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1205">схема</text></svg>