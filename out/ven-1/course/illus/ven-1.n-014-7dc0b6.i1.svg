<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1064" role="img" aria-label="Схема шага «Когда ЯМР перестаёт видеть пласт»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Когда ЯМР перестаёт видеть пласт»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Диаграмма ЯМР по разрезу</text><text class="it" x="24" y="96">скважины.</text><rect class="i-in" x="12" y="120" width="316" height="154" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Состав пород: есть ли</text><text class="it" x="24" y="204">ферро- и парамагнитные</text><text class="it" x="24" y="230">минералы, особенно в</text><text class="it" x="24" y="256">вулканогенных отложениях.</text><rect class="i-in" x="12" y="280" width="316" height="102" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Состав бурового раствора:</text><text class="it" x="24" y="364">есть ли нефтяные добавки.</text><line class="ia" x1="170" y1="392" x2="170" y2="412"/><path class="iah" d="M170 418 l-6 -9 h12 z"/><rect class="i-node" x="12" y="422" width="316" height="76" rx="6"/><text class="it" x="24" y="454">Когда ЯМР перестаёт видеть</text><text class="it" x="24" y="480">пласт</text><line class="ia" x1="170" y1="502" x2="170" y2="522"/><path class="iah" d="M170 528 l-6 -9 h12 z"/><rect class="i-out" x="12" y="532" width="316" height="102" rx="6"/><text class="ih" x="24" y="564">Вывод</text><text class="it" x="24" y="590">Решение: применим ли ЯМР в</text><text class="it" x="24" y="616">данном интервале.</text><rect class="i-out" x="12" y="640" width="316" height="128" rx="6"/><text class="ih" x="24" y="672">Вывод</text><text class="it" x="24" y="698">Пласты с глубокой</text><text class="it" x="24" y="724">кольматацией на диаграмме</text><text class="it" x="24" y="750">ЯМР почти не выделяются.</text><rect class="i-warn" x="12" y="774" width="316" height="102" rx="6"/><text class="ih" x="24" y="806">Где ломается</text><text class="it" x="24" y="832">Магнитные минералы: метод</text><text class="it" x="24" y="858">неприменим (условие 1).</text><rect class="i-warn" x="12" y="882" width="316" height="128" rx="6"/><text class="ih" x="24" y="914">Где ломается</text><text class="it" x="24" y="940">Глубокая кольматация у</text><text class="it" x="24" y="966">высокопроницаемых пластов</text><text class="it" x="24" y="992">(условие 2).</text><rect x="249" y="1028" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1049">схема</text></svg>