<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1004" role="img" aria-label="Схема шага «Где привычные приёмы перестают работать»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Где привычные приёмы перестают работать»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Глубина залегания</text><text class="it" x="24" y="96">отложений относительно 4—5</text><text class="it" x="24" y="122">км.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Степень уплотнённости</text><text class="it" x="24" y="230">пород: слабая, средняя или</text><text class="it" x="24" y="256">уплотнённая.</text><rect class="i-in" x="12" y="280" width="316" height="180" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Тип промывочной жидкости:</text><text class="it" x="24" y="364">пресный глинистый раствор</text><text class="it" x="24" y="390">или техническая вода, в</text><text class="it" x="24" y="416">том числе</text><text class="it" x="24" y="442">минерализованная.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Где привычные приёмы</text><text class="it" x="24" y="558">перестают работать</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="154" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Выбор: приёмы для</text><text class="it" x="24" y="694">межзерновых коллекторов</text><text class="it" x="24" y="720">или способы, аналогичные</text><text class="it" x="24" y="746">карбонатным сложным типам.</text><rect class="i-warn" x="12" y="770" width="316" height="180" rx="6"/><text class="ih" x="24" y="802">Где ломается</text><text class="it" x="24" y="828">За пределами 4—5 км, в</text><text class="it" x="24" y="854">уплотнённых породах и при</text><text class="it" x="24" y="880">технической воде</text><text class="it" x="24" y="906">межзерновые коллекторы</text><text class="it" x="24" y="932">выделяются труднее.</text><rect x="249" y="968" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="989">схема</text></svg>