<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1164" role="img" aria-label="Схема шага «Признаки коллектора по ходу бурения»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Признаки коллектора по ходу бурения»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Продолжительность бурения</text><text class="it" x="24" y="96">по интервалам разреза,</text><text class="it" x="24" y="122">записанная по ходу</text><text class="it" x="24" y="148">бурения.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Количество жидкости,</text><text class="it" x="24" y="256">поглощённой породами при</text><text class="it" x="24" y="282">бурении (фильтрационный</text><text class="it" x="24" y="308">метод).</text><rect class="i-in" x="12" y="332" width="316" height="128" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Записи автоматической</text><text class="it" x="24" y="416">станции контроля</text><text class="it" x="24" y="442">параметров бурения (АСПБ).</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Признаки коллектора по</text><text class="it" x="24" y="558">ходу бурения</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="154" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Интервалы разреза, которые</text><text class="it" x="24" y="694">можно считать возможными</text><text class="it" x="24" y="720">коллекторами по этим</text><text class="it" x="24" y="746">записям.</text><rect class="i-warn" x="12" y="770" width="316" height="128" rx="6"/><text class="ih" x="24" y="802">Где ломается</text><text class="it" x="24" y="828">Текст не даёт правила, как</text><text class="it" x="24" y="854">переводить эти записи в</text><text class="it" x="24" y="880">признак коллектора.</text><rect class="i-warn" x="12" y="904" width="316" height="206" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Опыт описан для</text><text class="it" x="24" y="988">нижнемеловых терригенных</text><text class="it" x="24" y="1014">отложений одного треста.</text><text class="it" x="24" y="1040">Для других пород</text><text class="it" x="24" y="1066">применимость текст не</text><text class="it" x="24" y="1092">подтверждает.</text><rect x="249" y="1128" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1149">схема</text></svg>