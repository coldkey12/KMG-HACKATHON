<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1272" role="img" aria-label="Схема шага «Когда в породе течёт только нефть»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Когда в породе течёт только нефть»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Лабораторные зависимости</text><text class="it" x="24" y="96">фазовой проницаемости по</text><text class="it" x="24" y="122">нефти и по воде от</text><text class="it" x="24" y="148">водонасыщения для образцов</text><text class="it" x="24" y="174">керна.</text><rect class="i-in" x="12" y="198" width="316" height="102" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Тип коллектора и жидкости,</text><text class="it" x="24" y="282">с которыми проводили опыт.</text><rect class="i-in" x="12" y="306" width="316" height="128" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Глинистость и средний</text><text class="it" x="24" y="390">размер фильтрующихся</text><text class="it" x="24" y="416">каналов образца.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Когда в породе течёт</text><text class="it" x="24" y="532">только нефть</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="154" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Значение K*в:</text><text class="it" x="24" y="668">водонасыщение, при котором</text><text class="it" x="24" y="694">фазовая проницаемость по</text><text class="it" x="24" y="720">воде становится нулевой.</text><rect class="i-out" x="12" y="744" width="316" height="128" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Вывод: при водонасыщении</text><text class="it" x="24" y="828">ниже K*в фильтруется</text><text class="it" x="24" y="854">только нефть.</text><rect class="i-warn" x="12" y="878" width="316" height="180" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">K*в справедливо для</text><text class="it" x="24" y="962">данного коллектора и</text><text class="it" x="24" y="988">жидкостей. Для другого</text><text class="it" x="24" y="1014">объекта его нужно получать</text><text class="it" x="24" y="1040">заново.</text><rect class="i-warn" x="12" y="1064" width="316" height="154" rx="6"/><text class="ih" x="24" y="1096">Где ломается</text><text class="it" x="24" y="1122">Значение зависит от</text><text class="it" x="24" y="1148">глинистости и размера</text><text class="it" x="24" y="1174">каналов. При их смене</text><text class="it" x="24" y="1200">порог сдвигается.</text><rect x="249" y="1236" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1257">схема</text></svg>