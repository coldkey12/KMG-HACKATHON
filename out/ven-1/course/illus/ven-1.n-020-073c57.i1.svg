<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1354" role="img" aria-label="Схема шага «Порог сопротивления по результатам испытаний»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Порог сопротивления по результатам испытаний»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Значения ρп (и Pн) по</text><text class="it" x="24" y="96">каждому испытанному</text><text class="it" x="24" y="122">пласту, отнесённому к</text><text class="it" x="24" y="148">продуктивным или</text><text class="it" x="24" y="174">водоносным.</text><rect class="i-in" x="12" y="198" width="316" height="154" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Результаты испытаний: при</text><text class="it" x="24" y="282">перфорации и на</text><text class="it" x="24" y="308">испытателях пластов на</text><text class="it" x="24" y="334">трубах и кабеле.</text><rect class="i-in" x="12" y="358" width="316" height="128" rx="6"/><text class="ih" x="24" y="390">Вход</text><text class="it" x="24" y="416">Число испытанных пластов:</text><text class="it" x="24" y="442">нужно хотя бы несколько</text><text class="it" x="24" y="468">десятков.</text><line class="ia" x1="170" y1="496" x2="170" y2="516"/><path class="iah" d="M170 522 l-6 -9 h12 z"/><rect class="i-node" x="12" y="526" width="316" height="76" rx="6"/><text class="it" x="24" y="558">Порог сопротивления по</text><text class="it" x="24" y="584">результатам испытаний</text><line class="ia" x1="170" y1="606" x2="170" y2="626"/><path class="iah" d="M170 632 l-6 -9 h12 z"/><rect class="i-out" x="12" y="636" width="316" height="128" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Два распределения ρп для</text><text class="it" x="24" y="720">двух классов пластов на</text><text class="it" x="24" y="746">одном графике.</text><rect class="i-out" x="12" y="770" width="316" height="128" rx="6"/><text class="ih" x="24" y="802">Вывод</text><text class="it" x="24" y="828">Точка пересечения:</text><text class="it" x="24" y="854">критическое значение ρп*</text><text class="it" x="24" y="880">или Pн*.</text><rect class="i-out" x="12" y="904" width="316" height="102" rx="6"/><text class="ih" x="24" y="936">Вывод</text><text class="it" x="24" y="962">Ширина области перекрытия:</text><text class="it" x="24" y="988">мера надёжности критерия.</text><rect class="i-warn" x="12" y="1012" width="316" height="128" rx="6"/><text class="ih" x="24" y="1044">Где ломается</text><text class="it" x="24" y="1070">Мало испытаний:</text><text class="it" x="24" y="1096">распределения нельзя</text><text class="it" x="24" y="1122">построить надёжно.</text><rect class="i-warn" x="12" y="1146" width="316" height="154" rx="6"/><text class="ih" x="24" y="1178">Где ломается</text><text class="it" x="24" y="1204">Первые разведочные</text><text class="it" x="24" y="1230">скважины: своих испытаний</text><text class="it" x="24" y="1256">нет, берут значения с</text><text class="it" x="24" y="1282">соседних месторождений.</text><rect x="249" y="1318" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1339">схема</text></svg>