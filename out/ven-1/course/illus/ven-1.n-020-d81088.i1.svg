<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1138" role="img" aria-label="Схема шага «Глубокое проникновение ломает задачу»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Глубокое проникновение ломает задачу»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривые сопротивления</text><text class="it" x="24" y="96">разных зондов. Глубина</text><text class="it" x="24" y="122">исследования комплекта</text><text class="it" x="24" y="148">зондов задаёт радиус,</text><text class="it" x="24" y="174">который видит каждый зонд.</text><rect class="i-in" x="12" y="198" width="316" height="154" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Параметры бурения:</text><text class="it" x="24" y="282">репрессия на пласт,</text><text class="it" x="24" y="308">качество раствора и его</text><text class="it" x="24" y="334">водоотдача.</text><rect class="i-in" x="12" y="358" width="316" height="102" rx="6"/><text class="ih" x="24" y="390">Вход</text><text class="it" x="24" y="416">Время между бурением и</text><text class="it" x="24" y="442">геофизическим замером.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Глубокое проникновение</text><text class="it" x="24" y="558">ломает задачу</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="180" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Вывод о насыщении по</text><text class="it" x="24" y="694">сопротивлению можно делать</text><text class="it" x="24" y="720">только при выполнении</text><text class="it" x="24" y="746">условия о глубине зоны</text><text class="it" x="24" y="772">проникновения.</text><rect class="i-warn" x="12" y="796" width="316" height="154" rx="6"/><text class="ih" x="24" y="828">Где ломается</text><text class="it" x="24" y="854">Глубокое проникновение:</text><text class="it" x="24" y="880">сопротивление отражает</text><text class="it" x="24" y="906">фильтрат раствора, а не</text><text class="it" x="24" y="932">природный флюид.</text><rect class="i-warn" x="12" y="956" width="316" height="128" rx="6"/><text class="ih" x="24" y="988">Где ломается</text><text class="it" x="24" y="1014">Сверхглубокие скважины</text><text class="it" x="24" y="1040">глубже 4 км: влияние этих</text><text class="it" x="24" y="1066">факторов сильнее всего.</text><rect x="249" y="1102" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1123">схема</text></svg>