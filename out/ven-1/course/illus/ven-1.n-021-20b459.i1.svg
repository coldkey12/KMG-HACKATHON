<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1216" role="img" aria-label="Схема шага «Когда вода перестаёт течь: Kв*»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Когда вода перестаёт течь: Kв*»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="206" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривые фазовой</text><text class="it" x="24" y="96">проницаемости нефти и воды</text><text class="it" x="24" y="122">для каждого образца в</text><text class="it" x="24" y="148">зависимости от</text><text class="it" x="24" y="174">коэффициента</text><text class="it" x="24" y="200">водонасыщения.</text><rect class="i-in" x="12" y="224" width="316" height="128" rx="6"/><text class="ih" x="24" y="256">Вход</text><text class="it" x="24" y="282">Коллектор и жидкости,</text><text class="it" x="24" y="308">которые фильтровались в</text><text class="it" x="24" y="334">опыте.</text><line class="ia" x1="170" y1="362" x2="170" y2="382"/><path class="iah" d="M170 388 l-6 -9 h12 z"/><rect class="i-node" x="12" y="392" width="316" height="76" rx="6"/><text class="it" x="24" y="424">Когда вода перестаёт течь:</text><text class="it" x="24" y="450">Kв*</text><line class="ia" x1="170" y1="472" x2="170" y2="492"/><path class="iah" d="M170 498 l-6 -9 h12 z"/><rect class="i-out" x="12" y="502" width="316" height="154" rx="6"/><text class="ih" x="24" y="534">Вывод</text><text class="it" x="24" y="560">Критическое водонасыщение</text><text class="it" x="24" y="586">Kв*: значение, ниже</text><text class="it" x="24" y="612">которого проницаемость по</text><text class="it" x="24" y="638">воде равна нулю.</text><rect class="i-out" x="12" y="662" width="316" height="180" rx="6"/><text class="ih" x="24" y="694">Вывод</text><text class="it" x="24" y="720">Значение служит основой</text><text class="it" x="24" y="746">для перехода к граничным</text><text class="it" x="24" y="772">значениям сопротивления и</text><text class="it" x="24" y="798">параметра насыщения в</text><text class="it" x="24" y="824">следующих разделах.</text><rect class="i-warn" x="12" y="848" width="316" height="154" rx="6"/><text class="ih" x="24" y="880">Где ломается</text><text class="it" x="24" y="906">Значение зависит от</text><text class="it" x="24" y="932">глинистости и размера</text><text class="it" x="24" y="958">каналов; при их изменении</text><text class="it" x="24" y="984">порог сдвигается.</text><rect class="i-warn" x="12" y="1008" width="316" height="154" rx="6"/><text class="ih" x="24" y="1040">Где ломается</text><text class="it" x="24" y="1066">Данные только</text><text class="it" x="24" y="1092">лабораторные, по образцам.</text><text class="it" x="24" y="1118">Прямых кривых по скважине</text><text class="it" x="24" y="1144">в главе нет.</text><rect x="249" y="1180" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1201">схема</text></svg>