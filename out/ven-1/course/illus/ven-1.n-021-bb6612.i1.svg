<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1272" role="img" aria-label="Схема шага «От порога насыщения к порогу сопротивления»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «От порога насыщения к порогу сопротивления»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривые фазовой</text><text class="it" x="24" y="96">проницаемости по нефти и</text><text class="it" x="24" y="122">воде для коллектора</text><text class="it" x="24" y="148">данного типа; из них</text><text class="it" x="24" y="174">граничное K*в.</text><rect class="i-in" x="12" y="198" width="316" height="154" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Зависимость параметра</text><text class="it" x="24" y="282">насыщения от</text><text class="it" x="24" y="308">водонасыщения, полученная</text><text class="it" x="24" y="334">для того же коллектора.</text><rect class="i-in" x="12" y="358" width="316" height="128" rx="6"/><text class="ih" x="24" y="390">Вход</text><text class="it" x="24" y="416">Сопротивление пласта по</text><text class="it" x="24" y="442">индукционному методу или</text><text class="it" x="24" y="468">по большим зондам.</text><line class="ia" x1="170" y1="496" x2="170" y2="516"/><path class="iah" d="M170 522 l-6 -9 h12 z"/><rect class="i-node" x="12" y="526" width="316" height="76" rx="6"/><text class="it" x="24" y="558">От порога насыщения к</text><text class="it" x="24" y="584">порогу сопротивления</text><line class="ia" x1="170" y1="606" x2="170" y2="626"/><path class="iah" d="M170 632 l-6 -9 h12 z"/><rect class="i-out" x="12" y="636" width="316" height="102" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Граничные значения P*н и</text><text class="it" x="24" y="720">ρ*п, соответствующие K*в.</text><rect class="i-out" x="12" y="744" width="316" height="154" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Класс пласта: продуктивный</text><text class="it" x="24" y="828">или водоносный, по</text><text class="it" x="24" y="854">сравнению сопротивления</text><text class="it" x="24" y="880">пласта с ρ*п.</text><rect class="i-warn" x="12" y="904" width="316" height="154" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Глинистость и пористость</text><text class="it" x="24" y="988">сильно меняются: один</text><text class="it" x="24" y="1014">порог сопротивления не</text><text class="it" x="24" y="1040">разделяет пласты.</text><rect class="i-warn" x="12" y="1064" width="316" height="154" rx="6"/><text class="ih" x="24" y="1096">Где ломается</text><text class="it" x="24" y="1122">Глубокое проникновение</text><text class="it" x="24" y="1148">фильтрата нарушает условие</text><text class="it" x="24" y="1174">неглубокого проникновения,</text><text class="it" x="24" y="1200">и порог может сместиться.</text><rect x="249" y="1236" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1257">схема</text></svg>