<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1458" role="img" aria-label="Схема шага «Глинистые пласты: отскок точки от линии СП»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Глинистые пласты: отскок точки от линии СП»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривая СП: амплитуда</text><text class="it" x="24" y="96">аномалии Eз против каждого</text><text class="it" x="24" y="122">пласта, мВ.</text><rect class="i-in" x="12" y="146" width="316" height="180" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Сопротивление промытой</text><text class="it" x="24" y="230">зоны ρпп по</text><text class="it" x="24" y="256">микроэлектрическим</text><text class="it" x="24" y="282">методам; при их отсутствии</text><text class="it" x="24" y="308">— по БЭЗ или малым зондам.</text><rect class="i-in" x="12" y="332" width="316" height="102" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Сопротивление неизменённой</text><text class="it" x="24" y="416">части ρп по БЭЗ или ИМ.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Глинистые пласты: отскок</text><text class="it" x="24" y="532">точки от линии СП</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="154" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Точки пластов на</text><text class="it" x="24" y="668">полулогарифмическом</text><text class="it" x="24" y="694">бланке: Eз против</text><text class="it" x="24" y="720">lg(ρпп/ρп).</text><rect class="i-out" x="12" y="744" width="316" height="128" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Линия водоносных пластов</text><text class="it" x="24" y="828">или семейство линий при</text><text class="it" x="24" y="854">разной глинистости.</text><rect class="i-out" x="12" y="878" width="316" height="154" rx="6"/><text class="ih" x="24" y="910">Вывод</text><text class="it" x="24" y="936">Вывод: точка выше линии</text><text class="it" x="24" y="962">означает продуктивность;</text><text class="it" x="24" y="988">величина отскока задаёт</text><text class="it" x="24" y="1014">надёжность.</text><rect class="i-warn" x="12" y="1038" width="316" height="232" rx="6"/><text class="ih" x="24" y="1070">Где ломается</text><text class="it" x="24" y="1096">Метод задуман для</text><text class="it" x="24" y="1122">глинистых терригенных</text><text class="it" x="24" y="1148">коллекторов, где</text><text class="it" x="24" y="1174">сопротивления продуктивных</text><text class="it" x="24" y="1200">и водоносных пластов</text><text class="it" x="24" y="1226">различаются не более чем в</text><text class="it" x="24" y="1252">2–3 раза.</text><rect class="i-warn" x="12" y="1276" width="316" height="128" rx="6"/><text class="ih" x="24" y="1308">Где ломается</text><text class="it" x="24" y="1334">Без заведомо водоносных</text><text class="it" x="24" y="1360">пластов линию по бланку не</text><text class="it" x="24" y="1386">построить.</text><rect x="249" y="1422" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1443">схема</text></svg>