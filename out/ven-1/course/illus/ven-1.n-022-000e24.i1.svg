<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1246" role="img" aria-label="Схема шага «Совмещаем кривые: где сопротивление поднимается»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Совмещаем кривые: где сопротивление поднимается»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривая сопротивления</text><text class="it" x="24" y="96">экранированного или</text><text class="it" x="24" y="122">индукционного зонда по</text><text class="it" x="24" y="148">глубине.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Кривая пористости НГМ или</text><text class="it" x="24" y="256">ЛТ по глубине (опорная</text><text class="it" x="24" y="282">кривая).</text><rect class="i-in" x="12" y="306" width="316" height="128" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Два зонда сопротивления в</text><text class="it" x="24" y="390">одном масштабе для</text><text class="it" x="24" y="416">совмещения.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Совмещаем кривые: где</text><text class="it" x="24" y="532">сопротивление поднимается</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="154" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Интервалы, где</text><text class="it" x="24" y="668">сопротивление выше опорной</text><text class="it" x="24" y="694">кривой: кандидаты в</text><text class="it" x="24" y="720">продуктивные коллекторы.</text><rect class="i-out" x="12" y="744" width="316" height="154" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Интервалы совпадения</text><text class="it" x="24" y="828">кривых: водоносные</text><text class="it" x="24" y="854">коллекторы и плотные</text><text class="it" x="24" y="880">пласты.</text><rect class="i-warn" x="12" y="904" width="316" height="154" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Высокое сопротивление</text><text class="it" x="24" y="988">плотного пласта не</text><text class="it" x="24" y="1014">означает продуктивность,</text><text class="it" x="24" y="1040">если кривые совпадают.</text><rect class="i-warn" x="12" y="1064" width="316" height="128" rx="6"/><text class="ih" x="24" y="1096">Где ломается</text><text class="it" x="24" y="1122">Порог «существенного»</text><text class="it" x="24" y="1148">подъёма в книге не задан</text><text class="it" x="24" y="1174">числом.</text><rect x="249" y="1210" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1231">схема</text></svg>