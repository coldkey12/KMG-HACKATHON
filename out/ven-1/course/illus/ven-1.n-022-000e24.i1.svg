<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1562" role="img" aria-label="Схема шага «Совмещение кривых сопротивления и пористости»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Совмещение кривых сопротивления и пористости»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="232" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривая кажущегося</text><text class="it" x="24" y="96">сопротивления</text><text class="it" x="24" y="122">экранированного (боковой</text><text class="it" x="24" y="148">каротаж, БК) или</text><text class="it" x="24" y="174">индукционного</text><text class="it" x="24" y="200">(индукционный метод, ИК)</text><text class="it" x="24" y="226">зонда.</text><rect class="i-in" x="12" y="250" width="316" height="128" rx="6"/><text class="ih" x="24" y="282">Вход</text><text class="it" x="24" y="308">Кривая пористости:</text><text class="it" x="24" y="334">нейтронный гамма-метод</text><text class="it" x="24" y="360">(НГМ) или метод ЛТ.</text><rect class="i-in" x="12" y="384" width="316" height="154" rx="6"/><text class="ih" x="24" y="416">Вход</text><text class="it" x="24" y="442">Кривые экранированного и</text><text class="it" x="24" y="468">микроэкранированного</text><text class="it" x="24" y="494">зондов в одном масштабе</text><text class="it" x="24" y="520">сопротивлений.</text><line class="ia" x1="170" y1="548" x2="170" y2="568"/><path class="iah" d="M170 574 l-6 -9 h12 z"/><rect class="i-node" x="12" y="578" width="316" height="76" rx="6"/><text class="it" x="24" y="610">Совмещение кривых</text><text class="it" x="24" y="636">сопротивления и пористости</text><line class="ia" x1="170" y1="658" x2="170" y2="678"/><path class="iah" d="M170 684 l-6 -9 h12 z"/><rect class="i-out" x="12" y="688" width="316" height="180" rx="6"/><text class="ih" x="24" y="720">Вывод</text><text class="it" x="24" y="746">Интервалы, где</text><text class="it" x="24" y="772">сопротивление заметно выше</text><text class="it" x="24" y="798">базисной кривой</text><text class="it" x="24" y="824">пористости, — продуктивные</text><text class="it" x="24" y="850">коллекторы.</text><rect class="i-out" x="12" y="874" width="316" height="154" rx="6"/><text class="ih" x="24" y="906">Вывод</text><text class="it" x="24" y="932">Интервалы, где кривые</text><text class="it" x="24" y="958">совпадают, — водоносные</text><text class="it" x="24" y="984">коллекторы или плотные</text><text class="it" x="24" y="1010">пласты.</text><rect class="i-out" x="12" y="1034" width="316" height="128" rx="6"/><text class="ih" x="24" y="1066">Вывод</text><text class="it" x="24" y="1092">Список интервалов для</text><text class="it" x="24" y="1118">проверки испытаниями или</text><text class="it" x="24" y="1144">керном.</text><rect class="i-warn" x="12" y="1168" width="316" height="154" rx="6"/><text class="ih" x="24" y="1200">Где ломается</text><text class="it" x="24" y="1226">Совпадение кривых</text><text class="it" x="24" y="1252">практическое, а не точное.</text><text class="it" x="24" y="1278">Граница между совпадением</text><text class="it" x="24" y="1304">и превышением размыта.</text><rect class="i-warn" x="12" y="1328" width="316" height="180" rx="6"/><text class="ih" x="24" y="1360">Где ломается</text><text class="it" x="24" y="1386">Способ приведения кривых</text><text class="it" x="24" y="1412">по пористости в этом</text><text class="it" x="24" y="1438">фрагменте не описан,</text><text class="it" x="24" y="1464">поэтому сравнение нельзя</text><text class="it" x="24" y="1490">воспроизвести по тексту.</text><rect x="249" y="1526" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1547">схема</text></svg>