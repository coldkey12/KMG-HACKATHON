<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1194" role="img" aria-label="Схема шага «Ложный отскок: вода, похожая на нефть»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Ложный отскок: вода, похожая на нефть»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Удельное сопротивление,</text><text class="it" x="24" y="96">снятое самыми большими</text><text class="it" x="24" y="122">зондами; на него влияет</text><text class="it" x="24" y="148">проникновение.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Параметр пористости ΔJm,</text><text class="it" x="24" y="256">вычисленный для каждого</text><text class="it" x="24" y="282">выделенного пласта.</text><rect class="i-in" x="12" y="306" width="316" height="154" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Тип коллектора (смешанный,</text><text class="it" x="24" y="390">с трещинами) и условия</text><text class="it" x="24" y="416">исследования скважины,</text><text class="it" x="24" y="442">включая время.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Ложный отскок: вода,</text><text class="it" x="24" y="558">похожая на нефть</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="154" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Точка пласта на графике;</text><text class="it" x="24" y="694">отскок вверх за область</text><text class="it" x="24" y="720">неоднозначности даёт</text><text class="it" x="24" y="746">признак продуктивности.</text><rect class="i-out" x="12" y="770" width="316" height="154" rx="6"/><text class="ih" x="24" y="802">Вывод</text><text class="it" x="24" y="828">Ложный отскок водоносного</text><text class="it" x="24" y="854">пласта, неотличимый от</text><text class="it" x="24" y="880">нефтеносного по этому</text><text class="it" x="24" y="906">признаку.</text><rect class="i-warn" x="12" y="930" width="316" height="102" rx="6"/><text class="ih" x="24" y="962">Где ломается</text><text class="it" x="24" y="988">Глубокое проникновение</text><text class="it" x="24" y="1014">фильтрата в коллектор.</text><rect class="i-warn" x="12" y="1038" width="316" height="102" rx="6"/><text class="ih" x="24" y="1070">Где ломается</text><text class="it" x="24" y="1096">Трещиноватый смешанный тип</text><text class="it" x="24" y="1122">коллектора.</text><rect x="249" y="1158" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1179">схема</text></svg>