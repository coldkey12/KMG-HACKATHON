<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1246" role="img" aria-label="Схема шага «Ложный отскок при глубоком проникновении»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Ложный отскок при глубоком проникновении»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Сопротивление пласта по</text><text class="it" x="24" y="96">большим зондам (ρп), то</text><text class="it" x="24" y="122">есть то, что видят большие</text><text class="it" x="24" y="148">зонды.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Глубина проникновения</text><text class="it" x="24" y="256">фильтрата относительно</text><text class="it" x="24" y="282">глубины исследования</text><text class="it" x="24" y="308">больших зондов.</text><rect class="i-in" x="12" y="332" width="316" height="128" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Условия исследования:</text><text class="it" x="24" y="416">время после бурения и тип</text><text class="it" x="24" y="442">коллектора (трещины).</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Ложный отскок при глубоком</text><text class="it" x="24" y="558">проникновении</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="154" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Точка выше линии</text><text class="it" x="24" y="694">непродуктивных пород:</text><text class="it" x="24" y="720">отскок, который по правилу</text><text class="it" x="24" y="746">означает продуктивность.</text><rect class="i-out" x="12" y="770" width="316" height="128" rx="6"/><text class="ih" x="24" y="802">Вывод</text><text class="it" x="24" y="828">Тот же отскок у</text><text class="it" x="24" y="854">водоносного пласта: ложная</text><text class="it" x="24" y="880">продуктивность.</text><rect class="i-warn" x="12" y="904" width="316" height="128" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Глубокое проникновение:</text><text class="it" x="24" y="988">отскок есть и у водоносных</text><text class="it" x="24" y="1014">коллекторов.</text><rect class="i-warn" x="12" y="1038" width="316" height="154" rx="6"/><text class="ih" x="24" y="1070">Где ломается</text><text class="it" x="24" y="1096">Неизменённая часть пласта</text><text class="it" x="24" y="1122">не измерена: условие</text><text class="it" x="24" y="1148">однозначности не</text><text class="it" x="24" y="1174">выполнено.</text><rect x="249" y="1210" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1231">схема</text></svg>