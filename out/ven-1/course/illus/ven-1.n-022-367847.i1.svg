<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1108" role="img" aria-label="Схема шага «Нейтронные замеры во времени показывают коллектор»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Нейтронные замеры во времени показывают коллектор»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Нейтронные кривые,</text><text class="it" x="24" y="96">повторно записанные против</text><text class="it" x="24" y="122">одного интервала</text><text class="it" x="24" y="148">обсаженной скважины.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Свойства фильтрата и</text><text class="it" x="24" y="256">пластовой воды</text><text class="it" x="24" y="282">относительно нефти.</text><line class="ia" x1="170" y1="310" x2="170" y2="330"/><path class="iah" d="M170 336 l-6 -9 h12 z"/><rect class="i-node" x="12" y="340" width="316" height="102" rx="6"/><text class="it" x="24" y="372">Нейтронные замеры во</text><text class="it" x="24" y="398">времени показывают</text><text class="it" x="24" y="424">коллектор</text><line class="ia" x1="170" y1="446" x2="170" y2="466"/><path class="iah" d="M170 472 l-6 -9 h12 z"/><rect class="i-out" x="12" y="476" width="316" height="180" rx="6"/><text class="ih" x="24" y="508">Вывод</text><text class="it" x="24" y="534">Есть ли изменение</text><text class="it" x="24" y="560">показаний во времени. Если</text><text class="it" x="24" y="586">есть, интервал</text><text class="it" x="24" y="612">рассматривают как признак</text><text class="it" x="24" y="638">коллектора.</text><rect class="i-warn" x="12" y="662" width="316" height="154" rx="6"/><text class="ih" x="24" y="694">Где ломается</text><text class="it" x="24" y="720">Если фильтрат и пластовая</text><text class="it" x="24" y="746">вода по свойствам похожи</text><text class="it" x="24" y="772">на нефть, пласты по этому</text><text class="it" x="24" y="798">признаку не разделить.</text><rect class="i-warn" x="12" y="822" width="316" height="232" rx="6"/><text class="ih" x="24" y="854">Где ломается</text><text class="it" x="24" y="880">Вода и природный газ дают</text><text class="it" x="24" y="906">резко разные нейтронные</text><text class="it" x="24" y="932">отклики. Условия, при</text><text class="it" x="24" y="958">которых это работает,</text><text class="it" x="24" y="984">разобраны в шаге 41 «Газ</text><text class="it" x="24" y="1010">против воды: давление и</text><text class="it" x="24" y="1036">соль».</text><rect x="249" y="1072" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1093">схема</text></svg>