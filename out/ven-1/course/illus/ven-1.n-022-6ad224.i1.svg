<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1190" role="img" aria-label="Схема шага «Нефть и пресная вода почти неразличимы нейтронами»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Нефть и пресная вода почти неразличимы нейтронами»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Тип нейтронного метода:</text><text class="it" x="24" y="96">стационарный (ННМ, НГМ)</text><text class="it" x="24" y="122">или импульсный (ИНМ).</text><rect class="i-in" x="12" y="146" width="316" height="154" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Минерализация пластовых</text><text class="it" x="24" y="230">вод в г/л, из данных</text><text class="it" x="24" y="256">опробования или анализа</text><text class="it" x="24" y="282">воды.</text><line class="ia" x1="170" y1="310" x2="170" y2="330"/><path class="iah" d="M170 336 l-6 -9 h12 z"/><rect class="i-node" x="12" y="340" width="316" height="76" rx="6"/><text class="it" x="24" y="372">Нефть и пресная вода почти</text><text class="it" x="24" y="398">неразличимы нейтронами</text><line class="ia" x1="170" y1="420" x2="170" y2="440"/><path class="iah" d="M170 446 l-6 -9 h12 z"/><rect class="i-out" x="12" y="450" width="316" height="180" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Вывод: можно ли данным</text><text class="it" x="24" y="534">методом разделить</text><text class="it" x="24" y="560">нефтеносные и водоносные</text><text class="it" x="24" y="586">пласты при данной</text><text class="it" x="24" y="612">минерализации.</text><rect class="i-out" x="12" y="636" width="316" height="154" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">При пресной воде для</text><text class="it" x="24" y="720">разделения по</text><text class="it" x="24" y="746">расформированию выбирают</text><text class="it" x="24" y="772">импульсный метод.</text><rect class="i-warn" x="12" y="796" width="316" height="154" rx="6"/><text class="ih" x="24" y="828">Где ломается</text><text class="it" x="24" y="854">При пресной воде отклики</text><text class="it" x="24" y="880">нефтеносного и водоносного</text><text class="it" x="24" y="906">пластов почти совпадают, и</text><text class="it" x="24" y="932">признак не работает.</text><rect class="i-warn" x="12" y="956" width="316" height="180" rx="6"/><text class="ih" x="24" y="988">Где ломается</text><text class="it" x="24" y="1014">Пороги 100—150 и 30—50 г/л</text><text class="it" x="24" y="1040">автор не привязывает к</text><text class="it" x="24" y="1066">конкретным породам.</text><text class="it" x="24" y="1092">Переносить их без проверки</text><text class="it" x="24" y="1118">нельзя.</text><rect x="249" y="1154" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1175">схема</text></svg>