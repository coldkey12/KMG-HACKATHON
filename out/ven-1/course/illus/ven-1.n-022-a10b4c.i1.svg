<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1060" role="img" aria-label="Схема шага «Газ против воды: давление и соль»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Газ против воды: давление и соль»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Показания стационарных</text><text class="it" x="24" y="96">нейтронных методов (ННМ,</text><text class="it" x="24" y="122">НГМ) и импульсного метода</text><text class="it" x="24" y="148">(ИНМ) по пласту.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Пластовое давление,</text><text class="it" x="24" y="256">минерализация пластовых</text><text class="it" x="24" y="282">вод и глинистость пластов.</text><line class="ia" x1="170" y1="310" x2="170" y2="330"/><path class="iah" d="M170 336 l-6 -9 h12 z"/><rect class="i-node" x="12" y="340" width="316" height="76" rx="6"/><text class="it" x="24" y="372">Газ против воды: давление</text><text class="it" x="24" y="398">и соль</text><line class="ia" x1="170" y1="420" x2="170" y2="440"/><path class="iah" d="M170 446 l-6 -9 h12 z"/><rect class="i-out" x="12" y="450" width="316" height="154" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Вывод о том, можно ли</text><text class="it" x="24" y="534">отделить газоносный пласт</text><text class="it" x="24" y="560">от водоносного по</text><text class="it" x="24" y="586">нейтронным методам.</text><rect class="i-out" x="12" y="610" width="316" height="102" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Выбор между стационарными</text><text class="it" x="24" y="694">и импульсными методами.</text><rect class="i-warn" x="12" y="718" width="316" height="154" rx="6"/><text class="ih" x="24" y="750">Где ломается</text><text class="it" x="24" y="776">Пресная вода при давлении</text><text class="it" x="24" y="802">свыше 400—500 кгс/см² —</text><text class="it" x="24" y="828">исключение, где разделение</text><text class="it" x="24" y="854">не простое.</text><rect class="i-warn" x="12" y="878" width="316" height="128" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Давления от 200 до 400</text><text class="it" x="24" y="962">кгс/см² в этом фрагменте</text><text class="it" x="24" y="988">не описаны.</text><rect x="249" y="1024" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1045">схема</text></svg>