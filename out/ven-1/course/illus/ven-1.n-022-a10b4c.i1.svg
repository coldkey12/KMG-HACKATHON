<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1168" role="img" aria-label="Схема шага «Газ и вода для нейтронного метода»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Газ и вода для нейтронного метода»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Показания нейтронных</text><text class="it" x="24" y="96">методов: стационарных</text><text class="it" x="24" y="122">(ННМ, НГМ) и импульсного</text><text class="it" x="24" y="148">(ИНМ).</text><rect class="i-in" x="12" y="172" width="316" height="102" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Пластовое давление в</text><text class="it" x="24" y="256">кгс/см².</text><rect class="i-in" x="12" y="280" width="316" height="102" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Минерализация пластовых</text><text class="it" x="24" y="364">вод и глинистость пластов.</text><line class="ia" x1="170" y1="392" x2="170" y2="412"/><path class="iah" d="M170 418 l-6 -9 h12 z"/><rect class="i-node" x="12" y="422" width="316" height="76" rx="6"/><text class="it" x="24" y="454">Газ и вода для нейтронного</text><text class="it" x="24" y="480">метода</text><line class="ia" x1="170" y1="502" x2="170" y2="522"/><path class="iah" d="M170 528 l-6 -9 h12 z"/><rect class="i-out" x="12" y="532" width="316" height="128" rx="6"/><text class="ih" x="24" y="564">Вывод</text><text class="it" x="24" y="590">Признак газоносного или</text><text class="it" x="24" y="616">водоносного пласта при</text><text class="it" x="24" y="642">подходящих условиях.</text><rect class="i-out" x="12" y="666" width="316" height="102" rx="6"/><text class="ih" x="24" y="698">Вывод</text><text class="it" x="24" y="724">Выбор метода: стационарный</text><text class="it" x="24" y="750">или импульсный.</text><rect class="i-warn" x="12" y="774" width="316" height="128" rx="6"/><text class="ih" x="24" y="806">Где ломается</text><text class="it" x="24" y="832">Пресная вода при высоком</text><text class="it" x="24" y="858">давлении: разделение почти</text><text class="it" x="24" y="884">не работает.</text><rect class="i-warn" x="12" y="908" width="316" height="206" rx="6"/><text class="ih" x="24" y="940">Где ломается</text><text class="it" x="24" y="966">Текст не задаёт порогов</text><text class="it" x="24" y="992">для давлений между 150—200</text><text class="it" x="24" y="1018">и 400—500 кгс/см² и не</text><text class="it" x="24" y="1044">называет порог</text><text class="it" x="24" y="1070">минерализации для</text><text class="it" x="24" y="1096">импульсных методов.</text><rect x="249" y="1132" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1153">схема</text></svg>