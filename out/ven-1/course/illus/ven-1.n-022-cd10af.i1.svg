<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1246" role="img" aria-label="Схема шага «Замеры до и после испытания пласта»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Замеры до и после испытания пласта»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Диаграммы повторных</text><text class="it" x="24" y="96">измерений одного</text><text class="it" x="24" y="122">интервала, снятые до и</text><text class="it" x="24" y="148">после испытания на трубах.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Показания экранированного</text><text class="it" x="24" y="256">или индукционного зонда</text><text class="it" x="24" y="282">(ρф) на каждой диаграмме.</text><rect class="i-in" x="12" y="306" width="316" height="154" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Показания зондов со</text><text class="it" x="24" y="390">средним и большим радиусом</text><text class="it" x="24" y="416">исследования на повторных</text><text class="it" x="24" y="442">диаграммах.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Замеры до и после</text><text class="it" x="24" y="558">испытания пласта</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="128" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Признак продуктивного</text><text class="it" x="24" y="694">коллектора: значительный</text><text class="it" x="24" y="720">рост ρф после испытания.</text><rect class="i-out" x="12" y="744" width="316" height="180" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Снижение во времени</text><text class="it" x="24" y="828">показаний зондов со</text><text class="it" x="24" y="854">средним и большим радиусом</text><text class="it" x="24" y="880">у большей части</text><text class="it" x="24" y="906">продуктивных коллекторов.</text><rect class="i-warn" x="12" y="930" width="316" height="128" rx="6"/><text class="ih" x="24" y="962">Где ломается</text><text class="it" x="24" y="988">Снижение характерно не для</text><text class="it" x="24" y="1014">всех коллекторов, а для</text><text class="it" x="24" y="1040">большей части.</text><rect class="i-warn" x="12" y="1064" width="316" height="128" rx="6"/><text class="ih" x="24" y="1096">Где ломается</text><text class="it" x="24" y="1122">Для «значительного» роста</text><text class="it" x="24" y="1148">в этом фрагменте книги нет</text><text class="it" x="24" y="1174">числового порога.</text><rect x="249" y="1210" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1231">схема</text></svg>