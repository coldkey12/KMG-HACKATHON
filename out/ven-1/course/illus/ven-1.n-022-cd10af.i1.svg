<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1112" role="img" aria-label="Схема шага «Повторные замеры сопротивления во времени»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Повторные замеры сопротивления во времени»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Повторные диаграммы зондов</text><text class="it" x="24" y="96">со средним и большим</text><text class="it" x="24" y="122">радиусом исследования по</text><text class="it" x="24" y="148">одному интервалу, снятые в</text><text class="it" x="24" y="174">разное время.</text><rect class="i-in" x="12" y="198" width="316" height="180" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Диаграмма экранированного</text><text class="it" x="24" y="282">(БК) или индукционного</text><text class="it" x="24" y="308">(ИК) зонда, снятая после</text><text class="it" x="24" y="334">испытания КИИ в том же</text><text class="it" x="24" y="360">интервале.</text><line class="ia" x1="170" y1="388" x2="170" y2="408"/><path class="iah" d="M170 414 l-6 -9 h12 z"/><rect class="i-node" x="12" y="418" width="316" height="76" rx="6"/><text class="it" x="24" y="450">Повторные замеры</text><text class="it" x="24" y="476">сопротивления во времени</text><line class="ia" x1="170" y1="498" x2="170" y2="518"/><path class="iah" d="M170 524 l-6 -9 h12 z"/><rect class="i-out" x="12" y="528" width="316" height="154" rx="6"/><text class="ih" x="24" y="560">Вывод</text><text class="it" x="24" y="586">Направление изменения</text><text class="it" x="24" y="612">показаний со временем: для</text><text class="it" x="24" y="638">большей части продуктивных</text><text class="it" x="24" y="664">коллекторов — снижение.</text><rect class="i-out" x="12" y="688" width="316" height="128" rx="6"/><text class="ih" x="24" y="720">Вывод</text><text class="it" x="24" y="746">Признак продуктивного</text><text class="it" x="24" y="772">коллектора: значительный</text><text class="it" x="24" y="798">рост ρφ после испытания.</text><rect class="i-warn" x="12" y="822" width="316" height="128" rx="6"/><text class="ih" x="24" y="854">Где ломается</text><text class="it" x="24" y="880">«Большая часть» — не все</text><text class="it" x="24" y="906">коллекторы. Исключения в</text><text class="it" x="24" y="932">узле не описаны.</text><rect class="i-warn" x="12" y="956" width="316" height="102" rx="6"/><text class="ih" x="24" y="988">Где ломается</text><text class="it" x="24" y="1014">Порог «значительного»</text><text class="it" x="24" y="1040">роста в тексте не задан.</text><rect x="249" y="1076" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1097">схема</text></svg>