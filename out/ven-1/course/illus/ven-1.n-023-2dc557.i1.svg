<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1376" role="img" aria-label="Схема шага «Одинаковые приборы и различие флюидов»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Одинаковые приборы и различие флюидов»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Повторные замеры</text><text class="it" x="24" y="96">нейтронным методом в одной</text><text class="it" x="24" y="122">скважине.</text><rect class="i-in" x="12" y="146" width="316" height="206" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Параметры режима: скорость</text><text class="it" x="24" y="230">замеров, постоянная</text><text class="it" x="24" y="256">интегрирующей ячейки,</text><text class="it" x="24" y="282">время задержки, мощность</text><text class="it" x="24" y="308">источника, заполнение</text><text class="it" x="24" y="334">скважины.</text><rect class="i-in" x="12" y="358" width="316" height="128" rx="6"/><text class="ih" x="24" y="390">Вход</text><text class="it" x="24" y="416">Данные эталонирования</text><text class="it" x="24" y="442">прибора перед</text><text class="it" x="24" y="468">исследованием.</text><line class="ia" x1="170" y1="496" x2="170" y2="516"/><path class="iah" d="M170 522 l-6 -9 h12 z"/><rect class="i-node" x="12" y="526" width="316" height="76" rx="6"/><text class="it" x="24" y="558">Одинаковые приборы и</text><text class="it" x="24" y="584">различие флюидов</text><line class="ia" x1="170" y1="606" x2="170" y2="626"/><path class="iah" d="M170 632 l-6 -9 h12 z"/><rect class="i-out" x="12" y="636" width="316" height="154" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Сравнимые ряды замеров:</text><text class="it" x="24" y="720">разница показаний связана</text><text class="it" x="24" y="746">с изменением пласта, а не</text><text class="it" x="24" y="772">с аппаратурой.</text><rect class="i-out" x="12" y="796" width="316" height="154" rx="6"/><text class="ih" x="24" y="828">Вывод</text><text class="it" x="24" y="854">Проверка, достаточен ли</text><text class="it" x="24" y="880">контраст времён жизни</text><text class="it" x="24" y="906">нейтронов для заданной</text><text class="it" x="24" y="932">пористости.</text><rect class="i-warn" x="12" y="956" width="316" height="180" rx="6"/><text class="ih" x="24" y="988">Где ломается</text><text class="it" x="24" y="1014">Смена прибора или режима</text><text class="it" x="24" y="1040">между замерами делает</text><text class="it" x="24" y="1066">разницу показаний</text><text class="it" x="24" y="1092">непригодной для вывода о</text><text class="it" x="24" y="1118">пласте.</text><rect class="i-warn" x="12" y="1142" width="316" height="180" rx="6"/><text class="ih" x="24" y="1174">Где ломается</text><text class="it" x="24" y="1200">Если контраст меньше 1,5</text><text class="it" x="24" y="1226">раза (при 20%) или 2,5</text><text class="it" x="24" y="1252">раза (при 10%), метод по</text><text class="it" x="24" y="1278">этому признаку не разделит</text><text class="it" x="24" y="1304">флюиды.</text><rect x="249" y="1340" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1361">схема</text></svg>