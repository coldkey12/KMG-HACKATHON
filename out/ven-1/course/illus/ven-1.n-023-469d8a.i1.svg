<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1034" role="img" aria-label="Схема шага «Линия регрессии по двум замерам»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Линия регрессии по двум замерам»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Значения λ по каждому</text><text class="it" x="24" y="96">неизменившемуся пласту при</text><text class="it" x="24" y="122">первом замере.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Значения λ по тем же</text><text class="it" x="24" y="230">пластам при одном из</text><text class="it" x="24" y="256">последующих замеров.</text><rect class="i-in" x="12" y="280" width="316" height="102" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Число неизменившихся</text><text class="it" x="24" y="364">пластов n.</text><line class="ia" x1="170" y1="392" x2="170" y2="412"/><path class="iah" d="M170 418 l-6 -9 h12 z"/><rect class="i-node" x="12" y="422" width="316" height="76" rx="6"/><text class="it" x="24" y="454">Линия регрессии по двум</text><text class="it" x="24" y="480">замерам</text><line class="ia" x1="170" y1="502" x2="170" y2="522"/><path class="iah" d="M170 528 l-6 -9 h12 z"/><rect class="i-out" x="12" y="532" width="316" height="102" rx="6"/><text class="ih" x="24" y="564">Вывод</text><text class="it" x="24" y="590">Коэффициенты a и b прямой</text><text class="it" x="24" y="616">y = ax + b.</text><rect class="i-warn" x="12" y="640" width="316" height="180" rx="6"/><text class="ih" x="24" y="672">Где ломается</text><text class="it" x="24" y="698">Линия строится по</text><text class="it" x="24" y="724">неизменившимся пластам;</text><text class="it" x="24" y="750">если в выборку попали</text><text class="it" x="24" y="776">изменившиеся, линия</text><text class="it" x="24" y="802">сдвигается.</text><rect class="i-warn" x="12" y="826" width="316" height="154" rx="6"/><text class="ih" x="24" y="858">Где ломается</text><text class="it" x="24" y="884">Запись D_x в тексте</text><text class="it" x="24" y="910">неоднозначна; без сверки</text><text class="it" x="24" y="936">со сканом знаменатель</text><text class="it" x="24" y="962">может быть понят неверно.</text><rect x="249" y="998" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1019">схема</text></svg>