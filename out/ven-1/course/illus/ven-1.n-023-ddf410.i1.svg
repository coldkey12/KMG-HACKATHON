<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1376" role="img" aria-label="Схема шага «Как правильно повторять нейтронные замеры»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Как правильно повторять нейтронные замеры»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Серия замеров одним и тем</text><text class="it" x="24" y="96">же типом прибора по одному</text><text class="it" x="24" y="122">интервалу в разные сроки</text><text class="it" x="24" y="148">после крепления.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Время каждого замера,</text><text class="it" x="24" y="256">отсчитанное от момента</text><text class="it" x="24" y="282">крепления скважины.</text><rect class="i-in" x="12" y="306" width="316" height="154" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Опорные пласты</text><text class="it" x="24" y="390">(непроницаемые,</text><text class="it" x="24" y="416">водоносные) с известным</text><text class="it" x="24" y="442">водородосодержанием.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Как правильно повторять</text><text class="it" x="24" y="558">нейтронные замеры</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="180" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Серия, в которой условия</text><text class="it" x="24" y="694">сравнимы: один прибор,</text><text class="it" x="24" y="720">одинаковые режимы,</text><text class="it" x="24" y="746">эталонирование и опорные</text><text class="it" x="24" y="772">пласты.</text><rect class="i-out" x="12" y="796" width="316" height="180" rx="6"/><text class="ih" x="24" y="828">Вывод</text><text class="it" x="24" y="854">Решение о том, пригодна ли</text><text class="it" x="24" y="880">серия для вывода об</text><text class="it" x="24" y="906">изменении флюида и</text><text class="it" x="24" y="932">неизменности опорных</text><text class="it" x="24" y="958">пластов.</text><rect class="i-warn" x="12" y="982" width="316" height="154" rx="6"/><text class="ih" x="24" y="1014">Где ломается</text><text class="it" x="24" y="1040">Замеры в необсаженной</text><text class="it" x="24" y="1066">скважине трудно сравнивать</text><text class="it" x="24" y="1092">с замерами после</text><text class="it" x="24" y="1118">крепления.</text><rect class="i-warn" x="12" y="1142" width="316" height="180" rx="6"/><text class="ih" x="24" y="1174">Где ломается</text><text class="it" x="24" y="1200">Если разница времён жизни</text><text class="it" x="24" y="1226">меньше порога (1,5 раза</text><text class="it" x="24" y="1252">при 20% или 2,5 раза при</text><text class="it" x="24" y="1278">10%), условие не</text><text class="it" x="24" y="1304">выполнено.</text><rect x="249" y="1340" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1361">схема</text></svg>