<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1346" role="img" aria-label="Схема шага «Когда и как часто делать повторные замеры»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Когда и как часто делать повторные замеры»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="206" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Серия повторных замеров</text><text class="it" x="24" y="96">одного и того же</text><text class="it" x="24" y="122">интервала, каждый с</text><text class="it" x="24" y="148">отметкой времени от</text><text class="it" x="24" y="174">момента крепления</text><text class="it" x="24" y="200">скважины.</text><rect class="i-in" x="12" y="224" width="316" height="154" rx="6"/><text class="ih" x="24" y="256">Вход</text><text class="it" x="24" y="282">Ожидаемые наилучшие</text><text class="it" x="24" y="308">коллекторы, от которых</text><text class="it" x="24" y="334">зависит интервал до</text><text class="it" x="24" y="360">второго замера.</text><rect class="i-in" x="12" y="384" width="316" height="154" rx="6"/><text class="ih" x="24" y="416">Вход</text><text class="it" x="24" y="442">Признак особо проницаемых</text><text class="it" x="24" y="468">пластов, при котором нужен</text><text class="it" x="24" y="494">замер в скважине без</text><text class="it" x="24" y="520">обсадных труб.</text><line class="ia" x1="170" y1="548" x2="170" y2="568"/><path class="iah" d="M170 574 l-6 -9 h12 z"/><rect class="i-node" x="12" y="578" width="316" height="76" rx="6"/><text class="it" x="24" y="610">Когда и как часто делать</text><text class="it" x="24" y="636">повторные замеры</text><line class="ia" x1="170" y1="658" x2="170" y2="678"/><path class="iah" d="M170 684 l-6 -9 h12 z"/><rect class="i-out" x="12" y="688" width="316" height="180" rx="6"/><text class="ih" x="24" y="720">Вывод</text><text class="it" x="24" y="746">Набор показаний во времени</text><text class="it" x="24" y="772">для каждого пласта. По</text><text class="it" x="24" y="798">нему видно, изменилась ли</text><text class="it" x="24" y="824">прискважинная часть</text><text class="it" x="24" y="850">пласта.</text><rect class="i-warn" x="12" y="874" width="316" height="206" rx="6"/><text class="ih" x="24" y="906">Где ломается</text><text class="it" x="24" y="932">Замер в скважине без</text><text class="it" x="24" y="958">обсадных труб нельзя</text><text class="it" x="24" y="984">напрямую сравнивать с</text><text class="it" x="24" y="1010">замерами после крепления:</text><text class="it" x="24" y="1036">колонна, кавери и корка</text><text class="it" x="24" y="1062">меняют показания.</text><rect class="i-warn" x="12" y="1086" width="316" height="206" rx="6"/><text class="ih" x="24" y="1118">Где ломается</text><text class="it" x="24" y="1144">Если следующий замер</text><text class="it" x="24" y="1170">сделан слишком поздно,</text><text class="it" x="24" y="1196">изменение может уже</text><text class="it" x="24" y="1222">закончиться до него. Это</text><text class="it" x="24" y="1248">логический вывод, не</text><text class="it" x="24" y="1274">прямой текст.</text><rect x="249" y="1310" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1331">схема</text></svg>