<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1276" role="img" aria-label="Схема шага «Низкочастотная акустика за обсадной трубой»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Низкочастотная акустика за обсадной трубой»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривые ΔT_p и ΔT_s,</text><text class="it" x="24" y="96">записанные в обсаженной</text><text class="it" x="24" y="122">скважине</text><rect class="i-in" x="12" y="146" width="316" height="102" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Кривая затухания амплитуд</text><text class="it" x="24" y="230">волн</text><rect class="i-in" x="12" y="254" width="316" height="128" rx="6"/><text class="ih" x="24" y="286">Вход</text><text class="it" x="24" y="312">Амплитуды продольной α_f и</text><text class="it" x="24" y="338">поперечной α_s волн по</text><text class="it" x="24" y="364">интервалу</text><line class="ia" x1="170" y1="392" x2="170" y2="412"/><path class="iah" d="M170 418 l-6 -9 h12 z"/><rect class="i-node" x="12" y="422" width="316" height="76" rx="6"/><text class="it" x="24" y="454">Низкочастотная акустика за</text><text class="it" x="24" y="480">обсадной трубой</text><line class="ia" x1="170" y1="502" x2="170" y2="522"/><path class="iah" d="M170 528 l-6 -9 h12 z"/><rect class="i-out" x="12" y="532" width="316" height="102" rx="6"/><text class="ih" x="24" y="564">Вывод</text><text class="it" x="24" y="590">Расчленение обсаженного</text><text class="it" x="24" y="616">разреза на интервалы</text><rect class="i-out" x="12" y="640" width="316" height="154" rx="6"/><text class="ih" x="24" y="672">Вывод</text><text class="it" x="24" y="698">Признак нефтеносной части:</text><text class="it" x="24" y="724">снижение α_f и рост α_s</text><text class="it" x="24" y="750">относительно водоносного</text><text class="it" x="24" y="776">интервала</text><rect class="i-out" x="12" y="800" width="316" height="154" rx="6"/><text class="ih" x="24" y="832">Вывод</text><text class="it" x="24" y="858">Оценка состояния зоны</text><text class="it" x="24" y="884">проникновения при её</text><text class="it" x="24" y="910">частичном или полном</text><text class="it" x="24" y="936">расформировании</text><rect class="i-warn" x="12" y="960" width="316" height="128" rx="6"/><text class="ih" x="24" y="992">Где ломается</text><text class="it" x="24" y="1018">Вывод о ВНК только для</text><text class="it" x="24" y="1044">мощного и достаточно</text><text class="it" x="24" y="1070">однородного коллектора</text><rect class="i-warn" x="12" y="1094" width="316" height="128" rx="6"/><text class="ih" x="24" y="1126">Где ломается</text><text class="it" x="24" y="1152">Признак дан относительно</text><text class="it" x="24" y="1178">эталона; абсолютных</text><text class="it" x="24" y="1204">порогов в тексте нет</text><rect x="249" y="1240" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1261">схема</text></svg>