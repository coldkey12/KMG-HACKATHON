<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1432" role="img" aria-label="Схема шага «ИНМ-КВ: что заполняет пласт за один замер»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «ИНМ-КВ: что заполняет пласт за один замер»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Два ряда показаний ИНМ-КВ</text><text class="it" x="24" y="96">по глубине: малого и</text><text class="it" x="24" y="122">большого зонда против</text><text class="it" x="24" y="148">одного пласта.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Режим измерений, выбранный</text><text class="it" x="24" y="256">так, чтобы солёные</text><text class="it" x="24" y="282">водоносные пласты давали</text><text class="it" x="24" y="308">совпадение.</text><rect class="i-in" x="12" y="332" width="316" height="102" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Сведения о наличии зоны</text><text class="it" x="24" y="416">проникновения у пласта.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">ИНМ-КВ: что заполняет</text><text class="it" x="24" y="532">пласт за один замер</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="128" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Совпадение двух зондов:</text><text class="it" x="24" y="668">водоносный пласт без зоны</text><text class="it" x="24" y="694">проникновения.</text><rect class="i-out" x="12" y="718" width="316" height="206" rx="6"/><text class="ih" x="24" y="750">Вывод</text><text class="it" x="24" y="776">Приращение малого зонда</text><text class="it" x="24" y="802">над большим: нефтеносный</text><text class="it" x="24" y="828">пласт без зоны</text><text class="it" x="24" y="854">проникновения или с</text><text class="it" x="24" y="880">пресной зоной</text><text class="it" x="24" y="906">проникновения.</text><rect class="i-out" x="12" y="930" width="316" height="128" rx="6"/><text class="ih" x="24" y="962">Вывод</text><text class="it" x="24" y="988">Вид жидкости в</text><text class="it" x="24" y="1014">прискважинной части по</text><text class="it" x="24" y="1040">одному замеру.</text><rect class="i-warn" x="12" y="1064" width="316" height="154" rx="6"/><text class="ih" x="24" y="1096">Где ломается</text><text class="it" x="24" y="1122">Нефть и пресная зона</text><text class="it" x="24" y="1148">проникновения дают</text><text class="it" x="24" y="1174">одинаковый признак. По</text><text class="it" x="24" y="1200">нему их не разделить.</text><rect class="i-warn" x="12" y="1224" width="316" height="154" rx="6"/><text class="ih" x="24" y="1256">Где ломается</text><text class="it" x="24" y="1282">Совпадение зависит от</text><text class="it" x="24" y="1308">солёности воды: более</text><text class="it" x="24" y="1334">пресная вода даёт</text><text class="it" x="24" y="1360">приращения.</text><rect x="249" y="1396" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1417">схема</text></svg>