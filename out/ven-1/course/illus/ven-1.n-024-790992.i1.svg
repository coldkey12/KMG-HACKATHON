<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1086" role="img" aria-label="Схема шага «Скорость расформирования говорит о проницаемости»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Скорость расформирования говорит о проницаемости»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Результаты повторных</text><text class="it" x="24" y="96">временных замеров одного и</text><text class="it" x="24" y="122">того же пласта, сделанных</text><text class="it" x="24" y="148">в разное время.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Пористость пластов,</text><text class="it" x="24" y="256">найденная другими</text><text class="it" x="24" y="282">методами.</text><line class="ia" x1="170" y1="310" x2="170" y2="330"/><path class="iah" d="M170 336 l-6 -9 h12 z"/><rect class="i-node" x="12" y="340" width="316" height="76" rx="6"/><text class="it" x="24" y="372">Скорость расформирования</text><text class="it" x="24" y="398">говорит о проницаемости</text><line class="ia" x1="170" y1="420" x2="170" y2="440"/><path class="iah" d="M170 446 l-6 -9 h12 z"/><rect class="i-out" x="12" y="450" width="316" height="180" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Качественная оценка</text><text class="it" x="24" y="534">проницаемости: в каком</text><text class="it" x="24" y="560">пласте зона проникновения</text><text class="it" x="24" y="586">расформировывается</text><text class="it" x="24" y="612">быстрее.</text><rect class="i-out" x="12" y="636" width="316" height="102" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Нижнее значение пористости</text><text class="it" x="24" y="720">для коллекторов.</text><rect class="i-warn" x="12" y="744" width="316" height="154" rx="6"/><text class="ih" x="24" y="776">Где ломается</text><text class="it" x="24" y="802">Чувствительность метода</text><text class="it" x="24" y="828">ниже искомого значения</text><text class="it" x="24" y="854">пористости: нижнюю границу</text><text class="it" x="24" y="880">тогда не установить.</text><rect class="i-warn" x="12" y="904" width="316" height="128" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Время даёт качественный</text><text class="it" x="24" y="988">признак, а не точное число</text><text class="it" x="24" y="1014">проницаемости.</text><rect x="249" y="1050" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1071">схема</text></svg>