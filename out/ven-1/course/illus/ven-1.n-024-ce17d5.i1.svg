<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 956" role="img" aria-label="Схема шага «Знак изменения показаний подсказывает флюид»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Знак изменения показаний подсказывает флюид»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Показания нейтронного</text><text class="it" x="24" y="96">метода по одному пласту</text><text class="it" x="24" y="122">при двух замерах.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Значение декремента λ по</text><text class="it" x="24" y="230">тому же пласту при двух</text><text class="it" x="24" y="256">замерах.</text><line class="ia" x1="170" y1="284" x2="170" y2="304"/><path class="iah" d="M170 310 l-6 -9 h12 z"/><rect class="i-node" x="12" y="314" width="316" height="76" rx="6"/><text class="it" x="24" y="346">Знак изменения показаний</text><text class="it" x="24" y="372">подсказывает флюид</text><line class="ia" x1="170" y1="394" x2="170" y2="414"/><path class="iah" d="M170 420 l-6 -9 h12 z"/><rect class="i-out" x="12" y="424" width="316" height="128" rx="6"/><text class="ih" x="24" y="456">Вывод</text><text class="it" x="24" y="482">Знак изменения показаний и</text><text class="it" x="24" y="508">знак изменения λ для</text><text class="it" x="24" y="534">пласта вне полосы.</text><rect class="i-out" x="12" y="558" width="316" height="102" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Вывод о типе замены флюида</text><text class="it" x="24" y="642">по таблице знаков.</text><rect class="i-warn" x="12" y="666" width="316" height="102" rx="6"/><text class="ih" x="24" y="698">Где ломается</text><text class="it" x="24" y="724">Знак не различает более</text><text class="it" x="24" y="750">пресную воду, нефть и газ.</text><rect class="i-warn" x="12" y="774" width="316" height="128" rx="6"/><text class="ih" x="24" y="806">Где ломается</text><text class="it" x="24" y="832">Эффект солёной воды описан</text><text class="it" x="24" y="858">при больших временах</text><text class="it" x="24" y="884">задержки.</text><rect x="249" y="920" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="941">схема</text></svg>