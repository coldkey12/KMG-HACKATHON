<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1198" role="img" aria-label="Схема шага «Слоистая пачка: площадь под кривой СП»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Слоистая пачка: площадь под кривой СП»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">кривая СП в пределах пачки</text><text class="it" x="24" y="96">и её отклонение от линии</text><text class="it" x="24" y="122">глин</text><rect class="i-in" x="12" y="146" width="316" height="76" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">полная мощность пачки H</text><rect class="i-in" x="12" y="228" width="316" height="154" rx="6"/><text class="ih" x="24" y="260">Вход</text><text class="it" x="24" y="286">сопротивления</text><text class="it" x="24" y="312">переслаивающихся пластов,</text><text class="it" x="24" y="338">пород и бурового раствора</text><text class="it" x="24" y="364">(проверка условия)</text><line class="ia" x1="170" y1="392" x2="170" y2="412"/><path class="iah" d="M170 418 l-6 -9 h12 z"/><rect class="i-node" x="12" y="422" width="316" height="76" rx="6"/><text class="it" x="24" y="454">Слоистая пачка: площадь</text><text class="it" x="24" y="480">под кривой СП</text><line class="ia" x1="170" y1="502" x2="170" y2="522"/><path class="iah" d="M170 528 l-6 -9 h12 z"/><rect class="i-out" x="12" y="532" width="316" height="76" rx="6"/><text class="ih" x="24" y="564">Вывод</text><text class="it" x="24" y="590">площадь ΩСП в пачке</text><rect class="i-out" x="12" y="614" width="316" height="102" rx="6"/><text class="ih" x="24" y="646">Вывод</text><text class="it" x="24" y="672">доля глинистых прослоев χ,</text><text class="it" x="24" y="698">найденная по связи с ΩСП</text><rect class="i-out" x="12" y="722" width="316" height="102" rx="6"/><text class="ih" x="24" y="754">Вывод</text><text class="it" x="24" y="780">эффективная мощность Нф =</text><text class="it" x="24" y="806">H(1 − χ)</text><rect class="i-warn" x="12" y="830" width="316" height="180" rx="6"/><text class="ih" x="24" y="862">Где ломается</text><text class="it" x="24" y="888">Связь близка к линейной</text><text class="it" x="24" y="914">только при сходстве</text><text class="it" x="24" y="940">сопротивлений; при других</text><text class="it" x="24" y="966">условиях способ менее</text><text class="it" x="24" y="992">эффективен.</text><rect class="i-warn" x="12" y="1016" width="316" height="128" rx="6"/><text class="ih" x="24" y="1048">Где ломается</text><text class="it" x="24" y="1074">Если границы пачки выбраны</text><text class="it" x="24" y="1100">неверно, площадь и доля</text><text class="it" x="24" y="1126">глины будут искажены.</text><rect x="249" y="1162" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1183">схема</text></svg>