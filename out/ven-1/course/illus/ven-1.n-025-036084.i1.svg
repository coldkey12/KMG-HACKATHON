<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 852" role="img" aria-label="Схема шага «Толщина коллектора по площади аномалии СП»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Толщина коллектора по площади аномалии СП»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="76" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривая СП по всей пачке.</text><rect class="i-in" x="12" y="94" width="316" height="102" rx="6"/><text class="ih" x="24" y="126">Вход</text><text class="it" x="24" y="152">Линия глин в пределах</text><text class="it" x="24" y="178">пачки.</text><rect class="i-in" x="12" y="202" width="316" height="76" rx="6"/><text class="ih" x="24" y="234">Вход</text><text class="it" x="24" y="260">Мощность пачки H.</text><line class="ia" x1="170" y1="288" x2="170" y2="308"/><path class="iah" d="M170 314 l-6 -9 h12 z"/><rect class="i-node" x="12" y="318" width="316" height="76" rx="6"/><text class="it" x="24" y="350">Толщина коллектора по</text><text class="it" x="24" y="376">площади аномалии СП</text><line class="ia" x1="170" y1="398" x2="170" y2="418"/><path class="iah" d="M170 424 l-6 -9 h12 z"/><rect class="i-out" x="12" y="428" width="316" height="76" rx="6"/><text class="ih" x="24" y="460">Вывод</text><text class="it" x="24" y="486">Площадь аномалии Ω_СП.</text><rect class="i-out" x="12" y="510" width="316" height="128" rx="6"/><text class="ih" x="24" y="542">Вывод</text><text class="it" x="24" y="568">Эффективная мощность h_ф =</text><text class="it" x="24" y="594">H(1 − χ_r) по связи с</text><text class="it" x="24" y="620">долей глин.</text><rect class="i-warn" x="12" y="644" width="316" height="154" rx="6"/><text class="ih" x="24" y="676">Где ломается</text><text class="it" x="24" y="702">Если сопротивления пород и</text><text class="it" x="24" y="728">раствора заметно</text><text class="it" x="24" y="754">различаются, связь площади</text><text class="it" x="24" y="780">и доли глин не линейна.</text><rect x="249" y="816" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="837">схема</text></svg>