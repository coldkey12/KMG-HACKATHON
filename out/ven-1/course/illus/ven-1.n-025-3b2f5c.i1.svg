<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1484" role="img" aria-label="Схема шага «Вычитаем прослои неколлектора»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Вычитаем прослои неколлектора»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривые микроэлектрических</text><text class="it" x="24" y="96">методов с короткими</text><text class="it" x="24" y="122">зондами у стенки скважины,</text><text class="it" x="24" y="148">по которым выделяют</text><text class="it" x="24" y="174">прослои неколлектора.</text><rect class="i-in" x="12" y="198" width="316" height="128" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Кривые СП, ГМ и</text><text class="it" x="24" y="282">каверномера, по которым</text><text class="it" x="24" y="308">отмечают прослои глин.</text><rect class="i-in" x="12" y="332" width="316" height="128" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Общая мощность пласта, из</text><text class="it" x="24" y="416">которой вычитают мощность</text><text class="it" x="24" y="442">прослоев неколлектора.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Вычитаем прослои</text><text class="it" x="24" y="558">неколлектора</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="128" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Суммарная мощность</text><text class="it" x="24" y="694">прослоев неколлектора,</text><text class="it" x="24" y="720">которую вычитают.</text><rect class="i-out" x="12" y="744" width="316" height="128" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Эффективная мощность hф</text><text class="it" x="24" y="828">как остаток от общей</text><text class="it" x="24" y="854">мощности.</text><rect class="i-out" x="12" y="878" width="316" height="180" rx="6"/><text class="ih" x="24" y="910">Вывод</text><text class="it" x="24" y="936">Для тонких переслаиваний:</text><text class="it" x="24" y="962">эффективная мощность и</text><text class="it" x="24" y="988">коэффициент</text><text class="it" x="24" y="1014">нефтегазонасыщения,</text><text class="it" x="24" y="1040">найденные расчётом.</text><rect class="i-warn" x="12" y="1064" width="316" height="206" rx="6"/><text class="ih" x="24" y="1096">Где ломается</text><text class="it" x="24" y="1122">Очень тонкие переслаивания</text><text class="it" x="24" y="1148">не выделяются даже</text><text class="it" x="24" y="1174">микроэлектрическими</text><text class="it" x="24" y="1200">методами, поэтому</text><text class="it" x="24" y="1226">вычитание по диаграмме для</text><text class="it" x="24" y="1252">них не работает.</text><rect class="i-warn" x="12" y="1276" width="316" height="154" rx="6"/><text class="ih" x="24" y="1308">Где ломается</text><text class="it" x="24" y="1334">В эффективную мощность</text><text class="it" x="24" y="1360">входят только</text><text class="it" x="24" y="1386">нефтегазонасыщенные</text><text class="it" x="24" y="1412">прослои коллектора.</text><rect x="249" y="1448" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1469">схема</text></svg>