<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1406" role="img" aria-label="Схема шага «Следы нефти и газа в растворе»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Следы нефти и газа в растворе»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Диаграмма газометрии:</text><text class="it" x="24" y="96">повышенное содержание</text><text class="it" x="24" y="122">тяжёлых компонентов</text><text class="it" x="24" y="148">углеводородов в глинистом</text><text class="it" x="24" y="174">растворе.</text><rect class="i-in" x="12" y="198" width="316" height="154" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Диаграмма газометрии:</text><text class="it" x="24" y="282">повышенное содержание</text><text class="it" x="24" y="308">метановой фракции в</text><text class="it" x="24" y="334">глинистом растворе.</text><rect class="i-in" x="12" y="358" width="316" height="154" rx="6"/><text class="ih" x="24" y="390">Вход</text><text class="it" x="24" y="416">Свечение глинистого</text><text class="it" x="24" y="442">раствора и шлама и</text><text class="it" x="24" y="468">рецептура раствора (есть</text><text class="it" x="24" y="494">ли нефтяные добавки).</text><line class="ia" x1="170" y1="522" x2="170" y2="542"/><path class="iah" d="M170 548 l-6 -9 h12 z"/><rect class="i-node" x="12" y="552" width="316" height="76" rx="6"/><text class="it" x="24" y="584">Следы нефти и газа в</text><text class="it" x="24" y="610">растворе</text><line class="ia" x1="170" y1="632" x2="170" y2="652"/><path class="iah" d="M170 658 l-6 -9 h12 z"/><rect class="i-out" x="12" y="662" width="316" height="154" rx="6"/><text class="ih" x="24" y="694">Вывод</text><text class="it" x="24" y="720">Тип флюида по признаку:</text><text class="it" x="24" y="746">тяжёлые компоненты</text><text class="it" x="24" y="772">указывают на нефть, метан</text><text class="it" x="24" y="798">— на газ.</text><rect class="i-out" x="12" y="822" width="316" height="128" rx="6"/><text class="ih" x="24" y="854">Вывод</text><text class="it" x="24" y="880">Признак нефти по свечению,</text><text class="it" x="24" y="906">если оно не вызвано</text><text class="it" x="24" y="932">нефтяными добавками.</text><rect class="i-out" x="12" y="956" width="316" height="128" rx="6"/><text class="ih" x="24" y="988">Вывод</text><text class="it" x="24" y="1014">Вывод с оговоркой:</text><text class="it" x="24" y="1040">аномалия может быть ложной</text><text class="it" x="24" y="1066">или отсутствовать.</text><rect class="i-warn" x="12" y="1090" width="316" height="154" rx="6"/><text class="ih" x="24" y="1122">Где ломается</text><text class="it" x="24" y="1148">Аномалия слабая или</text><text class="it" x="24" y="1174">отсутствует при высокой</text><text class="it" x="24" y="1200">проницаемости и</text><text class="it" x="24" y="1226">значительной репрессии.</text><rect class="i-warn" x="12" y="1250" width="316" height="102" rx="6"/><text class="ih" x="24" y="1282">Где ломается</text><text class="it" x="24" y="1308">Тяжёлая вязкая нефть может</text><text class="it" x="24" y="1334">не дать заметной аномалии.</text><rect x="249" y="1370" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1391">схема</text></svg>