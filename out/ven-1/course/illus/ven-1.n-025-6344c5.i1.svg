<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1194" role="img" aria-label="Схема шага «Газометрия: следы нефти в растворе»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Газометрия: следы нефти в растворе»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Диаграмма газометрии:</text><text class="it" x="24" y="96">аномалии тяжёлых</text><text class="it" x="24" y="122">компонентов углеводородов</text><text class="it" x="24" y="148">и метановой фракции по</text><text class="it" x="24" y="174">глубине.</text><rect class="i-in" x="12" y="198" width="316" height="102" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Люминесценция глинистого</text><text class="it" x="24" y="282">раствора и шлама.</text><rect class="i-in" x="12" y="306" width="316" height="102" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Рецептура раствора:</text><text class="it" x="24" y="390">наличие нефтяных добавок.</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Газометрия: следы нефти в</text><text class="it" x="24" y="506">растворе</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="154" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Тип флюида в интервале:</text><text class="it" x="24" y="642">нефтеносный (тяжёлые</text><text class="it" x="24" y="668">компоненты) или газоносный</text><text class="it" x="24" y="694">(метан) коллектор.</text><rect class="i-out" x="12" y="718" width="316" height="154" rx="6"/><text class="ih" x="24" y="750">Вывод</text><text class="it" x="24" y="776">Признак нефти по</text><text class="it" x="24" y="802">люминесценции, если</text><text class="it" x="24" y="828">раствор не содержит</text><text class="it" x="24" y="854">нефтяных добавок.</text><rect class="i-warn" x="12" y="878" width="316" height="154" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Аномалии может не быть при</text><text class="it" x="24" y="962">высокопроницаемом пласте</text><text class="it" x="24" y="988">со значительной</text><text class="it" x="24" y="1014">репрессией.</text><rect class="i-warn" x="12" y="1038" width="316" height="102" rx="6"/><text class="ih" x="24" y="1070">Где ломается</text><text class="it" x="24" y="1096">Аномалии может не быть при</text><text class="it" x="24" y="1122">тяжёлой вязкой нефти.</text><rect x="249" y="1158" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1179">схема</text></svg>