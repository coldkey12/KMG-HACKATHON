<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1086" role="img" aria-label="Схема шага «Тончайшее переслаивание считают расчётом»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Тончайшее переслаивание считают расчётом»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Диаграммы</text><text class="it" x="24" y="96">микроэлектрических</text><text class="it" x="24" y="122">методов, на которых тонкие</text><text class="it" x="24" y="148">прослои не выделяются</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Кривые сопротивления</text><text class="it" x="24" y="256">пачки, зависящие от</text><text class="it" x="24" y="282">направления тока</text><line class="ia" x1="170" y1="310" x2="170" y2="330"/><path class="iah" d="M170 336 l-6 -9 h12 z"/><rect class="i-node" x="12" y="340" width="316" height="76" rx="6"/><text class="it" x="24" y="372">Тончайшее переслаивание</text><text class="it" x="24" y="398">считают расчётом</text><line class="ia" x1="170" y1="420" x2="170" y2="440"/><path class="iah" d="M170 446 l-6 -9 h12 z"/><rect class="i-out" x="12" y="450" width="316" height="154" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Эффективная мощность как</text><text class="it" x="24" y="534">сумма мощностей</text><text class="it" x="24" y="560">нефтегазонасыщенных</text><text class="it" x="24" y="586">прослоев коллектора</text><rect class="i-out" x="12" y="610" width="316" height="154" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Коэффициент</text><text class="it" x="24" y="694">нефтегазонасыщения,</text><text class="it" x="24" y="720">найденный одновременно с</text><text class="it" x="24" y="746">эффективной мощностью</text><rect class="i-warn" x="12" y="770" width="316" height="128" rx="6"/><text class="ih" x="24" y="802">Где ломается</text><text class="it" x="24" y="828">Прослои тоньше разрешения</text><text class="it" x="24" y="854">приборов не разделяются по</text><text class="it" x="24" y="880">отдельности</text><rect class="i-warn" x="12" y="904" width="316" height="128" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Водонасыщенные прослои в</text><text class="it" x="24" y="988">эффективную мощность не</text><text class="it" x="24" y="1014">входят</text><rect x="249" y="1050" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1071">схема</text></svg>