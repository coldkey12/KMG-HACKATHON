<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1220" role="img" aria-label="Схема шага «Тонкий пласт на диаграмме выглядит иначе»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Тонкий пласт на диаграмме выглядит иначе»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Фиктивная мощность hф</text><text class="it" x="24" y="96">тонкого однородного</text><text class="it" x="24" y="122">пласта, снятая с кривой</text><text class="it" x="24" y="148">одного метода.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Метод, которым получена</text><text class="it" x="24" y="256">кривая: БК, СП или</text><text class="it" x="24" y="282">радиоактивный.</text><rect class="i-in" x="12" y="306" width="316" height="154" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Для БК-3 — отношения</text><text class="it" x="24" y="390">сопротивлений в диапазоне</text><text class="it" x="24" y="416">10–1000 и условие с</text><text class="it" x="24" y="442">отношением больше 0,5.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Тонкий пласт на диаграмме</text><text class="it" x="24" y="558">выглядит иначе</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="128" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Истинная мощность h,</text><text class="it" x="24" y="694">прочитанная на палетке для</text><text class="it" x="24" y="720">заданного hф.</text><rect class="i-out" x="12" y="744" width="316" height="128" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Сравнение оценок h по</text><text class="it" x="24" y="828">разным методам для одного</text><text class="it" x="24" y="854">пласта.</text><rect class="i-warn" x="12" y="878" width="316" height="154" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Палетка относится к тонким</text><text class="it" x="24" y="962">однородным пластам. Для</text><text class="it" x="24" y="988">других пластов её</text><text class="it" x="24" y="1014">применять нельзя.</text><rect class="i-warn" x="12" y="1038" width="316" height="128" rx="6"/><text class="ih" x="24" y="1070">Где ломается</text><text class="it" x="24" y="1096">Если условие БК-3 не</text><text class="it" x="24" y="1122">выполнено, палетка не</text><text class="it" x="24" y="1148">годится.</text><rect x="249" y="1184" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1205">схема</text></svg>