<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1190" role="img" aria-label="Схема шага «Границы пласта по диаграммам»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Границы пласта по диаграммам»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Диаграммы геофизических</text><text class="it" x="24" y="96">методов по скважине, на</text><text class="it" x="24" y="122">которых отбивают границы</text><text class="it" x="24" y="148">пласта.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Условие однородности</text><text class="it" x="24" y="256">пласта: по нему решают,</text><text class="it" x="24" y="282">применимо ли правило для</text><text class="it" x="24" y="308">h_ф.</text><line class="ia" x1="170" y1="336" x2="170" y2="356"/><path class="iah" d="M170 362 l-6 -9 h12 z"/><rect class="i-node" x="12" y="366" width="316" height="76" rx="6"/><text class="it" x="24" y="398">Границы пласта по</text><text class="it" x="24" y="424">диаграммам</text><line class="ia" x1="170" y1="446" x2="170" y2="466"/><path class="iah" d="M170 472 l-6 -9 h12 z"/><rect class="i-out" x="12" y="476" width="316" height="154" rx="6"/><text class="ih" x="24" y="508">Вывод</text><text class="it" x="24" y="534">Кровля и подошва пласта на</text><text class="it" x="24" y="560">глубинах. Для однородного</text><text class="it" x="24" y="586">пласта — мощность между</text><text class="it" x="24" y="612">ними как h_ф.</text><rect class="i-out" x="12" y="636" width="316" height="154" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Эффективная мощность</text><text class="it" x="24" y="720">продуктивного коллектора</text><text class="it" x="24" y="746">как подсчётный параметр</text><text class="it" x="24" y="772">запасов.</text><rect class="i-warn" x="12" y="796" width="316" height="154" rx="6"/><text class="ih" x="24" y="828">Где ломается</text><text class="it" x="24" y="854">Для неоднородного пласта</text><text class="it" x="24" y="880">правило h_ф = мощность</text><text class="it" x="24" y="906">между границами не</text><text class="it" x="24" y="932">применяется.</text><rect class="i-warn" x="12" y="956" width="316" height="180" rx="6"/><text class="ih" x="24" y="988">Где ломается</text><text class="it" x="24" y="1014">Правила отбивки в тексте</text><text class="it" x="24" y="1040">не перечислены. Без них</text><text class="it" x="24" y="1066">результат зависит от того,</text><text class="it" x="24" y="1092">как их понимает</text><text class="it" x="24" y="1118">интерпретатор.</text><rect x="249" y="1154" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1175">схема</text></svg>