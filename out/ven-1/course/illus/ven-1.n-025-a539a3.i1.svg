<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1034" role="img" aria-label="Схема шага «Мощность однородного пласта по границам»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Мощность однородного пласта по границам»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Диаграммы геофизических</text><text class="it" x="24" y="96">методов из ГИС по пласту.</text><rect class="i-in" x="12" y="120" width="316" height="102" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Известные правила</text><text class="it" x="24" y="204">проведения границ пласта.</text><line class="ia" x1="170" y1="232" x2="170" y2="252"/><path class="iah" d="M170 258 l-6 -9 h12 z"/><rect class="i-node" x="12" y="262" width="316" height="76" rx="6"/><text class="it" x="24" y="294">Мощность однородного</text><text class="it" x="24" y="320">пласта по границам</text><line class="ia" x1="170" y1="342" x2="170" y2="362"/><path class="iah" d="M170 368 l-6 -9 h12 z"/><rect class="i-out" x="12" y="372" width="316" height="180" rx="6"/><text class="ih" x="24" y="404">Вывод</text><text class="it" x="24" y="430">Эффективная мощность</text><text class="it" x="24" y="456">однородного пласта —</text><text class="it" x="24" y="482">расстояние между</text><text class="it" x="24" y="508">границами, проведёнными по</text><text class="it" x="24" y="534">диаграммам.</text><rect class="i-out" x="12" y="558" width="316" height="128" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Подсчётный параметр для</text><text class="it" x="24" y="642">расчёта запасов нефти и</text><text class="it" x="24" y="668">газа.</text><rect class="i-warn" x="12" y="692" width="316" height="128" rx="6"/><text class="ih" x="24" y="724">Где ломается</text><text class="it" x="24" y="750">Для неоднородного пласта</text><text class="it" x="24" y="776">это правило не описано и</text><text class="it" x="24" y="802">напрямую не применяется.</text><rect class="i-warn" x="12" y="826" width="316" height="154" rx="6"/><text class="ih" x="24" y="858">Где ломается</text><text class="it" x="24" y="884">Для тонких однородных</text><text class="it" x="24" y="910">пластов полученную</text><text class="it" x="24" y="936">величину пересчитывают в</text><text class="it" x="24" y="962">истинную мощность.</text><rect x="249" y="998" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1019">схема</text></svg>