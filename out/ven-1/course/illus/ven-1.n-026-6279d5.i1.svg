<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1272" role="img" aria-label="Схема шага «ВНК — не резкая граница»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «ВНК — не резкая граница»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Удельное сопротивление</text><text class="it" x="24" y="96">пласта ρп: максимальное в</text><text class="it" x="24" y="122">зоне предельного</text><text class="it" x="24" y="148">нефтенасыщения.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Коэффициент водонасыщения</text><text class="it" x="24" y="256">Кв по глубине: минимальный</text><text class="it" x="24" y="282">в нефтяной части, равен 1</text><text class="it" x="24" y="308">в водной части.</text><rect class="i-in" x="12" y="332" width="316" height="128" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Данные метода</text><text class="it" x="24" y="416">сопротивлений, по которым</text><text class="it" x="24" y="442">определяют положение ВНК.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="50" rx="6"/><text class="it" x="24" y="532">ВНК — не резкая граница</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="180" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Верхняя граница переходной</text><text class="it" x="24" y="668">зоны — подошва зоны</text><text class="it" x="24" y="694">предельного</text><text class="it" x="24" y="720">нефтенасыщения; нижняя —</text><text class="it" x="24" y="746">зеркало воды.</text><rect class="i-out" x="12" y="770" width="316" height="102" rx="6"/><text class="ih" x="24" y="802">Вывод</text><text class="it" x="24" y="828">Мощность переходной зоны</text><text class="it" x="24" y="854">от долей метра до 20–30 м.</text><rect class="i-warn" x="12" y="878" width="316" height="154" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Переход постепенный,</text><text class="it" x="24" y="962">поэтому одна точка ВНК</text><text class="it" x="24" y="988">может не описывать всю</text><text class="it" x="24" y="1014">зону.</text><rect class="i-warn" x="12" y="1038" width="316" height="180" rx="6"/><text class="ih" x="24" y="1070">Где ломается</text><text class="it" x="24" y="1096">Толщина зоны сильно</text><text class="it" x="24" y="1122">меняется по типу</text><text class="it" x="24" y="1148">коллектора; одна мощность</text><text class="it" x="24" y="1174">для всех пластов не</text><text class="it" x="24" y="1200">подходит.</text><rect x="249" y="1236" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1257">схема</text></svg>