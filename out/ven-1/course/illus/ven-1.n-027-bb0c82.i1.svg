<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1138" role="img" aria-label="Схема шага «Ложный водонефтяной контакт из-за фильтрата»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Ложный водонефтяной контакт из-за фильтрата»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Диаграммы сопротивлений по</text><text class="it" x="24" y="96">разрезу коллектора с</text><text class="it" x="24" y="122">высокой вертикальной</text><text class="it" x="24" y="148">проницаемостью.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Радиометрия, записанная в</text><text class="it" x="24" y="256">обсаженной колонне</text><text class="it" x="24" y="282">скважины.</text><line class="ia" x1="170" y1="310" x2="170" y2="330"/><path class="iah" d="M170 336 l-6 -9 h12 z"/><rect class="i-node" x="12" y="340" width="316" height="76" rx="6"/><text class="it" x="24" y="372">Ложный водонефтяной</text><text class="it" x="24" y="398">контакт из-за фильтрата</text><line class="ia" x1="170" y1="420" x2="170" y2="440"/><path class="iah" d="M170 446 l-6 -9 h12 z"/><rect class="i-out" x="12" y="450" width="316" height="128" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Положение ВНК по электрике</text><text class="it" x="24" y="534">может быть ниже истинного</text><text class="it" x="24" y="560">на 1–1,5 м.</text><rect class="i-out" x="12" y="584" width="316" height="154" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Слой под контактом по</text><text class="it" x="24" y="668">сопротивлению не</text><text class="it" x="24" y="694">отличается от нефтяного и</text><text class="it" x="24" y="720">не даёт признака воды.</text><rect class="i-warn" x="12" y="744" width="316" height="154" rx="6"/><text class="ih" x="24" y="776">Где ломается</text><text class="it" x="24" y="802">Без высокой вертикальной</text><text class="it" x="24" y="828">проницаемости автор</text><text class="it" x="24" y="854">явление не связывает с</text><text class="it" x="24" y="880">ошибкой.</text><rect class="i-warn" x="12" y="904" width="316" height="180" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Величина 1–1,5 м получена</text><text class="it" x="24" y="988">для Ромашкинского</text><text class="it" x="24" y="1014">месторождения и не</text><text class="it" x="24" y="1040">переносится на другие</text><text class="it" x="24" y="1066">пласты.</text><rect x="249" y="1102" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1123">схема</text></svg>