<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 792" role="img" aria-label="Схема шага «ВНК определяют по типу притока»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «ВНК определяют по типу притока»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Тип притока на каждом</text><text class="it" x="24" y="96">испытанном интервале</text><text class="it" x="24" y="122">переходной зоны: нефть с</text><text class="it" x="24" y="148">водой, эмульсия или вода с</text><text class="it" x="24" y="174">плёнкой нефти.</text><line class="ia" x1="170" y1="202" x2="170" y2="222"/><path class="iah" d="M170 228 l-6 -9 h12 z"/><rect class="i-node" x="12" y="232" width="316" height="76" rx="6"/><text class="it" x="24" y="264">ВНК определяют по типу</text><text class="it" x="24" y="290">притока</text><line class="ia" x1="170" y1="312" x2="170" y2="332"/><path class="iah" d="M170 338 l-6 -9 h12 z"/><rect class="i-out" x="12" y="342" width="316" height="128" rx="6"/><text class="ih" x="24" y="374">Вывод</text><text class="it" x="24" y="400">Положение ВНК: граница,</text><text class="it" x="24" y="426">выше которой приток</text><text class="it" x="24" y="452">промышленный.</text><rect class="i-out" x="12" y="476" width="316" height="128" rx="6"/><text class="ih" x="24" y="508">Вывод</text><text class="it" x="24" y="534">Эффективная мощность между</text><text class="it" x="24" y="560">ВНК и кровлей переходной</text><text class="it" x="24" y="586">зоны.</text><rect class="i-warn" x="12" y="610" width="316" height="128" rx="6"/><text class="ih" x="24" y="642">Где ломается</text><text class="it" x="24" y="668">Без испытаний тип притока</text><text class="it" x="24" y="694">неизвестен, и граница по</text><text class="it" x="24" y="720">притоку не определяется.</text><rect x="249" y="756" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="777">схема</text></svg>