<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1086" role="img" aria-label="Схема шага «Порог по нейтронам: выбор между двумя ошибками»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Порог по нейтронам: выбор между двумя ошибками»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Значения λ для пластов с</text><text class="it" x="24" y="96">надёжно известным</text><text class="it" x="24" y="122">насыщением, например по</text><text class="it" x="24" y="148">данным опробования в ряде</text><text class="it" x="24" y="174">скважин.</text><rect class="i-in" x="12" y="198" width="316" height="154" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Пористость и глинистость</text><text class="it" x="24" y="282">пластов: при близких их</text><text class="it" x="24" y="308">значениях визуальное</text><text class="it" x="24" y="334">правило работает.</text><line class="ia" x1="170" y1="362" x2="170" y2="382"/><path class="iah" d="M170 388 l-6 -9 h12 z"/><rect class="i-node" x="12" y="392" width="316" height="76" rx="6"/><text class="it" x="24" y="424">Порог по нейтронам: выбор</text><text class="it" x="24" y="450">между двумя ошибками</text><line class="ia" x1="170" y1="472" x2="170" y2="492"/><path class="iah" d="M170 498 l-6 -9 h12 z"/><rect class="i-out" x="12" y="502" width="316" height="128" rx="6"/><text class="ih" x="24" y="534">Вывод</text><text class="it" x="24" y="560">Граничное значение λ*:</text><text class="it" x="24" y="586">пласты с λ выше λ*</text><text class="it" x="24" y="612">считаются водоносными.</text><rect class="i-out" x="12" y="636" width="316" height="102" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Соотношение двух видов</text><text class="it" x="24" y="720">ошибок при выбранном λ*.</text><rect class="i-warn" x="12" y="744" width="316" height="154" rx="6"/><text class="ih" x="24" y="776">Где ломается</text><text class="it" x="24" y="802">Перекрытие распределений:</text><text class="it" x="24" y="828">одно значение λ может</text><text class="it" x="24" y="854">соответствовать пластам</text><text class="it" x="24" y="880">обоих типов.</text><rect class="i-warn" x="12" y="904" width="316" height="128" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Мало данных о насыщении:</text><text class="it" x="24" y="988">распределения построить</text><text class="it" x="24" y="1014">нельзя.</text><rect x="249" y="1050" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1071">схема</text></svg>