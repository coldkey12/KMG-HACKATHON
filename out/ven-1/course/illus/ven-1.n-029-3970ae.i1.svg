<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1224" role="img" aria-label="Схема шага «Поправки λ за глину и пористость»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Поправки λ за глину и пористость»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Измеренное значение λ по</text><text class="it" x="24" y="96">пласту (декремент</text><text class="it" x="24" y="122">затухания).</text><rect class="i-in" x="12" y="146" width="316" height="102" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Оценка коэффициента</text><text class="it" x="24" y="230">глинистости K_гл.</text><rect class="i-in" x="12" y="254" width="316" height="102" rx="6"/><text class="ih" x="24" y="286">Вход</text><text class="it" x="24" y="312">Оценка коэффициента</text><text class="it" x="24" y="338">пористости K_п.</text><line class="ia" x1="170" y1="366" x2="170" y2="386"/><path class="iah" d="M170 392 l-6 -9 h12 z"/><rect class="i-node" x="12" y="396" width="316" height="76" rx="6"/><text class="it" x="24" y="428">Поправки λ за глину и</text><text class="it" x="24" y="454">пористость</text><line class="ia" x1="170" y1="476" x2="170" y2="496"/><path class="iah" d="M170 502 l-6 -9 h12 z"/><rect class="i-out" x="12" y="506" width="316" height="102" rx="6"/><text class="ih" x="24" y="538">Вывод</text><text class="it" x="24" y="564">λ, уменьшенное на поправку</text><text class="it" x="24" y="590">за глинистость (I.8).</text><rect class="i-out" x="12" y="614" width="316" height="128" rx="6"/><text class="ih" x="24" y="646">Вывод</text><text class="it" x="24" y="672">Поправка за пористость</text><text class="it" x="24" y="698">Δλ_п (I.9), для условно</text><text class="it" x="24" y="724">водоносного пласта.</text><rect class="i-out" x="12" y="748" width="316" height="128" rx="6"/><text class="ih" x="24" y="780">Вывод</text><text class="it" x="24" y="806">Значения λ, приведённые к</text><text class="it" x="24" y="832">одной типичной пористости</text><text class="it" x="24" y="858">K_п0.</text><rect class="i-warn" x="12" y="882" width="316" height="154" rx="6"/><text class="ih" x="24" y="914">Где ломается</text><text class="it" x="24" y="940">Поправка за пористость</text><text class="it" x="24" y="966">верна только при</text><text class="it" x="24" y="992">допущении, что пласт</text><text class="it" x="24" y="1018">водоносный.</text><rect class="i-warn" x="12" y="1042" width="316" height="128" rx="6"/><text class="ih" x="24" y="1074">Где ломается</text><text class="it" x="24" y="1100">Без λ_гл, λ_гв и λ_в</text><text class="it" x="24" y="1126">поправки по формулам</text><text class="it" x="24" y="1152">вычислить нельзя.</text><rect x="249" y="1188" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1209">схема</text></svg>