<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1142" role="img" aria-label="Схема шага «Газ и граница газа по нейтронам»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Газ и граница газа по нейтронам»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Показания нейтронного</text><text class="it" x="24" y="96">метода (ИНМ или</text><text class="it" x="24" y="122">стационарного) против</text><text class="it" x="24" y="148">пласта.</text><rect class="i-in" x="12" y="172" width="316" height="102" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Пластовое давление пласта,</text><text class="it" x="24" y="256">кгс/см².</text><rect class="i-in" x="12" y="280" width="316" height="102" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Глинистость пласта:</text><text class="it" x="24" y="364">умеренная или высокая.</text><line class="ia" x1="170" y1="392" x2="170" y2="412"/><path class="iah" d="M170 418 l-6 -9 h12 z"/><rect class="i-node" x="12" y="422" width="316" height="76" rx="6"/><text class="it" x="24" y="454">Газ и граница газа по</text><text class="it" x="24" y="480">нейтронам</text><line class="ia" x1="170" y1="502" x2="170" y2="522"/><path class="iah" d="M170 528 l-6 -9 h12 z"/><rect class="i-out" x="12" y="532" width="316" height="128" rx="6"/><text class="ih" x="24" y="564">Вывод</text><text class="it" x="24" y="590">Положение ГЖК, ГНК или ГВК</text><text class="it" x="24" y="616">в пласте без зоны</text><text class="it" x="24" y="642">проникновения.</text><rect class="i-out" x="12" y="666" width="316" height="128" rx="6"/><text class="ih" x="24" y="698">Вывод</text><text class="it" x="24" y="724">Отнесение пласта к</text><text class="it" x="24" y="750">газоносному, нефтеносному</text><text class="it" x="24" y="776">или водоносному.</text><rect class="i-warn" x="12" y="800" width="316" height="128" rx="6"/><text class="ih" x="24" y="832">Где ломается</text><text class="it" x="24" y="858">Высокое давление и высокая</text><text class="it" x="24" y="884">глинистость: решение</text><text class="it" x="24" y="910">задачи осложняется.</text><rect class="i-warn" x="12" y="934" width="316" height="154" rx="6"/><text class="ih" x="24" y="966">Где ломается</text><text class="it" x="24" y="992">Есть зона проникновения:</text><text class="it" x="24" y="1018">правило из текста</text><text class="it" x="24" y="1044">относится к пластам без</text><text class="it" x="24" y="1070">неё.</text><rect x="249" y="1106" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1127">схема</text></svg>