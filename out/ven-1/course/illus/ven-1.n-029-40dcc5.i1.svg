<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1220" role="img" aria-label="Схема шага «Газовые пласты и ГЖК по нейтронам»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Газовые пласты и ГЖК по нейтронам»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Показания нейтронных</text><text class="it" x="24" y="96">методов (декремент λ или</text><text class="it" x="24" y="122">показания ИНМ) против</text><text class="it" x="24" y="148">пласта без зоны</text><text class="it" x="24" y="174">проникновения.</text><rect class="i-in" x="12" y="198" width="316" height="154" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Пластовое давление и</text><text class="it" x="24" y="282">глинистость пласта: по ним</text><text class="it" x="24" y="308">выбирают, какой метод</text><text class="it" x="24" y="334">годен.</text><rect class="i-in" x="12" y="358" width="316" height="128" rx="6"/><text class="ih" x="24" y="390">Вход</text><text class="it" x="24" y="416">Минерализация пластовых</text><text class="it" x="24" y="442">вод: для ИНМ важна высокая</text><text class="it" x="24" y="468">минерализация.</text><line class="ia" x1="170" y1="496" x2="170" y2="516"/><path class="iah" d="M170 522 l-6 -9 h12 z"/><rect class="i-node" x="12" y="526" width="316" height="76" rx="6"/><text class="it" x="24" y="558">Газовые пласты и ГЖК по</text><text class="it" x="24" y="584">нейтронам</text><line class="ia" x1="170" y1="606" x2="170" y2="626"/><path class="iah" d="M170 632 l-6 -9 h12 z"/><rect class="i-out" x="12" y="636" width="316" height="102" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Граница ГЖК (или ГНК и</text><text class="it" x="24" y="720">ВНК) по нейтронным данным.</text><rect class="i-out" x="12" y="744" width="316" height="154" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Разделяющая линия по</text><text class="it" x="24" y="828">данным керна через</text><text class="it" x="24" y="854">рассчитанный декремент</text><text class="it" x="24" y="880">газоносного пласта.</text><rect class="i-warn" x="12" y="904" width="316" height="128" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Высокое давление и высокая</text><text class="it" x="24" y="988">глинистость осложняют</text><text class="it" x="24" y="1014">решение.</text><rect class="i-warn" x="12" y="1038" width="316" height="128" rx="6"/><text class="ih" x="24" y="1070">Где ломается</text><text class="it" x="24" y="1096">Давление выше 500 кгс/см²:</text><text class="it" x="24" y="1122">задача отбивки ГНК как у</text><text class="it" x="24" y="1148">ВНК.</text><rect x="249" y="1184" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1205">схема</text></svg>