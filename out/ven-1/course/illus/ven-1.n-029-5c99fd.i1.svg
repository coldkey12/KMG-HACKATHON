<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1354" role="img" aria-label="Схема шага «Два признака вместо одного порога»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Два признака вместо одного порога»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Декремент затухания λ по</text><text class="it" x="24" y="96">пластам (показания ИНМ).</text><rect class="i-in" x="12" y="120" width="316" height="154" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Коэффициент пористости Kп</text><text class="it" x="24" y="204">или коэффициент</text><text class="it" x="24" y="230">глинистости Kгл по тем же</text><text class="it" x="24" y="256">пластам.</text><rect class="i-in" x="12" y="280" width="316" height="180" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Показания метода,</text><text class="it" x="24" y="364">чувствительного к</text><text class="it" x="24" y="390">пористости или</text><text class="it" x="24" y="416">глинистости, как</text><text class="it" x="24" y="442">альтернатива Kп и Kгл.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Два признака вместо одного</text><text class="it" x="24" y="558">порога</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="128" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">График: по одной оси λ, по</text><text class="it" x="24" y="694">другой Kп или Kгл, каждый</text><text class="it" x="24" y="720">пласт — точка.</text><rect class="i-out" x="12" y="744" width="316" height="128" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Разделяющая линия по</text><text class="it" x="24" y="828">совокупности точек разного</text><text class="it" x="24" y="854">насыщения.</text><rect class="i-out" x="12" y="878" width="316" height="102" rx="6"/><text class="ih" x="24" y="910">Вывод</text><text class="it" x="24" y="936">Линия водоносных пластов,</text><text class="it" x="24" y="962">близкая к прямой.</text><rect class="i-warn" x="12" y="986" width="316" height="154" rx="6"/><text class="ih" x="24" y="1018">Где ломается</text><text class="it" x="24" y="1044">Пределы λ перекрываются, а</text><text class="it" x="24" y="1070">второй параметр не учтён:</text><text class="it" x="24" y="1096">одна граница не разделяет</text><text class="it" x="24" y="1122">пласты.</text><rect class="i-warn" x="12" y="1146" width="316" height="154" rx="6"/><text class="ih" x="24" y="1178">Где ломается</text><text class="it" x="24" y="1204">Kп и Kгл независимо</text><text class="it" x="24" y="1230">меняются в значительных</text><text class="it" x="24" y="1256">пределах: одного графика</text><text class="it" x="24" y="1282">мало.</text><rect x="249" y="1318" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1339">схема</text></svg>