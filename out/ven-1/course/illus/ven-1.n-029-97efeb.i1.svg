<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1380" role="img" aria-label="Схема шага «Как газ из нефти меняет нейтронные показания»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Как газ из нефти меняет нейтронные показания»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Два замера нейтронного</text><text class="it" x="24" y="96">метода одного интервала: в</text><text class="it" x="24" y="122">работающей и в</text><text class="it" x="24" y="148">остановленной скважине.</text><rect class="i-in" x="12" y="172" width="316" height="102" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Интервал между замерами:</text><text class="it" x="24" y="256">5—10 ч после остановки.</text><rect class="i-in" x="12" y="280" width="316" height="128" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Давление насыщения и</text><text class="it" x="24" y="364">забойное давление по</text><text class="it" x="24" y="390">каждому интервалу.</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Как газ из нефти меняет</text><text class="it" x="24" y="506">нейтронные показания</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="154" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Приращение показаний в</text><text class="it" x="24" y="642">работающей скважине против</text><text class="it" x="24" y="668">интервалов с давлением</text><text class="it" x="24" y="694">насыщения выше забойного.</text><rect class="i-out" x="12" y="718" width="316" height="128" rx="6"/><text class="ih" x="24" y="750">Вывод</text><text class="it" x="24" y="776">Приращение относят к</text><text class="it" x="24" y="802">свободному газу в пласте</text><text class="it" x="24" y="828">при эксплуатации.</text><rect class="i-out" x="12" y="852" width="316" height="154" rx="6"/><text class="ih" x="24" y="884">Вывод</text><text class="it" x="24" y="910">Разделение пластов на</text><text class="it" x="24" y="936">нефтеносные, обводнённые и</text><text class="it" x="24" y="962">водоносные по классам</text><text class="it" x="24" y="988">рисунка.</text><rect class="i-warn" x="12" y="1012" width="316" height="154" rx="6"/><text class="ih" x="24" y="1044">Где ломается</text><text class="it" x="24" y="1070">Приращений не ждут, если</text><text class="it" x="24" y="1096">давление насыщения не выше</text><text class="it" x="24" y="1122">забойного: газ тогда не</text><text class="it" x="24" y="1148">выделяется.</text><rect class="i-warn" x="12" y="1172" width="316" height="154" rx="6"/><text class="ih" x="24" y="1204">Где ломается</text><text class="it" x="24" y="1230">У легких нефтей с высоким</text><text class="it" x="24" y="1256">газовым фактором</text><text class="it" x="24" y="1282">водородный контраст</text><text class="it" x="24" y="1308">слабее.</text><rect x="249" y="1344" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1365">схема</text></svg>