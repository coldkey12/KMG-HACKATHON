<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1246" role="img" aria-label="Схема шага «Когда хватает двухмерного сопоставления»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Когда хватает двухмерного сопоставления»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Показания нейтронных</text><text class="it" x="24" y="96">методов против пластов.</text><rect class="i-in" x="12" y="120" width="316" height="102" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Данные о пористости и</text><text class="it" x="24" y="204">глинистости пластов.</text><rect class="i-in" x="12" y="228" width="316" height="154" rx="6"/><text class="ih" x="24" y="260">Вход</text><text class="it" x="24" y="286">Два замера до и после</text><text class="it" x="24" y="312">расформирования зоны</text><text class="it" x="24" y="338">проникновения (для особо</text><text class="it" x="24" y="364">сложных случаев).</text><line class="ia" x1="170" y1="392" x2="170" y2="412"/><path class="iah" d="M170 418 l-6 -9 h12 z"/><rect class="i-node" x="12" y="422" width="316" height="76" rx="6"/><text class="it" x="24" y="454">Когда хватает двухмерного</text><text class="it" x="24" y="480">сопоставления</text><line class="ia" x1="170" y1="502" x2="170" y2="522"/><path class="iah" d="M170 528 l-6 -9 h12 z"/><rect class="i-out" x="12" y="532" width="316" height="180" rx="6"/><text class="ih" x="24" y="564">Вывод</text><text class="it" x="24" y="590">Вывод о характере</text><text class="it" x="24" y="616">насыщения пласта (газ,</text><text class="it" x="24" y="642">нефть или вода) при</text><text class="it" x="24" y="668">значительной</text><text class="it" x="24" y="694">дифференциации показаний.</text><rect class="i-out" x="12" y="718" width="316" height="154" rx="6"/><text class="ih" x="24" y="750">Вывод</text><text class="it" x="24" y="776">Положение ГНК и ВНК по</text><text class="it" x="24" y="802">комплексу электрометрии и</text><text class="it" x="24" y="828">нейтронного гамма-метода</text><text class="it" x="24" y="854">(пример рисунка 37).</text><rect class="i-warn" x="12" y="878" width="316" height="154" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Пористость и глинистость</text><text class="it" x="24" y="962">коррелируют, поэтому один</text><text class="it" x="24" y="988">фактор нельзя разделить от</text><text class="it" x="24" y="1014">другого полностью.</text><rect class="i-warn" x="12" y="1038" width="316" height="154" rx="6"/><text class="ih" x="24" y="1070">Где ломается</text><text class="it" x="24" y="1096">При слабой дифференциации</text><text class="it" x="24" y="1122">показаний двухмерного</text><text class="it" x="24" y="1148">сопоставления</text><text class="it" x="24" y="1174">недостаточно.</text><rect x="249" y="1210" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1231">схема</text></svg>