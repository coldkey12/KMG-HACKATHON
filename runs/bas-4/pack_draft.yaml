glossary:
- ru: буровой раствор
  en: drilling mud
  abbr: null
  def: Жидкость, которая циркулирует по скважине во время бурения и выносит породу
    на поверхность.
  prerequisite: true
- ru: ствол скважины
  en: wellbore
  abbr: null
  def: Пробуренная часть скважины, заполненная буровым раствором и флюидами.
  prerequisite: true
- ru: забойное давление
  en: bottomhole pressure
  abbr: null
  def: Давление на забое скважины; от него зависит, поступит ли флюид из пласта.
  prerequisite: true
- ru: пластовое давление
  en: formation pressure
  abbr: null
  def: Давление флюида в пласте, которое нужно уравновесить раствором.
  prerequisite: true
- ru: поровое давление
  en: pore pressure
  abbr: null
  def: Давление флюида в порах породы; в главе используется для описания глин переходной
    зоны.
  prerequisite: true
- ru: аномально высокое пластовое давление
  en: abnormally high formation pressure
  abbr: АВПД
  def: Пластовое давление заметно выше нормального для данной глубины.
  prerequisite: false
- ru: переходная зона
  en: transition zone
  abbr: null
  def: Интервал разреза, где давление постепенно растёт от нормального к аномальному.
  prerequisite: false
- ru: коллектор
  en: reservoir rock
  abbr: null
  def: Порода, способная вмещать пластовый флюид и отдавать его в скважину.
  prerequisite: true
- ru: пластовый флюид
  en: formation fluid
  abbr: null
  def: Нефть, газ или вода, находящиеся в пласте под давлением.
  prerequisite: false
- ru: проявление
  en: kick
  abbr: null
  def: Поступление пластового флюида в ствол скважины при недостатке противодавления.
  prerequisite: false
- ru: выброс
  en: blowout
  abbr: null
  def: Неконтролируемое поступление флюида из скважины на поверхность.
  prerequisite: false
- ru: перелив
  en: flow (overflow)
  abbr: null
  def: Выход бурового раствора из скважины при остановленных насосах.
  prerequisite: false
- ru: газирование раствора
  en: gas cut mud
  abbr: null
  def: Насыщение бурового раствора газом, которое может быть признаком притока.
  prerequisite: false
- ru: газосодержание
  en: gas content
  abbr: null
  def: Количество газа, растворённого или захваченного в буровом растворе.
  prerequisite: false
- ru: дегазация
  en: degassing
  abbr: null
  def: Удаление газа из бурового раствора перед его повторным использованием.
  prerequisite: false
- ru: гидростатическое давление
  en: hydrostatic pressure
  abbr: null
  def: Давление столба жидкости, зависящее от её плотности и высоты.
  prerequisite: true
- ru: противодавление
  en: back pressure
  abbr: null
  def: Давление, которое столб раствора создаёт на пласт и которое удерживает флюид.
  prerequisite: false
- ru: механическая скорость бурения
  en: rate of penetration
  abbr: null
  def: Скорость проходки долота по породе за единицу времени.
  prerequisite: true
- ru: скачок проходки
  en: drilling break
  abbr: null
  def: Резкое увеличение механической скорости бурения, которое может указывать на
    аномалию давления.
  prerequisite: false
- ru: уровнемер
  en: level sensor
  abbr: null
  def: Прибор для измерения уровня бурового раствора в приёмной емкости.
  prerequisite: false
- ru: расходомер
  en: flowmeter
  abbr: null
  def: Прибор для измерения расхода бурового раствора.
  prerequisite: true
- ru: приемная емкость
  en: mud pit
  abbr: null
  def: Емкость циркуляционной системы, в которой хранится буровой раствор.
  prerequisite: true
- ru: долив
  en: trip fill-up
  abbr: null
  def: Добавление бурового раствора в скважину при подъёме бурильной колонны.
  prerequisite: false
- ru: спускоподъемные операции
  en: tripping
  abbr: СПО
  def: Спуск и подъём бурильной или обсадной колонны.
  prerequisite: false
- ru: мерник
  en: trip tank
  abbr: null
  def: Мерная емкость с уровнемером, из которой измеряют объём долива.
  prerequisite: false
- ru: свабирование
  en: swabbing
  abbr: null
  def: Снижение давления на забое при подъёме колонны, которое может вызвать приток.
  prerequisite: false
- ru: штуцер
  en: choke
  abbr: null
  def: Регулируемое сужение на линии, которым управляют давлением в скважине.
  prerequisite: false
- ru: превентор
  en: blowout preventer
  abbr: null
  def: Запорное устьевое оборудование для перекрытия скважины.
  prerequisite: false
- ru: плашки
  en: rams
  abbr: null
  def: Уплотняющие элементы превентора; бывают трубными и глухими.
  prerequisite: false
- ru: безопасный клапан
  en: safety valve
  abbr: null
  def: Клапан, устанавливаемый на колонну труб для перекрытия её проходного канала.
  prerequisite: false
- ru: глушение скважины
  en: well kill
  abbr: null
  def: Возврат контроля над скважиной закачкой утяжелённого раствора.
  prerequisite: false
- ru: метод бурильщика
  en: driller's method
  abbr: null
  def: 'Двухэтапный способ глушения: сначала вытесняется флюид, затем закачивается
    утяжелённый раствор.'
  prerequisite: false
- ru: метод ожидания и веса
  en: wait-and-weight method
  abbr: null
  def: Одноэтапный способ глушения, при котором сразу циркулирует утяжелённый раствор.
  prerequisite: false
- ru: поглощение
  en: lost circulation
  abbr: null
  def: Уход бурового раствора в пласт или трещины вместо возврата на поверхность.
  prerequisite: false
- ru: абсолютная погрешность
  en: absolute error
  abbr: null
  def: Погрешность датчика в единицах измеряемой величины; в главе обозначена как
    ε.
  prerequisite: false
- ru: коэффициент безопасности
  en: safety margin
  abbr: null
  def: Запас давления сверх расчётного, добавляемый при глушении скважины.
  prerequisite: false
misconceptions:
- id: X01
  misconception: Газирование раствора само по себе является причиной выброса.
  correction: Газирование обычно не приводит к существенному падению забойного давления;
    оно скорее признак условий поступления газа в скважину.
  source: u-237-b00695
- id: X02
  misconception: Любой скачок проходки означает проявление.
  correction: Скачок проходки — признак возможного проявления, но может быть вызван
    провалом инструмента в каверну или трещину, и тогда приводит к поглощению, а не
    к проявлению.
  source: u-232-0bbf56
- id: X03
  misconception: Если давление на насосах снизилось, проявление слабое.
  correction: Снижение давления на насосах может быть вызвано движением газовой пачки,
    поступившей при свабировании; сама по себе оно не говорит о слабой интенсивности.
  source: u-238-866472
- id: X04
  misconception: Рост механической скорости бурения всегда означает приближение к
    зоне АВПД.
  correction: Устойчивое самопроизвольное увеличение может указывать на АВПД, но единичный
    рост без тренда и без других признаков недостаточен для вывода.
  source: u-232 footnote *Увеличение механической скорости*
- id: X05
  misconception: Изменение одного свойства бурового раствора однозначно доказывает
    проявление.
  correction: Отклонения свойств могут иметь и другие причины; достовернее судить
    по изменению нескольких показателей одновременно, с учётом запаздывания.
  source: u-239-15f37c, u-239-b38911
- id: X06
  misconception: Уровнемер фиксирует любой, даже очень малый приток.
  correction: Минимальный видимый объём равен ΔV_min = ε·S; он зависит от погрешности
    датчика и площади поверхности жидкости в емкостях.
  source: u-233-c024f3
- id: X07
  misconception: После закрытия скважины приток мгновенно прекращается.
  correction: Приток снижается постепенно из-за сжимаемости жидкости в скважине и
    полностью прекращается, когда давление на устье плюс гидростатическое станет равно
    пластовому.
  source: u-312-6b546e и далее
- id: X08
  misconception: Глушение скважины всегда выполняется в один этап.
  correction: Метод бурильщика предполагает два этапа глушения, а в методе ожидания
    и веса все работы выполняются в один этап; выбор зависит от условий.
  source: u-316-dcb2ca, u-317-c6819a
it_bridges:
- topic: Уровнемер и порог обнаружения (ΔV_min = ε·S)
  analogy: Датчик заполнения буфера или очереди, который срабатывает только при изменении
    выше порога, зависящего от размера ёмкости.
  breaks: В скважине порог задаётся физикой жидкости и площадью поверхности; в ИТ
    порог обычно задаётся настройкой и не связан с геометрией объекта.
- topic: Скачок проходки как ранний сигнал
  analogy: Аномалия метрики задержки (latency spike) как самый ранний сигнал деградации
    сервиса, который надо проверить, но не принять за диагноз.
  breaks: Скачок может быть вызван провалом инструмента в каверну, то есть механикой,
    а не аномалией давления; в мониторинге аномалия обычно отражает только саму метрику.
- topic: Мягкое перекрытие скважины через штуцер
  analogy: Постепенное ограничение потока (throttling) вместо резкого отключения,
    чтобы избежать скачков нагрузки.
  breaks: 'Приток флюида физический и сжимаемый: он не «останавливается по команде»,
    а снижается с инерцией; в системах запросов отмена обычно мгновенна.'
- topic: Сверка долива с объёмом поднятых труб
  analogy: Сверка двойной записи (reconciliation) между журналом и выгрузкой банка,
    где любое расхождение выше допуска считается аномалией.
  breaks: Объём раствора и металла труб — непрерывные величины с погрешностью датчиков
    и пленкой на трубах; в бухгалтерии записи дискретны и точны.
- topic: Сравнение входного и выходного расхода
  analogy: Сверка входящего и исходящего трафика на сетевом шлюзе, где рост выхода
    выше входа означает утечку или приток.
  breaks: В скважине есть инерция и запаздывание поступления сигналов с забоя; в сетях
    сигналы обычно приходят почти мгновенно.
- topic: Превентор как запорное оборудование
  analogy: Аварийный выключатель или circuit breaker, который обрывает поток при аномалии
    и требует ручного сброса.
  breaks: 'Перекрытие скважины нельзя просто откатить: после него требуется глушение
    и удаление поступившего флюида, а в ИТ откат обычно возможен.'
pronunciation:
- item: АВПД
  reading: а-вэ-пэ-дэ
  note: 'Читается по буквам; ударение на последний слог в каждой букве: а-ВЭ-пэ-дэ.'
- item: СПО
  reading: эс-пэ-о
  note: 'Читается по буквам; ударение на последний слог: эс-пэ-О.'
- item: м³
  reading: кубический метр
  note: 'Произносится полностью; ударение: кубИческий МЕтр.'
- item: л/с
  reading: литр в секунду
  note: 'Произносится полностью: ЛИтр в сеКУНду.'
- item: МПа
  reading: мегапаскаль
  note: 'Ударение на третьем слоге: мегапаСКАЛЬ.'
- item: превентор
  reading: превенТОР
  note: Ударение на последний слог.
- item: штуцер
  reading: ШТУцер
  note: Ударение на первый слог.
- item: ε
  reading: эпсилон
  note: Греческая буква, погрешность датчика; произносится ЭпсИлон.
- item: δ
  reading: дельта
  note: Относительная приведённая погрешность в формуле расходомера; ДЕльта.
- item: ΔV_min
  reading: дельта-вэ-минимум
  note: Минимальный объём, зафиксированный уровнемером; вслух ДЕльта вэ минИмум.
- item: ΔQ_min
  reading: дельта-кю-минимум
  note: Минимальный обнаруживаемый приращение расхода; ДЕльта кю минИмум.
- item: ρ
  reading: ро
  note: 'Плотность; вслух «ро», ударение на о: рО.'
- item: ζ
  reading: дзэта
  note: Глубина забоя на рис. 4.1; произносится дЗЭта.
- item: v_n
  reading: вэ-эн
  note: Механическая скорость бурения на рис. 4.1; ВЭ эН.
- item: Кубань
  reading: КубАНЬ
  note: 'Регион на рис. 4.1; ударение на последний слог-гласную: кубАНЬ.'
- item: Юбилейная площадь
  reading: юбИлейная плОщадь
  note: Название месторождения на рис. 4.1; ударения на И и О.
physics_checklist:
- rule: Плотность пластового флюида ниже плотности бурового раствора при поступлении
    флюида; на кадрах со столбом флюида это должно быть видно как разница плотностей.
  check: Сравнить подписи плотностей флюида и раствора на кадре; флюид должен быть
    легче раствора.
- rule: При подъёме газовой пачки высота её столба растёт из-за расширения, а давление
    на насосах снижается; снижение может быть существенным при большой массе газа.
  check: На графике давления на насосах и высоты пачки проверить монотонность и согласованность
    направления изменений.
- rule: После перекрытия скважины приток снижается постепенно из-за сжимаемости жидкости,
    а не мгновенно, и прекращается, когда сумма давления на устье и гидростатического
    давления сравняется с пластовым.
  check: На кадрах после закрытия превентора кривая притока должна убывать непрерывно,
    а не скачком.
- rule: Минимальный объём, видимый уровнемером, равен ε·S; при увеличении площади
    поверхности раствора порог обнаружения растёт.
  check: Если на кадре меняется площадь емкостей, порог регистрации объёма должен
    меняться пропорционально.
- rule: Повышение расхода на выходе ведёт к росту уровня в приёмных емкостях; эти
    показатели должны изменяться согласованно.
  check: На кадрах с расходомером и уровнемером рост расхода и уровня должен совпадать
    по времени с учётом запаздывания.
- rule: Признаки проявления рассматриваются в совокупности; одиночный скачок проходки
    или изменение свойств раствора не должны показываться как однозначный диагноз.
  check: В сценарии должен присутствовать хотя бы второй согласующийся признак либо
    явная оговорка о возможных других причинах.
- rule: Запаздывание поступления информации о свойствах раствора с забоя на устье
    соответствует времени подъёма забойной пачки.
  check: Изменения свойств раствора на поверхности должны появляться с задержкой относительно
    события на забое.
