<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1220" role="img" aria-label="Схема шага «Метод отношений: пористость сокращается»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Метод отношений: пористость сокращается»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Rxo — сопротивление</text><text class="it" x="24" y="96">промытой зоны от мелкого</text><text class="it" x="24" y="122">зонда.</text><rect class="i-in" x="12" y="146" width="316" height="180" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Rt — истинное</text><text class="it" x="24" y="230">сопротивление пласта от</text><text class="it" x="24" y="256">глубокого зонда с</text><text class="it" x="24" y="282">поправкой на</text><text class="it" x="24" y="308">проникновение.</text><rect class="i-in" x="12" y="332" width="316" height="128" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Rmf и Rw — сопротивления</text><text class="it" x="24" y="416">фильтрата и пластовой воды</text><text class="it" x="24" y="442">при температуре пласта.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Метод отношений:</text><text class="it" x="24" y="558">пористость сокращается</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="128" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Отношение Sw/Sxo, которое</text><text class="it" x="24" y="694">показывает подвижность</text><text class="it" x="24" y="720">углеводородов.</text><rect class="i-out" x="12" y="744" width="316" height="102" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Водонасыщенность Sw без</text><text class="it" x="24" y="828">пористости.</text><rect class="i-warn" x="12" y="852" width="316" height="128" rx="6"/><text class="ih" x="24" y="884">Где ломается</text><text class="it" x="24" y="910">Сокращение F верно только</text><text class="it" x="24" y="936">при одинаковом F в обеих</text><text class="it" x="24" y="962">зонах.</text><rect class="i-warn" x="12" y="986" width="316" height="180" rx="6"/><text class="ih" x="24" y="1018">Где ломается</text><text class="it" x="24" y="1044">Реальные кривые могут не</text><text class="it" x="24" y="1070">совпадать с условием</text><text class="it" x="24" y="1096">одинакового F. Это надо</text><text class="it" x="24" y="1122">проверять по другим</text><text class="it" x="24" y="1148">данным.</text><rect x="249" y="1184" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1205">схема</text></svg>