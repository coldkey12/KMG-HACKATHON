<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 978" role="img" aria-label="Схема шага «Swa меньше Swr в карбонатах с пустотами-слепками»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Swa меньше Swr в карбонатах с пустотами-слепками»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Swa — водонасыщенность</text><text class="it" x="24" y="96">неизменённой зоны по</text><text class="it" x="24" y="122">уравнению Арчи.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Swr — водонасыщенность по</text><text class="it" x="24" y="230">методу отношений для той</text><text class="it" x="24" y="256">же зоны.</text><line class="ia" x1="170" y1="284" x2="170" y2="304"/><path class="iah" d="M170 310 l-6 -9 h12 z"/><rect class="i-node" x="12" y="314" width="316" height="102" rx="6"/><text class="it" x="24" y="346">Swa меньше Swr в</text><text class="it" x="24" y="372">карбонатах с</text><text class="it" x="24" y="398">пустотами-слепками</text><line class="ia" x1="170" y1="420" x2="170" y2="440"/><path class="iah" d="M170 446 l-6 -9 h12 z"/><rect class="i-out" x="12" y="450" width="316" height="180" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Знак «Swa меньше Swr» —</text><text class="it" x="24" y="534">повод рассмотреть карбонат</text><text class="it" x="24" y="560">с моульдической</text><text class="it" x="24" y="586">пористостью и низкой</text><text class="it" x="24" y="612">проницаемостью.</text><rect class="i-warn" x="12" y="636" width="316" height="128" rx="6"/><text class="ih" x="24" y="668">Где ломается</text><text class="it" x="24" y="694">Признак не однозначен:</text><text class="it" x="24" y="720">вывод — возможность, а не</text><text class="it" x="24" y="746">доказательство.</text><rect class="i-warn" x="12" y="770" width="316" height="154" rx="6"/><text class="ih" x="24" y="802">Где ломается</text><text class="it" x="24" y="828">Тот же знак может давать и</text><text class="it" x="24" y="854">другая причина, поэтому</text><text class="it" x="24" y="880">данные нужно сверять с</text><text class="it" x="24" y="906">другими признаками.</text><rect x="249" y="942" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="963">схема</text></svg>