<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1142" role="img" aria-label="Схема шага «Кривая Rxo/Rt рядом с ПС»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Кривая Rxo/Rt рядом с ПС»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Глубокое сопротивление Rt:</text><text class="it" x="24" y="96">индукционный метод (ИК)</text><text class="it" x="24" y="122">или боковой каротаж (БК).</text><rect class="i-in" x="12" y="146" width="316" height="154" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Мелкое сопротивление Rxo:</text><text class="it" x="24" y="230">микробоковой каротаж (МБК)</text><text class="it" x="24" y="256">или микросфокусированный</text><text class="it" x="24" y="282">каротаж.</text><rect class="i-in" x="12" y="306" width="316" height="102" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Кривая ПС на той же</text><text class="it" x="24" y="390">глубине.</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="50" rx="6"/><text class="it" x="24" y="480">Кривая Rxo/Rt рядом с ПС</text><line class="ia" x1="170" y1="502" x2="170" y2="522"/><path class="iah" d="M170 528 l-6 -9 h12 z"/><rect class="i-out" x="12" y="532" width="316" height="102" rx="6"/><text class="ih" x="24" y="564">Вывод</text><text class="it" x="24" y="590">Кривая отношения Rxo/Rt в</text><text class="it" x="24" y="616">той же колонке, что ПС.</text><rect class="i-out" x="12" y="640" width="316" height="154" rx="6"/><text class="ih" x="24" y="672">Вывод</text><text class="it" x="24" y="698">Одна из трёх форм: ровная</text><text class="it" x="24" y="724">около 1 (глина), повторяет</text><text class="it" x="24" y="750">ПС (вода), уходит от ПС</text><text class="it" x="24" y="776">(нефть).</text><rect class="i-warn" x="12" y="800" width="316" height="154" rx="6"/><text class="ih" x="24" y="832">Где ломается</text><text class="it" x="24" y="858">Замеры без поправок за</text><text class="it" x="24" y="884">условия скважины: картина</text><text class="it" x="24" y="910">может отличаться от</text><text class="it" x="24" y="936">истинной.</text><rect class="i-warn" x="12" y="960" width="316" height="128" rx="6"/><text class="ih" x="24" y="992">Где ломается</text><text class="it" x="24" y="1018">Направление ухода описано</text><text class="it" x="24" y="1044">для нормальной</text><text class="it" x="24" y="1070">(отрицательной) ПС.</text><rect x="249" y="1106" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1127">схема</text></svg>