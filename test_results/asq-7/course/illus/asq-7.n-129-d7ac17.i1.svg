<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1272" role="img" aria-label="Схема шага «Почему кривая Rxo/Rt повторяет ПС»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Почему кривая Rxo/Rt повторяет ПС»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривая ПС, записанная в</text><text class="it" x="24" y="96">скважине.</text><rect class="i-in" x="12" y="120" width="316" height="180" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Сопротивления Rxo</text><text class="it" x="24" y="204">(промытая зона) и Rt</text><text class="it" x="24" y="230">(истинное сопротивление</text><text class="it" x="24" y="256">пласта); из них строится</text><text class="it" x="24" y="282">отношение Rxo/Rt.</text><rect class="i-in" x="12" y="306" width="316" height="154" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Сопротивления фильтрата</text><text class="it" x="24" y="390">Rmf и пластовой воды Rw</text><text class="it" x="24" y="416">входят в формулу ПС через</text><text class="it" x="24" y="442">отношение.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Почему кривая Rxo/Rt</text><text class="it" x="24" y="558">повторяет ПС</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="154" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">В водоносном интервале</text><text class="it" x="24" y="694">кривые Rxo/Rt и ПС</text><text class="it" x="24" y="720">движутся в одну сторону от</text><text class="it" x="24" y="746">исходных уровней.</text><rect class="i-out" x="12" y="770" width="316" height="128" rx="6"/><text class="ih" x="24" y="802">Вывод</text><text class="it" x="24" y="828">В углеводородном интервале</text><text class="it" x="24" y="854">кривая Rxo/Rt уходит от</text><text class="it" x="24" y="880">ПС.</text><rect class="i-warn" x="12" y="904" width="316" height="180" rx="6"/><text class="ih" x="24" y="936">Где ломается</text><text class="it" x="24" y="962">Вывод сделан для</text><text class="it" x="24" y="988">водоносной зоны. В</text><text class="it" x="24" y="1014">углеводородной зоне связь</text><text class="it" x="24" y="1040">с ПС нарушается из-за</text><text class="it" x="24" y="1066">роста Rt.</text><rect class="i-warn" x="12" y="1090" width="316" height="128" rx="6"/><text class="ih" x="24" y="1122">Где ломается</text><text class="it" x="24" y="1148">Константа K не задана в</text><text class="it" x="24" y="1174">этом узле; её берут из</text><text class="it" x="24" y="1200">главы 2.</text><rect x="249" y="1236" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1257">схема</text></svg>