<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1194" role="img" aria-label="Схема шага «Пористость по сопротивлению: откуда она берётся»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Пористость по сопротивлению: откуда она берётся»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Истинное сопротивление</text><text class="it" x="24" y="96">пласта Rt.</text><rect class="i-in" x="12" y="120" width="316" height="128" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Сопротивление пластовой</text><text class="it" x="24" y="204">воды Rw и коэффициенты a и</text><text class="it" x="24" y="230">m.</text><rect class="i-in" x="12" y="254" width="316" height="128" rx="6"/><text class="ih" x="24" y="286">Вход</text><text class="it" x="24" y="312">Пористостная кривая</text><text class="it" x="24" y="338">другого прибора, для</text><text class="it" x="24" y="364">сравнения и для оценки Sw.</text><line class="ia" x1="170" y1="392" x2="170" y2="412"/><path class="iah" d="M170 418 l-6 -9 h12 z"/><rect class="i-node" x="12" y="422" width="316" height="102" rx="6"/><text class="it" x="24" y="454">Пористость по</text><text class="it" x="24" y="480">сопротивлению: откуда она</text><text class="it" x="24" y="506">берётся</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="128" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Кривая пористости по</text><text class="it" x="24" y="642">проводимости, рассчитанная</text><text class="it" x="24" y="668">по формуле 7.19.</text><rect class="i-out" x="12" y="692" width="316" height="128" rx="6"/><text class="ih" x="24" y="724">Вывод</text><text class="it" x="24" y="750">Оценка Sw как отношение</text><text class="it" x="24" y="776">пористости по проводимости</text><text class="it" x="24" y="802">к настоящей пористости.</text><rect class="i-warn" x="12" y="826" width="316" height="154" rx="6"/><text class="ih" x="24" y="858">Где ломается</text><text class="it" x="24" y="884">В углеводородной зоне</text><text class="it" x="24" y="910">расчётная пористость</text><text class="it" x="24" y="936">меньше настоящей. Это и</text><text class="it" x="24" y="962">есть сигнал.</text><rect class="i-warn" x="12" y="986" width="316" height="154" rx="6"/><text class="ih" x="24" y="1018">Где ломается</text><text class="it" x="24" y="1044">Если параметры a, m и Rw</text><text class="it" x="24" y="1070">далеки от настоящих,</text><text class="it" x="24" y="1096">расчётная пористость не</text><text class="it" x="24" y="1122">совпадёт с настоящей.</text><rect x="249" y="1158" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1179">схема</text></svg>