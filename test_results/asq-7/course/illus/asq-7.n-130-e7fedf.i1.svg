<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1216" role="img" aria-label="Схема шага «Быстрый Rwa во время каротажа»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Быстрый Rwa во время каротажа»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривая глубокого</text><text class="it" x="24" y="96">индукционного или</text><text class="it" x="24" y="122">глубокого бокового</text><text class="it" x="24" y="148">каротажа как Rt, обычно</text><text class="it" x="24" y="174">без поправок на среду.</text><rect class="i-in" x="12" y="198" width="316" height="180" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Пористость из</text><text class="it" x="24" y="282">акустического или</text><text class="it" x="24" y="308">плотностного каротажа с</text><text class="it" x="24" y="334">подходящими параметрами</text><text class="it" x="24" y="360">матрицы и флюида.</text><rect class="i-in" x="12" y="384" width="316" height="154" rx="6"/><text class="ih" x="24" y="416">Вход</text><text class="it" x="24" y="442">Нейтрон-плотностная</text><text class="it" x="24" y="468">пористость, если она</text><text class="it" x="24" y="494">доступна в реальном</text><text class="it" x="24" y="520">времени.</text><line class="ia" x1="170" y1="548" x2="170" y2="568"/><path class="iah" d="M170 574 l-6 -9 h12 z"/><rect class="i-node" x="12" y="578" width="316" height="76" rx="6"/><text class="it" x="24" y="610">Быстрый Rwa во время</text><text class="it" x="24" y="636">каротажа</text><line class="ia" x1="170" y1="658" x2="170" y2="678"/><path class="iah" d="M170 684 l-6 -9 h12 z"/><rect class="i-out" x="12" y="688" width="316" height="154" rx="6"/><text class="ih" x="24" y="720">Вывод</text><text class="it" x="24" y="746">Кривая Rwa, выведенная на</text><text class="it" x="24" y="772">диаграмму во время</text><text class="it" x="24" y="798">каротажа, при a = 1.0 и m</text><text class="it" x="24" y="824">= 2.0.</text><rect class="i-warn" x="12" y="848" width="316" height="154" rx="6"/><text class="ih" x="24" y="880">Где ломается</text><text class="it" x="24" y="906">Фиксированные a и m и</text><text class="it" x="24" y="932">отсутствие поправок на</text><text class="it" x="24" y="958">среду делают значение</text><text class="it" x="24" y="984">приблизительным.</text><rect class="i-warn" x="12" y="1008" width="316" height="154" rx="6"/><text class="ih" x="24" y="1040">Где ломается</text><text class="it" x="24" y="1066">Неверные параметры матрицы</text><text class="it" x="24" y="1092">и флюида дают неверную</text><text class="it" x="24" y="1118">пористость и, значит,</text><text class="it" x="24" y="1144">неверный Rwa.</text><rect x="249" y="1180" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1201">схема</text></svg>