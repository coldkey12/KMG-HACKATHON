<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1350" role="img" aria-label="Схема шага «Пористость по сопротивлению»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Пористость по сопротивлению»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Измерение сопротивления</text><text class="it" x="24" y="96">неизменённой зоны</text><text class="it" x="24" y="122">(истинное сопротивление</text><text class="it" x="24" y="148">пласта).</text><rect class="i-in" x="12" y="172" width="316" height="180" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Параметры уравнения Арчи,</text><text class="it" x="24" y="256">как в шаге 7 «Уравнение</text><text class="it" x="24" y="282">Арчи: что в нём что». Для</text><text class="it" x="24" y="308">этого метода Sw принимают</text><text class="it" x="24" y="334">равным 1.0.</text><rect class="i-in" x="12" y="358" width="316" height="154" rx="6"/><text class="ih" x="24" y="390">Вход</text><text class="it" x="24" y="416">Пористость по другому</text><text class="it" x="24" y="442">прибору (акустика,</text><text class="it" x="24" y="468">плотность или нейтрон) для</text><text class="it" x="24" y="494">сравнения.</text><line class="ia" x1="170" y1="522" x2="170" y2="542"/><path class="iah" d="M170 548 l-6 -9 h12 z"/><rect class="i-node" x="12" y="552" width="316" height="76" rx="6"/><text class="it" x="24" y="584">Пористость по</text><text class="it" x="24" y="610">сопротивлению</text><line class="ia" x1="170" y1="632" x2="170" y2="652"/><path class="iah" d="M170 658 l-6 -9 h12 z"/><rect class="i-out" x="12" y="662" width="316" height="128" rx="6"/><text class="ih" x="24" y="694">Вывод</text><text class="it" x="24" y="720">Кривая пористости по</text><text class="it" x="24" y="746">сопротивлению, выведенная</text><text class="it" x="24" y="772">рядом с ПС.</text><rect class="i-out" x="12" y="796" width="316" height="206" rx="6"/><text class="ih" x="24" y="828">Вывод</text><text class="it" x="24" y="854">Высокая кривая, близкая к</text><text class="it" x="24" y="880">пористости пласта,</text><text class="it" x="24" y="906">указывает на водоносную</text><text class="it" x="24" y="932">зону. Низкая кривая</text><text class="it" x="24" y="958">указывает на возможные</text><text class="it" x="24" y="984">углеводороды.</text><rect class="i-warn" x="12" y="1008" width="316" height="154" rx="6"/><text class="ih" x="24" y="1040">Где ломается</text><text class="it" x="24" y="1066">Нефть или газ в зоне</text><text class="it" x="24" y="1092">занижают кривую, и она</text><text class="it" x="24" y="1118">перестаёт показывать</text><text class="it" x="24" y="1144">настоящую пористость.</text><rect class="i-warn" x="12" y="1168" width="316" height="128" rx="6"/><text class="ih" x="24" y="1200">Где ломается</text><text class="it" x="24" y="1226">Кривая верна только для</text><text class="it" x="24" y="1252">водоносной зоны, так как</text><text class="it" x="24" y="1278">расчёт принимает Sw = 1.</text><rect x="249" y="1314" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1335">схема</text></svg>