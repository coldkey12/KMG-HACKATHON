<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 822" role="img" aria-label="Схема шага «Объёмная влажность BVW»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Объёмная влажность BVW»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Водонасыщенность</text><text class="it" x="24" y="96">неизменённой зоны пласта</text><text class="it" x="24" y="122">Sw.</text><rect class="i-in" x="12" y="146" width="316" height="102" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Пористость φ, определённая</text><text class="it" x="24" y="230">по предыдущим измерениям.</text><line class="ia" x1="170" y1="258" x2="170" y2="278"/><path class="iah" d="M170 284 l-6 -9 h12 z"/><rect class="i-node" x="12" y="288" width="316" height="50" rx="6"/><text class="it" x="24" y="320">Объёмная влажность BVW</text><line class="ia" x1="170" y1="342" x2="170" y2="362"/><path class="iah" d="M170 368 l-6 -9 h12 z"/><rect class="i-out" x="12" y="372" width="316" height="128" rx="6"/><text class="ih" x="24" y="404">Вывод</text><text class="it" x="24" y="430">Значение BVW для каждой</text><text class="it" x="24" y="456">точки пласта, где известны</text><text class="it" x="24" y="482">Sw и φ.</text><rect class="i-warn" x="12" y="506" width="316" height="128" rx="6"/><text class="ih" x="24" y="538">Где ломается</text><text class="it" x="24" y="564">Если Sw или φ рассчитаны с</text><text class="it" x="24" y="590">ошибкой, значение BVW тоже</text><text class="it" x="24" y="616">будет с ошибкой.</text><rect class="i-warn" x="12" y="640" width="316" height="128" rx="6"/><text class="ih" x="24" y="672">Где ломается</text><text class="it" x="24" y="698">По одному значению BVW</text><text class="it" x="24" y="724">нельзя однозначно узнать</text><text class="it" x="24" y="750">Sw и φ.</text><rect x="249" y="786" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="807">схема</text></svg>