<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1324" role="img" aria-label="Схема шага «Объёмная вода зависит от размера зёрен»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Объёмная вода зависит от размера зёрен»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="232" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Литология породы</text><text class="it" x="24" y="96">(терригенная или</text><text class="it" x="24" y="122">карбонатная) и для</text><text class="it" x="24" y="148">терригенной — размер</text><text class="it" x="24" y="174">зерна. По книге это</text><text class="it" x="24" y="200">параметры, с которыми</text><text class="it" x="24" y="226">связан BVW.</text><rect class="i-in" x="12" y="250" width="316" height="128" rx="6"/><text class="ih" x="24" y="282">Вход</text><text class="it" x="24" y="308">Источник этих данных</text><text class="it" x="24" y="334">(керн, шлам, описание) в</text><text class="it" x="24" y="360">книге не указан.</text><rect class="i-in" x="12" y="384" width="316" height="128" rx="6"/><text class="ih" x="24" y="416">Вход</text><text class="it" x="24" y="442">Рассчитанные значения BVW</text><text class="it" x="24" y="468">по нескольким глубинам</text><text class="it" x="24" y="494">пласта.</text><line class="ia" x1="170" y1="522" x2="170" y2="542"/><path class="iah" d="M170 548 l-6 -9 h12 z"/><rect class="i-node" x="12" y="552" width="316" height="76" rx="6"/><text class="it" x="24" y="584">Объёмная вода зависит от</text><text class="it" x="24" y="610">размера зёрен</text><line class="ia" x1="170" y1="632" x2="170" y2="652"/><path class="iah" d="M170 658 l-6 -9 h12 z"/><rect class="i-out" x="12" y="662" width="316" height="128" rx="6"/><text class="ih" x="24" y="694">Вывод</text><text class="it" x="24" y="720">Ожидаемый диапазон BVW для</text><text class="it" x="24" y="746">данного класса породы по</text><text class="it" x="24" y="772">таблице 7.1.</text><rect class="i-out" x="12" y="796" width="316" height="180" rx="6"/><text class="ih" x="24" y="828">Вывод</text><text class="it" x="24" y="854">Сигнал для проверки: BVW</text><text class="it" x="24" y="880">заметно выходит за</text><text class="it" x="24" y="906">диапазон класса. Тогда</text><text class="it" x="24" y="932">ищут причину в типе породы</text><text class="it" x="24" y="958">или расчёте.</text><rect class="i-warn" x="12" y="982" width="316" height="128" rx="6"/><text class="ih" x="24" y="1014">Где ломается</text><text class="it" x="24" y="1040">Для карбонатов диапазоны</text><text class="it" x="24" y="1066">дают только общий ориентир</text><text class="it" x="24" y="1092">по типам пористости.</text><rect class="i-warn" x="12" y="1116" width="316" height="154" rx="6"/><text class="ih" x="24" y="1148">Где ломается</text><text class="it" x="24" y="1174">На границе двух классов</text><text class="it" x="24" y="1200">значение BVW не даёт</text><text class="it" x="24" y="1226">однозначного ответа о</text><text class="it" x="24" y="1252">классе.</text><rect x="249" y="1288" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1309">схема</text></svg>