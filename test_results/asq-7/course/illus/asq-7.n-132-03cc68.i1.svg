<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 844" role="img" aria-label="Схема шага «Почему оси Пикетта перевёрнуты»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Почему оси Пикетта перевёрнуты»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Пары значений Rt и</text><text class="it" x="24" y="96">пористости φ для точек</text><text class="it" x="24" y="122">разреза; каждая точка —</text><text class="it" x="24" y="148">отдельный интервал.</text><line class="ia" x1="170" y1="176" x2="170" y2="196"/><path class="iah" d="M170 202 l-6 -9 h12 z"/><rect class="i-node" x="12" y="206" width="316" height="76" rx="6"/><text class="it" x="24" y="238">Почему оси Пикетта</text><text class="it" x="24" y="264">перевёрнуты</text><line class="ia" x1="170" y1="286" x2="170" y2="306"/><path class="iah" d="M170 312 l-6 -9 h12 z"/><rect class="i-out" x="12" y="316" width="316" height="128" rx="6"/><text class="ih" x="24" y="348">Вывод</text><text class="it" x="24" y="374">Из наклона прямой</text><text class="it" x="24" y="400">оценивают m, из</text><text class="it" x="24" y="426">пересечения — a×Rw.</text><rect class="i-warn" x="12" y="450" width="316" height="180" rx="6"/><text class="ih" x="24" y="482">Где ломается</text><text class="it" x="24" y="508">Значения вне выбранных</text><text class="it" x="24" y="534">декад (0.01–1.0 по</text><text class="it" x="24" y="560">пористости, 0.1–100 по</text><text class="it" x="24" y="586">сопротивлению) не</text><text class="it" x="24" y="612">поместятся на листе.</text><rect class="i-warn" x="12" y="636" width="316" height="154" rx="6"/><text class="ih" x="24" y="668">Где ломается</text><text class="it" x="24" y="694">Если при переносе точек</text><text class="it" x="24" y="720">перепутать оси, наклон и</text><text class="it" x="24" y="746">пересечение будут</text><text class="it" x="24" y="772">прочитаны неверно.</text><rect x="249" y="808" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="829">схема</text></svg>