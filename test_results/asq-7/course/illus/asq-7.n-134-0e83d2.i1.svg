<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1276" role="img" aria-label="Схема шага «Пикетт или Хингл: что выбрать»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Пикетт или Хингл: что выбрать»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Точки «сопротивление –</text><text class="it" x="24" y="96">пористость» по многим</text><text class="it" x="24" y="122">зонам. Для водоносной</text><text class="it" x="24" y="148">линии нужен широкий</text><text class="it" x="24" y="174">разброс пористости.</text><rect class="i-in" x="12" y="198" width="316" height="128" rx="6"/><text class="ih" x="24" y="230">Вход</text><text class="it" x="24" y="256">Заданные значения матрицы</text><text class="it" x="24" y="282">(для Пикетта) и a с m (для</text><text class="it" x="24" y="308">Хингла).</text><rect class="i-in" x="12" y="332" width="316" height="128" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Литология и сопротивление</text><text class="it" x="24" y="416">воды одинаковы в</text><text class="it" x="24" y="442">сравниваемых интервалах.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Пикетт или Хингл: что</text><text class="it" x="24" y="558">выбрать</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="76" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Rw и m по Пикетту.</text><rect class="i-out" x="12" y="692" width="316" height="76" rx="6"/><text class="ih" x="24" y="724">Вывод</text><text class="it" x="24" y="750">Матрица по Хинглу.</text><rect class="i-out" x="12" y="774" width="316" height="154" rx="6"/><text class="ih" x="24" y="806">Вывод</text><text class="it" x="24" y="832">водонасыщенность точек,</text><text class="it" x="24" y="858">смещённых от водоносной</text><text class="it" x="24" y="884">линии, по расстоянию до</text><text class="it" x="24" y="910">неё.</text><rect class="i-warn" x="12" y="934" width="316" height="128" rx="6"/><text class="ih" x="24" y="966">Где ломается</text><text class="it" x="24" y="992">Узкий диапазон пористости:</text><text class="it" x="24" y="1018">водоносная линия не</text><text class="it" x="24" y="1044">определяется уверенно.</text><rect class="i-warn" x="12" y="1068" width="316" height="154" rx="6"/><text class="ih" x="24" y="1100">Где ломается</text><text class="it" x="24" y="1126">Меняется литология или</text><text class="it" x="24" y="1152">сопротивление воды:</text><text class="it" x="24" y="1178">сравнение интервалов</text><text class="it" x="24" y="1204">теряет смысл.</text><rect x="249" y="1240" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1261">схема</text></svg>