<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1086" role="img" aria-label="Схема шага «Пример Morrow: данные и линия воды»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Пример Morrow: данные и линия воды»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Для каждой зоны: глубина,</text><text class="it" x="24" y="96">объёмная плотность ρb и</text><text class="it" x="24" y="122">истинное сопротивление Rt</text><text class="it" x="24" y="148">(таблица 7.4).</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Плотность матрицы 2.65 и</text><text class="it" x="24" y="256">плотность жидкости 1.0 для</text><text class="it" x="24" y="282">пересчёта плотности в</text><text class="it" x="24" y="308">пористость.</text><line class="ia" x1="170" y1="336" x2="170" y2="356"/><path class="iah" d="M170 362 l-6 -9 h12 z"/><rect class="i-node" x="12" y="366" width="316" height="76" rx="6"/><text class="it" x="24" y="398">Пример Morrow: данные и</text><text class="it" x="24" y="424">линия воды</text><line class="ia" x1="170" y1="446" x2="170" y2="466"/><path class="iah" d="M170 472 l-6 -9 h12 z"/><rect class="i-out" x="12" y="476" width="316" height="128" rx="6"/><text class="ih" x="24" y="508">Вывод</text><text class="it" x="24" y="534">Положение водоносной линии</text><text class="it" x="24" y="560">и её наклон, по которому</text><text class="it" x="24" y="586">оценивается m.</text><rect class="i-out" x="12" y="610" width="316" height="128" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Диапазон допустимых m от</text><text class="it" x="24" y="694">1.8 до 2.15, а не одно</text><text class="it" x="24" y="720">число.</text><rect class="i-warn" x="12" y="744" width="316" height="128" rx="6"/><text class="ih" x="24" y="776">Где ломается</text><text class="it" x="24" y="802">Узкий диапазон пористости</text><text class="it" x="24" y="828">и разброс точек делают</text><text class="it" x="24" y="854">наклон неточным.</text><rect class="i-warn" x="12" y="878" width="316" height="154" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Неверно принятые плотности</text><text class="it" x="24" y="962">матрицы или флюида</text><text class="it" x="24" y="988">сдвигают пористость и</text><text class="it" x="24" y="1014">положение точек.</text><rect x="249" y="1050" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1071">схема</text></svg>