<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 658" role="img" aria-label="Схема шага «Глинистые песчаники: сланец не равен глине»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Глинистые песчаники: сланец не равен глине»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Объём глинистости</text><text class="it" x="24" y="96">(сланца), по которому</text><text class="it" x="24" y="122">вводят поправку к формуле</text><text class="it" x="24" y="148">Арчи.</text><line class="ia" x1="170" y1="176" x2="170" y2="196"/><path class="iah" d="M170 202 l-6 -9 h12 z"/><rect class="i-node" x="12" y="206" width="316" height="76" rx="6"/><text class="it" x="24" y="238">Глинистые песчаники:</text><text class="it" x="24" y="264">сланец не равен глине</text><line class="ia" x1="170" y1="286" x2="170" y2="306"/><path class="iah" d="M170 312 l-6 -9 h12 z"/><rect class="i-out" x="12" y="316" width="316" height="154" rx="6"/><text class="ih" x="24" y="348">Вывод</text><text class="it" x="24" y="374">Скорректированная</text><text class="it" x="24" y="400">водонасыщенность с учётом</text><text class="it" x="24" y="426">глины (этот узел не</text><text class="it" x="24" y="452">разбирает расчёт).</text><rect class="i-warn" x="12" y="476" width="316" height="128" rx="6"/><text class="ih" x="24" y="508">Где ломается</text><text class="it" x="24" y="534">Объём сланца может не</text><text class="it" x="24" y="560">описывать глину в самом</text><text class="it" x="24" y="586">песчанике.</text><rect x="249" y="622" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="643">схема</text></svg>