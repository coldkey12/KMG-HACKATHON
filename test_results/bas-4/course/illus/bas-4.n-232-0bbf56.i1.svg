<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1484" role="img" aria-label="Схема шага «Порог «вдвое» и ложная тревога»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Порог «вдвое» и ложная тревога»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривая механической</text><text class="it" x="24" y="96">скорости бурения по</text><text class="it" x="24" y="122">глубине забоя; ищется</text><text class="it" x="24" y="148">резкий рост на её участке.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Интервал скачка</text><text class="it" x="24" y="256">относительно переходной</text><text class="it" x="24" y="282">зоны и коллекторов</text><text class="it" x="24" y="308">высокого давления.</text><rect class="i-in" x="12" y="332" width="316" height="128" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Тип породы в интервале</text><text class="it" x="24" y="416">скачка: известковые</text><text class="it" x="24" y="442">отложения или нет.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Порог «вдвое» и ложная</text><text class="it" x="24" y="558">тревога</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="154" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Вероятный рост</text><text class="it" x="24" y="694">аномальности давления на</text><text class="it" x="24" y="720">забое — при скачке в</text><text class="it" x="24" y="746">переходной зоне.</text><rect class="i-out" x="12" y="770" width="316" height="154" rx="6"/><text class="ih" x="24" y="802">Вывод</text><text class="it" x="24" y="828">Признак вхождения в пласт</text><text class="it" x="24" y="854">высокого давления — рост</text><text class="it" x="24" y="880">более чем в 2 раза по</text><text class="it" x="24" y="906">зарубежной практике.</text><rect class="i-out" x="12" y="930" width="316" height="154" rx="6"/><text class="ih" x="24" y="962">Вывод</text><text class="it" x="24" y="988">Провал инструмента в</text><text class="it" x="24" y="1014">трещину или каверну —</text><text class="it" x="24" y="1040">тогда чаще поглощение</text><text class="it" x="24" y="1066">раствора.</text><rect class="i-warn" x="12" y="1090" width="316" height="154" rx="6"/><text class="ih" x="24" y="1122">Где ломается</text><text class="it" x="24" y="1148">Один и тот же скачок</text><text class="it" x="24" y="1174">скорости может дать и рост</text><text class="it" x="24" y="1200">давления, и провал</text><text class="it" x="24" y="1226">инструмента.</text><rect class="i-warn" x="12" y="1250" width="316" height="180" rx="6"/><text class="ih" x="24" y="1282">Где ломается</text><text class="it" x="24" y="1308">Порог «более чем в 2 раза»</text><text class="it" x="24" y="1334">— правило зарубежной</text><text class="it" x="24" y="1360">практики; для других</text><text class="it" x="24" y="1386">условий оно может не</text><text class="it" x="24" y="1412">работать.</text><rect x="249" y="1448" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1469">схема</text></svg>