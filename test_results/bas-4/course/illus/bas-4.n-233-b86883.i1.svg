<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 922" role="img" aria-label="Схема шага «Меньше ёмкостей в циркуляции — выше чувствительность уровнемера»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Меньше ёмкостей в циркуляции — выше чувствительность уровнемера»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Число и площадь приёмных</text><text class="it" x="24" y="96">ёмкостей, включённых в</text><text class="it" x="24" y="122">циркуляцию; стандартный</text><text class="it" x="24" y="148">блок — 20 м².</text><line class="ia" x1="170" y1="176" x2="170" y2="196"/><path class="iah" d="M170 202 l-6 -9 h12 z"/><rect class="i-node" x="12" y="206" width="316" height="128" rx="6"/><text class="it" x="24" y="238">Меньше ёмкостей в</text><text class="it" x="24" y="264">циркуляции — выше</text><text class="it" x="24" y="290">чувствительность</text><text class="it" x="24" y="316">уровнемера</text><line class="ia" x1="170" y1="338" x2="170" y2="358"/><path class="iah" d="M170 364 l-6 -9 h12 z"/><rect class="i-out" x="12" y="368" width="316" height="180" rx="6"/><text class="ih" x="24" y="400">Вывод</text><text class="it" x="24" y="426">Минимальный объём притока,</text><text class="it" x="24" y="452">который уровнемер может</text><text class="it" x="24" y="478">зафиксировать при</text><text class="it" x="24" y="504">выбранной площади (кривые</text><text class="it" x="24" y="530">рис. 4.2).</text><rect class="i-warn" x="12" y="554" width="316" height="154" rx="6"/><text class="ih" x="24" y="586">Где ломается</text><text class="it" x="24" y="612">Кривая построена для</text><text class="it" x="24" y="638">блоков по 20 м²; при</text><text class="it" x="24" y="664">других площадях значения</text><text class="it" x="24" y="690">другие.</text><rect class="i-warn" x="12" y="714" width="316" height="154" rx="6"/><text class="ih" x="24" y="746">Где ломается</text><text class="it" x="24" y="772">Значения 2 раза и 1,5 раза</text><text class="it" x="24" y="798">— относительные;</text><text class="it" x="24" y="824">абсолютный объём по ним не</text><text class="it" x="24" y="850">вычисляется.</text><rect x="249" y="886" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="907">схема</text></svg>