<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 952" role="img" aria-label="Схема шага «Газ растёт с глубиной — тяжелеть ступенями»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Газ растёт с глубиной — тяжелеть ступенями»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Газосодержание раствора по</text><text class="it" x="24" y="96">мере углубления в</text><text class="it" x="24" y="122">переходную зону</text><text class="it" x="24" y="148">(устойчивый рост).</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Положение забоя</text><text class="it" x="24" y="256">относительно переходной</text><text class="it" x="24" y="282">зоны.</text><line class="ia" x1="170" y1="310" x2="170" y2="330"/><path class="iah" d="M170 336 l-6 -9 h12 z"/><rect class="i-node" x="12" y="340" width="316" height="76" rx="6"/><text class="it" x="24" y="372">Газ растёт с глубиной —</text><text class="it" x="24" y="398">тяжелеть ступенями</text><line class="ia" x1="170" y1="420" x2="170" y2="440"/><path class="iah" d="M170 446 l-6 -9 h12 z"/><rect class="i-out" x="12" y="450" width="316" height="154" rx="6"/><text class="ih" x="24" y="482">Вывод</text><text class="it" x="24" y="508">Решение: ступенчатое</text><text class="it" x="24" y="534">повышение плотности</text><text class="it" x="24" y="560">раствора по ходу</text><text class="it" x="24" y="586">углубления.</text><rect class="i-warn" x="12" y="610" width="316" height="128" rx="6"/><text class="ih" x="24" y="642">Где ломается</text><text class="it" x="24" y="668">Рост газосодержания описан</text><text class="it" x="24" y="694">как обычный, а не</text><text class="it" x="24" y="720">обязательный.</text><rect class="i-warn" x="12" y="744" width="316" height="154" rx="6"/><text class="ih" x="24" y="776">Где ломается</text><text class="it" x="24" y="802">Локальное скопление газа</text><text class="it" x="24" y="828">может дать резкий скачок,</text><text class="it" x="24" y="854">который ступени не</text><text class="it" x="24" y="880">предскажут.</text><rect x="249" y="916" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="937">схема</text></svg>