<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1272" role="img" aria-label="Схема шага «Газ после спуска-подъёма и газовая пачка»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Газ после спуска-подъёма и газовая пачка»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Давление в бурильных</text><text class="it" x="24" y="96">трубах: его снижение после</text><text class="it" x="24" y="122">спуска или подъёма и при</text><text class="it" x="24" y="148">восстановлении циркуляции.</text><rect class="i-in" x="12" y="172" width="316" height="102" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Наличие расплескивания</text><text class="it" x="24" y="256">бурового раствора у устья.</text><rect class="i-in" x="12" y="280" width="316" height="128" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Место газа: только в</text><text class="it" x="24" y="364">забойной пачке или по всей</text><text class="it" x="24" y="390">колонне.</text><line class="ia" x1="170" y1="418" x2="170" y2="438"/><path class="iah" d="M170 444 l-6 -9 h12 z"/><rect class="i-node" x="12" y="448" width="316" height="76" rx="6"/><text class="it" x="24" y="480">Газ после спуска-подъёма и</text><text class="it" x="24" y="506">газовая пачка</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="154" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Газ только в забойной</text><text class="it" x="24" y="642">пачке без других</text><text class="it" x="24" y="668">признаков: обычно не</text><text class="it" x="24" y="694">выброс.</text><rect class="i-out" x="12" y="718" width="316" height="154" rx="6"/><text class="ih" x="24" y="750">Вывод</text><text class="it" x="24" y="776">Падение давления в трубах</text><text class="it" x="24" y="802">вместе с расплескиванием:</text><text class="it" x="24" y="828">устье закрывают и вымывают</text><text class="it" x="24" y="854">газ через дроссель.</text><rect class="i-warn" x="12" y="878" width="316" height="154" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Слово «обычно» означает,</text><text class="it" x="24" y="962">что правило не</text><text class="it" x="24" y="988">безусловное. Числового</text><text class="it" x="24" y="1014">порога в тексте нет.</text><rect class="i-warn" x="12" y="1038" width="316" height="180" rx="6"/><text class="ih" x="24" y="1070">Где ломается</text><text class="it" x="24" y="1096">Газ может появиться и от</text><text class="it" x="24" y="1122">изменения раствора, а не</text><text class="it" x="24" y="1148">только от падения</text><text class="it" x="24" y="1174">давления. Это по давлению</text><text class="it" x="24" y="1200">не видно.</text><rect x="249" y="1236" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1257">схема</text></svg>