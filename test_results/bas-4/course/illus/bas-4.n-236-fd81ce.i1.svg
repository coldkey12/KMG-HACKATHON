<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 978" role="img" aria-label="Схема шага «Газ из разбуренной породы: когда он поступает»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Газ из разбуренной породы: когда он поступает»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Газосодержание раствора на</text><text class="it" x="24" y="96">выходе из скважины,</text><text class="it" x="24" y="122">измеренное во время</text><text class="it" x="24" y="148">бурения.</text><rect class="i-in" x="12" y="172" width="316" height="102" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Состояние работы: бурение</text><text class="it" x="24" y="256">идёт или остановлено.</text><line class="ia" x1="170" y1="284" x2="170" y2="304"/><path class="iah" d="M170 310 l-6 -9 h12 z"/><rect class="i-node" x="12" y="314" width="316" height="76" rx="6"/><text class="it" x="24" y="346">Газ из разбуренной породы:</text><text class="it" x="24" y="372">когда он поступает</text><line class="ia" x1="170" y1="394" x2="170" y2="414"/><path class="iah" d="M170 420 l-6 -9 h12 z"/><rect class="i-out" x="12" y="424" width="316" height="180" rx="6"/><text class="ih" x="24" y="456">Вывод</text><text class="it" x="24" y="482">Газ в растворе при</text><text class="it" x="24" y="508">бурении; после остановки</text><text class="it" x="24" y="534">бурения его поступление из</text><text class="it" x="24" y="560">выбуренной породы</text><text class="it" x="24" y="586">прекращается.</text><rect class="i-warn" x="12" y="610" width="316" height="154" rx="6"/><text class="ih" x="24" y="642">Где ломается</text><text class="it" x="24" y="668">Одна величина газа не</text><text class="it" x="24" y="694">показывает, откуда он: из</text><text class="it" x="24" y="720">выбуренной породы или из</text><text class="it" x="24" y="746">приствольной части.</text><rect class="i-warn" x="12" y="770" width="316" height="154" rx="6"/><text class="ih" x="24" y="802">Где ломается</text><text class="it" x="24" y="828">Если газ идёт и после</text><text class="it" x="24" y="854">остановки бурения,</text><text class="it" x="24" y="880">источник может быть не в</text><text class="it" x="24" y="906">выбуренной породе.</text><rect x="249" y="942" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="963">схема</text></svg>