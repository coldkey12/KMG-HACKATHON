<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1034" role="img" aria-label="Схема шага «Долив против объёма поднятых труб»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Долив против объёма поднятых труб»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Фактический объём долива</text><text class="it" x="24" y="96">раствора при подъёме</text><text class="it" x="24" y="122">колонны.</text><rect class="i-in" x="12" y="146" width="316" height="128" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Объём металла поднятых</text><text class="it" x="24" y="230">труб и объём плёнки</text><text class="it" x="24" y="256">раствора на их стенках.</text><rect class="i-in" x="12" y="280" width="316" height="102" rx="6"/><text class="ih" x="24" y="312">Вход</text><text class="it" x="24" y="338">Контрольный (расчётный)</text><text class="it" x="24" y="364">объём долива.</text><line class="ia" x1="170" y1="392" x2="170" y2="412"/><path class="iah" d="M170 418 l-6 -9 h12 z"/><rect class="i-node" x="12" y="422" width="316" height="76" rx="6"/><text class="it" x="24" y="454">Долив против объёма</text><text class="it" x="24" y="480">поднятых труб</text><line class="ia" x1="170" y1="502" x2="170" y2="522"/><path class="iah" d="M170 528 l-6 -9 h12 z"/><rect class="i-out" x="12" y="532" width="316" height="154" rx="6"/><text class="ih" x="24" y="564">Вывод</text><text class="it" x="24" y="590">Сравнение фактического</text><text class="it" x="24" y="616">долива с контрольным;</text><text class="it" x="24" y="642">уменьшение больше 1 м³ —</text><text class="it" x="24" y="668">признак проявления.</text><rect class="i-warn" x="12" y="692" width="316" height="128" rx="6"/><text class="ih" x="24" y="724">Где ломается</text><text class="it" x="24" y="750">Наружная плёнка</text><text class="it" x="24" y="776">учитывается только при</text><text class="it" x="24" y="802">отсутствии обтираторов.</text><rect class="i-warn" x="12" y="826" width="316" height="154" rx="6"/><text class="ih" x="24" y="858">Где ломается</text><text class="it" x="24" y="884">Погрешность измерения</text><text class="it" x="24" y="910">объёма может быть</text><text class="it" x="24" y="936">сопоставима с допуском 1</text><text class="it" x="24" y="962">м³.</text><rect x="249" y="998" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1019">схема</text></svg>