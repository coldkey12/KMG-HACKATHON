<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1406" role="img" aria-label="Схема шага «Первые шаги при сигнале тревоги»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Первые шаги при сигнале тревоги»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Сигнал или предупреждение</text><text class="it" x="24" y="96">о возникновении проявления</text><text class="it" x="24" y="122">в вскрываемом или</text><text class="it" x="24" y="148">испытываемом пласте.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Состояние буровых насосов:</text><text class="it" x="24" y="256">работают или отключены. От</text><text class="it" x="24" y="282">этого зависит проверка на</text><text class="it" x="24" y="308">самоприток.</text><rect class="i-in" x="12" y="332" width="316" height="128" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Наличие перелива из</text><text class="it" x="24" y="416">скважины при отключённых</text><text class="it" x="24" y="442">насосах.</text><line class="ia" x1="170" y1="470" x2="170" y2="490"/><path class="iah" d="M170 496 l-6 -9 h12 z"/><rect class="i-node" x="12" y="500" width="316" height="76" rx="6"/><text class="it" x="24" y="532">Первые шаги при сигнале</text><text class="it" x="24" y="558">тревоги</text><line class="ia" x1="170" y1="580" x2="170" y2="600"/><path class="iah" d="M170 606 l-6 -9 h12 z"/><rect class="i-out" x="12" y="610" width="316" height="102" rx="6"/><text class="ih" x="24" y="642">Вывод</text><text class="it" x="24" y="668">Решение прекратить бурение</text><text class="it" x="24" y="694">или испытание пласта.</text><rect class="i-out" x="12" y="718" width="316" height="128" rx="6"/><text class="ih" x="24" y="750">Вывод</text><text class="it" x="24" y="776">Труба, поднятая над столом</text><text class="it" x="24" y="802">ротора, с безопасным</text><text class="it" x="24" y="828">клапаном под ней.</text><rect class="i-out" x="12" y="852" width="316" height="128" rx="6"/><text class="ih" x="24" y="884">Вывод</text><text class="it" x="24" y="910">Решение о срочном</text><text class="it" x="24" y="936">перекрытии скважины при</text><text class="it" x="24" y="962">переливе.</text><rect class="i-warn" x="12" y="986" width="316" height="180" rx="6"/><text class="ih" x="24" y="1018">Где ломается</text><text class="it" x="24" y="1044">Сигнал может быть</text><text class="it" x="24" y="1070">предупреждением, а не</text><text class="it" x="24" y="1096">подтверждённым</text><text class="it" x="24" y="1122">проявлением. Это вывод из</text><text class="it" x="24" y="1148">общей практики.</text><rect class="i-warn" x="12" y="1172" width="316" height="180" rx="6"/><text class="ih" x="24" y="1204">Где ломается</text><text class="it" x="24" y="1230">Порядок задан для</text><text class="it" x="24" y="1256">рассматриваемой компоновки</text><text class="it" x="24" y="1282">и зависит от типа</text><text class="it" x="24" y="1308">скважины, места и вида</text><text class="it" x="24" y="1334">работ.</text><rect x="249" y="1370" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1391">схема</text></svg>