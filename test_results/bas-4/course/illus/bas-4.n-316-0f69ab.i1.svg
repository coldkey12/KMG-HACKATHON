<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1142" role="img" aria-label="Схема шага «Цель глушения и два метода»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Цель глушения и два метода»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="128" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Давление в кольцевом</text><text class="it" x="24" y="96">пространстве на устье при</text><text class="it" x="24" y="122">закрытой скважине.</text><rect class="i-in" x="12" y="146" width="316" height="154" rx="6"/><text class="ih" x="24" y="178">Вход</text><text class="it" x="24" y="204">Максимально допустимое</text><text class="it" x="24" y="230">давление на разрыв</text><text class="it" x="24" y="256">обсадной колонны и</text><text class="it" x="24" y="282">устьевого оборудования.</text><rect class="i-in" x="12" y="306" width="316" height="128" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Давление в бурильных</text><text class="it" x="24" y="390">трубах, которое</text><text class="it" x="24" y="416">контролируют при глушении.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="50" rx="6"/><text class="it" x="24" y="506">Цель глушения и два метода</text><line class="ia" x1="170" y1="528" x2="170" y2="548"/><path class="iah" d="M170 554 l-6 -9 h12 z"/><rect class="i-out" x="12" y="558" width="316" height="128" rx="6"/><text class="ih" x="24" y="590">Вывод</text><text class="it" x="24" y="616">Выбор метода: метод</text><text class="it" x="24" y="642">бурильщика или метод</text><text class="it" x="24" y="668">ожидания и веса.</text><rect class="i-out" x="12" y="692" width="316" height="102" rx="6"/><text class="ih" x="24" y="724">Вывод</text><text class="it" x="24" y="750">Схема циркуляции: прямая</text><text class="it" x="24" y="776">или обратная.</text><rect class="i-warn" x="12" y="800" width="316" height="154" rx="6"/><text class="ih" x="24" y="832">Где ломается</text><text class="it" x="24" y="858">Если давление в кольцевом</text><text class="it" x="24" y="884">пространстве не ниже</text><text class="it" x="24" y="910">допустимого, эти методы по</text><text class="it" x="24" y="936">тексту не применяются.</text><rect class="i-warn" x="12" y="960" width="316" height="128" rx="6"/><text class="ih" x="24" y="992">Где ломается</text><text class="it" x="24" y="1018">Приток может быть газом, а</text><text class="it" x="24" y="1044">не жидкостью. Текст</text><text class="it" x="24" y="1070">допускает оба варианта.</text><rect x="249" y="1106" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1127">схема</text></svg>