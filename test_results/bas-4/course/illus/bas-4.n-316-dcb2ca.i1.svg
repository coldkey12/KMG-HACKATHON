<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1432" role="img" aria-label="Схема шага «Метод бурильщика: первый этап глушения»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Метод бурильщика: первый этап глушения»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Давление в затрубе на</text><text class="it" x="24" y="96">устье при закрытой</text><text class="it" x="24" y="122">скважине: исходная точка</text><text class="it" x="24" y="148">для установки штуцера.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Давление в бурильных</text><text class="it" x="24" y="256">трубах при закрытой</text><text class="it" x="24" y="282">скважине: используется для</text><text class="it" x="24" y="308">сравнения в конце этапа.</text><rect class="i-in" x="12" y="332" width="316" height="154" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Подача насоса на двух</text><text class="it" x="24" y="416">уровнях: запланированная</text><text class="it" x="24" y="442">скорость циркуляции и</text><text class="it" x="24" y="468">скорость глушения.</text><line class="ia" x1="170" y1="496" x2="170" y2="516"/><path class="iah" d="M170 522 l-6 -9 h12 z"/><rect class="i-node" x="12" y="526" width="316" height="76" rx="6"/><text class="it" x="24" y="558">Метод бурильщика: первый</text><text class="it" x="24" y="584">этап глушения</text><line class="ia" x1="170" y1="606" x2="170" y2="626"/><path class="iah" d="M170 632 l-6 -9 h12 z"/><rect class="i-out" x="12" y="636" width="316" height="154" rx="6"/><text class="ih" x="24" y="668">Вывод</text><text class="it" x="24" y="694">Кривые давлений в затрубе</text><text class="it" x="24" y="720">и трубах на</text><text class="it" x="24" y="746">запланированной скорости:</text><text class="it" x="24" y="772">обе держатся постоянно.</text><rect class="i-out" x="12" y="796" width="316" height="154" rx="6"/><text class="ih" x="24" y="828">Вывод</text><text class="it" x="24" y="854">Кривая давления в трубах</text><text class="it" x="24" y="880">на скорости глушения:</text><text class="it" x="24" y="906">держится на постоянном</text><text class="it" x="24" y="932">уровне.</text><rect class="i-out" x="12" y="956" width="316" height="128" rx="6"/><text class="ih" x="24" y="988">Вывод</text><text class="it" x="24" y="1014">Момент выхода пачки и</text><text class="it" x="24" y="1040">остановки циркуляции:</text><text class="it" x="24" y="1066">переход к выдержке.</text><rect class="i-warn" x="12" y="1090" width="316" height="154" rx="6"/><text class="ih" x="24" y="1122">Где ломается</text><text class="it" x="24" y="1148">Сигнал с забоя приходит с</text><text class="it" x="24" y="1174">опозданием, поэтому связь</text><text class="it" x="24" y="1200">давления с событиями на</text><text class="it" x="24" y="1226">забое видна не сразу.</text><rect class="i-warn" x="12" y="1250" width="316" height="128" rx="6"/><text class="ih" x="24" y="1282">Где ломается</text><text class="it" x="24" y="1308">До стабилизации давления</text><text class="it" x="24" y="1334">могут меняться, и их</text><text class="it" x="24" y="1360">равенство нельзя прочесть.</text><rect x="249" y="1396" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1417">схема</text></svg>