<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1298" role="img" aria-label="Схема шага «Проверка: заглушена ли скважина»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Проверка: заглушена ли скважина»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Давление в бурильных</text><text class="it" x="24" y="96">трубах при остановленной</text><text class="it" x="24" y="122">циркуляции и закрытом</text><text class="it" x="24" y="148">штуцере.</text><rect class="i-in" x="12" y="172" width="316" height="128" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Давление в кольцевом</text><text class="it" x="24" y="256">пространстве при закрытой</text><text class="it" x="24" y="282">скважине.</text><rect class="i-in" x="12" y="306" width="316" height="128" rx="6"/><text class="ih" x="24" y="338">Вход</text><text class="it" x="24" y="364">Момент, когда раствор</text><text class="it" x="24" y="390">глушения появляется на</text><text class="it" x="24" y="416">выходе из скважины.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Проверка: заглушена ли</text><text class="it" x="24" y="532">скважина</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="154" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Скважина заглушена:</text><text class="it" x="24" y="668">избыточного давления в</text><text class="it" x="24" y="694">трубах и кольцевом</text><text class="it" x="24" y="720">пространстве нет.</text><rect class="i-out" x="12" y="744" width="316" height="128" rx="6"/><text class="ih" x="24" y="776">Вывод</text><text class="it" x="24" y="802">Повторный выброс: давление</text><text class="it" x="24" y="828">в трубах есть, глушение</text><text class="it" x="24" y="854">повторяют.</text><rect class="i-warn" x="12" y="878" width="316" height="206" rx="6"/><text class="ih" x="24" y="910">Где ломается</text><text class="it" x="24" y="936">Книга задаёт ноль без</text><text class="it" x="24" y="962">допуска. Датчик с</text><text class="it" x="24" y="988">погрешностью может</text><text class="it" x="24" y="1014">показать ненулевое</text><text class="it" x="24" y="1040">значение даже без</text><text class="it" x="24" y="1066">давления.</text><rect class="i-warn" x="12" y="1090" width="316" height="154" rx="6"/><text class="ih" x="24" y="1122">Где ломается</text><text class="it" x="24" y="1148">Нулевое давление в трубах</text><text class="it" x="24" y="1174">не покрывает кольцевое</text><text class="it" x="24" y="1200">пространство. Нужна вторая</text><text class="it" x="24" y="1226">проверка.</text><rect x="249" y="1262" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1283">схема</text></svg>