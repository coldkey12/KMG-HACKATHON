<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1324" role="img" aria-label="Схема шага «Глушение одним этапом: сразу тяжёлый раствор»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Глушение одним этапом: сразу тяжёлый раствор»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Давление на устье закрытой</text><text class="it" x="24" y="96">скважины: исходная точка</text><text class="it" x="24" y="122">для уставки давления в</text><text class="it" x="24" y="148">затрубе.</text><rect class="i-in" x="12" y="172" width="316" height="180" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Фактическое давление на</text><text class="it" x="24" y="256">устье и допустимое</text><text class="it" x="24" y="282">давление обсадной колонны</text><text class="it" x="24" y="308">и оборудования: по ним</text><text class="it" x="24" y="334">выбирают запас.</text><rect class="i-in" x="12" y="358" width="316" height="154" rx="6"/><text class="ih" x="24" y="390">Вход</text><text class="it" x="24" y="416">Скорость насоса: давление</text><text class="it" x="24" y="442">на штуцере держат</text><text class="it" x="24" y="468">постоянным, пока насос</text><text class="it" x="24" y="494">набирает нужную скорость.</text><line class="ia" x1="170" y1="522" x2="170" y2="542"/><path class="iah" d="M170 548 l-6 -9 h12 z"/><rect class="i-node" x="12" y="552" width="316" height="76" rx="6"/><text class="it" x="24" y="584">Глушение одним этапом:</text><text class="it" x="24" y="610">сразу тяжёлый раствор</text><line class="ia" x1="170" y1="632" x2="170" y2="652"/><path class="iah" d="M170 658 l-6 -9 h12 z"/><rect class="i-out" x="12" y="662" width="316" height="128" rx="6"/><text class="ih" x="24" y="694">Вывод</text><text class="it" x="24" y="720">Уставка давления в</text><text class="it" x="24" y="746">затрубе: давление закрытой</text><text class="it" x="24" y="772">скважины плюс запас.</text><rect class="i-out" x="12" y="796" width="316" height="128" rx="6"/><text class="ih" x="24" y="828">Вывод</text><text class="it" x="24" y="854">Кривая давления в трубах,</text><text class="it" x="24" y="880">которая снижается по</text><text class="it" x="24" y="906">графику.</text><rect class="i-warn" x="12" y="930" width="316" height="154" rx="6"/><text class="ih" x="24" y="962">Где ломается</text><text class="it" x="24" y="988">Запас не фиксирован. Он</text><text class="it" x="24" y="1014">зависит от состояния</text><text class="it" x="24" y="1040">скважины и от разницы</text><text class="it" x="24" y="1066">давлений.</text><rect class="i-warn" x="12" y="1090" width="316" height="180" rx="6"/><text class="ih" x="24" y="1122">Где ломается</text><text class="it" x="24" y="1148">Момент, когда тяжёлый</text><text class="it" x="24" y="1174">раствор входит в трубы, по</text><text class="it" x="24" y="1200">поверхностным данным точно</text><text class="it" x="24" y="1226">не виден. Его оценивают по</text><text class="it" x="24" y="1252">скорости и объёму.</text><rect x="249" y="1288" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1309">схема</text></svg>