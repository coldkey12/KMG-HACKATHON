<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 454" role="img" aria-label="Схема шага «Зачем нужно уравнение притока»: частая ошибка и как правильно." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Зачем нужно уравнение притока»: частая ошибка и как правильно.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-warn" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Так думают</text><text class="it" x="24" y="70">Уравнение притока —</text><text class="it" x="24" y="96">готовая формула: подставил</text><text class="it" x="24" y="122">числа и получил давление в</text><text class="it" x="24" y="148">любой точке пласта.</text><line class="ia" x1="170" y1="170" x2="170" y2="190"/><path class="iah" d="M170 196 l-6 -9 h12 z"/><text class="il" x="182" y="188">на самом деле</text><rect class="i-out" x="12" y="200" width="316" height="206" rx="6"/><text class="ih" x="24" y="232">Как в книге</text><text class="it" x="24" y="258">Уравнение сначала</text><text class="it" x="24" y="284">упрощают, и только потом</text><text class="it" x="24" y="310">получают решение в</text><text class="it" x="24" y="336">формулах. Для нефти</text><text class="it" x="24" y="362">решения в главах 6 и 7,</text><text class="it" x="24" y="388">для газа — в главе 8.</text><rect x="249" y="418" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="439">схема</text></svg>