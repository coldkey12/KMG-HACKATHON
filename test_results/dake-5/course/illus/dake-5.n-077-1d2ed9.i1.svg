<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 900" role="img" aria-label="Схема шага «Среднее давление пласта по поровым объёмам»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Среднее давление пласта по поровым объёмам»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Среднее давление внутри</text><text class="it" x="24" y="96">каждой зоны дренирования.</text><rect class="i-in" x="12" y="120" width="316" height="102" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Поровый объём каждой зоны</text><text class="it" x="24" y="204">дренирования.</text><line class="ia" x1="170" y1="232" x2="170" y2="252"/><path class="iah" d="M170 258 l-6 -9 h12 z"/><rect class="i-node" x="12" y="262" width="316" height="76" rx="6"/><text class="it" x="24" y="294">Среднее давление пласта по</text><text class="it" x="24" y="320">поровым объёмам</text><line class="ia" x1="170" y1="342" x2="170" y2="362"/><path class="iah" d="M170 368 l-6 -9 h12 z"/><rect class="i-out" x="12" y="372" width="316" height="102" rx="6"/><text class="ih" x="24" y="404">Вывод</text><text class="it" x="24" y="430">Одно среднее пластовое</text><text class="it" x="24" y="456">давление всего пласта.</text><rect class="i-warn" x="12" y="480" width="316" height="232" rx="6"/><text class="ih" x="24" y="512">Где ломается</text><text class="it" x="24" y="538">Если условие из шаг 22</text><text class="it" x="24" y="564">«Каждая скважина дренирует</text><text class="it" x="24" y="590">свою зону» не выполнено,</text><text class="it" x="24" y="616">зоны нельзя считать</text><text class="it" x="24" y="642">независимыми, и формула не</text><text class="it" x="24" y="668">даёт среднее по всему</text><text class="it" x="24" y="694">пласту.</text><rect class="i-warn" x="12" y="718" width="316" height="128" rx="6"/><text class="ih" x="24" y="750">Где ломается</text><text class="it" x="24" y="776">Неверное выделение границ</text><text class="it" x="24" y="802">зон меняет поровые объёмы,</text><text class="it" x="24" y="828">а значит и веса в формуле.</text><rect x="249" y="864" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="885">схема</text></svg>