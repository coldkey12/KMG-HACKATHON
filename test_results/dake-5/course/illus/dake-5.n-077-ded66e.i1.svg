<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 736" role="img" aria-label="Схема шага «Каждая скважина дренирует свою зону»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Каждая скважина дренирует свою зону»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="180" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривые давления во времени</text><text class="it" x="24" y="96">по нескольким скважинам</text><text class="it" x="24" y="122">или точкам пласта, по</text><text class="it" x="24" y="148">которым оценивают скорость</text><text class="it" x="24" y="174">падения давления.</text><line class="ia" x1="170" y1="202" x2="170" y2="222"/><path class="iah" d="M170 228 l-6 -9 h12 z"/><rect class="i-node" x="12" y="232" width="316" height="76" rx="6"/><text class="it" x="24" y="264">Каждая скважина дренирует</text><text class="it" x="24" y="290">свою зону</text><line class="ia" x1="170" y1="312" x2="170" y2="332"/><path class="iah" d="M170 338 l-6 -9 h12 z"/><rect class="i-out" x="12" y="342" width="316" height="180" rx="6"/><text class="ih" x="24" y="374">Вывод</text><text class="it" x="24" y="400">Оценка, одинакова ли</text><text class="it" x="24" y="426">скорость падения давления</text><text class="it" x="24" y="452">по пласту; при совпадении</text><text class="it" x="24" y="478">зоны можно рассматривать</text><text class="it" x="24" y="504">раздельно.</text><rect class="i-warn" x="12" y="528" width="316" height="154" rx="6"/><text class="ih" x="24" y="560">Где ломается</text><text class="it" x="24" y="586">Шумные ряды давления или</text><text class="it" x="24" y="612">ряды разной длины делают</text><text class="it" x="24" y="638">сравнение скоростей</text><text class="it" x="24" y="664">неоднозначным.</text><rect x="249" y="700" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="721">схема</text></svg>