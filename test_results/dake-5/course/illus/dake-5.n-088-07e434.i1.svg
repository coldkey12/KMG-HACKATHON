<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 956" role="img" aria-label="Схема шага «Давление в точке пласта в любой момент»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Давление в точке пласта в любой момент»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="102" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Дебит скважины q —</text><text class="it" x="24" y="96">управляемый вход.</text><rect class="i-in" x="12" y="120" width="316" height="102" rx="6"/><text class="ih" x="24" y="152">Вход</text><text class="it" x="24" y="178">Расстояние r от скважины и</text><text class="it" x="24" y="204">время t.</text><rect class="i-in" x="12" y="228" width="316" height="102" rx="6"/><text class="ih" x="24" y="260">Вход</text><text class="it" x="24" y="286">Свойства пласта и флюида:</text><text class="it" x="24" y="312">k, h, φ, μ, c.</text><line class="ia" x1="170" y1="340" x2="170" y2="360"/><path class="iah" d="M170 366 l-6 -9 h12 z"/><rect class="i-node" x="12" y="370" width="316" height="76" rx="6"/><text class="it" x="24" y="402">Давление в точке пласта в</text><text class="it" x="24" y="428">любой момент</text><line class="ia" x1="170" y1="450" x2="170" y2="470"/><path class="iah" d="M170 476 l-6 -9 h12 z"/><rect class="i-out" x="12" y="480" width="316" height="102" rx="6"/><text class="ih" x="24" y="512">Вывод</text><text class="it" x="24" y="538">Давление p(r,t) в точке</text><text class="it" x="24" y="564">пласта.</text><rect class="i-out" x="12" y="588" width="316" height="154" rx="6"/><text class="ih" x="24" y="620">Вывод</text><text class="it" x="24" y="646">В реальных данных обычно</text><text class="it" x="24" y="672">видно давление на забое, а</text><text class="it" x="24" y="698">не в произвольной точке</text><text class="it" x="24" y="724">пласта.</text><rect class="i-warn" x="12" y="748" width="316" height="154" rx="6"/><text class="ih" x="24" y="780">Где ломается</text><text class="it" x="24" y="806">Формула выведена для</text><text class="it" x="24" y="832">однородного пласта;</text><text class="it" x="24" y="858">реальный пласт может не</text><text class="it" x="24" y="884">соответствовать этому.</text><rect x="249" y="920" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="941">схема</text></svg>