<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 340 1164" role="img" aria-label="Схема шага «Две корреляции одних и тех же скважин»: что на входе, что получаем и где правило ломается." xmlns="http://www.w3.org/2000/svg"><title>Схема шага «Две корреляции одних и тех же скважин»: что на входе, что получаем и где правило ломается.</title><style>.i-in{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.i-out{fill:#FFFFFF;stroke:#111827;stroke-width:2.5}.i-node{fill:#E5E7EB;stroke:#374151;stroke-width:1.5}.i-warn{fill:#FFFFFF;stroke:#374151;stroke-width:2;stroke-dasharray:7 5}.it{fill:#111827;font-size:20px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ih{fill:#4B5563;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.il{fill:#4B5563;font-size:19px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.ia{stroke:#4B5563;stroke-width:2}.iah{fill:#4B5563}.ibt{fill:#FFFFFF;font-size:19px;font-weight:700;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.isw{stroke:#6B7280;stroke-width:1.5}</style><rect class="i-in" x="12" y="12" width="316" height="154" rx="6"/><text class="ih" x="24" y="44">Вход</text><text class="it" x="24" y="70">Кривые ГИС двух скважин:</text><text class="it" x="24" y="96">отклик по глубине, по</text><text class="it" x="24" y="122">которому выделяют</text><text class="it" x="24" y="148">литофации.</text><rect class="i-in" x="12" y="172" width="316" height="154" rx="6"/><text class="ih" x="24" y="204">Вход</text><text class="it" x="24" y="230">Поверхности одинакового</text><text class="it" x="24" y="256">геологического времени</text><text class="it" x="24" y="282">(клиноформы), которые</text><text class="it" x="24" y="308">пересекают границы пород.</text><rect class="i-in" x="12" y="332" width="316" height="102" rx="6"/><text class="ih" x="24" y="364">Вход</text><text class="it" x="24" y="390">Пески, глины и гетеролиты</text><text class="it" x="24" y="416">между скважинами.</text><line class="ia" x1="170" y1="444" x2="170" y2="464"/><path class="iah" d="M170 470 l-6 -9 h12 z"/><rect class="i-node" x="12" y="474" width="316" height="76" rx="6"/><text class="it" x="24" y="506">Две корреляции одних и тех</text><text class="it" x="24" y="532">же скважин</text><line class="ia" x1="170" y1="554" x2="170" y2="574"/><path class="iah" d="M170 580 l-6 -9 h12 z"/><rect class="i-out" x="12" y="584" width="316" height="206" rx="6"/><text class="ih" x="24" y="616">Вывод</text><text class="it" x="24" y="642">Две схемы сопоставления:</text><text class="it" x="24" y="668">литостратиграфическая —</text><text class="it" x="24" y="694">пески непрерывны;</text><text class="it" x="24" y="720">хроностратиграфическая —</text><text class="it" x="24" y="746">пески разделены глинами и</text><text class="it" x="24" y="772">гетеролитами.</text><rect class="i-warn" x="12" y="796" width="316" height="154" rx="6"/><text class="ih" x="24" y="828">Где ломается</text><text class="it" x="24" y="854">Похожий отклик кривых не</text><text class="it" x="24" y="880">показывает, соединены ли</text><text class="it" x="24" y="906">пески: по времени они</text><text class="it" x="24" y="932">могут быть разобщены.</text><rect class="i-warn" x="12" y="956" width="316" height="154" rx="6"/><text class="ih" x="24" y="988">Где ломается</text><text class="it" x="24" y="1014">Линии времени не видны</text><text class="it" x="24" y="1040">напрямую в одной кривой;</text><text class="it" x="24" y="1066">их нужно строить по всей</text><text class="it" x="24" y="1092">схеме.</text><rect x="249" y="1128" width="79" height="28" rx="4" fill="#8E44AD"/><text class="ibt" x="261" y="1149">схема</text></svg>